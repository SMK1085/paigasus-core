title: 'Rust crate'
description: |
  Scaffolds a moon.yml for a Rust crate under rs/crates. Choose `library` for
  crates under rs/crates/libs (and bindings), or `service` for binaries under
  rs/crates/services.

  CAVEATS:
  - The `service` archetype emits dependsOn paigasus-proto-rs/paigasus-kernel-rs, which
    only resolve in a workspace where those projects exist (SMA-357/360) — generate there
    or hand-edit the references. Build/test/lint/fmt are inherited from
    .moon/tasks/rust.yml (no per-crate overrides); the contracts:generate build edge is
    added on paigasus-proto by SMA-389.
  - The `library` archetype emits NO dependsOn on purpose: most libs depend on
    paigasus-kernel-rs, but paigasus-kernel-rs and paigasus-proto-rs must NOT (self/cycle).
    Add `dependsOn: ['paigasus-kernel-rs']` by hand where appropriate.
variables:
  name:
    type: 'string'
    default: ''
    required: true
    prompt: 'Crate name (e.g. paigasus-kernel)?'
  archetype:
    type: 'enum'
    values: ['library', 'service']
    default: 'library'
    prompt: 'Archetype?'
