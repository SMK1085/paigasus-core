$schema: 'https://moonrepo.dev/schemas/project.json'
id: '{{ name }}-py'
layer: '{% if archetype == "service" %}application{% else %}library{% endif %}'
language: 'python'
{%- if archetype == "service" %}
tasks:
  start:
    command: 'uv run python -m {{ name | replace(from="-", to="_") }}'
    options:
      cache: false
      persistent: true
{%- endif %}
