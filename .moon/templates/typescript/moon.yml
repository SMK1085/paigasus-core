$schema: 'https://moonrepo.dev/schemas/project.json'
id: '{{ name }}-ts'
layer: '{% if archetype == "app" %}application{% else %}library{% endif %}'
language: 'typescript'
{%- if archetype == "app" %}
tasks:
  build:
    command: 'next build'
    inputs: ['@group(sources)', 'tsconfig.json', 'package.json', 'next.config.ts']
    outputs: ['.next']
    options:
      merge: replace
{%- endif %}
