$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Moon does NOT scope task files by filename — scope explicitly so these Rust commands
# only attach to Rust projects (not contracts, and not the future py/ts workspaces).
inheritedBy:
  languages: ['rust']

fileGroups:
  sources:
    - 'src/**/*'
    # SMA-537 — `cargo build` RUNS a crate-root build.rs and `cargo clippy --all-targets`
    # COMPILES it, but `src/**/*` does not match it, so editing one re-keyed no crate task.
    # Declared in the shared group rather than per-crate so a new crate cannot forget it — the
    # same argument .moon/tasks/rust.yml makes for declaring `deps: ['^:build']` centrally.
    # Reaches build/test/lint/build-release AND fmt, all of which consume @group(sources).
    # Twelve of thirteen crates have no build.rs; the entry simply matches nothing for them.
    # It does NOT disturb A6: a crate's own build.rs is `own/`-prefixed and excluded from
    # `observed` (cargo_moon_parity.py:400-401).
    - 'build.rs'
  tests:
    - 'tests/**/*'
    - '**/*_test.rs'

# `@group(upstreams)` (SMA-528) is each crate's transitive dependsOn closure, declared per-crate in
# its own moon.yml. It is what makes a CONSUMER affected by an UPSTREAM source change: Moon 2.3.2
# confers affectedness only through a task's own `inputs`, so `dependsOn` and the `^:build` below
# schedule an upstream's build but never SELECT this crate. Without it `moon ci` ran a kernel edit's
# own tests and no consumer's — including paigasus-kernel-parity-rs, the ADR-0005 harness.
# It also fixes a cache-correctness bug that is independent of scheduling: a consumer whose inputs
# omit its upstreams replays a cached PASS built against a DIFFERENT upstream.
# Deliberately NOT on `fmt` (crate-local by construction) or `build-release` (never runs in CI);
# neither carries `^:build` either.
tasks:
  build:
    command: 'cargo build'
    inputs: ['@group(sources)', 'Cargo.toml', '@group(upstreams)']
  build-release:
    command: 'cargo build --release'
    inputs: ['@group(sources)', 'Cargo.toml']
  test:
    command: 'cargo nextest run --no-tests=pass'
    # `/rs/.config/nextest.toml` is workspace-relative (leading `/`). Required because `rs/` is
    # NOT a Moon project — `.moon/workspace.yml` globs cover only `rs/crates/{libs,bindings,
    # services}/*` — so the profile is outside every project's project-relative inputs and
    # `implicitInputs` covers only `.moon/*`. Without this, editing the retry policy would not
    # bust this task's cache (stale PASS) and a profile-only PR would not select it under
    # `moon ci --affected`.
    inputs: ['@group(sources)', '@group(tests)', 'Cargo.toml', '/rs/.config/nextest.toml', '@group(upstreams)']
  lint:
    # `--locked` so clippy lints the resolution the PR actually SHIPS. Without it cargo silently
    # re-resolves and rewrites an inconsistent Cargo.lock, and the thirteen lints below would
    # compile against newest-compatible versions instead — which would make the whole point of the
    # workspace inputs unprovable. Among the compile gates, only `lint` passes `--locked`;
    # `repo:publish-metadata` also uses it, for its packaging checks
    # (`ci/publish-metadata/run.sh:243,258`). A Dependabot Cargo PR has already shipped a lockfile
    # resolved from 3 of 11 workspace members here (SMA-534).
    command: 'cargo clippy --locked --all-targets -- -D warnings'
    # `^:build` schedules each upstream's build before this crate's clippy runs (and orders
    # `contracts:generate` on the proto chain); it does NOT confer affectedness —
    # `@group(upstreams)` does (SMA-528). Without it clippy compiled against a stale upstream
    # artifact (SMA-526). Declared here rather than per-crate so a new crate has no per-crate
    # `lint` declaration to forget. A `workspace = true` in-tree dep still needs its own
    # hand-written `dependsOn` (SMA-524) — the parity gate's A1 catches that separately.
    # `repo:affected-smoke` asserts this expansion for every crate (cargo_moon_parity.py A3).
    deps: ['^:build']
    # The three WORKSPACE-level inputs (SMA-534). `rs/` has no Moon project, so without these a
    # Cargo.lock-only change — every Dependabot Cargo PR — scheduled no crate task at all.
    # Leading `/` = workspace-relative. Declared here, not per-crate, for the same reason as `deps`.
    #   /rs/Cargo.lock          the resolved dependency versions. The issue's motivating case.
    #   /rs/Cargo.toml          [workspace.dependencies] AND [workspace.lints.{rust,clippy}] — the
    #                           clippy posture itself — AND feature flips, which never reach the lock.
    #   /rs/rust-toolchain.toml which clippy-driver runs. Defence-in-depth: a CORRECT toolchain bump
    #                           also touches .moon/toolchains.yml, which is an implicitInput
    #                           (.moon/tasks.yml:17) and already schedules all thirteen lints. This
    #                           input catches the bump that drifts the two files apart, which
    #                           rust-toolchain.toml's own lockstep comment warns about.
    # Deliberately NOT on build/test/fmt: `clippy --all-targets` is a superset of
    # `check --all-targets`, so it already type-checks libs, bins and tests; adding `test` would put
    # the Docker-gated IAM container suites on every Dependabot PR. Clippy still neither links the
    # cdylibs nor compiles wasm32 — but that gap is CLOSED for the FFI cdylibs by SMA-546, which puts
    # these same three workspace inputs on `paigasus-kernel-ts:{build,test}` and
    # `paigasus-kernel-py:test` instead, since those are the tasks that actually link and compile
    # them. See `ci/affected-graph/README.md`'s A5 bullet for the guard that keeps it that way.
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'Cargo.toml'
      - '/rs/Cargo.toml'
      - '/rs/Cargo.lock'
      - '/rs/rust-toolchain.toml'
      - '@group(upstreams)'
  fmt:
    command: 'cargo fmt --check'
    # SMA-537. `cargo fmt --check` formats EVERY target in the package, but this task keyed on
    # @group(sources) alone, so a misformatted integration test could merge green and red `main`
    # on an unrelated later src edit. The groups below cover src/, build.rs and tests/.
    # NOT COVERED: benches/ and examples/. rustfmt formats both, and no glob here matches them.
    # No crate in this workspace has either directory today, so a glob for them would be a dead
    # input that `repo:input-liveness` reds. Add `benches/**/*` / `examples/**/*` here in the SAME
    # change that creates the first such directory (SMA-560 M4).
    #   @group(sources)         now includes build.rs (see fileGroups above)
    #   @group(tests)           tests/ is formatted too; an empty group matches nothing, which is
    #                           already true for `test`/`lint` on crates without a tests/ dir
    #   /rs/rustfmt.toml        the format config itself (max_width = 200); changing it must
    #                           invalidate every crate's fmt, or the tree drifts silently
    #   /rs/rust-toolchain.toml selects WHICH rustfmt runs — the same argument `lint` already
    #                           makes for this file
    # Deliberately NOT @group(upstreams): `cargo fmt --check` reads only the crate's own files,
    # so it cannot be broken by an upstream crate edit (SMA-526 rejected that propagation, and
    # that rejection was correct). This is a CONFIG-edit hole, which is a different defect.
    inputs: ['@group(sources)', '@group(tests)', '/rs/rustfmt.toml', '/rs/rust-toolchain.toml']
