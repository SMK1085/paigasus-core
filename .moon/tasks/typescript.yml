$schema: 'https://moonrepo.dev/schemas/tasks.json'

# Whole-tree lint/format for the ts workspace. Scoped to the configuration-layer root
# (ts/moon.yml) ONLY: eslint/prettier read the central ts/eslint.config.js & .prettierrc.js,
# so one run from ts/ covers the whole tree (including root-level files like ts/scripts/) —
# running them per-package would re-lint the same files (SMA-401). Per-project
# build/typecheck/test live in typescript-project.yml.
#
# fileGroups stay in this file (Moon 2.2.5 does not propagate global .moon/tasks.yml fileGroups
# to projects inheriting a scoped task); ts/moon.yml extends them with packages/*/… and apps/*/…
# for the root checks.
inheritedBy:
  languages: ['typescript']
  layers: ['configuration']

fileGroups:
  sources:
    - 'src/**/*'
  tests:
    - 'tests/**/*'
    - '**/*.test.ts'
    - '**/*.test.tsx'
    - '**/*.spec.ts'
    - '**/*.spec.tsx'

tasks:
  lint:
    command: 'pnpm exec eslint .'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'package.json'
      - '/ts/eslint.config.js'
      - '/ts/pnpm-lock.yaml'
  fmt:
    command: 'pnpm exec prettier --check .'
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - '.prettierrc.js'
      - '.prettierignore'
      - 'package.json'
      - '/ts/.prettierrc.js'
      - '/ts/.prettierignore'
      - '/ts/pnpm-lock.yaml'
