$schema: 'https://moonrepo.dev/schemas/toolchain.json'

node:
  version: '22.22.3'
  packageManager: 'pnpm'
  pnpm:
    version: '11.3.0'

rust:
  version: '1.95.0'
  components:
    - 'rustfmt'
    - 'clippy'
  bins:
    - 'cargo-nextest'

# Python is a first-class Moon toolchain in 2.x — the top-level `python` key.
# (The older `unstable_python` name is silently ignored by Moon 2.2.5, which
# would leave Python and uv unpinned.) uv is pinned under `python.uv`. Fallback
# if it misbehaves: drop this block and run uv via plain 'command' tasks per
# project (loses pinning, gains stability).
python:
  version: '3.12.13'
  packageManager: 'uv'
  uv:
    version: '0.11.16'
