$schema: 'https://moonrepo.dev/schemas/toolchains.json'

# Moon 2.x splits the old monolithic `node` block: `node` and `pnpm` are separate
# version-pinned toolchains. The Moon 1.x form (`node.packageManager` + nested
# `node.pnpm.version`) is silently ignored by 2.2.5, so pnpm never installs.
node:
  # Node 24 ("Krypton") is the Active LTS; 22 ("Jod") moved to Maintenance LTS.
  # Keep @types/node (ts catalog) on the matching major; bump both together at the
  # next LTS line.
  version: '24.16.0'
pnpm:
  version: '11.3.0'

rust:
  version: '1.95.0'
  components:
    - 'rustfmt'
    - 'clippy'
  # wasm32 target for the paigasus-wasm binding (SMA-427). Provisioned HERE (the path moon's
  # `moon setup` actually uses), NOT via rust-toolchain.toml `targets` — moon reads only the
  # channel from that file (syncToolchainConfig), so a clean CI runner would never install it.
  targets:
    - 'wasm32-unknown-unknown'
  # cargo-nextest is provisioned via a vendored proto plugin pinned in .prototools
  # (installed by `proto install`), NOT via `rust.bins` here: `moon setup` provisions the
  # toolchain + components but NOT bins, so a `rust.bins` nextest was never installed in CI
  # and every `:test` task failed with "no such command: nextest". Same reliability reason
  # cargo-deny/machete use proto plugins (SMA-375).

# Python and uv are Moon 2.2.5 built-in toolchains, keyed `unstable_python` and
# the separate `unstable_uv` (the unprefixed `python` / `uv` keys are NOT built-in
# in 2.2.5). The uv VERSION pins under `unstable_uv`.
unstable_python:
  version: '3.12.13'
  packageManager: 'uv'
unstable_uv:
  version: '0.11.16'
