$schema: 'https://moonrepo.dev/schemas/toolchains.json'

# Moon 2.x splits the old monolithic `node` block: `node` and `pnpm` are separate
# version-pinned toolchains. The Moon 1.x form (`node.packageManager` + nested
# `node.pnpm.version`) is silently ignored by 2.2.5, so pnpm never installs.
node:
  version: '22.22.3'
pnpm:
  version: '11.3.0'

rust:
  version: '1.95.0'
  components:
    - 'rustfmt'
    - 'clippy'
  bins:
    - 'cargo-nextest@0.9.136'

# Python and uv are Moon 2.2.5 built-in toolchains, keyed `unstable_python` and
# the separate `unstable_uv` (the unprefixed `python` / `uv` keys are NOT built-in
# in 2.2.5). The uv VERSION pins under `unstable_uv`.
unstable_python:
  version: '3.12.13'
  packageManager: 'uv'
unstable_uv:
  version: '0.11.16'
