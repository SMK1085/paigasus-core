$schema: 'https://moonrepo.dev/schemas/project.json'

layer: 'configuration'
language: 'python'

# The inherited fileGroups from .moon/tasks/python.yml assume src/ at the project root.
# The py workspace keeps sources under packages/*/src, so extend the inherited groups here.
# Moon merges (not overrides) fileGroups across the layers, so the resolved @group(sources)/
# @group(tests) used by the root's whole-tree checks (lint/fmt/typecheck/test) cover
# packages/*/src/** and packages/*/tests/**.
fileGroups:
  sources:
    - 'packages/*/src/**/*'
  tests:
    - 'packages/*/tests/**/*'

# No `build` here: it is routed to the library/application layers in
# .moon/tasks/python-project.yml, so it never attaches to this configuration root. This replaces
# the SMA-399 `workspace.inheritedTasks.exclude: ['build']`, now redundant under layer routing
# (SMA-401) — py/pyproject.toml is a virtual workspace root with no [project] table, so a root
# `uv build` would emit a junk UNKNOWN wheel; routing simply never gives it the task.
