[project]
name = "paigasus-kernel"
version = "0.1.0"
description = "Python bindings for the Paigasus behavioral kernel."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Paigasus contributors" }]
requires-python = ">=3.12"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
# Pinned exactly, and asserted by repo:version-lockstep. [tool.uv.sources] below is
# DEVELOPMENT-ONLY metadata — uv strips it from the built wheel — so without this pin the
# published wrapper would float against any paigasus-py-bindings version (SMA-576, spec §4).
# Under lockstep the bindings can never release independently, so an exact pin costs nothing.
dependencies = ["paigasus-py-bindings==0.1.0"]

# PyPI-bound. This marker — NOT the version field — is what repo:publish-metadata's
# Python arm reads to decide the publishable set (SMA-578 review M7): in this repo
# `version` means "in a lockstep family" (repo:version-lockstep writes it).
[tool.paigasus]
pypi = true

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
paigasus-py-bindings = { path = "../../../rs/crates/bindings/paigasus-py-bindings" }
