$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'repo'
layer: 'configuration'
language: 'bash'

tasks:
  install-hooks:
    script: 'lefthook validate && lefthook install'
    toolchain: 'system'
    inputs:
      - 'lefthook.yml'
      - '.lefthook/**/*'
    options:
      runInCI: false
