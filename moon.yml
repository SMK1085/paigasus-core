$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'repo'
layer: 'configuration'
language: 'bash'

tasks:
  install-hooks:
    script: 'lefthook validate && lefthook install'
    toolchain: 'system'
    inputs:
      - 'lefthook.yml'
      - '.lefthook/**/*'
    options:
      runInCI: false

  deny:
    description: 'cargo-deny supply-chain/license/advisory gate over the rs/ workspace (SMA-375).'
    command: 'cargo deny --manifest-path rs/Cargo.toml check'
    toolchain: 'system'
    inputs:
      - 'rs/**/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/deny.toml'

  osv:
    description: 'osv-scanner advisory gate over the npm + pip lockfiles — the ts/py counterpart to :deny (SMA-518).'
    # rs/ is deliberately excluded: :deny already gates it AND enforces license + yanked-crate
    # policy that OSV does not, so folding Rust in here would lose coverage, not add it.
    #
    # Wrapped in a script because osv-scanner's exit codes alone are not a sufficient gate: its
    # "no package sources found" error (128) is evaluated IN AGGREGATE, so one lockfile silently
    # parsing to zero packages while the other is healthy exits 0 and reads as clean. run.sh
    # asserts a per-lockfile package count as a control. See the header there.
    script: 'ci/osv/run.sh'
    toolchain: 'system'
    # Narrow inputs — `repo` owns the whole tree, so without these the gate runs on every change.
    # NOTE these only re-key the gate when dependencies actually MOVE. The scheduled workflow
    # (.github/workflows/security-scan.yml) is what catches an advisory published against an
    # unchanged lockfile — which is how the SMA-517 backlog accumulated in the first place.
    inputs:
      - 'ci/osv/**/*'
      - 'osv-scanner.toml'
      - 'ts/pnpm-lock.yaml'
      - 'py/uv.lock'
      - '.prototools'
      - '.proto/plugins/osv-scanner.toml'

  machete:
    description: 'cargo-machete unused-dependency check over the rs/ workspace (SMA-375).'
    command: 'cargo machete rs'
    toolchain: 'system'
    inputs:
      - 'rs/**/Cargo.toml'
      - 'rs/**/*.rs'

  release-parity:
    description: 'Dry-run release-plz over synthetic commits; assert commit->semver parity (SMA-398).'
    # Negative control FIRST, mirroring repo:publish-metadata, repo:affected-smoke and
    # repo:input-liveness (SMA-530). Without it CI runs only the real suite, and the real
    # suite CANNOT detect a check_case that has lost the ability to report red — that is
    # precisely when it is green. Measured: changing run.sh:51 to drop the `got_a` half of
    # the comparison leaves all five cases.tsv rows passing (slot b is at baseline in every
    # one) and the gate exits 0 while asserting nothing; only the control catches it.
    #
    # Moon does not enable errexit for `script:` blocks — the block's status is its LAST
    # command's — so `set -euo pipefail` is REQUIRED, or a failing control is masked by the
    # passing real run. run.sh's own `set -euo pipefail` governs its body, not this block.
    # Same trap repo:promtool, repo:nats-permissions and repo:publish-metadata document.
    #
    # All three sibling tasks carry their own control because their ECOSYSTEM-SPECIFIC
    # inputs are distinct: a PR touching only ts/packages/paigasus-sdk/.releaserc.json
    # selects release-parity-ts alone. They are not disjoint overall — all three also share
    # ci/release-parity/**/* and .prototools, and that sharing is load-bearing in the other
    # direction: it is what makes a ci/release-parity/ edit schedule all three at once.
    # Net cost measured at +890ms/+733ms/+1111ms (~20% each). These three lines are
    # pinned by SELF_SCHEDULED_GATES in ci/affected-graph/ci_targets.py — edit them and that
    # gate reds until the constant agrees.
    script: |
      set -euo pipefail
      ci/release-parity/run.sh --negative-control
      ci/release-parity/run.sh
    toolchain: 'system'
    inputs:
      - 'ci/release-parity/**/*'
      - 'rs/release-plz.toml'
      - '.prototools'
      - '.proto/plugins/release-plz.toml'

  release-parity-py:
    description: 'Dry-run python-semantic-release over synthetic commits; assert commit->semver parity (SMA-405).'
    # Negative control FIRST — see repo:release-parity above for the full reasoning; this
    # task carries its own because the three tasks' ECOSYSTEM-SPECIFIC inputs are distinct
    # (they still share ci/release-parity/**/* and .prototools) (SMA-530).
    script: |
      set -euo pipefail
      ci/release-parity/run.sh --ecosystem python-semantic-release --negative-control
      ci/release-parity/run.sh --ecosystem python-semantic-release
    toolchain: 'system'
    inputs:
      - 'ci/release-parity/**/*'
      - 'py/packages/paigasus-ml/pyproject.toml'
      - 'py/packages/paigasus-workflows/pyproject.toml'
      - 'py/uv.lock'
      - '.prototools'

  release-parity-ts:
    description: 'Dry-run semantic-release over synthetic commits; assert commit->semver parity + documented 0.x divergence (SMA-406).'
    # Negative control FIRST — see repo:release-parity above for the full reasoning; this
    # task carries its own because the three tasks' ECOSYSTEM-SPECIFIC inputs are distinct
    # (they still share ci/release-parity/**/* and .prototools) (SMA-530).
    script: |
      set -euo pipefail
      ci/release-parity/run.sh --ecosystem semantic-release --negative-control
      ci/release-parity/run.sh --ecosystem semantic-release
    toolchain: 'system'
    inputs:
      - 'ci/release-parity/**/*'
      - 'ts/packages/paigasus-sdk/.releaserc.json'
      - 'ts/packages/paigasus-ui/.releaserc.json'
      - 'ts/tooling/semantic-release-path-filter.mjs'
      - 'ts/tooling/semantic-release-next-version.mjs'
      - 'ts/pnpm-lock.yaml'
      - '.prototools'

  next-env-drift:
    description: 'Assert the committed next-env.d.ts matches what `next typegen` emits (SMA-519).'
    # next-env.d.ts is generated by Next but tracked (tsconfig lists it in `include`, and
    # typecheck runs without a build), and nothing asserted the two agreed — it sat stale from
    # May until SMA-517. Same shape as parity-corpus-drift: regenerate, then diff.
    script: 'ci/next-env/run.sh'
    toolchain: 'system'
    # Ordered AFTER the console build, not merely to have a fresh tree: `next typegen` writes
    # into ts/apps/paigasus-console/.next, which is `paigasus-console-ts:build`'s declared
    # output. Letting both run concurrently would race on that directory (a build cleaning
    # .next under a running typegen), which is the flake shape SMA-427 already paid for with
    # wasm-pack's destructive --out-dir. This dep serializes them.
    deps:
      - 'paigasus-console-ts:build'
    # Narrow inputs — `repo` owns the whole tree, so without these the gate runs on every change.
    # 'ts/pnpm-lock.yaml' is the IMPORTANT one and is the entire reason this drift went unseen:
    # the Next VERSION is what drives this file's content, and the lockfile is absent from
    # paigasus-console-ts:build's own inputs, so a Next upgrade never re-keyed that task.
    inputs:
      - 'ci/next-env/**/*'
      - 'ts/apps/paigasus-console/next-env.d.ts'
      - 'ts/apps/paigasus-console/next.config.ts'
      - 'ts/apps/paigasus-console/tsconfig.json'
      - 'ts/apps/paigasus-console/app/**/*'
      - 'ts/pnpm-lock.yaml'

  affected-smoke:
    description: 'Assert the cross-language affected graph still cascades; fail red on a deleted edge or a dropped --include-relations (SMA-409).'
    # Run the negative control FIRST, mirroring repo:publish-metadata. Without this CI runs only the
    # real suite, so the self-tests that prove these assertions can FIRE are never executed — a
    # rotted self-test ships green, taking the repo's only proof-that-the-gate-bites with it
    # (SMA-526 hit this; SMA-534 adds A4's rows, which are worth exactly nothing unexecuted).
    # Moon does not enable errexit for `script:` blocks — same latent defect the nats-permissions,
    # promtool and publish-metadata tasks document — hence the explicit `set -euo pipefail`.
    script: |
      set -euo pipefail
      ci/affected-graph/run.sh --negative-control
      ci/affected-graph/run.sh
    toolchain: 'system'
    inputs:
      - 'ci/affected-graph/**/*'
      - '.github/workflows/ci.yml'
      - '.moon/**/*'
      - 'moon.yml'
      - '*/moon.yml'
      - 'rs/crates/*/*/moon.yml'
      - 'py/packages/*/moon.yml'
      - 'ts/packages/*/moon.yml'
      - 'ts/apps/*/moon.yml'
      - 'rs/**/Cargo.toml'
      - 'py/packages/*/pyproject.toml'
      - 'rs/crates/*/*/pyproject.toml'
      - 'rs/crates/*/*/package.json'
      - 'ts/packages/*/package.json'
      - 'ts/apps/*/package.json'
      # SMA-542 — this task now pins the call sites of repo:actionlint's self-tests and mutation
      # battery (ACTIONLINT_SH_CALL_SITES), so a change under ci/actionlint/ MUST re-key it.
      # Without this the pin is real but unreachable: the PR that deletes those lines does not
      # schedule this task, while repo:actionlint (inputs: ['**/*']) still runs and now asserts
      # nothing. Same reasoning as the CLAUDE.md entry below — repo:actionlint's own `**/*` cannot
      # green a different task.
      - 'ci/actionlint/**/*'
      # SMA-530 — this task now pins ci/release-parity/run.sh's --negative-control BLOCK
      # (RELEASE_PARITY_SH_CALL_SITES), so a change under ci/release-parity/ MUST re-key it.
      # Without this the pin is real but unreachable: the PR that deletes the block does not
      # schedule this task. Same reasoning as the ci/actionlint/**/* entry above.
      - 'ci/release-parity/**/*'
      # SMA-541 — this task now asserts that CLAUDE.md's documented full-graph command mirrors
      # ci.yml's `T=(...)` array, so a docs-only edit MUST re-key it; without this the assertion is
      # real but unreachable behind a cached PASS. (repo:actionlint's `**/*` already covers
      # CLAUDE.md, but that is a different task and cannot green this one.)
      - 'CLAUDE.md'
      # The guard shells out to the proto-pinned `moon` for its query output, and this file's own
      # README states the expected sets are "a snapshot ... at the pinned moon version" — which is
      # only true if a version bump re-runs it. Every other repo gate that shells out to a
      # proto-pinned binary lists this (repo:osv, repo:promtool, the three release-parity*).
      - '.prototools'

  parity-corpus-drift:
    description: 'Regenerate the parity corpus from the kernel; assert it matches the committed vectors (SMA-433).'
    # Run the generator crate-scoped from rs/ so rs/.cargo/config.toml is in scope, then assert the
    # committed corpus is unchanged. NEVER broaden to --workspace: the parity crate is a plain
    # lib+bin (no cdylib), so it needs none of the apple-darwin link flags the FFI cdylibs do.
    script: '( cd rs && cargo run -p paigasus-kernel-parity --bin gen-parity-vectors ) && git diff --exit-code rs/crates/libs/paigasus-kernel-parity/vectors/'
    toolchain: 'system'
    # Narrow inputs — `repo` owns the whole tree, so without these the guard would run on every change.
    inputs:
      - 'rs/crates/libs/paigasus-kernel/src/**/*'
      # The kernel manifest too: the generator compiles `paigasus-kernel`, so a kernel Cargo.toml
      # change (a future `[features]` toggle altering `sum`) must re-key the gate (cache-input
      # completeness — the on-disk complement to the in-crate replay test).
      - 'rs/crates/libs/paigasus-kernel/Cargo.toml'
      - 'rs/crates/libs/paigasus-kernel-parity/src/**/*'
      - 'rs/crates/libs/paigasus-kernel-parity/Cargo.toml'
      - 'rs/crates/libs/paigasus-kernel-parity/vectors/**/*'

  observability-drift:
    description: 'Assert the committed Grafana dashboards + Prometheus rules reference only registered metric families (SMA-466).'
    # Duplicates paigasus-observability-rs:test ON PURPOSE. `ops/` has no moon.yml, so it belongs to
    # the root `repo` project, while the crate's `test` inputs are project-relative — an ops-only
    # change never makes the crate affected, so without this task the drift guard would not run on
    # exactly the PRs that introduce drift. Same shape as parity-corpus-drift above.
    script: '( cd rs && cargo nextest run --no-tests=pass -p paigasus-observability --test drift )'
    toolchain: 'system'
    # Narrow inputs — `repo` owns the whole tree, so without these the guard would run on every change.
    inputs:
      - 'ops/observability/prometheus/rules/**/*'
      - 'ops/observability/grafana/dashboards/**/*'
      - 'rs/crates/libs/paigasus-observability/**/*'

  nats-permissions:
    description: 'Assert the committed ops/nats permission set is exactly sufficient for the IAM publisher and the gateway consumer, and no broader (SMA-493).'
    # Duplicates paigasus-iam-rs:test ON PURPOSE, same reasoning as observability-drift above:
    # `ops/` has no moon.yml so it belongs to the root `repo` project, while the crate's `test`
    # inputs are project-relative — an ops-only change (which is exactly how a permission set
    # gets loosened) would otherwise never make the crate affected, and the guard would not run
    # on the PRs that need it.
    # Moon does not enable errexit for `script:` blocks — a failing command followed by a
    # succeeding one still exits the task 0 — so `set -euo pipefail` is required explicitly or
    # a failing check-subjects.sh would be masked by a passing test suite (CodeRabbit, SMA-493).
    script: |
      set -euo pipefail
      bash ops/nats/check-subjects.sh
      # `--profile iam-nats` only sets where the JUnit report is written; the retry budget and the
      # docker-containers group still come from `profile.default`, which custom profiles inherit.
      # Its own profile, not `iam`: this task and paigasus-iam-rs:test can run concurrently, and a
      # shared store dir would clobber one report with the other (SMA-521).
      ( cd rs && cargo nextest run --no-tests=pass -p paigasus-iam --test nats_permissions --test docker_preflight --profile iam-nats )
    toolchain: 'system'
    # Narrow inputs — `repo` owns the whole tree, so without these the guard runs on every change.
    # Per entry:
    #   - 'ops/nats/**/*' — the committed permission set itself; this is what the suite proves
    #     is correct, and what check-subjects.sh checks against provision.sh's subject lists.
    #   - 'tests/nats_permissions.rs' — the suite's own source.
    #   - 'src/adapters/events/**/*' — the publisher/consumer adapter code the suite exercises
    #     against a real broker (creds loading, nats_publisher, relay).
    #   - 'src/config.rs' — only `PublisherConfig`/`PublisherBackend` (~130 of this file's ~2855
    #     lines) actually feed the suite. Deliberately NOT narrowed further: this file holds
    #     ~15 unrelated config structs sharing one module, Moon inputs are file-level (no line
    #     ranges), and splitting `PublisherConfig` out is a real refactor of a file five other
    #     SMA-493 tasks already touched — out of scope here. So an edit anywhere in config.rs
    #     triggers this container suite even when unrelated to publishing; that's accepted as
    #     the cheaper failure mode versus a missed gate on an actual `PublisherConfig` change.
    #   - 'Cargo.toml', 'rs/Cargo.lock' — dependency/version changes that could alter broker
    #     client behavior (e.g. the NATS crate itself).
    #   - 'rs/.config/nextest.toml' — this task runs its own `cargo nextest` against
    #     -p paigasus-iam, which the SMA-521 retry/test-group override matches. Without this
    #     input a profile edit would leave this gate serving a cached PASS. (It is NOT
    #     inherited from .moon/tasks/rust.yml: that file is `inheritedBy: languages: ['rust']`
    #     and this task is `language: 'bash'` on the root `repo` project.)
    # NOT included: 'tests/support/**/*' (~776 lines of shared auth/tenancy/audit/API-key test
    # infra) — nats_permissions.rs still has no `mod support;`, so that surface is not a
    # dependency and including it would trigger this Docker-backed, TLS-cert-minting suite on
    # unrelated test-fixture changes. Its ONE standalone file IS a dependency since SMA-538
    # (`#[path = "support/docker.rs"] mod docker;` for the shared skip policy) and is listed
    # below individually — without it a policy edit would change this binary while leaving the
    # gate that proves the committed permission set has not been loosened on a cached PASS.
    inputs:
      - 'ops/nats/**/*'
      - 'rs/crates/services/paigasus-iam/tests/nats_permissions.rs'
      - 'rs/crates/services/paigasus-iam/tests/docker_preflight.rs'
      - 'rs/crates/services/paigasus-iam/tests/support/docker.rs'
      - 'rs/crates/services/paigasus-iam/src/adapters/events/**/*'
      - 'rs/crates/services/paigasus-iam/src/config.rs'
      - 'rs/crates/services/paigasus-iam/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/.config/nextest.toml'

  wasm-getrandom-free:
    description: 'Assert the wasm binding pulls no `getrandom` — the kernel mints UUIDv7 from injected bytes, so wasm32-unknown-unknown stays buildable (SMA-448).'
    # Resolve the FULL dependency tree first (fail LOUD if `cargo tree` itself errors — a broken
    # invocation must not silently read as "getrandom absent"), then grep it for getrandom. We WANT
    # it absent: fail the task only when the (successfully resolved) tree contains it.
    script: |
      cd rs
      if ! out="$(cargo tree -p paigasus-wasm --target wasm32-unknown-unknown -e no-dev)"; then
        echo "cargo tree failed for paigasus-wasm (wasm32) — cannot verify getrandom absence" >&2
        exit 2
      fi
      if printf '%s\n' "$out" | grep -qw getrandom; then
        echo "getrandom is in the paigasus-wasm dependency graph — a uuid rng feature leaked" >&2
        exit 1
      fi
    toolchain: 'system'
    inputs:
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/crates/libs/paigasus-kernel/Cargo.toml'
      - 'rs/crates/libs/paigasus-kernel/src/**/*'
      - 'rs/crates/bindings/paigasus-wasm/Cargo.toml'
      - 'rs/crates/bindings/paigasus-wasm/src/**/*'

  redis-connect-single-site:
    description: 'Assert the redis `ConnectionManager` type name, and the known unnamed-connection constructors, never appear outside `adapters::redis_conn`, so no known call site can bypass the circuit breaker (SMA-473, SMA-476).'
    # WHAT IS GATED: the `ConnectionManager` TYPE NAME, plus a maintained allowlist of
    # `redis::Client` methods that hand back an ALTERNATIVE `ConnectionLike` without ever naming a
    # gated type — anywhere outside redis_conn.rs.
    #
    # SMA-473 gated only the constructors (`::new(`, `::new_with_config(`,
    # `ConnectionManagerConfig`, `.get_connection_manager`), because adapters legitimately HELD a
    # `ConnectionManager` in a field. Since SMA-476 they hold a `RedisHandle` instead, so the type
    # name has no business appearing anywhere else — and banning the name outright is a real
    # strengthening: it closes the copy-paste-a-typed-field bypass that motivated SMA-473. It is
    # NOT a proof that no unnamed bypass can exist (see the next paragraph and D12 in the design
    # doc, which used to overclaim this).
    #
    # This subsumes SMA-473's separate `new_lazy_with_config` rule (which required naming
    # `connection_manager_config()` on the same line): that call cannot be made without the type
    # name either, so the rule was deleted rather than kept as dead weight.
    #
    # `.get_connection_manager` is kept as its own term because the `redis::Client` convenience
    # constructors return a `ConnectionManager` without the caller ever naming the type
    # (`redis-1.3.0/src/client.rs:453`) — exactly the accidental/copy-paste bypass.
    #
    # `.get_multiplexed_async_connection` and `.get_connection` are gated for the SAME reason
    # (SMA-476 review): `redis::Client::open(u)?.get_multiplexed_async_connection().await` yields
    # a `MultiplexedConnection`, which — like `ConnectionManager` — implements `ConnectionLike`
    # and is accepted by the same `AsyncCommands` blanket impl, all without naming a gated type.
    # `.get_connection` is the sync equivalent (`redis::Connection`). Both were zero-occurrence
    # (latent, not a live bug) when added. This list is maintained by hand, not derived from the
    # `ConnectionLike` trait, so a FUTURE redis-rs method of the same shape needs its own term
    # added here — this gate is an allowlist of known escape hatches, not an exhaustive one.
    #
    # `.get_connection` ALONE is ambiguous: `persistence/migration/*.rs` calls SeaORM's
    # `SchemaManager::get_connection` (same method name, unrelated crate, returns a DB connection)
    # on every migration file, which would otherwise produce a wall of false offenders. Migrations
    # are architecturally Postgres-only — they never touch Redis — so that directory alone is
    # excluded from THIS term. It stays fully in scope for `ConnectionManager` and the other two
    # terms, none of which collide with anything SeaORM exposes.
    #
    # SCOPE is `src/` AND `tests/`: a Docker-gated integration test is just as able to construct a
    # stock manager as production code.
    #
    # Comment lines are excluded so prose may still name the API — several module docs do. NOTE
    # the filter anchors on `//` only, so a `/* ... */` BLOCK comment naming ConnectionManager
    # WILL trip this gate. Use `//` in this crate when writing about the type.
    #
    # Two portability notes, both learned the hard way:
    #   - Do NOT anchor paths on `^\./`. GNU grep (CI, Linux) emits the `./` prefix; ugrep
    #     (some dev shells) strips it. An `^\./` anchor silently matches nothing on one of
    #     them, which would make this gate pass while guarding nothing. Passing `src tests`
    #     explicitly (rather than `.`) sidesteps that divergence entirely.
    #   - The comment filter anchors on `:[0-9]+:[[:space:]]*//` so it tests the CONTENT,
    #     not any `://` that happens to appear inside a redis URL on a code line.
    #
    # The control (`expected` must be non-empty) is what catches a pattern typo or an upstream
    # rename: without it, BOTH greps could go empty and the gate would pass while guarding nothing.
    script: |
      cd rs/crates/services/paigasus-iam
      named_hits="$(grep -rnE 'ConnectionManager|\.get_connection_manager|\.get_multiplexed_async_connection' src tests | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
      bare_get_connection_hits="$(grep -rnE '\.get_connection\b' src tests | grep -vE ':[0-9]+:[[:space:]]*//' | grep -v '/persistence/migration/' || true)"
      hits="$(printf '%s\n%s\n' "$named_hits" "$bare_get_connection_hits" | grep -v '^$' || true)"
      expected="$(printf '%s\n' "$hits" | grep -E 'adapters/redis_conn\.rs:' || true)"
      offenders="$(printf '%s\n' "$hits" | grep -vE 'adapters/redis_conn\.rs:' || true)"
      if [ -z "$expected" ]; then
        echo "no redis connection-config construction found in adapters/redis_conn.rs — the guard is not guarding anything (renamed file? changed API?)" >&2
        exit 2
      fi
      if [ -n "$offenders" ]; then
        echo "redis connection config built outside adapters/redis_conn.rs (SMA-473 — use redis_conn::connect):" >&2
        printf '%s\n' "$offenders" >&2
        exit 1
      fi
    toolchain: 'system'
    # Narrow inputs — `repo` owns the whole tree, so without these the guard runs on every change.
    inputs:
      - 'rs/crates/services/paigasus-iam/src/**/*'
      - 'rs/crates/services/paigasus-iam/tests/**/*'

  iam-docker-policy-single-site:
    description: 'Assert the Docker-unavailable decision exists exactly once, in tests/support/docker.rs, so a new container-backed suite cannot hand-roll copy #12 (SMA-538).'
    # WHAT IS GATED — two independent tells, both under this crate's tests/, both expected to
    # appear ONLY in the one file that owns the policy:
    #
    #   1. Reading the `CI` environment variable. Every one of the 11 copies SMA-538 removed was
    #      `if std::env::var_os("CI").is_some() { panic!(..) }` followed by an `eprintln!` and a
    #      `return None`. Three alternatives are matched: `var_os("CI")` and `var("CI")` are the
    #      runtime reads the removed copies used — `var\("CI"\)` is unprefixed on purpose so it
    #      also catches a bare `use std::env::var; var("CI")` import, not only the fully
    #      qualified `env::var("CI")` form; `option_env!("CI")` is a compile-time read of the
    #      same variable — not a perfect substitute (baked in at build time, not read per-process)
    #      but standard and discoverable enough that a well-meaning author reaching for "check if
    #      CI is set" could land on it instead of the neighbouring `std::env::var_os` idiom.
    #      Covering it costs one alternation; not covering it would let copy #12 through under a
    #      different macro name, which defeats the point of a durability gate. A whitespace-padded
    #      call, e.g. `std::env::var_os( "CI" )`, is a KNOWN, deliberately-uncovered gap — not
    #      missed, just not worth chasing here, because `cargo fmt --check` is a separate
    #      mandatory gate on the same PR and would reject that spacing regardless.
    #   2. Importing `AsyncRunner`. Reading `CI` is only how the 11 original copies happened to be
    #      written — the actual decision is "does this suite skip on its own instead of calling
    #      `start_or_skip`", and a new suite could do that unconditionally
    #      (`let Ok(node) = image.start().await else { return; };`) without ever touching `CI`,
    #      evading term 1 and passing in CI too. The consolidation made a tighter term possible:
    #      `AsyncRunner` (which `.start()` needs to be in scope) now appears in exactly one place.
    #      Matched as `use .*runners::.*AsyncRunner` — the IMPORT, not `.start()` itself:
    #      `nats_publisher.rs` legitimately calls `ContainerAsync::start` to restart an
    #      already-created container, and gating bare `.start()` would collide with that.
    #      The `.*` between `runners::` and `AsyncRunner` is load-bearing: it catches the BRACED
    #      form `use testcontainers::runners::{AsyncRunner, ..}`, which an anchored
    #      `runners::AsyncRunner` misses. rustfmt here sets only `max_width`, so import
    #      granularity survives exactly as an author typed it — the braced form is ordinary, not
    #      exotic. STILL uncovered, and knowingly so: a glob (`use ..::runners::*;`) and a
    #      fully-qualified inline path with no import at all. Both are unusual enough, and this
    #      gate is defence-in-depth behind the canary, that chasing them would cost more in
    #      false-positive surface than it buys.
    #
    # Modelled on repo:redis-connect-single-site, including its two portability lessons: do NOT
    # anchor paths on `^\./` (GNU grep emits the prefix, ugrep strips it), and filter comment
    # lines by CONTENT (`:[0-9]+:[[:space:]]*//`) so prose may still name the variable or the API
    # (e.g. `nats_publisher.rs`'s two `AsyncRunner::start` doc-comment mentions).
    #
    # The control — `expected` must be non-empty — is what catches a pattern typo or a rename:
    # without it all greps could go empty and the gate would pass while guarding nothing.
    script: |
      cd rs/crates/services/paigasus-iam
      hits="$(grep -rnE 'var_os\("CI"\)|var\("CI"\)|option_env!\("CI"\)|use .*runners::.*AsyncRunner' tests | grep -vE ':[0-9]+:[[:space:]]*//' || true)"
      expected="$(printf '%s\n' "$hits" | grep -E '^tests/support/docker\.rs:' || true)"
      offenders="$(printf '%s\n' "$hits" | grep -vE '^tests/support/docker\.rs:' | grep -v '^$' || true)"
      if [ -z "$expected" ]; then
        echo "no CI check or AsyncRunner import found in tests/support/docker.rs — the guard is not guarding anything (moved? renamed?)" >&2
        exit 2
      fi
      if [ -n "$offenders" ]; then
        echo "Docker-skip policy hand-rolled outside tests/support/docker.rs (SMA-538 — call start_or_skip):" >&2
        printf '%s\n' "$offenders" >&2
        exit 1
      fi
    toolchain: 'system'
    # Narrow inputs — `repo` owns the whole tree, so without these the guard runs on every change.
    inputs:
      - 'rs/crates/services/paigasus-iam/tests/**/*'

  input-liveness:
    description: 'Assert every repo:* task input still matches a tracked file, so a wired gate cannot silently stop firing (SMA-553).'
    # inputs MUST stay ['**/*'] — asserted by this gate's own D13 floor AND by ci_targets.py, so
    # neither is the sole judge of its own configuration. The verdict depends on the WHOLE tracked
    # tree because a glob dies when files MOVE, and no narrow input list can observe that. This is
    # also why the check is not folded into ci/affected-graph/run.sh: repo:affected-smoke's narrow
    # inputs list no `ops/` path, so renaming ops/ would leave it serving a cached PASS on exactly
    # the change that kills repo:promtool (SMA-553 D2). Same reasoning repo:actionlint records.
    #
    # Negative control FIRST, mirroring repo:affected-smoke and repo:publish-metadata: without it
    # CI runs only the real check, so the self-test that proves these assertions can FIRE never
    # executes and a rotted control ships green (SMA-526). Moon does not enable errexit for
    # `script:` blocks — a failing command followed by a succeeding one still exits 0 — so
    # `set -euo pipefail` is required explicitly.
    script: |
      set -euo pipefail
      python3 ci/affected-graph/task_inputs.py --self-test
      python3 ci/affected-graph/task_inputs.py
    toolchain: 'system'
    inputs:
      - '**/*'

  promtool:
    description: 'promtool validates the Prometheus scrape config + alert rules + rule unit tests under ops/observability/prometheus/ (SMA-446).'
    # Moon does not enable errexit for `script:` blocks — same latent defect as nats-permissions
    # above (CodeRabbit, SMA-493): without this, a failing `check config` would be masked by a
    # passing `check rules`/`test rules`.
    script: |
      set -euo pipefail
      promtool check config ops/observability/prometheus/prometheus.yml
      promtool check rules ops/observability/prometheus/rules/*.rules.yml
      promtool test rules ops/observability/prometheus/rules/tests/*.test.yml
    toolchain: 'system'
    inputs:
      - 'ops/observability/prometheus/**/*'
      - '.prototools'
      - '.proto/plugins/promtool.toml'

  publish-metadata:
    description: 'Assert every publishable crate carries crates.io-valid metadata, packages exactly the intended files, and cannot be released by release-plz while still at the 0.0.0 stub floor (SMA-376); and that every PyPI-bound distribution carries PyPI-valid metadata whose declared README/LICENSE files exist, while wheels.yml stays credential-free (SMA-578).'
    # The self-test runs FIRST: a gate that cannot report red is worse than no gate, and it
    # is sub-second, so paying for it before the real (network + compile) checks is free.
    # Moon does not enable errexit for `script:` blocks — same latent defect as the
    # nats-permissions/promtool tasks document — hence the explicit `set -euo pipefail`.
    script: |
      set -euo pipefail
      bash ci/publish-metadata/run.sh --negative-control
      bash ci/publish-metadata/run.sh
    toolchain: 'system'
    # DELIBERATELY BROAD on rs/crates/**: the publishable set is discovered at RUNTIME from
    # `cargo metadata`, so per-crate globs would go stale the day a new crate flips
    # publish = true and Moon would serve a cached pass over sources it never tracked. A
    # vacuous gate is worse than a slow one. The rest of the list is every input that
    # DETERMINES the answer: the toolchain pin and cargo config (they drive the verify
    # build) and release-plz.toml (Check 3). `.gitignore` is kept too even though today's
    # `include` allowlist makes cargo ignore it entirely (the other git-sensitive path,
    # the `--allow-dirty` dirty check, is skipped whenever `CI` is set) — it earns its
    # place as a forward guard for a future publishable crate that ships without an
    # `include` list. Omitting an input that DOES determine the answer is the exact
    # staleness ci/next-env/run.sh documents.
    inputs:
      - 'ci/publish-metadata/run.sh'
      # security-scan.yml is an input because Check 4 ASSERTS ON IT: without this, the
      # call-site pin would serve a cached pass on exactly the PR that deletes the job.
      - 'ci/publish-metadata/categories.py'
      - 'ci/publish-metadata/crates-io-categories.txt'
      - '.github/workflows/security-scan.yml'
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/crates/**/*'
      - 'rs/rust-toolchain.toml'
      - 'rs/.cargo/config.toml'
      - 'rs/release-plz.toml'
      - '.gitignore'
      # The PyPI arm (SMA-578). wheels.yml is an input because Check P-D6 ASSERTS ON IT;
      # without it the credential ban would serve a cached pass on exactly the PR that
      # adds a registry credential.
      #
      # The py/ entries are SINGLE-LEVEL GLOBS, matching run.sh's PYPI_SCAN_GLOB. They
      # were literal per-package paths until SMA-578 review I1 measured the hole that
      # leaves: a PR ADDING a PyPI-bound package under py/packages/ touches no listed
      # input, so Moon never selects this task and the new package's metadata is never
      # checked at all. A glob selects the task for a package that does not exist yet;
      # a literal list cannot. ONE level, never `**/`: a recursive glob would sweep in
      # py/pyproject.toml (a uv virtual root with no [project] table) and node-gyp's
      # copy under ts/node_modules in a provisioned tree — `py/packages/*/` matches
      # neither. README/LICENSE are globbed because Check P2 asserts they EXIST, so
      # deleting one must select this task rather than replay a cached pass. The
      # bindings crate's pyproject/README/LICENSE are already covered by
      # 'rs/crates/**/*' above.
      - '.github/workflows/wheels.yml'
      - 'py/packages/*/pyproject.toml'
      - 'py/packages/*/README.md'
      - 'py/packages/*/LICENSE'

  version-lockstep:
    description: "Assert every version-carrying site in the kernel and proto lockstep families agrees with that family's source-of-truth Cargo crate (SMA-576)."
    # --self-test runs FIRST (its fixture tables cost nothing and catching a broken verdict
    # function before it's trusted by anything else is the point), then the negative control,
    # mirroring repo:publish-metadata directly above: a gate that cannot report red is worse than
    # no gate, and it is sub-second. Moon does NOT enable errexit for `script:` blocks — a script's
    # status is simply its LAST command's — so without the explicit `set -euo pipefail` a failing
    # self-test or control would be masked by the passing real run (the SMA-526 rotted-negative-
    # control shape; the same shape applied `--self-test` was never invoked at all until this line
    # was added — SMA-576 fix-wave finding 1).
    script: |
      set -euo pipefail
      bash ci/version-lockstep/run.sh --self-test
      bash ci/version-lockstep/run.sh --negative-control
      bash ci/version-lockstep/run.sh
    toolchain: 'system'
    # Every file that CARRIES a version in either family, plus the script itself. Narrower than
    # publish-metadata's `rs/crates/**/*` because the site list here is STATIC (declared in run.sh's
    # SITES array), not discovered at runtime — so a per-file list cannot go stale behind a new
    # crate the way a runtime-discovered set would. Each entry must match a tracked file or
    # repo:input-liveness reds; the set is pinned a second time, from an independently scheduled
    # gate, by ci_targets.py's SELF_TASK_EXPECTED_GLOBS.
    inputs:
      - 'ci/version-lockstep/run.sh'
      - 'rs/Cargo.toml'
      - 'rs/Cargo.lock'
      - 'rs/crates/libs/paigasus-kernel/Cargo.toml'
      - 'rs/crates/libs/paigasus-proto/Cargo.toml'
      - 'rs/crates/libs/paigasus-proto-derive/Cargo.toml'
      - 'rs/crates/bindings/paigasus-py-bindings/Cargo.toml'
      - 'rs/crates/bindings/paigasus-py-bindings/pyproject.toml'
      - 'rs/crates/bindings/paigasus-node-bindings/Cargo.toml'
      - 'rs/crates/bindings/paigasus-node-bindings/package.json'
      - 'rs/crates/bindings/paigasus-node-bindings/index.js'
      - 'rs/crates/bindings/paigasus-wasm/Cargo.toml'
      - 'rs/crates/bindings/paigasus-wasm/package.json'
      - 'py/uv.lock'
      - 'py/packages/paigasus-kernel/pyproject.toml'
      - 'py/packages/paigasus-proto/pyproject.toml'

  actionlint:
    description: 'actionlint over .github/workflows/**, plus controls that every paths: glob still matches the tree, every branches: entry names a real branch, and the self-test/mutation-battery invocations that guard all of it cannot be silently deleted (SMA-525, SMA-540, SMA-542).'
    # WHY `inputs: **/*` AND NOT THE NARROW LIST THE OTHER repo:* GATES USE — this gate makes an
    # assertion about the WHOLE FILE TREE, not about the workflow files. A directory rename is the
    # dominant real-world way a paths: glob comes to match nothing (a typo is at least made by
    # someone looking at the file), and keying on .github/workflows/** would let Moon serve a
    # cached pass indefinitely — reproducing the "silent and permanent" failure this gate exists
    # to prevent. Concretely: security-scan.yml filters on 'ci/osv/**', and this change adds a
    # sibling ci/actionlint/, so a future ci/ reshuffle is plausible.
    #
    # WHAT `inputs: **/*` STILL DOES NOT COVER (SMA-540) — the branch half of check 5 reads git REF
    # state, and .git/ is in no task's input hash. Two runs over an identical tree therefore hash
    # identically, and ci.yml restores .moon/cache across runs, so a PASS recorded while a branch
    # existed can replay after that branch is deleted upstream — a silent pass in a gate whose
    # whole premise is that it never silently passes. Narrow today (every filter in this repo names
    # `main`, which is never deleted) and it fails safe in the other direction, since a genuinely
    # typo'd name changes the workflow file and so changes the hash. Run `ci/actionlint/run.sh`
    # directly, or `moon run repo:actionlint --force`, to bypass the cache. Stated as L9 in
    # docs/superpowers/specs/2026-08-19-sma-540-branches-filter-gate-design.md.
    #
    # The narrow-inputs convention elsewhere in this file exists because those gates are expensive
    # (cargo nextest, next typegen). This one is ~17-19s standalone and warm (measured via
    # interleaved base/branch A/B sweeps — sequential min-of-N is invalid on this shared host, see
    # the measured table in ci/actionlint/README.md; supersedes an earlier ~14.42s min-of-7 figure,
    # which predated this wave's tenth self-test — was ~1.0s before SMA-542 added checks 8-9,
    # ~6.33s before the SMA-542 residual-closure wave added check 8d, ~14.42s before this wave added
    # check 8e): six actionlint invocations — one over the real workflows, five stdin fixtures —
    # and ten fixture tables (extractor,
    # path-filter verdicts, branch-filter verdicts, config allowlist, ci-target floor, invocation
    # allowlist, affected-graph wiring, block execution, kill predicate, affected-smoke block).
    # TWO DIFFERENT `git ls-files` counts, for two different walks, are worth keeping distinct
    # rather than merging into one number (measured via `bash -x`, CodeRabbit PR 150 finding F2 —
    # a merged "26" here previously read as the SAME walk check 9 re-runs, when it is not): the
    # FULL GATE (checks 5/6 scanning the real workflow files' `paths:`/`branches:` filters, on top
    # of everything `--self-test` already does) makes 27; `--self-test` ALONE (the fixture tables'
    # own synthetic `pattern_verdict`/`tracked_exact`/branch-resolution calls, never touching the
    # real workflow files) makes 9 — unchanged by SMA-572's tenth table, since
    # `affected_smoke_block_self_test` builds its fixtures from an in-memory `moon.yml` string and
    # never calls `git ls-files` at all (re-measured the same way after SMA-572: still 9). Check
    # 9's mutation battery re-runs the SECOND of those — the whole of `--self-test`, 9
    # `git ls-files` calls included — PLUS check 8d's own dynamic execution of the
    # moon-ci-affected-graph step's `run:` block against a stubbed `moon`, once per event path, all
    # once per self-test invocation plus once unmutated, eleven concurrent subprocesses. That dynamic
    # execution is most of check 8d's OWN standalone cost (~1.5s of the ~2.01s -> ~3.52s
    # `--self-test` jump): each of the EIGHT fixtures that reach the per-event-path loop (the
    # healthy control, the if-false mutant, two healthy rechecks, the subset mutant, the
    # branch-swap mutant, the duplicate-invocation mutant, and the final aggregate re-run — every
    # other fixture returns before the loop) spawns a handful of real subprocesses (a scratch
    # `mktemp -d`, then per event path a `bash -c` running the extracted block, which itself shells
    # out to `grep` and the stubbed `moon`) rather than a `grep`/`sed` pass over text. That
    # ~2.01s -> ~3.52s figure is itself now historical: this wave's tenth self-test
    # (`affected_smoke_block_self_test`, check 8e) took standalone `--self-test` to ~3.85s
    # (interleaved base/branch measurement, base ~3.3s) — a different number from the full-gate
    # ~17-19s above, not a restatement of it.
    # See the measured table in ci/actionlint/README.md.
    # Through Moon it is ~11.6s, essentially all of which is Moon's own per-task floor; see the
    # measured table in ci/actionlint/README.md before concluding the inputs are the problem.
    script: 'ci/actionlint/run.sh'
    toolchain: 'system'
    inputs:
      - '**/*'

  error-code-single-site:
    description: 'Assert every file spelling a canonical error code is on a reviewed manifest, so a new emission site cannot ship without a registry membership test (SMA-507).'
    # WHY `inputs: rs/crates/**/src/**/*.rs` AND NOT A NARROW LIST — this gate's whole job is to
    # notice a NEW emission site in a NEW file. Narrow inputs would schedule it only when an
    # already-listed file changed, so the one case it exists for would be the one case it never
    # runs on. Cheap for the same reason repo:actionlint is: .moon/workspace.yml's
    # hasher.ignorePatterns keeps gitignored trees out of the hash walk, and the check is a
    # pure-python regex scan of ~200 files with no cargo invocation.
    #
    # `--self-test` runs FIRST and in the SAME script block, per repo:affected-smoke and
    # repo:publish-metadata: a rotted checker must red rather than ship green. `set -euo pipefail`
    # is REQUIRED — Moon does not enable errexit for `script:` blocks, so without it a failing
    # --self-test would be masked by a passing --single-site.
    #
    # This gate does NOT guard code REMOVAL. It does not need to: both service crates declare
    # `test: deps: ['^:build']` in their own moon.yml, so a contracts change already schedules
    # paigasus-{iam,gateway}-rs:test and the membership tests run. See ci/error-registry/README.md.
    # (Until SMA-528 this was aspirational: `^:build` schedules an upstream's build, it does not
    # make this crate affected. What makes it true is `@group(upstreams)` — both service crates'
    # `test` now key on paigasus-proto's sources, so a contracts change that regenerates them
    # selects the test.)
    script: |
      set -euo pipefail
      python3 ci/error-registry/check.py --self-test
      python3 ci/error-registry/check.py --single-site
    toolchain: 'system'
    inputs:
      - 'rs/crates/**/src/**/*.rs'
      - 'contracts/proto/paigasus/common/v1/error.proto'
      - 'ci/error-registry/**/*'

  http-extractor-envelope:
    description: 'Assert no HTTP handler takes a bare `axum::Json` in request position, so a refused body cannot answer outside the IAM error envelope (SMA-587).'
    # WHY THIS EXISTS — a bare `axum::Json<T>` in REQUEST position answers a refused body
    # (malformed JSON, wrong content-type, schema mismatch, oversized body) with axum's default
    # PLAIN TEXT rejection, escaping the service's stable `{"error":{code,message}}` envelope.
    # SMA-587 converted fourteen handlers to the house `EnvelopeJson<T>`; nothing but this gate
    # stops a fifteenth being written with bare `Json<T>` tomorrow.
    #
    # WHY `inputs` IS THE ADAPTER TREE AND NOT A FILE LIST — like repo:error-code-single-site, this
    # gate's whole job is to notice a NEW handler in a NEW file. A narrow list would schedule it
    # only when an already-clean file changed, so the one case it exists for is the one case it
    # never runs on. The first glob is IDENTICAL to check.py's SCAN_GLOB on purpose: scheduling and
    # scanning must not be able to drift apart. Cheap for the same reason the other repo:* scans
    # are — a pure-python pass over 26 files, no cargo invocation (toolchain: 'system').
    #
    # `--self-test` runs FIRST and in the SAME script block, per repo:error-code-single-site: a
    # rotted checker must red rather than ship green, and the self-test's planted violations are
    # the only proof this gate can red at all (it carries no --negative-control mode).
    # `set -euo pipefail` is REQUIRED — Moon does not enable errexit for `script:` blocks, so
    # without it a failing --self-test would be masked by a passing --check.
    script: |
      set -euo pipefail
      python3 ci/http-extractor/check.py --self-test
      python3 ci/http-extractor/check.py --check
    toolchain: 'system'
    inputs:
      - 'rs/crates/services/*/src/adapters/http/**/*.rs'
      - 'ci/http-extractor/**/*'
