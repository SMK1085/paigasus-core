$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-kernel-ts'
layer: 'library'
language: 'typescript'

# Cross-language edge to the napi binding crate (ADR-0005). dependsOn buys build ordering +
# affected-graph propagation under `moon ci --include-relations` (task-level `^:build` carries the
# cascade; a project dependsOn alone does not — SMA-389 D3), and provisions the Rust toolchain in
# this project's task context so `napi build` can shell out to cargo.
dependsOn:
  - 'paigasus-node-bindings-rs'
  - 'paigasus-wasm-rs'

tasks:
  # Produce the .node, THEN typecheck. It does NOT touch the committed wasm glue — `generate-wasm`
  # below is that glue's only writer (SMA-634). Overrides the inherited
  # `tsc --noEmit` build (which would not produce the addon). `^:build` only builds the upstream
  # cargo gate, not this artifact (review F1).
  #
  # `napi build` is the @paigasus/node-bindings devDep `@napi-rs/cli`, hoisted into the ts
  # workspace via @paigasus/kernel's own `@napi-rs/cli` devDep (pnpm does NOT install a
  # `file:`-linked dep's devDeps — SMA-420 spike S2). `--cwd ../../../rs/...` keeps cargo's cwd
  # inside `rs/` so it picks up the apple-darwin `-undefined dynamic_lookup` link flags from
  # rs/.cargo/config.toml (spike S1); the .node lands in the crate dir, not here. The glue goes to
  # the scratch files index.fresh.js and index.fresh.d.ts beside it (SMA-667): the committed
  # index.js and index.d.ts have two writers only. generate-napi-glue writes both files.
  # version-lockstep --write writes only the version literals of index.js, as text (SMA-684).
  # `--no-dts-cache` gives each run its own type-def folder. Without it, `build` and `test` share
  # one folder, and napi-derive rewrites its files there during each compile. A run that reads
  # the folder at that time can read a partial file.
  #
  # `touch` the kernel + binding sources first: cargo/`napi build` incrementality is mtime-based, so
  # after a git op that leaves a Rust source OLDER than an existing rs/target/ artifact (warm cache +
  # checkout/rebase/stash → mtime inversion), cargo reports "up to date" and napi re-links a STALE
  # .node against the wrong source. Bumping the two (tiny) crates' source mtime forces a
  # content-correct recompile from current source — the napi analog of the py wheel's
  # `uv sync --reinstall-package`. `touch` is host-agnostic (CI is Linux, dev is macOS); a per-triple
  # `cargo clean --target <triple>` would have to know the host triple, so we avoid it.
  #
  # SMA-634: this task no longer runs wasm-pack and no longer writes the crate directory. The five
  # wasm artifacts are committed, and `paigasus-kernel-ts:generate-wasm` is their only writer. The
  # wasm inputs stay: `napi build` keeps this an FFI task, so A7 demands the dependsOn closure's
  # sources and manifests. `tsc` reads paigasus_wasm.d.ts through src/binding-parity.types.ts, from
  # the installed copy, which the preflight holds equal to the committed file (SMA-536).
  build:
    script: 'touch ../../../rs/crates/libs/paigasus-kernel/src/lib.rs ../../../rs/crates/bindings/paigasus-node-bindings/src/lib.rs ../../../rs/crates/bindings/paigasus-wasm/src/lib.rs && pnpm exec napi build --platform --cwd ../../../rs/crates/bindings/paigasus-node-bindings --js index.fresh.js --dts index.fresh.d.ts --no-dts-cache && node ../../../ts/scripts/check-installed-bindings.mjs && pnpm exec tsc -p tsconfig.json --noEmit'
    deps: ['^:build']
    inputs:
      - 'src/**/*'
      - 'tsconfig.json'
      - 'vitest.config.ts'
      - 'package.json'
      - '/ts/tsconfig.base.json'
      - '/ts/pnpm-lock.yaml'
      # Both Rust sources: napi build recompiles the binding AND the kernel it calls (spike S5),
      # so a kernel-source edit must bust this task's cache too (review F4) — Moon hashes only
      # listed inputs, and an upstream `^:build` recompile alone does not re-key this task.
      - '/rs/crates/libs/paigasus-kernel/src/**/*'
      # The kernel's manifest, not just its sources (SMA-560) — a `[features]` toggle there can
      # change what this task links with no src diff.
      - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
      # The napi crate's build script. `napi build` COMPILES it (it is `napi_build::setup()`,
      # which emits the addon's link args), so a change to it changes this task's output — but
      # nothing keyed on it. This is where SMA-537 and SMA-560 meet.
      - '/rs/crates/bindings/paigasus-node-bindings/build.rs'
      - '/rs/crates/bindings/paigasus-node-bindings/src/**/*'
      # ...and the binding's manifests, so a napi-config (package.json) or dependency (Cargo.toml)
      # change re-keys the build even without a Rust src diff (cache-input completeness, CodeRabbit).
      # This task writes the glue to the scratch files index.fresh.js and index.fresh.d.ts only
      # (SMA-667). The committed index.js and index.d.ts are not its outputs.
      - '/rs/crates/bindings/paigasus-node-bindings/Cargo.toml'
      - '/rs/crates/bindings/paigasus-node-bindings/package.json'
      # SMA-536. The `tsc` of this task reads the INSTALLED copy of index.d.ts and of the two wasm
      # typings through ts/node_modules (src/binding-parity.types.ts). The preflight
      # ts/scripts/check-installed-bindings.mjs runs first and fails unless the installed copies
      # equal the committed files. So `tsc` reads bytes equal to the committed files, and the
      # committed files are real inputs here. The committed index.js stays out: `tsc` does not read
      # it. ci/affected-graph/cargo_moon_parity.py A12 asserts these lines.
      - '/rs/crates/bindings/paigasus-node-bindings/index.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm.d.ts'
      - '/ts/scripts/check-installed-bindings.mjs'
      # wasm binding: same cache-input completeness as the napi crate — a kernel or wasm-binding src
      # edit or a manifest change must re-key this task. Since SMA-634 this task does not build the
      # wasm glue; `generate-wasm` is its only writer.
      - '/rs/crates/bindings/paigasus-wasm/src/**/*'
      - '/rs/crates/bindings/paigasus-wasm/Cargo.toml'
      - '/rs/crates/bindings/paigasus-wasm/package.json'
      # Parity corpus (SMA-433): a corpus change must re-key the ts replay. Task-hash input only —
      # it does not make this project affected by a corpus-only edit (see affected-smoke parity-oneway).
      - '/rs/crates/libs/paigasus-kernel-parity/vectors/**/*'
      #
      # Workspace-level Rust files (SMA-546). This task LINKS two cdylibs and compiles
      # wasm32-unknown-unknown; `cargo clippy` does neither, so SMA-534's thirteen lints cannot
      # cover a dependency bump here. Without these the task replays a CACHED artifact built from
      # a different resolution — a cache-correctness bug independent of scheduling. Moon has no
      # hash-only input, so declaring them also makes a lockfile touch SCHEDULE this task, which
      # is the coverage half of SMA-546.
      #   /rs/Cargo.lock          the resolved versions the PR ships
      #   /rs/Cargo.toml          [workspace.dependencies] + feature flips, which never reach the lock
      #   /rs/rust-toolchain.toml the compiler wasm-pack selects (it runs from INSIDE the crate dir
      #                           precisely so this file's 1.95.0 override wins)
      #   /.prototools            pins wasm-pack itself — the OTHER half of the rs/Cargo.toml:90-97
      #                           invariant, which is bidirectional ("bump the two together")
      #   /rs/.cargo/config.toml  the -undefined dynamic_lookup flags napi's cdylib link needs on
      #                           macOS; the `--cwd` above exists to bring this file into cargo's
      #                           upward walk
      - '/rs/Cargo.lock'
      - '/rs/Cargo.toml'
      - '/rs/rust-toolchain.toml'
      - '/.prototools'
      - '/rs/.cargo/config.toml'
    outputs:
      # Glob the platform-suffixed .node (darwin-arm64 on dev, linux-x64-gnu on CI, …) so the
      # declared output exists on EVERY host — a hardcoded triple fails Moon's output check on Linux.
      # Cross-platform prebuild matrix + publish still deferred (ADR-0006 / SMA-376/407).
      - '/rs/crates/bindings/paigasus-node-bindings/paigasus-node-bindings.*.node'
  # SMA-536. Overrides the inherited `typecheck`. The default merge keeps its inputs
  # (@group(sources), tsconfig.json, package.json, /ts/tsconfig.base.json, /ts/pnpm-lock.yaml).
  # `tsc` reads both binding typings through src/binding-parity.types.ts, from the INSTALLED copy
  # under ts/node_modules. The preflight runs first and fails, with the repair command, unless that
  # copy equals the committed files. So the committed typings are real inputs here.
  # No `deps: ['^:build']`: `tsc` reads only committed files, so a Rust build orders nothing here
  # and does not confer affectedness (SMA-528). tests/**/* and vitest.config.ts are here because
  # tsconfig.json `include` names them. ci/affected-graph/cargo_moon_parity.py A12 asserts the
  # binding lines and the preflight.
  typecheck:
    script: 'node ../../../ts/scripts/check-installed-bindings.mjs && pnpm exec tsc -p tsconfig.json --noEmit'
    inputs:
      - 'tests/**/*'
      - 'vitest.config.ts'
      - '/rs/crates/bindings/paigasus-node-bindings/index.d.ts'
      - '/rs/crates/bindings/paigasus-node-bindings/package.json'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/package.json'
      - '/ts/scripts/check-installed-bindings.mjs'
  # Rebuild the .node fresh (cache-bust on a Rust edit, review F4), THEN run vitest. The py
  # analog (`uv sync --reinstall-package … && pytest`) refreshes the INSTALLED artifact; here the
  # freshness fix is split: `napi build` rewrites the crate-dir .node, and vitest.config.ts aliases
  # @paigasus/node-bindings to that crate dir — because pnpm COPIES a `file:` dep into its store at
  # install time and never re-copies a rebuilt binary, so loading via the package name would import
  # a STALE store .node (verified: a kernel edit otherwise passes against the old value).
  # SMA-667: `napi build` writes the glue to the scratch files index.fresh.js and index.fresh.d.ts,
  # and tests/committed-napi-glue.test.ts compares them with the committed index.js and index.d.ts.
  # The vitest alias still loads the COMMITTED index.js, which loads the fresh .node.
  #
  # wasm: this task builds into its OWN scratch out-dir `.wasmpack-test-out` and vitest.config.ts
  # aliases @paigasus/wasm straight at THAT scratch glue — it does NOT copy into the crate dir. That
  # is what the drift gate compares the committed files against.
  #
  # SMA-634: `build` no longer runs wasm-pack at all, so the old race between `build` and `test` over
  # the shared crate dir (`cp: … File exists` on the gitignored .wasm — SMA-427 CI) cannot happen any
  # more. `generate-wasm` is the ONLY writer of the crate directory now, and CI never runs it
  # (`runInCI: false`). The separate scratch out-dirs stay: `generate-wasm` and this task can still
  # run in the same local invocation, and `wasm-pack build` CLEANS its --out-dir. The wasm-pack cargo
  # builds share rs/target and serialize on cargo's target-dir lock (safe).
  #
  # `touch` first (highest priority — this is the assertion): cargo/`napi build` incrementality is
  # mtime-based, so a warm rs/target/ + a git op that leaves a Rust source OLDER than its artifact
  # (mtime inversion) makes cargo skip the recompile and napi re-link a STALE .node — the review
  # reproduced sum(2,3)→6 against `a + b` source (silent false red/green, which defeats the guard's
  # whole purpose). Bumping the two crates' source mtime forces a content-correct recompile from
  # current source before the assertion (napi analog of py's `uv sync --reinstall-package`); it is
  # host-agnostic, unlike a per-triple `cargo clean --target`.
  #
  # `-- --locked` reaches the `cargo build` wasm-pack forwards to, but wasm-pack makes its own
  # unlocked cargo call BEFORE that build and repairs an inconsistent lock there first — so this
  # task cannot guarantee a locked resolution (measured, SMA-601).
  test:
    script: 'touch ../../../rs/crates/libs/paigasus-kernel/src/lib.rs ../../../rs/crates/bindings/paigasus-node-bindings/src/lib.rs ../../../rs/crates/bindings/paigasus-wasm/src/lib.rs && pnpm exec napi build --platform --cwd ../../../rs/crates/bindings/paigasus-node-bindings --js index.fresh.js --dts index.fresh.d.ts --no-dts-cache && ( cd ../../../rs/crates/bindings/paigasus-wasm && wasm-pack build . --target bundler --release --no-pack --out-dir .wasmpack-test-out --out-name paigasus_wasm -- --locked ) && pnpm exec vitest run'
    deps: ['^:build']
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      # Check 3 of tests/committed-napi-glue.test.ts reads this file.
      - 'moon.yml'
      - 'vitest.config.ts'
      - 'package.json'
      - '/ts/pnpm-lock.yaml'
      # Both Rust sources, so a kernel-source edit re-runs vitest against a freshly built .node
      # rather than caching a stale green (review F4) — see the build task's note. The binding's
      # manifests are listed too so a napi-config/dep change re-keys this task (CodeRabbit).
      - '/rs/crates/libs/paigasus-kernel/src/**/*'
      # The kernel's manifest, not just its sources (SMA-560) — a `[features]` toggle there can
      # change what this task links with no src diff.
      - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
      # The napi crate's build script. `napi build` COMPILES it (it is `napi_build::setup()`,
      # which emits the addon's link args), so a change to it changes this task's output — but
      # nothing keyed on it. This is where SMA-537 and SMA-560 meet.
      - '/rs/crates/bindings/paigasus-node-bindings/build.rs'
      - '/rs/crates/bindings/paigasus-node-bindings/src/**/*'
      - '/rs/crates/bindings/paigasus-node-bindings/Cargo.toml'
      - '/rs/crates/bindings/paigasus-node-bindings/package.json'
      # wasm binding sources + manifests, so a kernel or wasm-binding edit re-runs the browser vitest
      # project against freshly built glue rather than a stale green (mirrors the napi inputs above).
      - '/rs/crates/bindings/paigasus-wasm/src/**/*'
      - '/rs/crates/bindings/paigasus-wasm/Cargo.toml'
      - '/rs/crates/bindings/paigasus-wasm/package.json'
      # SMA-634: the five committed artifacts the drift gate compares. Named one by one, not as a
      # `paigasus_wasm*` glob, so a new scratch file beside them cannot re-key this task.
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm.d.ts'
      # SMA-667: the two committed napi glue files that tests/committed-napi-glue.test.ts compares
      # with this task's scratch build. Named one by one, not as an `index.*` glob, so the scratch
      # files `index.fresh.*` cannot re-key this task.
      - '/rs/crates/bindings/paigasus-node-bindings/index.js'
      - '/rs/crates/bindings/paigasus-node-bindings/index.d.ts'
      # Parity corpus (SMA-433): a corpus change must re-key the ts replay. Task-hash input only —
      # it does not make this project affected by a corpus-only edit (see affected-smoke parity-oneway).
      - '/rs/crates/libs/paigasus-kernel-parity/vectors/**/*'
      #
      # Workspace-level Rust files (SMA-546) — same rationale as `build` above: this task rebuilds
      # both cdylibs before asserting, so its cached vitest RESULT is as resolution-dependent as
      # build's artifact.
      - '/rs/Cargo.lock'
      - '/rs/Cargo.toml'
      - '/rs/rust-toolchain.toml'
      - '/.prototools'
      - '/rs/.cargo/config.toml'

  # SMA-634. The ONLY writer of the five committed wasm artifacts
  # (rs/crates/bindings/paigasus-wasm/paigasus_wasm*). `test` already builds into its own,
  # non-committing `.wasmpack-test-out`, and `build` no longer calls wasm-pack at all. This task
  # uses a third out-dir, `.wasmpack-regen-out`, so a concurrent `test` run's wasm-pack wipe cannot
  # interleave with this task's copy into the crate directory.
  #
  # Run it after an edit to the Rust kernel or the wasm binding, then commit all five files. A
  # wasm-bindgen family bump runs it in the build container of .github/workflows/wasm-lockstep.yml
  # (SMA-693). tests/committed-wasm.test.ts reds until the committed files agree with the source.
  #
  # ONE host per PR regenerates them. A family bump from the wasm-lockstep workflow regenerates on
  # Linux; a kernel or binding edit regenerates on the author's host. The binary bytes differ per
  # host (spec F12), so the binary changes host between PRs, and a second host in one PR produces
  # a diff that says nothing. The four glue files are byte-identical on macOS, Linux arm64 and
  # Linux amd64 (spec F15), which is what makes the gate valid in CI.
  #
  # The literal `wasm-pack` call stays HERE, not inside the script file:
  # ci/affected-graph/cargo_moon_parity.py derives an FFI task from the resolved invocation
  # (FFI_MARKERS), and an invocation behind a wrapper would drop this task out of A5, A7 and A8.
  # The path remap travels as `--config`, never as RUSTFLAGS: cargo reads one rustflags source
  # only, and a `--config` value also survives a path that holds a space. Its VALUE is no longer a
  # literal: `--remap-path-prefix=/Users=/redacted` rewrote the first segment only and shipped the
  # user name (`/redacted/<user>/.cargo/...`) in a public repository, so scripts/generate-wasm.mjs
  # now computes one remap per whole root ($HOME, CARGO_HOME, RUSTUP_HOME) and `--remap` prints it.
  # `export PROTO_REPORTER=text` guards that capture: a proto-shimmed `node` otherwise writes an
  # NDJSON preamble to stdout and exits 0, and `$remap` would become a JSON blob (SMA-609). The
  # `case` is the fail-closed assertion on the captured value, the analog of the `[ -x ]` check the
  # release-parity modules make.
  #
  # WHEN A CRATE VERSION ENTERS THE GLUE (SMA-680 spec F5/F6). wasm-bindgen hashes the compiling
  # crate's CARGO_PKG_NAME and CARGO_PKG_VERSION into shim names. Export names are restored, and
  # import names keep the hash. Today the only hashed import is `__wbg_Error_*`, which wasm-bindgen
  # declares itself, so the glue follows the wasm-bindgen version and not ours. If the kernel or
  # paigasus-wasm gets its own `#[wasm_bindgen] extern "C"` block, `inline_js` or `module = "..."`,
  # our version enters an import name. Then every kernel-group release PR fails check 1
  # (inferred, not measured) of tests/committed-wasm.test.ts, also with
  # `dependencies_update = false` in rs/release-plz.toml.
  #
  # runInCI: false — the CI workflow never regenerates; it only compares. The wasm-lockstep
  # workflow runs this task inside a container that has no CI variable, so Moon does not drop it
  # there (SMA-693 spec F2). cache: false — the task writes tracked files, and a cached replay
  # would write nothing.
  generate-wasm:
    script: |
      set -euo pipefail
      export PROTO_REPORTER=text
      node scripts/generate-wasm.mjs --pre
      remap="$(node scripts/generate-wasm.mjs --remap)"
      case "$remap" in '['*--remap-path-prefix=*']') ;; *) echo "generate-wasm: --remap produced \"$remap\", not a rustflags array. Refusing to build a binary that would hold absolute host paths." >&2; exit 2 ;; esac
      ( cd ../../../rs/crates/bindings/paigasus-wasm && wasm-pack build . --target bundler --release --no-pack --out-dir .wasmpack-regen-out --out-name paigasus_wasm -- --config "target.wasm32-unknown-unknown.rustflags=$remap" --locked )
      node scripts/generate-wasm.mjs --post
    deps: ['^:build']
    # A5 demands the five workspace inputs on every FFI task, and A7 the sources and manifests of
    # the dependsOn closure (paigasus-kernel-rs, paigasus-node-bindings-rs, paigasus-wasm-rs), plus
    # the napi crate's build.rs. They are declared although the task is `cache: false`: the
    # assertions read the declaration, not the cache.
    inputs:
      - 'scripts/**/*'
      - 'package.json'
      - '/rs/crates/libs/paigasus-kernel/src/**/*'
      - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
      - '/rs/crates/bindings/paigasus-node-bindings/build.rs'
      - '/rs/crates/bindings/paigasus-node-bindings/src/**/*'
      - '/rs/crates/bindings/paigasus-node-bindings/Cargo.toml'
      - '/rs/crates/bindings/paigasus-wasm/src/**/*'
      - '/rs/crates/bindings/paigasus-wasm/Cargo.toml'
      - '/rs/Cargo.lock'
      - '/rs/Cargo.toml'
      - '/rs/rust-toolchain.toml'
      - '/.prototools'
      - '/rs/.cargo/config.toml'
    options:
      runInCI: false
      cache: false

  # SMA-667. The sanctioned local writer of the two committed napi glue files
  # (rs/crates/bindings/paigasus-node-bindings/index.js and index.d.ts). `version-lockstep --write`
  # is the only other writer, and of index.js only. In a release it edits the version literals of
  # the guards as text, in place (SMA-684). It runs no `napi build` and does not write index.d.ts.
  #
  # Run it after a Rust change to the napi binding or the kernel. Run it also after a `@napi-rs/cli`
  # change in ts/pnpm-lock.yaml, or after a `napi` or `napi-derive` change in rs/Cargo.lock. The
  # `napi-rs` crates and `@napi-rs/cli` each have their own Dependabot group. Then commit both files. tests/committed-napi-glue.test.ts reds until the
  # committed files agree with the generator. Run it as its OWN command, not in the same `moon run`
  # as `test`, `build` or `typecheck` (SMA-536): this task has no order with them, and each of them
  # hashes index.d.ts, so it can hash its inputs before this task writes.
  #
  # It builds into the scratch files, like `build` and `test`, and then `cp`s them over the
  # committed files. `napi build` writes by rename, which replaces the inode and breaks the pnpm
  # hard link of the `file:` dependency @paigasus/node-bindings, so `tsc` would read a stale
  # index.d.ts through ts/node_modules. `cp` writes into the existing inode.
  #
  # The literal `napi build` stays HERE, not behind a wrapper: cargo_moon_parity.py finds an FFI
  # task by its resolved command (FFI_MARKERS). runInCI: false — CI never regenerates; it only
  # compares. cache: false — the task writes tracked files, and a cached replay writes nothing.
  generate-napi-glue:
    script: 'touch ../../../rs/crates/libs/paigasus-kernel/src/lib.rs ../../../rs/crates/bindings/paigasus-node-bindings/src/lib.rs && pnpm exec napi build --platform --cwd ../../../rs/crates/bindings/paigasus-node-bindings --js index.fresh.js --dts index.fresh.d.ts --no-dts-cache && cp ../../../rs/crates/bindings/paigasus-node-bindings/index.fresh.js ../../../rs/crates/bindings/paigasus-node-bindings/index.js && cp ../../../rs/crates/bindings/paigasus-node-bindings/index.fresh.d.ts ../../../rs/crates/bindings/paigasus-node-bindings/index.d.ts'
    deps: ['^:build']
    # A5 and A7 read the declaration, so the inputs are declared although the task is
    # `cache: false`: the napi crate's sources, manifests and build.rs, the kernel, the wasm crate
    # (the dependsOn closure) and the five workspace files.
    inputs:
      - 'package.json'
      - '/ts/pnpm-lock.yaml'
      - '/rs/crates/libs/paigasus-kernel/src/**/*'
      - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
      - '/rs/crates/bindings/paigasus-node-bindings/build.rs'
      - '/rs/crates/bindings/paigasus-node-bindings/src/**/*'
      - '/rs/crates/bindings/paigasus-node-bindings/Cargo.toml'
      - '/rs/crates/bindings/paigasus-node-bindings/package.json'
      - '/rs/crates/bindings/paigasus-wasm/src/**/*'
      - '/rs/crates/bindings/paigasus-wasm/Cargo.toml'
