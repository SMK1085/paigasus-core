$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-next-config-ts'
layer: 'library'
language: 'typescript'

tasks:
  # `/ts/eslint.config.js` is added to the INHERITED test inputs, not merged away: tests/boundaries
  # asserts that the workspace eslint config actually applies this package's preset, and the
  # inherited input list (.moon/tasks/typescript-project.yml) does not name that file. Without it
  # Moon replays a cached PASS on exactly the PR that deletes the import — the guard-the-guard
  # hole the assertion exists to close (spec § 9.4).
  test:
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'vitest.config.ts'
      - 'package.json'
      - '/ts/eslint.config.js'
      - '/ts/pnpm-lock.yaml'
      # SMA-512: tests/next-app-rules.test.ts reads ts/apps with readdirSync and asserts the
      # shipped ts/eslint.config.js carries exactly one Next block per app directory found there.
      # Adding or removing an app changes that directory listing and so changes what the test
      # asserts. Without this input, Moon serves a cached PASS on the PR that adds a second app —
      # the exact PR the assertion exists to catch.
      - '/ts/apps/*/package.json'
