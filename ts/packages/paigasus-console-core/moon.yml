$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-console-core-ts'
layer: 'library'
language: 'typescript'

# THREE things are required and none implies another. `dependsOn` is what `moon query projects
# --affected` follows; task `inputs` are the ONLY thing that confers affectedness on a
# DOWNSTREAM task (CLAUDE.md, Moon 2.5.3); and a task-level `deps: ['contracts:generate']` is the
# ONLY thing that ORDERS this package's tasks after the generator that writes the tree they read.
# contracts:generate runs `buf generate` with `clean: true`, which DELETES
# ts/packages/paigasus-proto/src/generated/** before rewriting it, so a task scheduled inside that
# ~11s window compiles or runs against a half-deleted tree — see
# ts/packages/paigasus-discovery/moon.yml for the CI measurement of exactly that failure.
# `testing/fake-iam.ts` imports `@paigasus/proto` and `@paigasus/proto/iam` directly, and
# `tsconfig.json` includes `testing/**/*`, so `build` and `typecheck` compile that tree;
# `src/iam-clients.ts` and `src/errors.ts` reach it through `@paigasus/sdk`; and `test` loads
# `testing/fake-iam.ts` at run time. All three tasks below therefore carry the `deps` line.
dependsOn:
  - 'paigasus-auth-ts'
  - 'paigasus-sdk-ts'
  - 'paigasus-discovery-ts'
  - 'paigasus-proto-ts'

tasks:
  build:
    deps: ['contracts:generate']
    inputs: &upstreams
      - '/ts/packages/paigasus-auth/src/**/*'
      - '/ts/packages/paigasus-auth/package.json'
      - '/ts/packages/paigasus-sdk/src/**/*'
      - '/ts/packages/paigasus-sdk/package.json'
      - '/ts/packages/paigasus-discovery/src/**/*'
      - '/ts/packages/paigasus-discovery/package.json'
      - '/ts/packages/paigasus-proto/src/**/*'
      - '/ts/packages/paigasus-proto/package.json'
      # SMA-634. @paigasus/console-core reads the kernel's source and, through it, the five
      # COMMITTED wasm artifacts. There is deliberately no `deps` on a kernel task and no dependsOn
      # edge: the artifacts are tracked files, so no console task compiles Rust. Inputs are the only
      # thing that confers affectedness on Moon 2.5.3, so they are what makes a kernel edit re-run
      # this package. The five artifact paths are named one by one, not as a `paigasus_wasm*` glob.
      - '/ts/packages/paigasus-kernel/src/**/*'
      - '/ts/packages/paigasus-kernel/package.json'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/package.json'
      # testing/ is a published subpath, not test-only scaffolding: both apps import it. It is
      # outside src/, so @group(sources) does not cover it.
      - 'testing/**/*'
  typecheck:
    deps: ['contracts:generate']
    inputs: *upstreams
  test:
    deps: ['contracts:generate']
    inputs:
      - 'vitest.config.ts'
      - 'testing/**/*'
      - '/ts/packages/paigasus-auth/src/**/*'
      - '/ts/packages/paigasus-auth/package.json'
      - '/ts/packages/paigasus-sdk/src/**/*'
      - '/ts/packages/paigasus-sdk/package.json'
      - '/ts/packages/paigasus-discovery/src/**/*'
      - '/ts/packages/paigasus-discovery/package.json'
      - '/ts/packages/paigasus-proto/src/**/*'
      - '/ts/packages/paigasus-proto/package.json'
      # SMA-634. @paigasus/console-core reads the kernel's source and, through it, the five
      # COMMITTED wasm artifacts. There is deliberately no `deps` on a kernel task and no dependsOn
      # edge: the artifacts are tracked files, so no console task compiles Rust. Inputs are the only
      # thing that confers affectedness on Moon 2.5.3, so they are what makes a kernel edit re-run
      # this package. The five artifact paths are named one by one, not as a `paigasus_wasm*` glob.
      - '/ts/packages/paigasus-kernel/src/**/*'
      - '/ts/packages/paigasus-kernel/package.json'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/package.json'
      # The parity corpus and the Rust constant the PRN reader is held to.
      - '/rs/crates/libs/paigasus-kernel-parity/vectors/**/*'
      - '/rs/crates/libs/paigasus-iam-core/src/authz/model.rs'
      # SMA-630 spec § 5.1. tests/unit/action-names.test.ts reads the action catalog as TEXT. Without
      # this input, a changed Rust action name selects no paigasus-console-core-ts task, and Moon
      # serves a cached PASS on exactly the PR that breaks the parity. repo:input-liveness checks
      # `repo:*` tasks only, so the SMA-630 plan (Task 2) confirmed with `moon task … --json` that
      # this entry resolves to a tracked file.
      - '/rs/crates/libs/paigasus-iam-core/src/authz/action.rs'
      # SMA-661 spec § 7.2. tests/unit/bulk-replay-ceiling.test.ts reads the bulk-replay clamp as TEXT.
      # Without this input, a changed Rust clamp selects no paigasus-console-core-ts task, and Moon
      # serves a cached PASS on exactly the PR that breaks the ceiling. The iam-console `test` task
      # cannot carry it instead: it has no /rs/** input, and adding one would rebuild the console on
      # every dead_letter.rs edit, because that task depends on `~:build`.
      - '/rs/crates/libs/paigasus-iam-core/src/dead_letter.rs'
      # SMA-634 fix wave. tests/unit/wasm-gate-wiring.test.ts reads these files as TEXT, to pin the
      # wiring of the four-check wasm drift gate: the kernel vitest config's `include` entry that
      # selects checks 1-3, and each console vitest config's `setupFiles` entry plus the setup
      # file's own check 4 call. Without these inputs, deleting one of those entries selects no
      # paigasus-console-core-ts task and Moon serves a cached PASS on exactly the commit that
      # switches the gate off. The app paths are GLOBS on purpose: the test discovers every
      # ts/apps/* directory with a package.json, so a third console zone must re-key this task too.
      - '/ts/packages/paigasus-kernel/vitest.config.ts'
      - '/ts/packages/paigasus-kernel/tests/committed-wasm.test.ts'
      - '/ts/apps/*/vitest.config.ts'
      - '/ts/apps/*/tests/support/setup.ts'
      - '/ts/apps/*/package.json'
  test-e2e:
    # SMA-648 § 4.4: the Docker-backed tier. It drives the REAL call site, descriptorCacheFor, against
    # a real Redis, because the defect lived in the client options that call site passes.
    # `script` (not `command`): Moon's `command` setting rejects shell syntax. `set -euo pipefail`
    # because Moon does not enable errexit for script blocks.
    # NO SKIP HATCH: like @paigasus/auth's and @paigasus/discovery's tiers, this task fails when
    # Docker is unreachable.
    script: |
      set -euo pipefail
      pnpm exec vitest run --config vitest.containers.config.ts
    # src/discovery.ts loads @paigasus/discovery/server at RUN time, whose core imports
    # @paigasus/proto's generated tree. contracts:generate deletes that tree before it rewrites it,
    # so this task must be ordered after it (the measured failure is in
    # ts/packages/paigasus-discovery/moon.yml).
    deps: ['contracts:generate']
    # Inputs are the ONLY thing that confers affectedness on Moon 2.5.3. This list covers this
    # package's source and tests, both vitest configs, tsconfig.json, package.json, the lockfile,
    # and @paigasus/discovery's source (which owns createRedisDescriptorCache's preconditions).
    # It deliberately does NOT list testing/**/*: this tier imports nothing from testing/.
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'vitest.config.ts'
      - 'vitest.containers.config.ts'
      - 'tsconfig.json'
      - 'package.json'
      - '/ts/pnpm-lock.yaml'
      - '/ts/packages/paigasus-discovery/src/**/*'
      - '/ts/packages/paigasus-discovery/package.json'
      # SMA-634. @paigasus/console-core reads the kernel's source and, through it, the five
      # COMMITTED wasm artifacts. There is deliberately no `deps` on a kernel task and no dependsOn
      # edge: the artifacts are tracked files, so no console task compiles Rust. Inputs are the only
      # thing that confers affectedness on Moon 2.5.3, so they are what makes a kernel edit re-run
      # this package. The five artifact paths are named one by one, not as a `paigasus_wasm*` glob.
      - '/ts/packages/paigasus-kernel/src/**/*'
      - '/ts/packages/paigasus-kernel/package.json'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.js'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/paigasus_wasm_bg.wasm.d.ts'
      - '/rs/crates/bindings/paigasus-wasm/package.json'
    options:
      # A real container. A cached PASS would replay a green that tested nothing.
      cache: false
