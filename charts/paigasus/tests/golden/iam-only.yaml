# Source: paigasus/templates/console-env-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: paigasus-paigasus-console-env
data:
  PAIGASUS_PUBLIC_ORIGIN: "https://console.example.test"
  PAIGASUS_OIDC_ISSUER: "https://idp.example.test/realms/paigasus"
  PAIGASUS_OIDC_CLIENT_ID: "paigasus-console"
  PAIGASUS_IAM_GRPC_URL: "http://paigasus-paigasus-iam-backend:9090"
  # Forced, not exposed. createAuthRuntime refuses "memory" once PAIGASUS_ZONES names more than
  # one zone, and console-core's descriptor cache needs Redis regardless. A knob whose only other
  # setting crash-loops the pod is not a knob.
  PAIGASUS_SESSION_STORE: "redis"
---
# Source: paigasus/templates/zonemap-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: paigasus-paigasus-zonemap
data:
  # Byte-identical across every console pod BY CONSTRUCTION — one object, mounted by both — rather
  # than by template discipline. assertCompiledAgreement() throws on a pod whose OWN entry
  # disagrees, but it does not check the other zones' entries, so this is the control, not it.
  PAIGASUS_ZONES: "{\"iam\":\"/iam\"}"
  PAIGASUS_SERVICES: "{\"iam\":\"http://paigasus-paigasus-iam-backend:8080\"}"
---
# Source: paigasus/templates/backend-service.yaml
apiVersion: v1
kind: Service
metadata:
  # MUST match paigasus.name's <release>-<chart>-<id>-backend shape exactly: paigasus.serviceMapJson
  # (_helpers.tpl) builds every PAIGASUS_SERVICES URL from that same helper. A mismatch here is
  # invisible to `helm template` and renders a permanently `degraded` console tile at runtime
  # instead — the exact state AC 2 exists to distinguish from `absent`.
  name: paigasus-paigasus-iam-backend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: iam-backend
    app.kubernetes.io/instance: paigasus
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: grpc
      port: 9090
      targetPort: grpc
