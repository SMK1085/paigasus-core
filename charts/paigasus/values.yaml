# SPDX-License-Identifier: Apache-2.0
#
# ONE values block. Six projections derive from `zones` and from nothing else: the ingress path
# rules, PAIGASUS_ZONES, PAIGASUS_SERVICES, PAIGASUS_IAM_GRPC_URL, the console Deployments and the
# backend Deployments. A zone's `enabled` flag governs ALL of them together — that is what makes
# "routable but unadvertised" unrepresentable rather than merely checked (spec D6).
#
# A zone id MUST be a member of SERVICE_SLUGS (ts/packages/paigasus-discovery/src/core/state.ts).
# parseServiceMap THROWS on an unknown key, in BOTH consoles, at first request (spec F8).
zones:
  iam:
    enabled: true
    basePath: /iam
    console:
      image:
        repository: ghcr.io/smk1085/paigasus-iam-console
        tag: ""          # defaults to .Chart.AppVersion
      replicas: 2
    backend:
      # Deployed by this chart. Kept true: the gRPC-to-IAM link from any other zone's backend has
      # no TLS design yet (see zones.gateway.backend below), but IAM itself has no such backend
      # dependency, so this chart deploys it directly.
      deploy: true
      image:
        repository: ghcr.io/smk1085/paigasus-iam
        tag: ""
      # replicas and maxSurge are pinned; see the comment in templates/backend-deployment.yaml.
      httpPort: 8080
      grpcPort: 9090
      migrationLockWaitSeconds: 120
      # REQUIRED. Genuinely missing from the original schema (SMA-513 Task 11) — added because
      # IamConfig::validate hard-fails boot without it. Must hold key "pepper": a base64 string
      # decoding to at least 32 bytes (ApiKeyConfig::pepper). Kept as its own secret rather than
      # folded into postgres.existingSecret or oidc.existingSecret because it rotates on its own
      # schedule and belongs to neither of those two concerns.
      apiKeysPepperSecret: ""
      # NOT required. Bump after rotating apiKeysPepperSecret IN PLACE, so the IAM pod
      # rolls. Without it a stale pod keeps the old pepper and keeps accepting API keys
      # that a rotated pod rejects, so rotation does not revoke them consistently.
      apiKeysSecretVersion: ""
  gateway:
    enabled: false
    basePath: /gateway
    console:
      image:
        repository: ghcr.io/smk1085/paigasus-gateway-console
        tag: ""
      replicas: 2
    backend:
      # NOT deployed by this chart (SMA-513 Task 11b). Measured in the tree:
      # GatewayConfig::validate hard-fails boot on an empty upstream.openai.api_key
      # (rs/crates/services/paigasus-gateway/src/config.rs:278), and iam.grpc_addr accepts
      # LoopbackInsecure only for a loopback host (:209-222) — so an in-cluster gateway->IAM
      # link needs a TLS design that is out of scope here. Supply the address of an existing
      # gateway backend instead, the same way postgres.existingSecret and oidc.existingSecret do.
      deploy: false
      image:
        repository: ghcr.io/smk1085/paigasus-gateway
        tag: ""
      httpPort: 8088
      # Genuinely missing from the original schema (SMA-513 Task 11) — the gateway backend is
      # stateless and horizontally scalable, unlike IAM's SMA-559-pinned single replica, so it
      # gets a real knob rather than a hardcoded default. Mirrors console.replicas above.
      replicas: 2
      # REQUIRED whenever the gateway zone is enabled (deploy is false and stays false; see
      # above). The full base URL of an existing gateway backend, e.g. "http://gateway.internal:8088".
      url: ""

ingress:
  host: ""               # REQUIRED. Feeds PAIGASUS_PUBLIC_ORIGIN as https://<host>.
  className: ""
  tlsSecretName: ""      # REQUIRED. The ingress must terminate TLS: PAIGASUS_PUBLIC_ORIGIN is
                         # validated as https, and __Host-pgs_sid requires Secure.
  annotations: {}
  # DO NOT add a rewrite annotation. Each console compiles basePath in and serves its full path
  # already; a rewrite that strips /iam breaks every route in that zone.

oidc:
  issuer: ""             # REQUIRED
  clientId: ""           # REQUIRED
  audience: ""           # NOT required. The access-token audience that IAM accepts. Empty means
                         # oidc.clientId. Set it only when your IdP puts a different value in the
                         # access token's `aud` claim (for example Okta: api://default). It REPLACES
                         # oidc.clientId; IAM then does not accept oidc.clientId as the audience.
                         # Quote it in a values file. See docs/ops/RUNBOOK-chart.md § 6.
  existingSecret: ""     # REQUIRED. Must hold keys: oidc-client-secret, session-redis-url.
  secretVersion: ""      # NOT required. The chart does not own existingSecret and cannot observe
                         # its contents, so it cannot detect a rotation on its own. Bump this
                         # value (any string) whenever the referenced Secret's contents change, so
                         # the console pods roll — it is the operator's explicit signal, fed into
                         # the console Deployment's checksum/secret annotation.
  # NOT required. Trust for an IdP whose certificate chain ends at a private CA (SMA-513 PR 3).
  # existingConfigMap names a ConfigMap that holds PEM root certificates under `key`. When it is
  # set, every console pod and the IAM pod mount that ONE key read-only under /etc/paigasus/idp-ca/,
  # the consoles get NODE_EXTRA_CA_CERTS and IAM gets IAM_AUTHN__EXTRA_CA_BUNDLE_PATH. A missing
  # ConfigMap or key stops the pod at volume setup. The consoles trust the bundle for EVERY TLS
  # connection (Redis included); IAM trusts it only for JWKS fetches. Put only the IdP's roots in it.
  # A CA certificate is public, so this is a ConfigMap, not a Secret. See docs/ops/RUNBOOK-chart.md.
  caBundle:
    existingConfigMap: ""
    key: ca.crt
    # NOT required. Bump (any string) after the ConfigMap's contents change: Node and IAM read the
    # bundle once, at process start, so only a restart picks up a new CA. Same shape as
    # oidc.secretVersion; it feeds a checksum/idp-ca annotation on all three Deployments.
    version: ""

redis: {}                # the URL lives in oidc.existingSecret, since it may carry a password

postgres:
  # NOT required. Bump after rotating existingSecret IN PLACE, so the IAM pod rolls. The
  # chart cannot observe an external Secret's contents, so without this a revoked DSN
  # survives in the running pod until someone restarts the single replica by hand.
  secretVersion: ""
  existingSecret: ""     # REQUIRED. Must hold key "database-url", the complete Postgres DSN.
                         # IamConfig has no decomposed host/user/db config of its own — figment
                         # reads ONE opaque DSN (IAM_DATABASE_URL) — and the chart never composes
                         # it from a host plus a password, precisely so no password ever has to
                         # be percent-encoded by a template: a password containing @, /, :, ? or #
                         # would break a composed URI or silently redirect it to another host.
