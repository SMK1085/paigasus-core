{{- include "paigasus.validate" . -}}
{{- $root := . -}}
{{- $full := include "paigasus.fullname" . -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $full }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  # DO NOT add a rewrite annotation here or in values. Each console compiles basePath in and
  # serves its FULL path already — a rewrite that strips /iam breaks every route in that zone.
  # This is the change an operator is most likely to add by reflex.
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  tls:
    # The ingress MUST terminate TLS: PAIGASUS_PUBLIC_ORIGIN is validated as https, and the
    # __Host-pgs_sid cookie requires Secure. One host, so the cookie is host-only and every zone
    # reads it (ADR-0017 decision 2).
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          {{- range $id, $z := .Values.zones }}
          {{- if $z.enabled }}
          # This zone's own {{ $z.basePath }}/auth/* routes are IN-APP route handlers and fall
          # under its own prefix already, so they need no rule of their own. Written per zone,
          # not as a single static comment naming both prefixes: a disabled zone must leave no
          # trace anywhere in the rendered output (see tests/ingress.sh), and a comment naming
          # the OTHER zone's prefix here would leak it into an iam-only render.
          - path: {{ $z.basePath }}
            pathType: Prefix
            backend:
              service:
                name: {{ $full }}-{{ $id }}-console
                port:
                  name: http
          {{- end }}
          {{- end }}
