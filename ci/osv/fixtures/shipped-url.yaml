# SPDX-License-Identifier: Apache-2.0
# expect: 3 shipped-path
# A URL-valued version (it contains @) is not an alias; the edge still reaches braces.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

importers:

  .:
    devDependencies:
      typescript:
        specifier: 'catalog:'
        version: 6.0.3

  apps/iam-console:
    dependencies:
      '@semantic-release/commit-analyzer':
        specifier: 'catalog:'
        version: 13.0.1(semantic-release@25.0.9(supports-color@7.2.0)(typescript@6.0.3))(supports-color@7.2.0)

snapshots:

  '@semantic-release/commit-analyzer@13.0.1(semantic-release@25.0.9(supports-color@7.2.0)(typescript@6.0.3))(supports-color@7.2.0)':
    dependencies:
      micromatch: 4.0.8
    transitivePeerDependencies:
      - supports-color

  'braces@git+ssh://git@github.com/micromatch/braces.git#abc123':
    dependencies:
      fill-range: 7.1.1

  fill-range@7.1.1: {}

  micromatch@4.0.8:
    dependencies:
      braces: git+ssh://git@github.com/micromatch/braces.git#abc123
      picomatch: 2.3.2

  picomatch@2.3.2: {}

  typescript@6.0.3: {}
