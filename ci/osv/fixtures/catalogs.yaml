# SPDX-License-Identifier: Apache-2.0
# expect: 0
# A catalogs: block holds importer-like `version:` lines that name braces, and an overrides:
# block names it too. The guard reads neither section. Only `.` reaches braces.
lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

catalogs:
  default:
    '@next/eslint-plugin-next':
      specifier: ^16.3.6
      version: 16.3.6
    braces:
      specifier: ^3.0.3
      version: 3.0.3
    micromatch:
      specifier: ^4.0.8
      version: 4.0.8

overrides:
  braces@<3.0.3: '>=3.0.3'

importers:

  .:
    devDependencies:
      '@next/eslint-plugin-next':
        specifier: 'catalog:'
        version: 16.3.6(eslint@10.11.0(jiti@2.7.0)(supports-color@7.2.0))

  apps/iam-console:
    dependencies:
      '@connectrpc/connect':
        specifier: 'catalog:'
        version: 2.2.0(@bufbuild/protobuf@2.15.0)

snapshots:

  '@bufbuild/protobuf@2.15.0': {}

  '@connectrpc/connect@2.2.0(@bufbuild/protobuf@2.15.0)':
    dependencies:
      '@bufbuild/protobuf': 2.15.0

  '@next/eslint-plugin-next@16.3.6(eslint@10.11.0(jiti@2.7.0)(supports-color@7.2.0))':
    dependencies:
      fast-glob: 3.3.1
    transitivePeerDependencies:
      - eslint

  braces@3.0.3:
    dependencies:
      fill-range: 7.1.1

  fast-glob@3.3.1:
    dependencies:
      micromatch: 4.0.8

  fill-range@7.1.1: {}

  micromatch@4.0.8:
    dependencies:
      braces: 3.0.3
      picomatch: 2.3.2

  picomatch@2.3.2: {}
