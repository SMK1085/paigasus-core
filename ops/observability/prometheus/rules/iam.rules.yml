# SPDX-License-Identifier: Apache-2.0
groups:
  - name: iam
    rules:
      - alert: IamDenialAuditDrops
        expr: rate(iam_denial_audits_dropped_total[5m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "IAM denial-audit entries are being dropped (drain not keeping up)" }
      - alert: IamOutboxBacklogAgeHigh
        expr: iam_outbox_oldest_unpublished_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "IAM outbox oldest unpublished event age > 5m" }
      - alert: IamOutboxEventsParked
        expr: increase(iam_outbox_relay_parked_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "IAM outbox parked a poison event" }
      - alert: IamOutboxRelayStalled
        expr: rate(iam_outbox_relay_ticks_total[10m]) == 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM outbox relay is not ticking (stalled but process alive)" }
      - alert: IamPolicySnapshotReloadsStalled
        # Three things this expression has to get right (SMA-470).
        #
        # (1) It must not go silent exactly when the backstop is most broken. If
        # `outcome="installed"` has NEVER been emitted — a fresh replica, or (the failure mode
        # this alert exists to catch) every reload erroring so `installed` never fires at all —
        # that label's series does not exist in Prometheus. `increase()`/`sum()` over a
        # nonexistent series return an EMPTY vector, not a 0-valued one, and `empty == 0` is also
        # empty, so a naked `sum(increase(...)) == 0` never fires. The `or` branch supplies the
        # missing zero so the comparison always has something to evaluate against.
        #
        # (2) One healthy replica must not mask a wedged one. A bare `sum()` drops `job` and
        # `instance`, so a fleet-wide total stays non-zero while a single replica's backstop is
        # stuck — and a stuck replica still serves revoked grants. `sum by (job, instance)` keeps
        # the alert per target. That is also why the fallback is `(up{job="iam"} == 1) * 0` and
        # not a bare `vector(0)`: the multiplication drops `__name__` and leaves a 0-valued series
        # carrying exactly `{job, instance}` for every LIVE iam target — the same label set the
        # left side produces, which is what lets `or` compose them per target instead of
        # collapsing the fleet into one anonymous series. `job: iam` is the real scrape job
        # (`prometheus.yml`). A target that is DOWN is deliberately excluded: that is `TargetDown`
        # (`targets.rules.yml`), and an unlabelled `vector(0)` fallback would double-page for it.
        #
        # (3) Detection must actually take the 15 minutes the annotation promises. `increase(...
        # [15m])` only reaches zero 15m after the last install, so pairing it with `for: 15m` pages
        # ~30 minutes late. `[10m]` + `for: 5m` is 15 minutes total, keeping a 5m debounce against
        # a scrape gap or a rolling restart. 10m of silence is already ~19 missed backstop cycles
        # (`authz.policy_cache_ttl_secs + authz.refresh_interval_secs` ~31s at the defaults), so a
        # healthy replica never gets close.
        expr: (sum by (job, instance) (increase(iam_authz_policy_snapshot_reloads_total{outcome="installed"}[10m])) or (up{job="iam"} == 1) * 0) == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "IAM policy snapshot has not installed a reload (revocations may not take effect)", description: "No policy-snapshot reload has been INSTALLED in 15 minutes on {{ $labels.job }}/{{ $labels.instance }}. The snapshot's TTL backstop (authz.policy_cache_ttl_secs, default 30s) should install one every TTL regardless of generation movement, so silence here means role revocations are not taking effect on this replica. Check for outcome=\"failed\" (Postgres unreachable, or a malformed policy row aborting every compile) and outcome=\"rejected\". See RUNBOOK section 4." }
      - alert: IamAuditPartitionMaintenanceStalled
        expr: sum without (result) (increase(iam_audit_partition_maintenance_ticks_total[2d])) == 0
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "IAM audit partition-maintenance task is not ticking", description: "No successful audit partition-maintenance tick in ~2 days. Denied partitions won't be pruned (slow index/table bloat) and, after ahead_months, new-month create-ahead stops. The task ticks on interval_secs (default 86400 = daily), so the 2d window assumes the default daily interval — widen it if interval_secs is increased. NOTE: if audit.retention.enabled=false the series is absent and this alert stays silent — expected. See RUNBOOK §4." }
      - alert: IamHighErrorRate
        expr: sum(rate(iam_http_requests_total{status_class="5xx"}[5m])) / sum(rate(iam_http_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM HTTP 5xx ratio > 5%" }
      - alert: IamGrpcHighErrorRate
        expr: sum(rate(iam_grpc_requests_total{grpc_status!="ok"}[5m])) / sum(rate(iam_grpc_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM gRPC non-OK ratio > 5%" }
      - alert: IamAuthzRedisCacheBypassed
        # SMA-473. `cache="bypass"` is emitted ONLY when the entity-generation counter read
        # errors (`cedar_authorizer.rs` step 3), which under `authz.cache.backend = "memory"`
        # cannot happen — so a sustained nonzero rate means the Redis backend is unhealthy,
        # with no healthy-state false positives.
        #
        # This alert exists BECAUSE SMA-473 made the outage quiet. Before it, a Redis outage
        # announced itself as 19-28s authz latency that tripped client-side timeouts ONLY —
        # neither error-rate rule caught it, because each records INSIDE its own timeout
        # boundary. NOT IamHighErrorRate: `serve_http` applies its `TimeoutLayer` OUTSIDE
        # `app_routes`, which is where `http_metrics_layer` lives, so a timed-out HTTP request
        # short-circuits before the metrics layer records it (`iam_http_requests_total` never
        # counts it) — and it short-circuits with 408, i.e. `status_class="4xx"`, which that
        # rule's 5xx filter excludes anyway. NOT IamGrpcHighErrorRate either: `record_grpc` is
        # called from inside each RPC body, but tonic's `GrpcTimeout` wraps the routed service
        # from outside and, on expiry, drops the inner future before the handler ever reaches
        # it — so a timed-out gRPC call never counts either. So the pre-SMA-473 signal was
        # narrower than it looked, which strengthens the case for this rule. Bounding the retry
        # budget removed what was left; without this rule a total Redis outage produces correct,
        # fast decisions and NO page — while the decision cache is gone, cross-replica API-key
        # revocation stops being global, and (under `authn.jwks_cache.backend = "redis"`) every
        # token-authenticated request 503s (API-key auth fails open onto Postgres).
        #
        # `sum(...)` so the alert is one series, not one per `decision` label — and so the
        # result carries no labels beyond `severity`.
        #
        # `for: 10m`, not 0m: a routine Redis failover briefly bypasses too, and that must
        # not page. NOTE the `memory`-backend trap — the series does not exist there, `sum()`
        # over an empty vector is empty, and this alert is SILENT rather than firing. See the
        # RUNBOOK's "Authz availability posture".
        expr: sum(rate(iam_authz_decisions_total{cache="bypass"}[5m])) > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM authz is bypassing the Redis decision cache (Redis unhealthy)", description: "IAM authz decisions are bypassing the Redis decision cache. While this fires: the decision cache is gone (decisions still evaluate correctly, just slower), cross-replica API-key revocation stops being global, and (if authn.jwks_cache.backend=\"redis\") every token-authenticated request 503s (API-key auth fails open onto Postgres). NOTE: this alert only has a signal under authz.cache.backend=\"redis\" — on the default authz.cache.backend=\"memory\" the cache=\"bypass\" series never exists, sum() over an empty vector is empty, and this alert stays SILENT rather than firing. See RUNBOOK's \"Authz availability posture\"." }
