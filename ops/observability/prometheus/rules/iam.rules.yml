# SPDX-License-Identifier: Apache-2.0
groups:
  - name: iam
    rules:
      - alert: IamDenialAuditDrops
        expr: rate(iam_denial_audits_dropped_total[5m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "IAM denial-audit entries are being dropped (drain not keeping up)" }
      - alert: IamOutboxBacklogAgeHigh
        expr: iam_outbox_oldest_unpublished_age_seconds > 300
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "IAM outbox oldest unpublished event age > 5m" }
      - alert: IamOutboxEventsParked
        expr: increase(iam_outbox_relay_parked_total[15m]) > 0
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "IAM outbox parked a poison event" }
      # SMA-471: with a real broker, publish failures are the earliest signal that delivery is
      # broken — earlier than parking (max_attempts × poll_interval) and earlier than backlog
      # age. The counter is already primed: relay.rs increments it by 0 on every tick, so the
      # series exists before the first failure and `increase()` can fire on it.
      - alert: IamOutboxPublishFailures
        expr: increase(iam_outbox_relay_publish_failures_total[5m]) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "IAM outbox publishes are failing (broker unreachable or rejecting)" }
      - alert: IamOutboxRelayStalled
        expr: rate(iam_outbox_relay_ticks_total[10m]) == 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM outbox relay is not ticking (stalled but process alive)" }
      - alert: IamPolicySnapshotReloadsStalled
        # Three things this expression has to get right (SMA-470).
        #
        # (1) It must not go silent exactly when the backstop is most broken. If
        # `outcome="installed"` has NEVER been emitted — a fresh replica, or (the failure mode
        # this alert exists to catch) every reload erroring so `installed` never fires at all —
        # that label's series does not exist in Prometheus. `increase()`/`sum()` over a
        # nonexistent series return an EMPTY vector, not a 0-valued one, and `empty == 0` is also
        # empty, so a naked `sum(increase(...)) == 0` never fires. The `or` branch supplies the
        # missing zero so the comparison always has something to evaluate against.
        #
        # (2) One healthy replica must not mask a wedged one. A bare `sum()` drops `job` and
        # `instance`, so a fleet-wide total stays non-zero while a single replica's backstop is
        # stuck — and a stuck replica still serves revoked grants. `sum by (job, instance)` keeps
        # the alert per target. That is also why the fallback is `(up{job="iam"} == 1) * 0` and
        # not a bare `vector(0)`: the multiplication drops `__name__` and leaves a 0-valued series
        # carrying exactly `{job, instance}` for every LIVE iam target — the same label set the
        # left side produces, which is what lets `or` compose them per target instead of
        # collapsing the fleet into one anonymous series. `job: iam` is the real scrape job
        # (`prometheus.yml`). A target that is DOWN is deliberately excluded: that is `TargetDown`
        # (`targets.rules.yml`), and an unlabelled `vector(0)` fallback would double-page for it.
        #
        # (3) Detection must actually take the 15 minutes the annotation promises. `increase(...
        # [15m])` only reaches zero 15m after the last install, so pairing it with `for: 15m` pages
        # ~30 minutes late. `[10m]` + `for: 5m` is 15 minutes total, keeping a 5m debounce against
        # a scrape gap or a rolling restart. 10m of silence is already ~19 missed backstop cycles
        # (`authz.policy_cache_ttl_secs + authz.refresh_interval_secs` ~31s at the defaults), so a
        # healthy replica never gets close.
        expr: (sum by (job, instance) (increase(iam_authz_policy_snapshot_reloads_total{outcome="installed"}[10m])) or (up{job="iam"} == 1) * 0) == 0
        for: 5m
        labels: { severity: critical }
        annotations: { summary: "IAM policy snapshot has not installed a reload (revocations may not take effect)", description: "No policy-snapshot reload has been INSTALLED in 15 minutes on {{ $labels.job }}/{{ $labels.instance }}. The snapshot's TTL backstop (authz.policy_cache_ttl_secs, default 30s) should install one every TTL regardless of generation movement, so silence here means role revocations are not taking effect on this replica. Check for outcome=\"failed\" (Postgres unreachable, or a malformed policy row aborting every compile) and outcome=\"rejected\". See RUNBOOK section 4." }
      - alert: IamAuditPartitionMaintenanceStalled
        expr: sum without (result) (increase(iam_audit_partition_maintenance_ticks_total[2d])) == 0
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "IAM audit partition-maintenance task is not ticking", description: "No successful audit partition-maintenance tick in ~2 days. Denied partitions won't be pruned (slow index/table bloat) and, after ahead_months, new-month create-ahead stops. The task ticks on interval_secs (default 86400 = daily), so the 2d window assumes the default daily interval — widen it if interval_secs is increased. NOTE: if audit.retention.enabled=false the series is absent and this alert stays silent — expected. See RUNBOOK §4." }
      # The window is scaled to THIS task's hourly default (interval_secs = 3600), NOT copied
      # from IamAuditPartitionMaintenanceStalled's [2d] — that alert's window matches the audit
      # maintainer's DAILY interval, and reusing it here would tolerate ~48 consecutive missed
      # ticks. The `or (up{job="iam"} == 1) * 0` fallback mirrors IamPolicySnapshotReloadsStalled:
      # without it, a replica that spawned the maintainer but never completed a single tick emits
      # no series at all, and `empty == 0` is empty — the alert would go silent exactly when
      # things are worst.
      #
      # `for: 2h`, exceeding this task's own hourly tick interval, is deliberate — NOT a copy-paste
      # of a bigger number for safety margin. `main.rs` runs an AWAITED startup tick before the
      # maintainer's first `interval_secs` sleep, so a freshly booted replica's counter gets its
      # FIRST sample at boot and its SECOND an hour later. `increase()` over a single sample is 0
      # (there's no earlier point in the window to diff against), so `increase(...[6h]) == 0` is
      # already true at t=0 — a perfectly healthy replica goes pending the instant it boots,
      # regardless of hold length. With `for: 1h` the second hourly tick has to land AND be
      # scraped before that hold elapses, which is a photo finish against `interval_secs = 3600`:
      # any tick jitter or scrape delay pages a healthy replica after every restart. `for: 2h`
      # gives the second tick a full extra cycle of slack to clear the condition well before the
      # hold elapses. Worst-case detection becomes ~8h (6h window + 2h hold) — an acceptable trade
      # for a sweep whose failure mode is slow, unbounded table growth, not something that needs
      # minute-scale paging. This also brings the hold in line with its IamOutboxRetentionErroring
      # sibling below, which independently arrived at `for: 2h` for a different reason.
      - alert: IamOutboxRetentionStalled
        expr: (sum by (job, instance) (increase(iam_outbox_retention_ticks_total[6h])) or (up{job="iam"} == 1) * 0) == 0
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "IAM outbox retention sweep is not ticking", description: "No outbox retention tick in ~6 hours on {{ $labels.job }}/{{ $labels.instance }}. Published event_outbox rows are not being deleted, so the table grows without bound, and the iam_outbox_parked_rows dead-letter gauge is stale. The sweep ticks on outbox.retention.interval_secs (default 3600 = hourly), so the 6h window assumes the default — widen it if interval_secs is increased. Unlike the audit equivalent, outbox.retention.enabled=false does NOT silence this: the maintainer is spawned unconditionally and still ticks to refresh the gauge, so silence here always means something is wrong. See RUNBOOK section 4." }
      # A sweep that TICKS but ERRORS on every tick is invisible to IamOutboxRetentionStalled
      # above: that alert sums `result="ok"` and `result="error"` together, so a healthy tick
      # count and an all-erroring tick count look identical to it. `event_outbox` still grows
      # without bound in that failure mode; the only signal without this alert is a `warn!` line.
      #
      # `for: 2h`, not 1h like its Stalled sibling — and it does NOT achieve the same guarantee.
      # `increase(...[6h]) > 0` cannot distinguish "one error, now recovered" from "still
      # erroring": once a single error tick lands in the window the condition stays true for
      # nearly the whole 6h regardless of what happens afterward (the sample doesn't leave the
      # window until it ages out near the 6h mark), so `for:` here bounds time-to-page, not
      # repetition count. 2h gives the sweep's own "will retry next tick" behavior at least one
      # extra hourly cycle to clear a genuinely transient failure (e.g. a single serialization
      # conflict on one DELETE pass) before paging; a sweep erroring on EVERY tick — the failure
      # mode this alert exists for — is trivially still erroring 2h later and pages reliably. A
      # truly one-off blip that then recovers will still surface here once, ~2h after it
      # happened, and resolve on its own once that sample ages past the 6h window — an accepted
      # false-alarm rate for a warning-level page reacting to something that failed an entire
      # DELETE outright.
      - alert: IamOutboxRetentionErroring
        expr: increase(iam_outbox_retention_ticks_total{result="error"}[6h]) > 0
        for: 2h
        labels: { severity: warning }
        annotations: { summary: "IAM outbox retention sweep had a recent error", description: "iam_outbox_retention_ticks_total{result=\"error\"} increased on {{ $labels.job }}/{{ $labels.instance }} in the last 6 hours. The sweep IS ticking — unlike IamOutboxRetentionStalled, the maintainer task is alive and completing ticks — but at least one tick in that window had a failing step: the published-row sweep, the parked-row sweep, or the parked-row gauge query. While this persists, published event_outbox rows are not being deleted, so the table grows without bound, and if the gauge query is the failing step iam_outbox_parked_rows also goes stale. outbox.retention.enabled=false does NOT cause this: a disabled sweep still ticks and still reports result=\"ok\" (it only skips the two DELETE steps), so a firing alert here always means a real failure, never an intentional pause. Check IAM logs for the tick's own warn!s (\"outbox published-row sweep failed; will retry next tick\", \"outbox parked-row sweep failed; will retry next tick\", \"outbox parked-row gauge query failed\") to see which step is failing and why. See RUNBOOK section 4." }
      # `max by (job)` is REQUIRED, not cosmetic: every replica runs a maintainer and each sets
      # the same global count, so N replicas emit N identical series. A bare
      # `iam_outbox_parked_rows > 0` would page N times for one condition, and a `sum()` panel
      # would report N times the real backlog.
      - alert: IamOutboxDeadLetterBacklog
        expr: max by (job) (iam_outbox_parked_rows) > 0
        for: 1h
        labels: { severity: warning }
        annotations: { summary: "IAM outbox dead letters are awaiting an operator", description: "At least one event_outbox row has been parked for over an hour on {{ $labels.job }} and nobody has retired it. Parked rows are excluded from the relay's poll forever, so those events will never be delivered until an operator replays or discards them via /v1/outbox/dead-letters. This complements IamOutboxEventsParked: that one fires when something JUST parked, this one fires when nobody has dealt with it. See RUNBOOK section 4." }
      - alert: IamHighErrorRate
        expr: sum(rate(iam_http_requests_total{status_class="5xx"}[5m])) / sum(rate(iam_http_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM HTTP 5xx ratio > 5%" }
      - alert: IamGrpcHighErrorRate
        expr: sum(rate(iam_grpc_requests_total{grpc_status!="ok"}[5m])) / sum(rate(iam_grpc_requests_total[5m])) > 0.05
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM gRPC non-OK ratio > 5%" }
      - alert: IamAuthzRedisCacheBypassed
        # SMA-473. `cache="bypass"` is emitted ONLY when the entity-generation counter read
        # errors (`cedar_authorizer.rs` step 3), which under `authz.cache.backend = "memory"`
        # cannot happen — so a sustained nonzero rate means the Redis backend is unhealthy,
        # with no healthy-state false positives.
        #
        # This alert exists BECAUSE SMA-473 made the outage quiet. Before it, a Redis outage
        # announced itself as 19-28s authz latency that tripped client-side timeouts ONLY —
        # neither error-rate rule caught it, because each records INSIDE its own timeout
        # boundary. NOT IamHighErrorRate: `serve_http` applies its `TimeoutLayer` OUTSIDE
        # `app_routes`, which is where `http_metrics_layer` lives, so a timed-out HTTP request
        # short-circuits before the metrics layer records it (`iam_http_requests_total` never
        # counts it) — and it short-circuits with 408, i.e. `status_class="4xx"`, which that
        # rule's 5xx filter excludes anyway. NOT IamGrpcHighErrorRate either: `record_grpc` is
        # called from inside each RPC body, but tonic's `GrpcTimeout` wraps the routed service
        # from outside and, on expiry, drops the inner future before the handler ever reaches
        # it — so a timed-out gRPC call never counts either. So the pre-SMA-473 signal was
        # narrower than it looked, which strengthens the case for this rule. Bounding the retry
        # budget removed what was left; without this rule a total Redis outage produces correct,
        # fast decisions and NO page — while the decision cache is gone, cross-replica API-key
        # revocation stops being global, and (under `authn.jwks_cache.backend = "redis"`) every
        # token-authenticated request 503s (API-key auth fails open onto Postgres).
        #
        # `sum(...)` so the alert is one series, not one per `decision` label — and so the
        # result carries no labels beyond `severity`.
        #
        # `for: 10m`, not 0m: a routine Redis failover briefly bypasses too, and that must
        # not page. NOTE the `memory`-backend trap — the series does not exist there, `sum()`
        # over an empty vector is empty, and this alert is SILENT rather than firing. See the
        # RUNBOOK's "Authz availability posture".
        expr: sum(rate(iam_authz_decisions_total{cache="bypass"}[5m])) > 0
        for: 10m
        labels: { severity: critical }
        annotations: { summary: "IAM authz is bypassing the Redis decision cache (Redis unhealthy)", description: "IAM authz decisions are bypassing the Redis decision cache. While this fires: the decision cache is gone (decisions still evaluate correctly, just slower), cross-replica API-key revocation stops being global, and (if authn.jwks_cache.backend=\"redis\") every token-authenticated request 503s (API-key auth fails open onto Postgres). NOTE: this alert only has a signal under authz.cache.backend=\"redis\" — on the default authz.cache.backend=\"memory\" the cache=\"bypass\" series never exists, sum() over an empty vector is empty, and this alert stays SILENT rather than firing. See RUNBOOK's \"Authz availability posture\"." }
      - alert: IamRedisBreakerOpen
        # SMA-476. `!= 0` rather than `== 2` on purpose: the gauge legitimately sits at 1
        # (half_open) while a probe is in flight, and an `== 2` expression with a `for:` clause
        # could reset every time a scrape lands on a probe — i.e. never fire during exactly the
        # outage it exists for.
        #
        # `max by (job, role)` because the gauge is per-replica: every replica sets its own, so
        # sum() would report nonsense.
        #
        # role="jwks" is EXCLUDED here and paged separately below at critical severity — an open
        # JWKS breaker is a total token-auth outage, not a degradation.
        expr: max by (job, role) (iam_redis_breaker_state{role!="jwks"}) != 0
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "IAM Redis circuit breaker is not closed (role {{ $labels.role }})", description: "The Redis circuit breaker for role {{ $labels.role }} has been open or half-open for 2m, so authz/API-key cache commands are short-circuiting instantly instead of dialling. Decisions remain CORRECT (these caches fail open onto Postgres) but uncached. Recovery lags Redis by up to ~6s after it returns. See RUNBOOK's \"Authz availability posture\"." }
      - alert: IamJwksRedisBreakerOpen
        # SMA-476 D9. RedisJwksCache is the ONLY fail-CLOSED Redis consumer: its error propagates
        # through JwksProvider::key_for as AuthnError::Unavailable, so while this fires EVERY
        # token-authenticated request 503s. That is an outage, not a degradation.
        #
        # It cannot be left to IamAuthzRedisCacheBypassed as a "critical companion": that rule is
        # structurally SILENT under authz.cache.backend="memory", which is exactly the split
        # configuration where a JWKS Redis may be the only Redis in play.
        expr: max by (job, role) (iam_redis_breaker_state{role="jwks"}) != 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "IAM JWKS Redis circuit breaker is not closed — token auth is failing closed", description: "The Redis circuit breaker for the JWKS cache has been open or half-open for 1m. RedisJwksCache fails CLOSED, so every token-authenticated request is returning 503 (API-key auth is unaffected — it fails open onto Postgres). Recovery lags Redis by up to ~6s after it returns. See RUNBOOK's \"Authz availability posture\"." }
      - alert: IamRedisBreakerFlapping
        # SMA-476 D10. Neither rule above can fire on a breaker that opens and re-closes INSIDE
        # one scrape interval: the open window is 2s while scrapes are 15-30s apart, so the gauge
        # is sampled at 0 most of the time and the `for:` clause never holds. A chronically sick
        # backend looks exactly like that, and this counter is the only artifact that survives a
        # sub-scrape-interval state.
        expr: max by (job, role) (increase(iam_redis_breaker_transitions_total{to="open"}[10m])) > 5
        for: 0m
        labels: { severity: warning }
        annotations: { summary: "IAM Redis circuit breaker is flapping (role {{ $labels.role }})", description: "The Redis circuit breaker for role {{ $labels.role }} opened more than 5 times in 10m. Each open costs a cache-bypass window; repeated opens suggest an intermittently unhealthy backend rather than a clean outage. NOTE the state gauge may read 0 at scrape time — that is why this rule watches transitions, not state." }

      - alert: IamAuthzGenerationRewound
        # SMA-474. A Redis generation counter came back BELOW what a process had already
        # observed, and `Generations` repaired it forward. Neither `iam:authz:policy_gen` nor
        # `iam:authz:entity_gen` carries a TTL, so under `allkeys-*` they are ordinary eviction
        # candidates — and an evicted key reads back as `0`, which before SMA-474 was a
        # successful read of the wrong value that nothing detected.
        #
        # WARNING, not critical, and deliberately so: the mechanism self-heals, and the benign
        # causes outnumber the hazardous ones. The split is NOT by cause name but by whether the
        # cache key spaces died with the counter. A FLUSHALL, a restart without persistence and a
        # failover to an EMPTY replica are whole-Redis loss — they destroy the slice/decision
        # caches too (all three share ONE connection, `AppState::new`), leaving a cold cache
        # rather than a stale one. Hazardous: selective eviction of just the generation keys, AND
        # a failover to a stale but NON-EMPTY replica, which answers normally, reports a lower
        # generation, and still holds entries written under it. This signal cannot tell them
        # apart on its own; the RUNBOOK entry carries the triage step. Do NOT reword the
        # annotation to claim this is conclusive evidence of `allkeys-*`.
        #
        # `sum by (counter, outcome)`, never a bare `sum()`: the grouping is what lets the
        # promtool fixture use a flat series as a control (a bare sum folds every series into
        # one total, so no control is possible), and it puts the counter and outcome on the
        # alert where triage needs them. `outcome="repair_failed"` is the one that matters
        # operationally — Redis rejected the repair write, so that replica is serving a
        # process-local generation with no cross-replica cache sharing.
        expr: sum by (counter, outcome) (increase(iam_authz_generation_rewinds_total[15m])) > 0
        for: 5m
        labels: { severity: warning }
        annotations: { summary: "IAM authz generation counter rewound", description: "A Redis authz generation counter (iam:authz:policy_gen / iam:authz:entity_gen) came back lower than this process had already observed, and was repaired forward. Neither key carries a TTL, so the usual cause is allkeys-* eviction — check CONFIG GET maxmemory-policy, which must be volatile-*. A FLUSHALL, a restart without persistence, or a failover to an EMPTY replica also produce this and are benign — they destroy the slice/decision caches along with the counter, leaving a cold cache rather than a stale one. A failover to a stale but NON-EMPTY replica is NOT benign: it returns a lower generation (reason=lower) while still holding cache entries written under it. Triage on the caches, not the cause: check whether iam:authz:slice:* and iam:authz:dec:* are also empty — if they survived, treat it as hazardous. outcome=repair_failed means Redis rejected the repair write (INCRBY is denyoom) and the replica is serving a process-local generation with no cross-replica cache sharing. See RUNBOOK's \"Authz availability posture\"." }
