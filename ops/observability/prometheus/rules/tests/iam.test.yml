# SPDX-License-Identifier: Apache-2.0
rule_files: [../iam.rules.yml]
evaluation_interval: 1m
tests:
  # IamDenialAuditDrops: rate(...[5m]) > 0, for: 0m — fires as soon as the counter moves.
  - interval: 1m
    input_series:
      - series: 'iam_denial_audits_dropped_total'
        values: '0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 0m
        alertname: IamDenialAuditDrops
        exp_alerts: []
      - eval_time: 5m
        alertname: IamDenialAuditDrops
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "IAM denial-audit entries are being dropped (drain not keeping up)" }

  # IamOutboxBacklogAgeHigh: gauge > 300 for: 5m.
  - interval: 1m
    input_series:
      - series: 'iam_outbox_oldest_unpublished_age_seconds'
        values: '400+0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: IamOutboxBacklogAgeHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: IamOutboxBacklogAgeHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "IAM outbox oldest unpublished event age > 5m" }

  # IamOutboxEventsParked: increase(...[15m]) > 0, for: 0m — fires as soon as one event parks.
  - interval: 1m
    input_series:
      - series: 'iam_outbox_relay_parked_total'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: IamOutboxEventsParked
        exp_alerts: []
      - eval_time: 5m
        alertname: IamOutboxEventsParked
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "IAM outbox parked a poison event" }

  # IamOutboxRelayStalled: rate(...[10m]) == 0, for: 10m — the ticks counter is flat (not ticking).
  - interval: 1m
    input_series:
      - series: 'iam_outbox_relay_ticks_total'
        values: '5+0x11'
    alert_rule_test:
      - eval_time: 10m
        alertname: IamOutboxRelayStalled
        exp_alerts: []
      - eval_time: 11m
        alertname: IamOutboxRelayStalled
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM outbox relay is not ticking (stalled but process alive)" }

  # IamPolicySnapshotReloadsStalled: healthy fleet — every backstop cycle installs, so
  # sum by (job, instance) (increase(...{outcome="installed"}[10m])) stays well above 0 and the
  # alert never fires. The `up` series is what the expr's `or` fallback keys off; a live target
  # whose left-hand series exists must be answered by the LEFT side, never by the 0-valued
  # fallback, so this doubles as the control for the `or` composing correctly.
  - interval: 1m
    input_series:
      - series: 'iam_authz_policy_snapshot_reloads_total{outcome="installed", job="iam", instance="host.docker.internal:8080"}'
        values: '0+1x25'
      - series: 'up{job="iam", instance="host.docker.internal:8080"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts: []

  # IamPolicySnapshotReloadsStalled: total backstop failure — every reload errors, so
  # outcome="installed" never exists as a series at all (only outcome="failed" does). This is the
  # control case for the `or` fallback in the expr: without it, `sum by (job, instance)
  # (increase(<absent series>[10m]))` itself evaluates to an empty vector and `empty == 0` is ALSO
  # empty, so a naive expr would silently never fire — exactly the "goes quiet when things are
  # worst" trap SMA-470 cares about. `outcome="failed"` moving proves the metric family is alive
  # and scraped; it is `installed` specifically that must be caught as effectively zero. Fires at
  # `for: 5m` because the condition holds from the first evaluation.
  - interval: 1m
    input_series:
      - series: 'iam_authz_policy_snapshot_reloads_total{outcome="failed", job="iam", instance="host.docker.internal:8080"}'
        values: '0+1x25'
      - series: 'up{job="iam", instance="host.docker.internal:8080"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 4m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts: []
      - eval_time: 5m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts:
          - exp_labels: { severity: critical, job: iam, instance: "host.docker.internal:8080" }
            exp_annotations: { summary: "IAM policy snapshot has not installed a reload (revocations may not take effect)", description: "No policy-snapshot reload has been INSTALLED in 15 minutes on iam/host.docker.internal:8080. The snapshot's TTL backstop (authz.policy_cache_ttl_secs, default 30s) should install one every TTL regardless of generation movement, so silence here means role revocations are not taking effect on this replica. Check for outcome=\"failed\" (Postgres unreachable, or a malformed policy row aborting every compile) and outcome=\"rejected\". See RUNBOOK section 4." }

  # IamPolicySnapshotReloadsStalled: the metric family has NEVER been emitted at all (e.g. a
  # replica that crashed before its first reload, or a build that dropped the counter call
  # entirely). Only `up` exists — the same `or` fallback must still produce a firing alert,
  # labelled with the target, rather than silently evaluating nothing.
  - interval: 1m
    input_series:
      - series: 'up{job="iam", instance="host.docker.internal:8080"}'
        values: '1x25'
    alert_rule_test:
      - eval_time: 5m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts:
          - exp_labels: { severity: critical, job: iam, instance: "host.docker.internal:8080" }
            exp_annotations: { summary: "IAM policy snapshot has not installed a reload (revocations may not take effect)", description: "No policy-snapshot reload has been INSTALLED in 15 minutes on iam/host.docker.internal:8080. The snapshot's TTL backstop (authz.policy_cache_ttl_secs, default 30s) should install one every TTL regardless of generation movement, so silence here means role revocations are not taking effect on this replica. Check for outcome=\"failed\" (Postgres unreachable, or a malformed policy row aborting every compile) and outcome=\"rejected\". See RUNBOOK section 4." }

  # IamPolicySnapshotReloadsStalled: the series EXISTS and then goes FLAT — the wedged-backstop
  # shape an absent-series test can never reach (a process that installed happily, then stopped:
  # every later load erroring, or `install_if_fresher` rejecting every recompile, the SMA-470 D-B
  # defect itself). Installs stop after t=5m, so `increase(...[10m])` first hits 0 at t=15m and
  # the `for: 5m` hold pages at t=20m — the 15 minutes of total detection the annotation promises.
  - interval: 1m
    input_series:
      - series: 'iam_authz_policy_snapshot_reloads_total{outcome="installed", job="iam", instance="host.docker.internal:8080"}'
        values: '0+1x5 6x30'
      - series: 'up{job="iam", instance="host.docker.internal:8080"}'
        values: '1x36'
    alert_rule_test:
      # Still installing: the trailing window straddles the last increment, so not even pending.
      - eval_time: 14m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts: []
      # Flat for a full 10m window, but the 5m debounce has not elapsed — pending, not firing.
      - eval_time: 19m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts: []
      - eval_time: 20m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts:
          - exp_labels: { severity: critical, job: iam, instance: "host.docker.internal:8080" }
            exp_annotations: { summary: "IAM policy snapshot has not installed a reload (revocations may not take effect)", description: "No policy-snapshot reload has been INSTALLED in 15 minutes on iam/host.docker.internal:8080. The snapshot's TTL backstop (authz.policy_cache_ttl_secs, default 30s) should install one every TTL regardless of generation movement, so silence here means role revocations are not taking effect on this replica. Check for outcome=\"failed\" (Postgres unreachable, or a malformed policy row aborting every compile) and outcome=\"rejected\". See RUNBOOK section 4." }

  # IamPolicySnapshotReloadsStalled: a MASKED replica — the reason the expr aggregates
  # `by (job, instance)` instead of taking a bare fleet-wide `sum()`. One instance keeps
  # installing, the other wedges. Under `sum()` the healthy instance's increase keeps the total
  # non-zero and the alert stays silent forever while a live replica serves revoked grants.
  # Exactly one alert must fire, and it must name the WEDGED instance.
  - interval: 1m
    input_series:
      - series: 'iam_authz_policy_snapshot_reloads_total{outcome="installed", job="iam", instance="host.docker.internal:8080"}'
        values: '0+1x36'
      - series: 'iam_authz_policy_snapshot_reloads_total{outcome="installed", job="iam", instance="host.docker.internal:8081"}'
        values: '0+1x5 6x30'
      - series: 'up{job="iam", instance="host.docker.internal:8080"}'
        values: '1x36'
      - series: 'up{job="iam", instance="host.docker.internal:8081"}'
        values: '1x36'
    alert_rule_test:
      - eval_time: 20m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts:
          - exp_labels: { severity: critical, job: iam, instance: "host.docker.internal:8081" }
            exp_annotations: { summary: "IAM policy snapshot has not installed a reload (revocations may not take effect)", description: "No policy-snapshot reload has been INSTALLED in 15 minutes on iam/host.docker.internal:8081. The snapshot's TTL backstop (authz.policy_cache_ttl_secs, default 30s) should install one every TTL regardless of generation movement, so silence here means role revocations are not taking effect on this replica. Check for outcome=\"failed\" (Postgres unreachable, or a malformed policy row aborting every compile) and outcome=\"rejected\". See RUNBOOK section 4." }

  # IamPolicySnapshotReloadsStalled: a DOWN target must NOT fire this alert — `TargetDown`
  # (targets.rules.yml) already pages for it, and an unlabelled `vector(0)` fallback would page
  # twice for one fault. The `up{job="iam"} == 1` filter is what excludes it. The second, healthy
  # target is the control: without it a broken expr that simply never fires would pass this case
  # vacuously, and it also proves the `or` does not manufacture a zero for a target whose
  # left-hand series is present and non-zero.
  - interval: 1m
    input_series:
      - series: 'up{job="iam", instance="host.docker.internal:8080"}'
        values: '0x25'
      - series: 'up{job="iam", instance="host.docker.internal:8081"}'
        values: '1x25'
      - series: 'iam_authz_policy_snapshot_reloads_total{outcome="installed", job="iam", instance="host.docker.internal:8081"}'
        values: '0+1x25'
    alert_rule_test:
      - eval_time: 20m
        alertname: IamPolicySnapshotReloadsStalled
        exp_alerts: []

  # IamAuditPartitionMaintenanceStalled: sum without(result) increase(...[2d]) == 0, for: 1h.
  # The maintenance task ticks ~once/day: the series steps up at t=24h and again at t=48h
  # (still-increasing → must NOT alert, even close to the 2d boundary), then goes flat forever
  # (task stalled) → the trailing 2d window eventually sees zero increase and, after holding for
  # the 1h `for`, the alert fires.
  - interval: 30m
    input_series:
      - series: 'iam_audit_partition_maintenance_ticks_total{result="ok", job="iam"}'
        values: '0x47 1x47 2x120'
    alert_rule_test:
      - eval_time: 24h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts: []
      - eval_time: 48h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts: []
      - eval_time: 72h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts: []
      - eval_time: 108h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts:
          - exp_labels: { severity: warning, job: iam }
            exp_annotations: { summary: "IAM audit partition-maintenance task is not ticking", description: "No successful audit partition-maintenance tick in ~2 days. Denied partitions won't be pruned (slow index/table bloat) and, after ahead_months, new-month create-ahead stops. The task ticks on interval_secs (default 86400 = daily), so the 2d window assumes the default daily interval — widen it if interval_secs is increased. NOTE: if audit.retention.enabled=false the series is absent and this alert stays silent — expected. See RUNBOOK §4." }

  # IamHighErrorRate: sum(rate(5xx)) / sum(rate(total)) > 0.05, for: 10m.
  # Both classes grow at the same rate, so the 5xx ratio holds steady at 50%.
  - interval: 1m
    input_series:
      - series: 'iam_http_requests_total{status_class="5xx"}'
        values: '0+1x11'
      - series: 'iam_http_requests_total{status_class="2xx"}'
        values: '0+1x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: IamHighErrorRate
        exp_alerts: []
      - eval_time: 11m
        alertname: IamHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM HTTP 5xx ratio > 5%" }

  # IamGrpcHighErrorRate: sum(rate(non-ok)) / sum(rate(total)) > 0.05, for: 10m.
  - interval: 1m
    input_series:
      - series: 'iam_grpc_requests_total{grpc_status="permission_denied"}'
        values: '0+1x11'
      - series: 'iam_grpc_requests_total{grpc_status="ok"}'
        values: '0+1x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: IamGrpcHighErrorRate
        exp_alerts: []
      - eval_time: 11m
        alertname: IamGrpcHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM gRPC non-OK ratio > 5%" }

  # IamAuthzRedisCacheBypassed (SMA-473): sum(rate(...{cache="bypass"}[5m])) > 0, for: 10m.
  #
  # The real discriminator is `eval_time: 12m`, not `5m`. `for: 10m` guarantees nothing can be
  # ACTIVE at 5m regardless of what the expression says, so `5m` alone (or `5m` + `20m` with
  # `12m` omitted) passes even against a rule that dropped its `cache="bypass"` selector or used
  # `>= 0` instead of `> 0` — those mutants both pass the SUCCESS/exp_alerts:[] check at 5m too.
  # Under the correct rule, the genuine bypass signal (starting at t=6m) has only been true ~6m
  # by t=12m and is still PENDING. Under either mutant, the `cache="hit"` series (or the flat
  # `>= 0`-satisfying zero segment) has been true since ~t=1m, so `for: 10m` has already elapsed
  # by t=12m and it fires early — which is what `exp_alerts: []` at 12m catches. The `cache="hit"`
  # series is what makes that 12m assertion discriminate: without it climbing throughout, a
  # selector-dropped mutant would have no early-true signal to fire on. `eval_time: 5m` is kept
  # as a plain sanity check that a healthy window stays quiet, not as the mutation catcher
  # (SMA-466 lesson: don't let a fixture's comment claim a discriminating power it doesn't have).
  - interval: 1m
    input_series:
      - series: 'iam_authz_decisions_total{cache="bypass",decision="allow"}'
        values: '0+0x5 0+1x18'
      - series: 'iam_authz_decisions_total{cache="hit",decision="allow"}'
        values: '0+5x23'
    alert_rule_test:
      # Sanity check: only the `hit` series is moving in this window — quiet, not proof.
      - eval_time: 5m
        alertname: IamAuthzRedisCacheBypassed
        exp_alerts: []
      # The discriminator: bypass has been true only ~6m (since t=6m), still pending under the
      # correct rule; a selector-dropped or `>= 0` mutant would already be firing here.
      - eval_time: 12m
        alertname: IamAuthzRedisCacheBypassed
        exp_alerts: []
      - eval_time: 20m
        alertname: IamAuthzRedisCacheBypassed
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM authz is bypassing the Redis decision cache (Redis unhealthy)", description: "IAM authz decisions are bypassing the Redis decision cache. While this fires: the decision cache is gone (decisions still evaluate correctly, just slower), cross-replica API-key revocation stops being global, and (if authn.jwks_cache.backend=\"redis\") every token-authenticated request 503s (API-key auth fails open onto Postgres). NOTE: this alert only has a signal under authz.cache.backend=\"redis\" — on the default authz.cache.backend=\"memory\" the cache=\"bypass\" series never exists, sum() over an empty vector is empty, and this alert stays SILENT rather than firing. See RUNBOOK's \"Authz availability posture\"." }

  # The `memory`-backend contract, pinned (SMA-473). This is a DIFFERENT shape from the block
  # above: there, `cache="bypass"` exists and is merely flat at zero for a while. Here it does
  # not exist AT ALL, which is what `authz.cache.backend = "memory"` actually looks like —
  # `Generations::Memory::entity_gen` cannot error, so the label value is never emitted.
  # `sum()` over an empty vector returns EMPTY, not 0, so the `> 0` comparison has nothing to
  # evaluate and the alert stays SILENT rather than firing.
  #
  # That silence is a documented operator trap (the RUNBOOK calls it out alongside the same
  # shape in IamAuditPartitionMaintenanceStalled), so it deserves a test rather than trust:
  # someone "hardening" the rule into `... or vector(0)`, or aggregating in a way that
  # synthesises a zero sample, would turn every memory-backend deployment into a permanent
  # page. Evaluated at 25m — well past `for: 10m` — so a rule that fires here has had every
  # chance to do so.
  - interval: 1m
    input_series:
      - series: 'iam_authz_decisions_total{cache="hit",decision="allow"}'
        values: '0+5x25'
    alert_rule_test:
      - eval_time: 25m
        alertname: IamAuthzRedisCacheBypassed
        exp_alerts: []

  # IamOutboxRetentionStalled: a live target whose sweep counter never moves must fire; a target
  # whose counter IS advancing is the control that proves the rule is not simply always-firing.
  # The `stalled` counter is flat from t=0, so the condition (increase(...[6h]) == 0) is already
  # true at the earliest evaluation — the same single-sample startup transient the `for: 2h`
  # rationale in iam.rules.yml documents. The 30m/119m/121m trio below brackets the `for: 2h`
  # hold the same way IamOutboxRetentionErroring's 30m/119m/121m trio brackets ITS `for: 2h`:
  # comfortably not firing, not yet firing just before the hold elapses, firing just after.
  - interval: 1m
    input_series:
      - series: 'up{job="iam", instance="stalled:8080"}'
        values: '1+0x400'
      - series: 'iam_outbox_retention_ticks_total{job="iam", instance="stalled:8080", result="ok"}'
        values: '5+0x400'
      - series: 'up{job="iam", instance="healthy:8080"}'
        values: '1+0x400'
      - series: 'iam_outbox_retention_ticks_total{job="iam", instance="healthy:8080", result="ok"}'
        values: '5+1x400'
    alert_rule_test:
      - eval_time: 30m
        alertname: IamOutboxRetentionStalled
        exp_alerts: []
      - eval_time: 119m
        alertname: IamOutboxRetentionStalled
        exp_alerts: []
      - eval_time: 121m
        alertname: IamOutboxRetentionStalled
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, instance: "stalled:8080" }
            exp_annotations: { summary: "IAM outbox retention sweep is not ticking", description: "No outbox retention tick in ~6 hours on iam/stalled:8080. Published event_outbox rows are not being deleted, so the table grows without bound, and the iam_outbox_parked_rows dead-letter gauge is stale. The sweep ticks on outbox.retention.interval_secs (default 3600 = hourly), so the 6h window assumes the default — widen it if interval_secs is increased. Unlike the audit equivalent, outbox.retention.enabled=false does NOT silence this: the maintainer is spawned unconditionally and still ticks to refresh the gauge, so silence here always means something is wrong. See RUNBOOK section 4." }
      - eval_time: 7h
        alertname: IamOutboxRetentionStalled
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, instance: "stalled:8080" }
            exp_annotations: { summary: "IAM outbox retention sweep is not ticking", description: "No outbox retention tick in ~6 hours on iam/stalled:8080. Published event_outbox rows are not being deleted, so the table grows without bound, and the iam_outbox_parked_rows dead-letter gauge is stale. The sweep ticks on outbox.retention.interval_secs (default 3600 = hourly), so the 6h window assumes the default — widen it if interval_secs is increased. Unlike the audit equivalent, outbox.retention.enabled=false does NOT silence this: the maintainer is spawned unconditionally and still ticks to refresh the gauge, so silence here always means something is wrong. See RUNBOOK section 4." }

  # IamOutboxRetentionStalled: a LIVE target that has never emitted the series at all must still
  # fire — that is the `or (up == 1) * 0` fallback, and without it this case would be silent.
  # `x420` (not `x400`) so the `up` series has a sample at the 7h eval instant itself: a series
  # ending at 400m would be stale (past the 5m staleness lookback) by the 420m eval time, and the
  # fallback — which depends entirely on `up` being live since there is no left-hand series at
  # all here — would silently produce nothing.
  - interval: 1m
    input_series:
      - series: 'up{job="iam", instance="never-ticked:8080"}'
        values: '1+0x420'
    alert_rule_test:
      - eval_time: 7h
        alertname: IamOutboxRetentionStalled
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, instance: "never-ticked:8080" }
            exp_annotations: { summary: "IAM outbox retention sweep is not ticking", description: "No outbox retention tick in ~6 hours on iam/never-ticked:8080. Published event_outbox rows are not being deleted, so the table grows without bound, and the iam_outbox_parked_rows dead-letter gauge is stale. The sweep ticks on outbox.retention.interval_secs (default 3600 = hourly), so the 6h window assumes the default — widen it if interval_secs is increased. Unlike the audit equivalent, outbox.retention.enabled=false does NOT silence this: the maintainer is spawned unconditionally and still ticks to refresh the gauge, so silence here always means something is wrong. See RUNBOOK section 4." }

  # IamOutboxRetentionStalled: proves the [6h] window is actually enforced, not merely present.
  # Neither case above can catch a regression to the neighbour's [2d]: `stalled`/`healthy` live
  # out their whole ~7h simulated life inside a single 6h window, and `never-ticked` never has a
  # left-hand series at all, so [6h] and [2d] agree on all three. Here the counter advances for
  # the first 8h, then goes flat for the rest of this target's life, evaluated at 24h:
  #   - correct [6h] window == [18h,24h] -> entirely inside the flat tail -> increase == 0 -> fires.
  #   - regressed [2d]=48h window == [-24h,24h], i.e. effectively [0,24h] -> still captures the
  #     0-8h climb -> increase > 0 -> would wrongly stay silent.
  # `interval: 5m` (not 1m) keeps a 30h series readable (360 samples instead of 1800).
  - interval: 5m
    input_series:
      - series: 'iam_outbox_retention_ticks_total{job="iam", instance="window-check:8080", result="ok"}'
        values: '0+1x96 96x264'
    alert_rule_test:
      - eval_time: 24h
        alertname: IamOutboxRetentionStalled
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, instance: "window-check:8080" }
            exp_annotations: { summary: "IAM outbox retention sweep is not ticking", description: "No outbox retention tick in ~6 hours on iam/window-check:8080. Published event_outbox rows are not being deleted, so the table grows without bound, and the iam_outbox_parked_rows dead-letter gauge is stale. The sweep ticks on outbox.retention.interval_secs (default 3600 = hourly), so the 6h window assumes the default — widen it if interval_secs is increased. Unlike the audit equivalent, outbox.retention.enabled=false does NOT silence this: the maintainer is spawned unconditionally and still ticks to refresh the gauge, so silence here always means something is wrong. See RUNBOOK section 4." }

  # IamOutboxRetentionErroring: increase(...{result="error"}[6h]) > 0, for: 2h. The healthy
  # target emits ONLY result="ok" ticks — its counter climbs steadily and result="error" never
  # exists as a series for it at all. That is the control this alert needs: without it, a
  # regression that dropped the `{result="error"}` selector (so the expr matched result="ok" too)
  # would treat this target's routine successful ticks as errors and page on it forever; with the
  # selector correctly in place, this target must never appear in exp_alerts at ANY eval_time
  # below. The second target's counter carries ONLY result="error" and climbs at the same rate,
  # modelling a sweep that errors on every tick (the failure mode this alert exists to catch) —
  # it must fire once the `for: 2h` hold elapses.
  - interval: 1m
    input_series:
      - series: 'iam_outbox_retention_ticks_total{job="iam", instance="healthy:8080", result="ok"}'
        values: '5+1x400'
      - series: 'iam_outbox_retention_ticks_total{job="iam", instance="erroring:8080", result="error"}'
        values: '0+1x400'
    alert_rule_test:
      - eval_time: 30m
        alertname: IamOutboxRetentionErroring
        exp_alerts: []
      - eval_time: 119m
        alertname: IamOutboxRetentionErroring
        exp_alerts: []
      - eval_time: 121m
        alertname: IamOutboxRetentionErroring
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, instance: "erroring:8080", result: "error" }
            exp_annotations: { summary: "IAM outbox retention sweep had a recent error", description: "iam_outbox_retention_ticks_total{result=\"error\"} increased on iam/erroring:8080 in the last 6 hours. The sweep IS ticking — unlike IamOutboxRetentionStalled, the maintainer task is alive and completing ticks — but at least one tick in that window had a failing step: the published-row sweep, the parked-row sweep, or the parked-row gauge query. While this persists, published event_outbox rows are not being deleted, so the table grows without bound, and if the gauge query is the failing step iam_outbox_parked_rows also goes stale. outbox.retention.enabled=false does NOT cause this: a disabled sweep still ticks and still reports result=\"ok\" (it only skips the two DELETE steps), so a firing alert here always means a real failure, never an intentional pause. Check IAM logs for the tick's own warn!s (\"outbox published-row sweep failed; will retry next tick\", \"outbox parked-row sweep failed; will retry next tick\", \"outbox parked-row gauge query failed\") to see which step is failing and why. See RUNBOOK section 4." }

  # IamOutboxDeadLetterBacklog: a nonzero backlog held for an hour fires ONCE for the job even
  # though two replicas each report it (proving the `max by (job)` aggregation). The zero-valued
  # job is the control: a `>= 0` comparison would fire for it, `> 0` must not.
  - interval: 1m
    input_series:
      - series: 'iam_outbox_parked_rows{job="iam", instance="a:8080"}'
        values: '3+0x120'
      - series: 'iam_outbox_parked_rows{job="iam", instance="b:8080"}'
        values: '3+0x120'
      - series: 'iam_outbox_parked_rows{job="iam-empty", instance="c:8080"}'
        values: '0+0x120'
    alert_rule_test:
      - eval_time: 30m
        alertname: IamOutboxDeadLetterBacklog
        exp_alerts: []
      - eval_time: 61m
        alertname: IamOutboxDeadLetterBacklog
        exp_alerts:
          - exp_labels: { severity: warning, job: iam }
            exp_annotations: { summary: "IAM outbox dead letters are awaiting an operator", description: "At least one event_outbox row has been parked for over an hour on iam and nobody has retired it. Parked rows are excluded from the relay's poll forever, so those events will never be delivered until an operator replays or discards them via /v1/outbox/dead-letters. This complements IamOutboxEventsParked: that one fires when something JUST parked, this one fires when nobody has dealt with it. See RUNBOOK section 4." }

  # SMA-476 breaker alerts. The `authz` series sits at 2 (open) and `api_keys` at 0 throughout:
  # that second series is the CONTROL for IamRedisBreakerOpen's `role!="jwks"` filter. Without it
  # both inputs would be nonzero and a broken expr (`>= 0`, or a missing role filter) would still
  # produce exactly the expected alerts and pass.
  #
  # IamJwksRedisBreakerOpen needs its OWN control: its `role="jwks"` selector filters out
  # `api_keys` before that comparison ever runs, so without a second, zero-valued `role="jwks"`
  # series (job "iam-empty", below) every input the rule actually sees would be 2 — a `!= 0` weakened
  # to `>= 0` would still pass.
  - interval: 1m
    input_series:
      - series: 'iam_redis_breaker_state{job="iam", role="authz"}'
        values: '2+0x5'
      - series: 'iam_redis_breaker_state{job="iam", role="api_keys"}'
        values: '0+0x5'
      - series: 'iam_redis_breaker_state{job="iam", role="jwks"}'
        values: '2+0x5'
      - series: 'iam_redis_breaker_state{job="iam-empty", role="jwks"}'
        values: '0+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: IamRedisBreakerOpen
        exp_alerts: []
      - eval_time: 3m
        alertname: IamRedisBreakerOpen
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, role: authz }
            exp_annotations:
              summary: "IAM Redis circuit breaker is not closed (role authz)"
              description: "The Redis circuit breaker for role authz has been open or half-open for 2m, so authz/API-key cache commands are short-circuiting instantly instead of dialling. Decisions remain CORRECT (these caches fail open onto Postgres) but uncached. Recovery lags Redis by up to ~6s after it returns. See RUNBOOK's \"Authz availability posture\"."
      # The jwks series is at 2 as well, but IamRedisBreakerOpen must NOT match it — proving the
      # role!="jwks" filter works rather than being decorative.
      - eval_time: 3m
        alertname: IamJwksRedisBreakerOpen
        exp_alerts:
          - exp_labels: { severity: critical, job: iam, role: jwks }
            exp_annotations:
              summary: "IAM JWKS Redis circuit breaker is not closed — token auth is failing closed"
              description: "The Redis circuit breaker for the JWKS cache has been open or half-open for 1m. RedisJwksCache fails CLOSED, so every token-authenticated request is returning 503 (API-key auth is unaffected — it fails open onto Postgres). Recovery lags Redis by up to ~6s after it returns. See RUNBOOK's \"Authz availability posture\"."

  # SMA-476 mutation coverage: IamRedisBreakerOpen must ALSO fire on half_open (state 1), not
  # only open (state 2). Every case above only ever samples state 2, so a regression that
  # narrowed `!= 0` to `== 2` would pass all of them while going silent here. That is not a
  # theoretical gap: HALF_OPEN_DEADLINE exists precisely because a probe whose future gets
  # cancelled can leave the breaker stuck at half_open indefinitely, which is exactly the state
  # an operator must be paged about.
  - interval: 1m
    input_series:
      - series: 'iam_redis_breaker_state{job="iam", role="authz"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 1m
        alertname: IamRedisBreakerOpen
        exp_alerts: []
      - eval_time: 3m
        alertname: IamRedisBreakerOpen
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, role: authz }
            exp_annotations:
              summary: "IAM Redis circuit breaker is not closed (role authz)"
              description: "The Redis circuit breaker for role authz has been open or half-open for 2m, so authz/API-key cache commands are short-circuiting instantly instead of dialling. Decisions remain CORRECT (these caches fail open onto Postgres) but uncached. Recovery lags Redis by up to ~6s after it returns. See RUNBOOK's \"Authz availability posture\"."

  # SMA-476 mutation coverage: same `!= 0` vs `== 2` gap as above, but for IamJwksRedisBreakerOpen
  # at critical severity — a half-open JWKS breaker stuck past its HALF_OPEN_DEADLINE means every
  # token-authenticated request is 503ing while this alert stays quiet under the `== 2` mutant.
  - interval: 1m
    input_series:
      - series: 'iam_redis_breaker_state{job="iam", role="jwks"}'
        values: '1+0x5'
    alert_rule_test:
      - eval_time: 0m
        alertname: IamJwksRedisBreakerOpen
        exp_alerts: []
      - eval_time: 1m
        alertname: IamJwksRedisBreakerOpen
        exp_alerts:
          - exp_labels: { severity: critical, job: iam, role: jwks }
            exp_annotations:
              summary: "IAM JWKS Redis circuit breaker is not closed — token auth is failing closed"
              description: "The Redis circuit breaker for the JWKS cache has been open or half-open for 1m. RedisJwksCache fails CLOSED, so every token-authenticated request is returning 503 (API-key auth is unaffected — it fails open onto Postgres). Recovery lags Redis by up to ~6s after it returns. See RUNBOOK's \"Authz availability posture\"."

  # Flapping: ten opens in 10m against a control series with the SAME volume but a different
  # `to=` value. That mismatch is deliberate: it proves the rule's `{to="open"}` selector matters
  # rather than being decorative. If it were dropped, an unfiltered increase() would also count
  # this closed-transition series, so role=jwks would spuriously cross the >5 threshold too and
  # produce an alert this fixture does not expect — the fixture would fail. A control that never
  # transitions at all (the old `0+0x10` shape) could not tell the two cases apart.
  - interval: 1m
    input_series:
      - series: 'iam_redis_breaker_transitions_total{job="iam", role="authz", to="open"}'
        values: '0+1x10'
      - series: 'iam_redis_breaker_transitions_total{job="iam", role="jwks", to="closed"}'
        values: '0+1x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: IamRedisBreakerFlapping
        exp_alerts:
          - exp_labels: { severity: warning, job: iam, role: authz }
            exp_annotations:
              summary: "IAM Redis circuit breaker is flapping (role authz)"
              description: "The Redis circuit breaker for role authz opened more than 5 times in 10m. Each open costs a cache-bypass window; repeated opens suggest an intermittently unhealthy backend rather than a clean outage. NOTE the state gauge may read 0 at scrape time — that is why this rule watches transitions, not state."

  # Flapping must aggregate per-replica with `max`, never `sum` — IAM_REDIS_BREAKER_STATE's doc in
  # names.rs spells out why (each replica sets its own series independently). Three replicas of the
  # SAME job+role each open only twice in 10m — no single breaker is flapping — but their SUM (6)
  # would cross the >5 threshold on its own. This is the regression the `max by (job, role)` fix
  # exists for: `sum` would page on fleet-wide noise across healthy replicas instead of on one
  # genuinely flapping breaker.
  - interval: 1m
    input_series:
      - series: 'iam_redis_breaker_transitions_total{job="iam", role="authz", to="open", instance="a:8080"}'
        values: '0+0.2x10'
      - series: 'iam_redis_breaker_transitions_total{job="iam", role="authz", to="open", instance="b:8080"}'
        values: '0+0.2x10'
      - series: 'iam_redis_breaker_transitions_total{job="iam", role="authz", to="open", instance="c:8080"}'
        values: '0+0.2x10'
    alert_rule_test:
      - eval_time: 10m
        alertname: IamRedisBreakerFlapping
        exp_alerts: []
