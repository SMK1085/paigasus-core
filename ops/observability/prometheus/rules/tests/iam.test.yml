rule_files: [../iam.rules.yml]
evaluation_interval: 1m
tests:
  # IamDenialAuditDrops: rate(...[5m]) > 0, for: 0m — fires as soon as the counter moves.
  - interval: 1m
    input_series:
      - series: 'iam_denial_audits_dropped_total'
        values: '0 1 2 3 4 5'
    alert_rule_test:
      - eval_time: 0m
        alertname: IamDenialAuditDrops
        exp_alerts: []
      - eval_time: 5m
        alertname: IamDenialAuditDrops
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "IAM denial-audit entries are being dropped (drain not keeping up)" }

  # IamOutboxBacklogAgeHigh: gauge > 300 for: 5m.
  - interval: 1m
    input_series:
      - series: 'iam_outbox_oldest_unpublished_age_seconds'
        values: '400+0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: IamOutboxBacklogAgeHigh
        exp_alerts: []
      - eval_time: 5m
        alertname: IamOutboxBacklogAgeHigh
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "IAM outbox oldest unpublished event age > 5m" }

  # IamOutboxEventsParked: increase(...[15m]) > 0, for: 0m — fires as soon as one event parks.
  - interval: 1m
    input_series:
      - series: 'iam_outbox_relay_parked_total'
        values: '0 0 0 1 1 1'
    alert_rule_test:
      - eval_time: 1m
        alertname: IamOutboxEventsParked
        exp_alerts: []
      - eval_time: 5m
        alertname: IamOutboxEventsParked
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations: { summary: "IAM outbox parked a poison event" }

  # IamOutboxRelayStalled: rate(...[10m]) == 0, for: 10m — the ticks counter is flat (not ticking).
  - interval: 1m
    input_series:
      - series: 'iam_outbox_relay_ticks_total'
        values: '5+0x11'
    alert_rule_test:
      - eval_time: 10m
        alertname: IamOutboxRelayStalled
        exp_alerts: []
      - eval_time: 11m
        alertname: IamOutboxRelayStalled
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM outbox relay is not ticking (stalled but process alive)" }

  # IamAuditPartitionMaintenanceStalled: sum without(result) increase(...[2d]) == 0, for: 1h.
  # The maintenance task ticks ~once/day: the series steps up at t=24h and again at t=48h
  # (still-increasing → must NOT alert, even close to the 2d boundary), then goes flat forever
  # (task stalled) → the trailing 2d window eventually sees zero increase and, after holding for
  # the 1h `for`, the alert fires.
  - interval: 30m
    input_series:
      - series: 'iam_audit_partition_maintenance_ticks_total{result="ok", job="iam"}'
        values: '0x47 1x47 2x120'
    alert_rule_test:
      - eval_time: 24h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts: []
      - eval_time: 48h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts: []
      - eval_time: 72h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts: []
      - eval_time: 108h
        alertname: IamAuditPartitionMaintenanceStalled
        exp_alerts:
          - exp_labels: { severity: warning, job: iam }
            exp_annotations: { summary: "IAM audit partition-maintenance task is not ticking", description: "No successful audit partition-maintenance tick in ~2 days. Denied partitions won't be pruned (slow index/table bloat) and, after ahead_months, new-month create-ahead stops. The task ticks on interval_secs (default 86400 = daily), so the 2d window assumes the default daily interval — widen it if interval_secs is increased. NOTE: if audit.retention.enabled=false the series is absent and this alert stays silent — expected. See RUNBOOK §4." }

  # IamHighErrorRate: sum(rate(5xx)) / sum(rate(total)) > 0.05, for: 10m.
  # Both classes grow at the same rate, so the 5xx ratio holds steady at 50%.
  - interval: 1m
    input_series:
      - series: 'iam_http_requests_total{status_class="5xx"}'
        values: '0+1x11'
      - series: 'iam_http_requests_total{status_class="2xx"}'
        values: '0+1x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: IamHighErrorRate
        exp_alerts: []
      - eval_time: 11m
        alertname: IamHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM HTTP 5xx ratio > 5%" }

  # IamGrpcHighErrorRate: sum(rate(non-ok)) / sum(rate(total)) > 0.05, for: 10m.
  - interval: 1m
    input_series:
      - series: 'iam_grpc_requests_total{grpc_status="permission_denied"}'
        values: '0+1x11'
      - series: 'iam_grpc_requests_total{grpc_status="ok"}'
        values: '0+1x11'
    alert_rule_test:
      - eval_time: 9m
        alertname: IamGrpcHighErrorRate
        exp_alerts: []
      - eval_time: 11m
        alertname: IamGrpcHighErrorRate
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations: { summary: "IAM gRPC non-OK ratio > 5%" }
