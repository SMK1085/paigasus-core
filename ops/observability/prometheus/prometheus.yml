global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.rules.yml
scrape_configs:
  - job_name: iam
    static_configs:
      - targets: ["host.docker.internal:8080"]
  - job_name: gateway
    static_configs:
      - targets: ["host.docker.internal:8088"]
