# Vendored proto TOML plugin for the buf CLI.
#
# Source: https://github.com/stk0vrfl0w/proto-toml-plugins (plugins/buf.toml, MIT).
# Vendored in SMA-360 rather than referenced by URL: the upstream repo is
# effectively unmaintained, and this schema only resolves official, checksummed
# `bufbuild/buf` GitHub release binaries — nothing to maintain, so we own it.
#
# buf names its arm64 assets differently per OS: `buf-Darwin-arm64` and
# `buf-Windows-arm64.exe`, but `buf-Linux-aarch64`. The global [install.arch]
# remap (aarch64 -> arm64) is correct for macOS/Windows; the Linux-only
# [platform.linux.arch] identity override (aarch64 -> aarch64) shadows it so the
# Linux asset resolves too. Needs proto >= 0.58.1 (bundles schema_tool 0.18.0,
# moonrepo/plugins#151), pinned in .prototools. On an older schema engine the
# unknown [platform.linux.arch] table is ignored: macOS/Windows stay correct via
# the kept global remap, and only Linux-arm64 would regress to the wrong name —
# which the proto floor prevents. (SMA-360, SMA-387, SMA-411)

name = "buf"
type = "cli"

[platform.linux]
download-file = "buf-Linux-{arch}"
checksum-file = "sha256.txt"

[platform.macos]
download-file = "buf-Darwin-{arch}"
checksum-file = "sha256.txt"

[platform.windows]
download-file = "buf-Windows-{arch}.exe"
checksum-file = "sha256.txt"

[install]
checksum-url = "https://github.com/bufbuild/buf/releases/download/v{version}/{checksum_file}"
download-url = "https://github.com/bufbuild/buf/releases/download/v{version}/{download_file}"

# macOS/Windows arm64 assets are *-arm64; kept global so older schema engines
# still resolve them correctly.
[install.arch]
aarch64 = "arm64"

# Linux arm64 asset is buf-Linux-aarch64; this identity override beats the global
# remap above on proto >= 0.58.1 (schema_tool 0.18.0).
[platform.linux.arch]
aarch64 = "aarch64"

[resolve]
git-url = "https://github.com/bufbuild/buf"
