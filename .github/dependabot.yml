# Dependabot version updates. Each ecosystem gets ONE grouped PR per week covering
# minor+patch bumps; major bumps intentionally arrive as separate individual PRs so a
# breaking change is reviewed on its own (not hidden in a green group).
version: 2
updates:
  # ---- Rust: Cargo workspace at rs/ ----
  - package-ecosystem: cargo
    directory: /rs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- JS/TS: pnpm workspace + catalog at ts/ ----
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Hold a bump for 3 days before proposing it: pnpm 11's built-in 24h
    # minimumReleaseAge supply-chain policy rejects too-fresh packages in CI
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION), so a same-day npm release fails
    # `pnpm install --frozen-lockfile`. 3 days clears the 24h gate with margin.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # @types/node tracks the Node runtime major (Active LTS 24, .moon/toolchains.yml).
    # Ignore its major bumps so the type defs can't drift ahead of the runtime — bump
    # both deliberately at the next LTS line.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # ---- Python: uv workspace at py/ ----
  - package-ecosystem: uv
    directory: /py
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- Python: standalone uv project for repo:workflow-credentials (SMA-593) ----
  # A SECOND uv entry, not a widening of the one above: dependabot resolves each `directory`
  # independently, and this gate's project is outside the py/ workspace on purpose (it is CI
  # tooling, not a shipped package). Without this entry its pinned pyyaml is in a lockfile that
  # nothing watches, which the spec's "the pin is in a lockfile, where Dependabot sees it"
  # justification assumed was already true. Settings mirror the /py block exactly.
  - package-ecosystem: uv
    directory: /ci/workflow-credentials
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- GitHub Actions: workflows at repo root ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # SMA-500: the container images pin `rust:` and `ubuntu:` by digest. A pinned-and-never-updated
  # base on a security-audited product is the mirror image of the floating-tag risk the design
  # rejected Chainguard over, so the pins are kept fresh here. NOTE the chisel version and its two
  # sha384 checksums in rs/Dockerfile are NOT covered by any updater and are bumped by hand.
  - package-ecosystem: docker
    directory: /rs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # A version bump to `rust` or `ubuntu` is NOT a job this updater can safely do alone: it
    # would move the FROM tag but leave `ENV RUSTUP_TOOLCHAIN=1.95.0` and
    # rs/rust-toolchain.toml's channel untouched (rust), or leave `chisel cut --release
    # ubuntu-24.04` hardcoded against a new ubuntu:25.04 base (ubuntu) — three/two-site
    # agreements that ci/images/run.sh's assert_pins checks, but only across sites a human
    # edits together, not sites a grouped dependabot PR touches on its own. Ignore every semver
    # update-type for these two so only DIGEST refreshes on the pinned tag flow through
    # automatically (this entry's stated purpose, see the block comment above); a version bump
    # stays deliberate, human, and multi-site.
    ignore:
      - dependency-name: "rust"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "ubuntu"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # SMA-513: ts/Dockerfile pins both of its base images by digest — the builder node:X.Y.Z-bookworm
  # and the runtime gcr.io/distroless/nodejs24-debian12:nonroot. Covered here for the same reason
  # the /rs block exists — a pinned-and-never-updated base is the mirror image of the floating-tag
  # risk. As in /rs, digest refreshes on the pinned tags flow through and version bumps stay human.
  # What Dependabot does with each entry below is read from dependabot-core's docker
  # update_checker.rb and tag.rb (main at 6634a4a4), NOT from GitHub's published docs, which do not
  # describe it: a change in dependabot-core can change it.
  - package-ecosystem: docker
    directory: /ts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      docker-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      # The runtime tag `nonroot` holds no digits, so dependabot-core treats it as a
      # NON-comparable tag: it never proposes another tag for it and only refreshes its digest.
      # This ignore therefore never fires today. It is kept as a guard in case the tag is ever
      # changed to a versioned one. The Node major is part of the image NAME (nodejs24-…), so a
      # Node major bump is a different image that Dependabot never proposes; assert_console_pins
      # in ci/images/run.sh holds that major equal to .prototools' node pin.
      - dependency-name: "gcr.io/distroless/nodejs24-debian12"
        update-types:
          - "version-update:semver-major"
      # assert_console_pins in ci/images/run.sh holds the builder's exact X.Y.Z equal to
      # .prototools' node pin, so an automated version bump is a red Dependabot cannot fix on its
      # own; all three semver update-types are ignored. The builder is digest-pinned
      # (`FROM node:X.Y.Z-bookworm@sha256:… AS builder`), so with every newer tag ignored
      # Dependabot stays on the same tag and refreshes only its digest — the /rs behaviour. One
      # caveat from the same source: a digest-only refresh on a VERSIONED tag is suppressed when
      # dependabot-core's `docker_digest_only_update_suppression` experiment is on, and whether it
      # is on for this repository is not known. A version bump stays deliberate, human, and moves
      # the Dockerfile and .prototools together.
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
