# Dependabot version updates. Each ecosystem gets ONE grouped PR per week covering
# minor+patch bumps; major bumps intentionally arrive as separate individual PRs so a
# breaking change is reviewed on its own (not hidden in a green group).
version: 2
updates:
  # ---- Rust: Cargo workspace at rs/ ----
  - package-ecosystem: cargo
    directory: /rs
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- JS/TS: pnpm workspace + catalog at ts/ ----
  - package-ecosystem: npm
    directory: /ts
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    # Hold a bump for 3 days before proposing it: pnpm 11's built-in 24h
    # minimumReleaseAge supply-chain policy rejects too-fresh packages in CI
    # (ERR_PNPM_MINIMUM_RELEASE_AGE_VIOLATION), so a same-day npm release fails
    # `pnpm install --frozen-lockfile`. 3 days clears the 24h gate with margin.
    cooldown:
      default-days: 3
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    # @types/node tracks the Node runtime major (Active LTS 24, .moon/toolchains.yml).
    # Ignore its major bumps so the type defs can't drift ahead of the runtime — bump
    # both deliberately at the next LTS line.
    ignore:
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"

  # ---- Python: uv workspace at py/ ----
  - package-ecosystem: uv
    directory: /py
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "build(deps)"
      prefix-development: "build(deps)"
    groups:
      uv-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  # ---- GitHub Actions: workflows at repo root ----
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
