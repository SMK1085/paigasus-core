# SPDX-License-Identifier: Apache-2.0
name: release

# The full release path — `release`, `publish-pypi`, `publish-npm` — is present in this file
# (SMA-579), but INERT until `vars.PAIGASUS_RELEASE_ENABLED` is `'true'`. SMA-580 is what flips
# that variable, after its own pre-flight. Nothing publishes until then.
#
# HOW THE GATE REACHES EACH JOB — two ways, not three (SMA-603 correction of fix round 3, Minor
# 1; that earlier wording said three of the seven jobs carried the literal `if:`, which was true
# then and is false now that `plan` exists). The authoritative statement is the "THE `plan` JOB
# DECIDES WHETHER TO BUILD" note below; this is its summary:
#   * `plan` ALONE carries `if: vars.PAIGASUS_RELEASE_ENABLED == 'true'` literally.
#   * Every other gated job — `wheels`, `prebuild`, `proto-dist`, `approve-release`, `release`,
#     `publish-pypi` and `publish-npm` — carries NO `if:` on the flag itself. They are gated
#     TRANSITIVELY, through an unbroken `needs:` chain back to `plan`: `wheels`, `prebuild` and
#     `proto-dist` depend on `plan` directly (and also skip on `plan`'s `nothing_to_release`
#     output), and the rest depend on those.
#   * `release-pr` is not gated on the FLAG, by design — it must keep proposing the release PR
#     while the flag is off. That is only safe because it cannot reach a registry, which
#     `ci/actionlint/release_guard.py`'s V7 now ASSERTS (it is in that guard's `UNGATED_JOBS`,
#     and a member of that set carrying a publish step fails the gate).
#     It DOES carry `if: github.event_name == 'push'` (SMA-580), which is an event filter, not a
#     flag gate and not a security boundary — see the job's own comment.
# `release_guard.py` V1 still recognizes three shapes at the code level — an UNGATED_JOBS
# exemption, a literal gate, and a transitive gate — and rejects a job that fits none of them.
# That is a property of the checker, not a count of how many jobs use each shape today.
on:
  push:
    branches:
      - main
  # PERMANENT (SMA-580; corrected SMA-603 — this trigger is no longer scheduled for removal, see
  # the note at the end of this block). Step I of the activation sequence dispatches this workflow
  # explicitly rather than re-running a run whose jobs skipped, which removes two premises about
  # re-run semantics that SMA-580's design never measured: that a re-run re-reads repository
  # variables, and that it re-executes jobs that previously skipped.
  #
  # THE AUTHORIZATION BOUNDARY IS NOT IN THIS FILE, and must not be moved into it. A dispatch runs
  # the workflow definition FROM THE DISPATCHED REF, so anyone with write access can push a branch
  # carrying an edited copy of this file and dispatch that. Every in-workflow control — the `if:`
  # gate below, the `environment:` keys, a `github.ref` check — is therefore attacker-controlled on
  # such a ref, and none of them bounds this trigger.
  #
  # What DOES bound it is enforced outside this repository, by GitHub environments and by the
  # registries, and it holds in both directions:
  #
  #   * Keep the `environment:` key — that environment's deployment branch policy is restricted to
  #     `main` ONLY, so a job entering it from any other ref fails.
  #   * Remove it — the job loses its authorization. Since SMA-602 there is no publish token at
  #     all: crates.io, PyPI and npm each authenticate through OIDC trusted publishing, and the
  #     twelve publishers MUST BE CONFIGURED to require the `release-publish` environment claim.
  #     Dropping the `environment:` key then drops that claim and the registries reject the
  #     exchange. The `PAIGASUS_BOT_*` App secrets remain ENVIRONMENT secrets on `release-pr` and
  #     `release-publish`, so a job that leaves the environment cannot mint a token either.
  #
  #     READ "MUST BE CONFIGURED" LITERALLY (SMA-602 final review, Important 5). The environment
  #     field is OPTIONAL on both registries — npm 11.13.0 defines it with `default: null` and no
  #     `required: true` (lib/commands/trust/github.js), and PyPI's form accepts an empty
  #     environment too. A publisher registered WITHOUT it accepts an exchange carrying no
  #     environment claim, this file stays green, and NOTHING here detects it. The boundary
  #     therefore rests on twelve external settings, verified by hand: `npm trust list` reads the
  #     nine npm ones back, PyPI offers no read-back at all. RUNBOOK §5.1.2 owns that read-back
  #     and its periodic re-check; §5.2 records that PyPI has none.
  #
  # That pair is the boundary, and it now covers EVERY job that touches a credential — `release-pr`
  # on `release-pr`, and `release`/`publish-pypi`/`publish-npm` on `release-publish`. There are no
  # repository secrets left; `gh api .../actions/secrets` returns an empty list.
  #
  # It depends on both deployment branch policies staying `main`-only and on every credential
  # staying an ENVIRONMENT secret. A repository secret of the same name would silently defeat this,
  # because it resolves for any run regardless of ref. See
  # docs/ops/RUNBOOK-release-activation.md §3. Do not relax either half.
  #
  # The `if: github.event_name == 'push'` on `release-pr` is NOT part of this boundary — an edited
  # copy of this file on the dispatched ref deletes it. It closes the accidental case only.
  #
  # THIS TRIGGER IS PERMANENT (SMA-603 — withdraws the earlier "remove after the first release"
  # instruction, and the runbook's step J row that repeated it). `ci/release-plan/` decides on TAG
  # EXISTENCE, and it deliberately always builds on a `workflow_dispatch` — so a manual dispatch
  # is the "build anyway" lever for the state where release-plz has already cut the tags but a
  # registry is still missing the artifact (the SMA-580 npm half, published by hand the first
  # time because a fresh dispatch found the tags already present and skipped every publish step).
  # Removing the trigger would remove that lever with no replacement.
  #
  # This does NOT touch the authorization argument above: the boundary is still the environments
  # and their branch policies, never the trigger itself, so keeping this trigger permanently
  # changes nothing about who can make it publish.
  workflow_dispatch:

# Least privilege for the auto GITHUB_TOKEN, matching every other workflow here: it is never
# used for the push/PR below (that goes through the App installation token — see "Mint").
permissions:
  contents: read

# JOB ORDER IS LOAD-BEARING, and it is the reverse of the obvious one (SMA-578 review B3).
# Everything REVERSIBLE runs before the first IRREVERSIBLE step:
#
#   {wheels, prebuild, proto-dist} -> release -> {publish-pypi, publish-npm}
#
# The draft this replaced ran `release` FIRST, so release-plz published to crates.io and cut six
# tags before a single wheel was built. A zig regression or a runner-image change in the 12-leg
# matrix then left crates.io permanently published, tags permanently cut, and paigasus-kernel
# missing from PyPI while pinning paigasus-py-bindings==X.Y.Z. Nothing forces that order: the
# release commit on main already carries the bumped versions, so the artifacts can be built first.
#
# COROLLARY, equally load-bearing: NO JOB DOWNSTREAM OF `release` MAY BUILD ANYTHING. A wasm-pack
# or uv build after the crates.io upload reintroduces exactly the half-published state this order
# exists to prevent.
#
# ONE EXCEPTION, stated precisely (fix round 3, Important 5; the earlier wording claimed both
# publish jobs "only download, assert and upload", and that was false of one of them):
#
#   * `publish-pypi` genuinely only downloads, asserts and uploads. It has no checkout and no
#     toolchain setup.
#   * `publish-npm` runs `actions/checkout`, `moonrepo/setup-toolchain` and
#     `pnpm --dir ts install --frozen-lockfile` BEFORE it publishes. It COMPILES NOTHING — no
#     cargo, no wasm-pack, no napi build. It needs a JS toolchain because the publisher itself,
#     `napi prepublish`, is a Node CLI that must be resolvable from the pnpm workspace, and
#     because the main package publishes from the crate directory in the checkout.
#
# THE RESIDUAL, honestly — and REWRITTEN after it fired on the first live release (SMA-580).
# A setup failure inside publish-npm lands AFTER crates.io has published and after publish-pypi
# may have uploaded. That happened: run 33264074393 died on `pnpm: command not found` (exit 127)
# with both other registries already live.
#
# The previous wording here got BOTH of its comforts wrong, so neither is repeated:
#
#   1. It argued the window was narrow because `prebuild.yml` ran the byte-identical
#      `pnpm --dir ts install --frozen-lockfile` earlier in the SAME run. That reasoning does not
#      transfer: prebuild runs in DIFFERENT JOBS, on different runners, each doing its own
#      `moon setup`. A sibling job succeeding says nothing about this job's PATH. The actual fault
#      was a missing toolchain, not a lockfile — see the `moon setup` step below.
#   2. It claimed the `npmstate` pre-check "makes a re-run converge … so the job is safe to run
#      again". That is true only for a re-run WITHIN the same run, where
#      `needs.release.outputs.released` is still populated. It is FALSE for a fresh dispatch:
#      release-plz then finds the tags already present, returns an empty `releases` array, and
#      `relinfo` sets `kernel_release=false` — so every publish step SKIPS and the job goes GREEN
#      having published nothing. MEASURED reasoning, not hypothetical; it is why SMA-580's npm
#      half had to be published by hand.
#
# So the honest statement: this job is re-runnable in place, and NOT recoverable by re-dispatch
# once the release commit is tagged. Making it recoverable needs a version override input —
# tracked in SMA-602, not bolted on here.
#
# DO NOT "FIX" THIS BY RESTRUCTURING publish-npm (SMA-579 Ruling 24). Removing the install means
# replacing `napi prepublish` with a hand-rolled `npm publish` loop over the seven platform dirs
# plus a `jq` rewrite of the main package's optionalDependencies. That puts new, unreviewed logic
# in the one path where a mistake cannot be undone — a worse trade than the narrow, re-runnable
# failure window it would close.
#
# THE `plan` JOB DECIDES WHETHER TO BUILD (SMA-579 Task 6+7 decision, superseded by SMA-603). The
# original design considered a `plan` job that ran `release-plz release --dry-run` first, so a
# push with nothing to release could skip the 12-leg matrix. That approach does not work, for a
# more general reason than the one first recorded here.
#
# The first reason found was narrow: measured against the real repository, the dry-run FAILED
# every time, with `no matching package named paigasus-proto-derive` — a dry run never publishes
# the derive crate to crates.io, so the dependent `paigasus-proto` dry-run can never resolve it.
# That failure is real and permanent until a LIVE release publishes the derive crate first, but it
# applies to the `proto` version group ONLY — `paigasus-kernel` is a publish group of one with no
# in-tree dependency, so its dry-run resolves fine. It is no longer the operative reason.
#
# The reason that generalizes (SMA-603, spec M6): `release-plz release --dry-run --output json`
# prints `{"releases":[]}` at exit 0 EVEN WHEN it would publish. Measured with only the `kernel`
# version group bumped: release-plz logged that it would publish `paigasus-kernel` and cut
# `paigasus-kernel-v0.1.1`, and still reported an empty array. The array records PERFORMED
# releases, and a dry run performs none — so it cannot distinguish "nothing to release" from "a
# release is pending". A `plan` job that read it would silently skip every kernel-group release.
#
# What replaced it is `ci/release-plan/`, which decides on TAG EXISTENCE instead — the same thing
# release-plz itself short-circuits on before it touches a registry or runs cargo. The `plan` job
# below is the ONLY holder of the literal flag gate; `wheels`, `prebuild` and `proto-dist` gate on
# it transitively through `needs: [plan]` AND on its `nothing_to_release` output, and
# `approve-release`/`release`/`publish-pypi`/`publish-npm` are gated only TRANSITIVELY through
# their own `needs:` chain. Do not "fix" this by reintroducing a dry-run-based decision — the
# `releases`-array blindness above is not specific to the derive crate and would recur.

jobs:
  release-pr:
    name: release PR
    # Push-only. This job has no business running on a manual dispatch: step I of the activation
    # dispatches this workflow to publish, not to re-propose a release PR.
    #
    # This is NOT a security boundary, and must not be read as one. A dispatch runs the definition
    # from the dispatched ref, so an edited copy deletes this line. It closes the ACCIDENTAL case
    # only — a dispatch never mints the App token by mistake. See the `workflow_dispatch` comment
    # at the top of this file for the residual it does not close.
    if: github.event_name == 'push'
    # THE CREDENTIAL BOUNDARY for this job, and the reason it is an environment rather than an
    # `if:` (SMA-580). `release-pr`'s deployment branch policy is `main`-only, and the App
    # credentials below are ENVIRONMENT secrets on it — not repository secrets. So both directions
    # are closed on a dispatched ref carrying an edited copy of this file:
    #
    #   * keeps `environment: release-pr` -> the branch policy fails the job on any ref but `main`
    #   * drops it                        -> the job cannot read PAIGASUS_BOT_* at all
    #
    # A job may declare only ONE environment, which is why this is its own environment rather than
    # `release-publish`: that name is bound by the crates.io and PyPI trusted publishers and must
    # stay on the `release` job. Do not merge the two.
    environment: release-pr
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # release-plz force-updates its PR branch on every run, so two rapid merges to main would
    # race. Do NOT cancel in progress: a cancelled run can leave the branch half-written.
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      # The App credentials may not exist yet (a human must create them — see the workflow's
      # own doc). A job-level `if:` cannot see whether a secret is set: per GitHub's own
      # context-availability table, `jobs.<job_id>.if` only sees github/needs/vars/inputs,
      # never secrets. A step's `if:`/`env:` CAN see secrets, so every step below is
      # individually guarded on this step's output instead. Left unconfigured, this makes the
      # whole job skip cleanly (green) on every push to main rather than failing forever.
      #
      # Keyed on the App identifier rather than the private key purely because it is not a
      # credential. Both are required by the mint step below, so a HALF-configured App fails
      # there instead of skipping — which is correct: that is a real misconfiguration, not a
      # "not set up yet".
      - name: Check for the App credentials
        id: preflight
        env:
          APP_ID_SET: ${{ secrets.PAIGASUS_BOT_APP_ID != '' }}
        run: |
          echo "configured=$APP_ID_SET" >> "$GITHUB_OUTPUT"
          if [ "$APP_ID_SET" != "true" ]; then
            echo "::notice::PAIGASUS_BOT_APP_ID is not set — skipping the release-PR job until a human creates the App secrets (see release.yml)."
          fi

      # An App INSTALLATION token, minted fresh per run and valid for one hour — which is
      # exactly why it cannot be a stored repository secret, and why the earlier
      # RELEASE_PLZ_TOKEN shape could only ever have held a long-lived PAT. This job's
      # timeout-minutes: 20 keeps the whole run well inside that hour, so one mint here is
      # enough for both consumers below.
      #
      # Scoped to THIS repository (the action defaults `repositories` to the current repo) and
      # to exactly two permissions, requested EXPLICITLY below rather than inherited. Without
      # the `permission-*` inputs a minted token carries every permission the App installation
      # holds, so granting the App an unrelated scope later would silently widen this token
      # (zizmor: github-app, "app token inherits blanket installation permissions").
      #
      #   contents:write      — the stamping step's push
      #   pull-requests:write — release-plz opening/updating the release PR
      #
      # Both must genuinely be granted to the installation: the action ERRORS when asked for a
      # permission the App does not hold. That is the right direction — an under-granted App
      # reds here rather than half-working further down.
      #
      # The action registers the token as a log mask and revokes it in its post-step, so it
      # does not outlive the run.
      #
      # WHICH APP: the EXISTING Paigasus bot GitHub App. Do not create a second one.
      #
      # TWO reasons this job can skip, and only the second is a misconfiguration:
      #   1. The run was a `workflow_dispatch`. The job's `if:` is push-only (SMA-580), so it
      #      skips BY DESIGN and the preflight step below never runs.
      #   2. The run was a push and the preflight reported `configured=false` — then, and only
      #      then, the cause is a missing `PAIGASUS_BOT_APP_ID` secret, not a missing App.
      - name: Mint the App installation token
        id: app_token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id` (v3.2.0 warns on the latter).
          # PAIGASUS_BOT_APP_ID holds the App's CLIENT ID, not the numeric App ID — the secret
          # predates this input's rename and is deliberately left named as it is, since
          # rotating a secret name costs more than this comment. Do not "correct" it by
          # swapping in the numeric App ID: the value here is the Client ID, and the secret
          # NAME is the only stale thing about it.
          client-id: ${{ secrets.PAIGASUS_BOT_APP_ID }}
          private-key: ${{ secrets.PAIGASUS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # persist-credentials: false, matching every other checkout in this repo
          # (artipacked hardening). An earlier revision persisted the App token here so the
          # stamping step could push — but `actions/checkout` writes that credential into
          # the local git config for the WHOLE job, which handed a write-capable token to
          # four steps that have no business with it (setup-toolchain, proto install,
          # moon setup, pnpm install). A compromised action or transitive dependency in any
          # of them could have used it before release work even began.
          #
          # The token now reaches only the two steps that genuinely need it, via their own
          # `env:` — release-plz (GIT_TOKEN) and the stamping step (which authenticates its
          # fetch/push through an explicit remote URL rather than ambient git config).
          persist-credentials: false

      - name: Set up proto + Moon
        if: steps.preflight.outputs.configured == 'true'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          # Don't cache the proto/Moon toolchain dir: a restored ~/.proto carries stale
          # setup-state that makes `moon setup` skip installing node/pnpm (their shims
          # then don't exist). Reinstall fresh each run (matches ci.yml/prebuild.yml).
          cache: false

      # release-plz is proto-pinned like every other CLI this repo depends on
      # (.prototools, .proto/plugins/release-plz.toml) — install the pinned binary
      # directly rather than through a third-party GitHub Action, which would resolve
      # its own, unpinned release-plz build. Narrow install (not a bare `proto install`):
      # this job needs none of actionlint/buf/deny/machete/nextest/promtool/wasm-pack.
      - name: Install pinned release-plz CLI
        if: steps.preflight.outputs.configured == 'true'
        run: proto install release-plz

      - name: Install Moon-managed toolchains (node, pnpm, rust, python, uv)
        if: steps.preflight.outputs.configured == 'true'
        run: moon setup

      - name: Install JS workspace deps
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm --dir ts install --frozen-lockfile

      # release-plz first, ALWAYS, then --write (next step). release-plz owns every Cargo
      # version and the [workspace.dependencies] requirements; --write then brings the six
      # sites it cannot reach (pyproject/package.json/the dependency pin) plus the three
      # regenerated sites into line.
      #
      # Run from rs/: release-plz's config/manifest discovery (./release-plz.toml,
      # ./Cargo.toml) is CWD-relative with no upward search, so this is what makes it find
      # rs/release-plz.toml and rs/Cargo.toml without --config/--manifest-path flags.
      #
      # `--output json` always prints one line, `{"prs": [...]}`, with 0 or 1 elements —
      # verified against the pinned 0.3.158 source
      # (release_plz_core::command::release_pr::release_pr returns Option<ReleasePr>;
      # main.rs wraps None as `[]`, Some(pr) as `[pr]`). Each element carries head_branch/
      # base_branch/html_url/number/releases (the ReleasePr struct) — the CLI's own --help
      # only promises "prints the branch, URL and number", so this was confirmed by reading
      # the source at the exact pinned tag, not assumed from the docs.
      - name: Open or update the release PR
        id: release_pr
        if: steps.preflight.outputs.configured == 'true'
        working-directory: rs
        env:
          GIT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          OUT="$(release-plz release-pr --output json)"
          echo "$OUT"
          echo "json=$OUT" >> "$GITHUB_OUTPUT"

      # release-plz does ALL of its work — version bumps, changelog, branch creation, push —
      # inside a private copy under a tempdir
      # (release_plz_core::command::release_pr::copy_to_temp_dir, confirmed by reading the
      # pinned 0.3.158 source and independently measured: a throwaway clone's HEAD and
      # working tree were untouched after a real `release-pr` run). This checkout's `main`
      # is therefore NEVER the branch to act on — the branch comes only from the JSON above,
      # never from `git rev-parse --abbrev-ref HEAD` (which would still read "main" here and
      # push straight to it).
      - name: Stamp the non-Cargo manifests onto the release PR branch
        if: steps.preflight.outputs.configured == 'true'
        env:
          PR_JSON: ${{ steps.release_pr.outputs.json }}
          # Scoped to this step only. The checkout sets persist-credentials: false, so there
          # are no ambient git credentials — the fetch and push below authenticate through an
          # explicit remote URL built from this value. GitHub masks the secret in logs, and
          # the URL is never written to git config (no `remote set-url`), so it does not
          # outlive the commands themselves.
          GH_TOKEN_FOR_PUSH: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          PR_COUNT="$(printf '%s' "$PR_JSON" | jq '.prs | length')"
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "release-plz: no release PR needed (every releasable package is already" \
                 "at its proposed version) — nothing to stamp"
            exit 0
          fi
          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.prs[0].head_branch')"
          AUTH_REMOTE="https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch "$AUTH_REMOTE" "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD

          bash ci/version-lockstep/run.sh --write

          if git diff --quiet; then
            echo "version-lockstep: nothing to stamp"
            exit 0
          fi
          # The App's bot user, in the resolvable `<id>+<login>@` form. Both halves matter.
          # `paigasus-release[bot]` was used here until SMA-620 and is not a real account —
          # GET /users/paigasus-release[bot] is a 404 — so commits it authored resolved to
          # `author: null`. That is unfixable downstream: cla-assistant matches commit authors
          # against a login allowlist, and a null author has no login to allowlist. It never
          # surfaced because this step is conditional on there being drift to stamp and has
          # never run. Verified: id 285361405, type Bot, and the author of both release commits
          # on main.
          git config user.name  "paigasusbot[bot]"
          git config user.email "285361405+paigasusbot[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rs): stamp the non-Cargo manifests to the release version"
          git push "$AUTH_REMOTE" "HEAD:$BRANCH"

  # THE SKIP DECISION (SMA-603). Without this, every push to `main` with the flag on builds the
  # full 12-leg matrix and then waits at `approve-release` for a human, indefinitely, even when
  # there is nothing to release — observed on run 33265567805.
  #
  # WHY NOT `release-plz release --dry-run`. Measured (spec M6): with only the `kernel` version
  # group bumped, release-plz logs that it WOULD publish paigasus-kernel and cut
  # `paigasus-kernel-v0.1.1`, and still prints `{"releases":[]}` at exit 0. That array records
  # PERFORMED releases and a dry run performs none, so it cannot tell "nothing to release" from
  # "a release is pending". Reading it would silently skip every kernel-group release. Do not
  # reintroduce it.
  #
  # This job is the ONLY holder of the literal flag gate now. `wheels`, `prebuild` and
  # `proto-dist` gate transitively through `needs: [plan]` — with the flag off this job skips,
  # and a job whose needs: dependency skipped is itself skipped.
  plan:
    name: decide whether anything is releasable
    if: vars.PAIGASUS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      # A STEP output is not a JOB output. Without this mapping every
      # `needs.plan.outputs.nothing_to_release` below is the empty string — which builds, so it
      # fails safe, but the feature would never fire. release_guard.py V9c asserts this key AND
      # that `steps.decide` names a step that exists in this job.
      nothing_to_release: ${{ steps.decide.outputs.nothing_to_release }}
      # SMA-658. One skip flag and one version for each service chain. The version is what
      # publish-images-<svc> compares against the image's own label, so a chain can never publish
      # an archive built for a different version.
      skip_iam: ${{ steps.decide.outputs.skip_iam }}
      skip_gateway: ${{ steps.decide.outputs.skip_gateway }}
      version_iam: ${{ steps.decide.outputs.version_iam }}
      version_gateway: ${{ steps.decide.outputs.version_gateway }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # LOAD-BEARING. The tags ARE the signal, and a shallow checkout has none.
          fetch-depth: 0
          persist-credentials: false

      # LOAD-BEARING, and the reason is measured (SMA-603 C1). `ci/release-plan/run.sh` runs the
      # checker through `uv`, which is a proto-managed shim and is NOT on `ubuntu-latest`. Without
      # these two steps the Decide step died, the `plan` job failed, and because every consumer
      # carries a status-function-free `if:` — GitHub applies an implicit `success()` — `wheels`,
      # `prebuild` and `proto-dist` SKIPPED, and `approve-release`, `release`, `publish-pypi` and
      # `publish-npm` skipped down the `needs:` chain. The whole publish path was dropped on every
      # push. This file's own header records the same class of fault once already: SMA-580's
      # `publish-npm` died on `pnpm: command not found`, and the conclusion there was "the actual
      # fault was a missing toolchain".
      #
      # `run.sh` now ALSO fails safe when `uv` is absent (it writes nothing_to_release=false and
      # exits 0). Both halves are needed: without the toolchain the job would build every time and
      # the feature would never fire; without the fail-safe a future toolchain regression would
      # drop the release path again.
      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          # Don't cache the proto/Moon toolchain dir: a restored ~/.proto carries stale
          # setup-state that makes `moon setup` skip installing toolchains (their shims then
          # don't exist). Reinstall fresh each run — same reason the release-pr job above gives.
          cache: false

      # NARROW install, like the release-pr job's `proto install release-plz`: this job needs
      # none of actionlint/buf/deny/machete/nextest/promtool/wasm-pack, only `uv`.
      - name: Install pinned uv
        run: proto install uv

      # ONE PHYSICAL LINE, AND ONE COMMAND. release_guard.py's command_segments is per physical
      # line, so a backslash continuation would be judged without its flags; V9e additionally
      # requires this step to run exactly the invocation and nothing else, because a second
      # command here could overwrite $GITHUB_OUTPUT after the checker wrote it.
      - name: Decide
        id: decide
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: ci/release-plan/run.sh --github-output

  # THE REVERSIBLE STAGE. Everything below `release` only downloads what these produce.
  wheels:
    name: build wheels
    needs: [plan]
    # FAIL-SAFE POLARITY, and it is carried by the operator. The output is named for the SKIP
    # condition and tested with `!=`, so anything but the literal 'true' builds — 'false', the
    # empty string, an unset output. `== 'true'` would invert it; `== 'false'` would fail closed
    # on an unset output. release_guard.py V9b pins both accepted forms.
    if: needs.plan.outputs.nothing_to_release != 'true'
    uses: ./.github/workflows/wheels.yml

  prebuild:
    name: build node addons and wasm
    needs: [plan]
    # FAIL-SAFE POLARITY, and it is carried by the operator. The output is named for the SKIP
    # condition and tested with `!=`, so anything but the literal 'true' builds — 'false', the
    # empty string, an unset output. `== 'true'` would invert it; `== 'false'` would fail closed
    # on an unset output. release_guard.py V9b pins both accepted forms.
    if: needs.plan.outputs.nothing_to_release != 'true'
    uses: ./.github/workflows/prebuild.yml

  proto-dist:
    name: build the Python proto distribution
    needs: [plan]
    # FAIL-SAFE POLARITY, and it is carried by the operator. The output is named for the SKIP
    # condition and tested with `!=`, so anything but the literal 'true' builds — 'false', the
    # empty string, an unset output. `== 'true'` would invert it; `== 'false'` would fail closed
    # on an unset output. release_guard.py V9b pins both accepted forms.
    if: needs.plan.outputs.nothing_to_release != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install Moon-managed toolchains
        run: moon setup

      - name: Build the distribution
        working-directory: py
        run: uv build --package paigasus-proto --out-dir ../dist

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proto-dist-py
          path: |
            dist/paigasus_proto-*.whl
            dist/paigasus_proto-*.tar.gz
          if-no-files-found: error

  # The ONE place a human approval can be inserted, by adding required reviewers to the
  # `release-approval` environment in repo settings. It must NOT go on the publishing jobs:
  # GitHub pauses EACH job entering an environment, so reviewers on release-publish would stop
  # the run again between crates.io and PyPI — leaving crates.io published and PyPI empty if the
  # second approval is rejected or times out (30 days). That is the split state the job order
  # above exists to prevent. SMA-580: add reviewers HERE, never to release-publish.
  approve-release:
    name: approve the release
    needs: [wheels, prebuild, proto-dist]
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - run: echo "Approved. Everything below this point is irreversible."

  release:
    name: publish to crates.io and cut tags
    needs: [wheels, prebuild, proto-dist, approve-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-publish
    # The irreversible step, serialized. Two merges to main in quick succession would otherwise
    # run two `release-plz release` invocations concurrently, racing the same crates.io publish
    # and the same tag push. NEVER cancel-in-progress here: a cancelled release can leave
    # crates.io half-published with tags partially cut, which is precisely the split state the
    # job ORDER above exists to prevent. A queued second run is safe — release-plz is idempotent
    # and skips packages already published at that version.
    #
    # The build jobs deliberately carry no group: they only produce artifacts, so concurrent
    # runs are harmless, and serializing them would put every push to main behind a full
    # 12-leg matrix.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      id-token: write    # crates.io OIDC exchange
      contents: read     # the App token below does the writing, not GITHUB_TOKEN
    outputs:
      released: ${{ steps.rel.outputs.json }}
    steps:
      - name: Authenticate with crates.io
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      # A SECOND mint: tokens are per-job and live one hour. Every checkout in this repo sets
      # persist-credentials: false, so there are no ambient git credentials and release-plz's
      # tag push needs this explicitly.
      # Same App as the release-pr job above: the EXISTING Paigasus bot GitHub App.
      - name: Mint the App installation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.PAIGASUS_BOT_APP_ID }}
          private-key: ${{ secrets.PAIGASUS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install pinned release-plz CLI
        run: proto install release-plz

      - name: Release
        id: rel
        working-directory: rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
          GIT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          OUT="$(release-plz release --output json)"
          echo "$OUT"
          echo "json=$OUT" >> "$GITHUB_OUTPUT"

  # THE THIRD AND FOURTH IRREVERSIBLE STAGES. The `plan` job (see the file-header decision)
  # decides WHETHER to build at all — it is not consulted again here. The version and per-family
  # flags for these two jobs still come straight out of `release`'s own `released` output, not
  # from `plan`, which carries no version information of its own. Both jobs only download,
  # assert and upload; the corollary above forbids anything that compiles, fetches or
  # generates here.
  publish-pypi:
    name: publish to PyPI
    needs: [wheels, proto-dist, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      id-token: write    # PyPI trusted publishing; the claim binds to THIS file's name
    steps:
      # `release`'s `released` output is release-plz's own `--output json`, shaped
      # `{"releases":[{"package_name":...,"version":...}]}` (measured against release_plz_core
      # 0.36.14 — "releases"/"package_name", NOT "prs"/"package", which is the OTHER command's
      # shape). paigasus-py-bindings is Cargo `publish = false`, so release-plz never reports
      # it — bind against paigasus-kernel instead, which it definitely reports and which
      # version_group holds to the identical number (repo:version-lockstep asserts that).
      - name: Read the released version
        id: relinfo
        env:
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          set -euo pipefail
          # Fix round 1 (Critical 2): `paigasus-kernel` (group `kernel`) and `paigasus-proto`
          # (group `proto`) are INDEPENDENTLY triggered release-plz version groups — a
          # contracts-only commit legitimately releases proto with no kernel entry in
          # `$RELEASED`, and vice versa. A missing family must never hard-fail the job: it
          # must gate that family's steps off instead, so a run where NEITHER family released
          # still completes having uploaded nothing. `.releases[]?` (not `.releases[]`) so an
          # empty `{"releases":[]}` array yields "" rather than a jq error under `pipefail`.
          # Fix round 2 (Important): `?` also swallows a STRUCTURALLY WRONG payload (release-plz
          # schema drift, or `$RELEASED` wired to the wrong key) — `.releases[]?` on `null`,
          # `{"unexpected":1}` or `{"releases":null}` would silently report both families absent
          # and the job would exit 0 having uploaded nothing. Validate the shape explicitly
          # first, so `?` is doing only the job it was added for (a legitimately empty or
          # absent-key `releases` array), not hiding a wiring bug as a quiet no-op.
          jq -e 'has("releases") and (.releases | type == "array")' <<<"$RELEASED" >/dev/null \
            || { echo "::error::malformed release output from release-plz: $RELEASED"; exit 1; }
          KERNEL_VERSION="$(jq -r '.releases[]? | select(.package_name == "paigasus-kernel") | .version' <<<"$RELEASED")"
          PROTO_VERSION="$(jq -r '.releases[]? | select(.package_name == "paigasus-proto") | .version' <<<"$RELEASED")"
          if [ -n "$KERNEL_VERSION" ]; then
            echo "kernel_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          # This keys on the RUST crate `paigasus-proto` reported by release-plz. What gets
          # uploaded below under this flag is the PYTHON distribution built from
          # py/packages/paigasus-proto — same name, two different artifacts.
          if [ -n "$PROTO_VERSION" ]; then
            echo "proto_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "proto_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "proto_version=$PROTO_VERSION" >> "$GITHUB_OUTPUT"

      # THREE downloads, not one. wheels.yml deliberately keeps face-paigasus-kernel OUTSIDE the
      # wheel-* namespace precisely so a single `pattern: wheel-*` + merge-multiple cannot
      # collapse them: paigasus-py-bindings MUST reach PyPI before paigasus-kernel, because the
      # face pins `==` and the reverse order leaves it uninstallable in between.
      - name: Download the bindings wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist-bindings

      - name: Download the bindings sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist-bindings

      - name: Download the kernel face
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: face-paigasus-kernel
          path: dist-face

      - name: Download the proto distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: proto-dist-py
          path: dist-proto

      # Binds the artifact to the release. Without this a re-run against a moved main could
      # publish a stale wheel under the wrong version.
      - name: Assert the wheels match the released version
        if: steps.relinfo.outputs.kernel_release == 'true'
        env:
          KERNEL_VERSION: ${{ steps.relinfo.outputs.kernel_version }}
        run: |
          set -euo pipefail
          [ -n "$KERNEL_VERSION" ] || { echo "::error::no kernel version from relinfo"; exit 1; }
          found=0
          for w in dist-bindings/*.whl; do
            case "$(basename "$w")" in
              paigasus_py_bindings-"$KERNEL_VERSION"-*) found=$((found+1)) ;;
              *) echo "::error::unexpected wheel $(basename "$w") — expected version $KERNEL_VERSION"; exit 1 ;;
            esac
          done
          [ "$found" -ge 7 ] || { echo "::error::found $found wheels, expected at least 7"; exit 1; }
          # The sdist is not a `.whl`, so the loop above never inspects it — without this it
          # ships whatever version wheels.yml's `sdist` job happened to build, unbound to the
          # release. A re-run against a moved main could then publish an sdist at the wrong,
          # permanently-burnt PyPI version.
          test -f "dist-bindings/paigasus_py_bindings-$KERNEL_VERSION.tar.gz" \
            || { echo "::error::missing dist-bindings/paigasus_py_bindings-$KERNEL_VERSION.tar.gz"; exit 1; }
          echo "OK: $found wheels + sdist at $KERNEL_VERSION"

      # AUTH: OIDC trusted publishing. This job supplies no `password:`, so
      # pypa/gh-action-pypi-publish mints an OIDC token instead (SMA-602).
      #
      # PyPI allows only ONE *pending* trusted publisher per (owner, repo, workflow, environment)
      # tuple, and all three projects below share that tuple exactly — same repo, same
      # `release.yml`, same `release-publish` environment. Registering the second one fails with
      # "A pending trusted publisher matching this configuration has already been registered for a
      # different project name". That is pypi/warehouse#16920, open since 2024-10, and it is the
      # documented monorepo limitation, not a misconfiguration.
      #
      # The constraint binds PENDING publishers only. So SMA-580 created all three projects with
      # an account-scoped token once, and SMA-602 then registered a NORMAL trusted publisher on
      # each — normal publishers may share a tuple, which is the ordinary monorepo case — and
      # deleted the token. Do not reintroduce one: a token would MASK a broken exchange rather
      # than fail. npm's OIDC helper never throws, so a failed exchange falls through to any
      # configured credential and publishes silently.
      #
      # WHAT V10 ACTUALLY COVERS (corrected, SMA-602 final review, Important 1 — the earlier
      # "V10 reds on it" was over-broad). release_guard.py's V10 is four rules, not a blanket
      # ban on credentials:
      #   1. a strict-equality allowlist of the secret NAMES this file may reference
      #      (EXPECTED_RELEASE_SECRETS — currently the two `PAIGASUS_BOT_*` App credentials);
      #   2. any `password:` inside the `with:` of a `pypa/gh-action-pypi-publish` step,
      #      whatever the value is;
      #   3. three credentials banned by literal name (PYPI_API_TOKEN, NPM_TOKEN,
      #      NODE_AUTH_TOKEN);
      #   4. an npm `_authToken` or `_auth` written anywhere the parsed document can reach.
      # It reads the PARSED YAML, so it sees no comment — including this one. It cannot see a
      # credential fetched at run time (a vault call, a decoded blob), and rule 1 covers only
      # the `secrets` context, not a value smuggled in through `vars`.
      #
      # V10 is not the only rule guarding this file. V11 asserts that `id-token: write` must be
      # present in the `permissions:` block of both `publish-pypi` and `publish-npm` jobs — without
      # it, GitHub provides no OIDC token and npm's oidc.js silently falls through to a legacy
      # credential (SMA-602 F2). V12 pins seven load-bearing lines of the npm OIDC floor check
      # (`floor=11.5.1` and related assertions) across release.yml and prebuild.yml; deleting or
      # lowering either copy keeps CI green while breaking publish (F3).
      #
      # A consequence worth knowing: with no `password:`, the action's `attestations` input
      # (default 'true', and effective only under Trusted Publishing) becomes live, so all three
      # projects now upload PEP 740 attestations. That needs no extra permission — they are
      # Sigstore-signed with the same OIDC token, not through GitHub's attestations API.
      #
      # `id-token: write` stays on this job: it is what the normal publishers use, and removing
      # it now would just have to be added back.
      #
      # ORDER IS LOAD-BEARING: bindings, then the face. skip-existing makes a partial failure
      # re-runnable — PyPI returns 400 "file already exists" otherwise, so an un-skipped retry can
      # never succeed unaided. PyPI is delete-but-never-reuse.
      - name: Publish paigasus-py-bindings
        if: steps.relinfo.outputs.kernel_release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist-bindings
          skip-existing: true

      - name: Publish paigasus-kernel
        if: steps.relinfo.outputs.kernel_release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist-face
          skip-existing: true

      # Binds the proto distribution to the release, same reason as the wheel/sdist assertion
      # above: `PROTO_VERSION` was computed but never exported, so this upload shipped whatever
      # proto-dist happened to build — a re-run against a moved main could publish it at a
      # version that does not match the release. Filenames match `uv build --package
      # paigasus-proto`'s output (a pure-Python uv_build wheel, tag py3-none-any).
      - name: Assert the proto distribution matches the released version
        if: steps.relinfo.outputs.proto_release == 'true'
        env:
          PROTO_VERSION: ${{ steps.relinfo.outputs.proto_version }}
        run: |
          set -euo pipefail
          [ -n "$PROTO_VERSION" ] || { echo "::error::no proto version from relinfo"; exit 1; }
          test -f "dist-proto/paigasus_proto-$PROTO_VERSION-py3-none-any.whl" \
            || { echo "::error::missing dist-proto/paigasus_proto-$PROTO_VERSION-py3-none-any.whl"; exit 1; }
          test -f "dist-proto/paigasus_proto-$PROTO_VERSION.tar.gz" \
            || { echo "::error::missing dist-proto/paigasus_proto-$PROTO_VERSION.tar.gz"; exit 1; }
          echo "OK: proto wheel + sdist at $PROTO_VERSION"

      # Independent cadence: release-plz sees the RUST crate `paigasus-proto`; what uploads here
      # is the PYTHON distribution built from py/packages/paigasus-proto. Same name, two things.
      - name: Publish paigasus-proto
        if: steps.relinfo.outputs.proto_release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist-proto
          skip-existing: true

  publish-npm:
    name: publish to npm
    needs: [prebuild, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      # `contents: read` is REQUIRED here and is not a copy of `release`'s block for symmetry
      # (fix round 3, Important 8). A job-level `permissions:` block sets every scope it does NOT
      # list to `none` — so declaring `id-token: write` alone left `contents` at none while
      # `actions/checkout` below runs. It works today only because this repository is public; the
      # day it is not, or the day a checkout needs any contents scope, the job fails AFTER
      # crates.io has already published. `release` carries `contents: read` beside
      # `id-token: write` for exactly this reason.
      contents: read
      id-token: write    # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      # REQUIRED, and its absence is why the first live release failed here (SMA-580).
      # `setup-toolchain` installs proto and Moon; it does NOT install the Moon-MANAGED
      # toolchains. `moon setup` is what installs node and pnpm via proto and puts their shims on
      # PATH. Without it the next step dies with `pnpm: command not found`, exit 127 — MEASURED on
      # run 33264074393, after crates.io and PyPI had already published.
      #
      # Every other job in this repository that runs pnpm already does this: `release-pr` below,
      # `proto-dist` above, and both `prebuild.yml` jobs. `publish-npm` was the only one missing
      # it, and it is the one job that had never executed before the flag was flipped.
      - name: Install Moon-managed toolchains (node, pnpm, rust, python, uv)
        run: moon setup

      # REQUIRED (SMA-602 final review, Critical 1), and its absence would repeat the SMA-580
      # failure one registry over. `moonrepo/setup-toolchain` puts `~/.proto/bin` and
      # `~/.proto/shims` on PATH, and proto DOES NOT SHIM npm — only node, pnpm, pnpx and the
      # pinned CLIs. So a bare `npm` here resolves to the RUNNER IMAGE's npm, which on
      # ubuntu-latest is npm 10.x. npm 10 has no `lib/utils/oidc.js` at all: there is no OIDC
      # code path for it to enter. OIDC trusted publishing needs npm >= 11.5.1.
      #
      # With the credential removed, npm 10 would find nothing to authenticate with and die
      # ENEEDAUTH — AFTER crates.io has published and the tags are cut, in the one job a fresh
      # dispatch cannot repair (RUNBOOK §7.4).
      #
      # WHY THIS SHAPE, not a `.prototools` pin. `napi prepublish` spawns each per-platform
      # child through execSync with `env: process.env`, resolving the tool from PATH — so the
      # fix must move PATH, not one step's argv. `$GITHUB_PATH` is prepended for every LATER
      # step, so it wins over `~/.proto/shims` and every child process inherits it. Pinning npm
      # in `.prototools` would also work, but it edits a file the whole Moon graph keys on and
      # it makes moon's node toolchain the arbiter of an npm version nothing else needs.
      #
      # WHY NOT `npm install -g npm@<version>` (SMA-602 fix round 4, F9 + F10). That earlier
      # shape put a REGISTRY ROUND-TRIP inside the irreversible job, and it ran UNCONDITIONALLY
      # while every substantive step below is gated on `kernel_release == 'true'` — so on a
      # proto-only release, which publishes no npm package at all, an npmjs.org hiccup or a
      # yanked version still reds this job. It also decoupled the npm version from the node pin
      # that justifies it.
      #
      # The Node version `.prototools` pins already ships npm INSIDE its own install, at
      # `<node prefix>/bin/npm`; proto shims `node` but not `npm`, which is the only reason the
      # binary is not already on PATH. `moon setup` above is what puts that install on disk.
      # Prepending that directory is network-free, and the npm version is whatever the pinned
      # node carries — a `.prototools` node bump moves both together instead of silently
      # un-fixing this.
      #
      # `proto bin node` is what resolves the directory; DO NOT hardcode the version.
      # `--reporter text` is REQUIRED on any captured proto call: proto answers in NDJSON when
      # it detects an agent environment and still exits 0, so an unflagged capture yields a JSON
      # blob rather than a path (SMA-596). `ci/release-parity/ecosystems/release-plz.sh` is the
      # worked example, including the `-x` assertion that fails at the assignment.
      - name: Put the pinned Node's npm on PATH
        run: |
          set -euo pipefail
          node_bin="$(proto --reporter text bin node)"
          if [ ! -f "$node_bin" ] || [ ! -x "$node_bin" ]; then
            echo "::error::proto did not resolve node to an executable file. Got: ${node_bin:-<empty>}"
            echo "::error::If that looks like JSON, proto agent-mode NDJSON leaked past --reporter text (SMA-596)."
            exit 1
          fi
          node_dir="$(dirname "$node_bin")"
          if [ ! -x "$node_dir/npm" ]; then
            echo "::error::the pinned Node install at $node_dir ships no executable npm."
            exit 1
          fi
          echo "pinned node: $node_bin"
          echo "$node_dir" >> "$GITHUB_PATH"

      # Separate step ON PURPOSE: a `$GITHUB_PATH` write takes effect only from the NEXT step,
      # so the assertion cannot live in the step that performs the install. It must FAIL LOUDLY
      # and by version — a bare ENEEDAUTH later is the least recoverable failure in this
      # repository. prebuild.yml's `assemble` job carries the identical assertion, and it runs
      # BEFORE `release`: `release` needs [wheels, prebuild, proto-dist, approve-release], so a
      # wrong npm reds while everything is still reversible. This copy is the backstop for the
      # case where only this job's PATH is wrong.
      #
      # The comparison is PURE SHELL on purpose (SMA-602 fix round 4, F11). The earlier form
      # was `printf … | sort -V | head -n1` under `set -euo pipefail`: `head` closes the pipe
      # after one line, so `sort` can die with SIGPIPE, the pipeline status becomes 141, and the
      # step reds with NO `::error::` line at all — indistinguishable, to a reader of the run,
      # from a real floor violation. Nothing here writes to a closed pipe, so a version verdict
      # is the only thing that can fail this step. `ci/actionlint/run.sh` check 13 (SMA-647) now
      # bans a pipe into an early-exit reader in every tracked shell surface, not only here.
      # A version that is empty or not purely dotted
      # digits also fails: this step guards the least recoverable failure in the repository, so
      # "cannot parse" must never read as "above the floor".
      - name: Assert npm is new enough for OIDC trusted publishing
        run: |
          set -euo pipefail
          echo "npm resolves to: $(command -v npm)"
          v="$(npm --version)"
          floor=11.5.1
          echo "npm version: ${v:-<empty>} (floor $floor)"
          below() {
            echo "::error::npm ${v:-<empty>} is below the $floor floor required for OIDC trusted publishing."
            echo "::error::npm 10.x carries no lib/utils/oidc.js, so no token exchange happens at all."
            echo "::error::With no credential configured this job would fail ENEEDAUTH after crates.io published."
            exit 1
          }
          case "$v" in
            ''|*[!0-9.]*|.*|*.|*..*) below ;;
          esac
          IFS=. read -r vmaj vmin vpat _ <<<"$v" || true
          IFS=. read -r fmaj fmin fpat _ <<<"$floor" || true
          vmaj=$((10#${vmaj:-0})); vmin=$((10#${vmin:-0})); vpat=$((10#${vpat:-0}))
          fmaj=$((10#${fmaj:-0})); fmin=$((10#${fmin:-0})); fpat=$((10#${fpat:-0}))
          if [ "$vmaj" -lt "$fmaj" ] \
            || { [ "$vmaj" -eq "$fmaj" ] && [ "$vmin" -lt "$fmin" ]; } \
            || { [ "$vmaj" -eq "$fmaj" ] && [ "$vmin" -eq "$fmin" ] && [ "$vpat" -lt "$fpat" ]; }; then
            below
          fi
          echo "OK: npm $v can exchange an OIDC token"

      - name: Install JS workspace deps
        run: pnpm --dir ts install --frozen-lockfile

      # See publish-pypi's "Read the released version" step for the JSON shape and for why a
      # missing family must gate its steps off rather than fail (Fix round 1, Critical 2):
      # `paigasus-kernel` and `paigasus-proto` are independently triggered release-plz version
      # groups, so a proto-only release legitimately has no kernel entry here. Every @paigasus/*
      # npm package is in the kernel family, so `kernel_release` alone governs this whole job.
      - name: Read the released version
        id: relinfo
        env:
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          set -euo pipefail
          # Fix round 2 (Important): validate the shape before the family filter — see
          # publish-pypi's identical guard for why `.releases[]?` alone would silently report
          # kernel_release=false on a structurally wrong payload instead of failing loudly.
          jq -e 'has("releases") and (.releases | type == "array")' <<<"$RELEASED" >/dev/null \
            || { echo "::error::malformed release output from release-plz: $RELEASED"; exit 1; }
          KERNEL_VERSION="$(jq -r '.releases[]? | select(.package_name == "paigasus-kernel") | .version' <<<"$RELEASED")"
          if [ -n "$KERNEL_VERSION" ]; then
            echo "kernel_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "kernel_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

      # There is deliberately NO `prebuild-*` download here (fix round 3, Minor 4). One existed and
      # wrote the raw addons to `…/artifacts`, which NOTHING in this job reads: `napi artifacts`
      # (the subcommand that moves `artifacts/` into `npm/`) runs in prebuild.yml, not here, and
      # `napi prepublish` reads only the `npm/` dirs. The `npm-dirs` artifact below already carries
      # each platform's `.node`, because prebuild.yml uploads that directory AFTER running
      # `napi artifacts` into it. The assertion step further down is what proves that rather than
      # assuming it — it fails the job if any platform dir arrives without its binary, before
      # anything is published.
      - name: Download the assembled npm dirs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-dirs
          path: rs/crates/bindings/paigasus-node-bindings/npm

      - name: Download the wasm distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wasm-dist
          path: wasm-dist

      # Fix round 3, Important 6. publish-pypi asserts BOTH a version binding (every wheel filename
      # carries $KERNEL_VERSION) and an artifact floor (at least 7 wheels). publish-npm asserted
      # NEITHER, and both gaps end in an irreversible publish:
      #
      #   * No version binding. The packages publish whatever version their downloaded
      #     package.json carries. On a mismatch the `npm view "$PKG@$VERSION"` pre-check below
      #     404s — it asks about the RELEASED version — so the job concludes "not published yet"
      #     and then publishes the WRONG version. npm allows unpublish only within 72 hours.
      #   * No platform-count floor. In @napi-rs/cli 3.7.2 `napi artifacts` writes only the
      #     binaries it finds, and `prepublish` skips a missing one with
      #     `if (!existsSync(dstPath)) { debug.warn(...); continue; }` — a `debug`-namespaced
      #     warning, invisible without DEBUG= set. So a missing platform binary publishes 6 of 7
      #     platform packages and then publishes the main package whose optionalDependencies name
      #     the seventh, which does not exist. Silently.
      #
      # Seven is the `napi.targets` count in the crate's package.json, not a guess. The two
      # non-platform package.json files are checked too: the main package publishes from the
      # checkout and @paigasus/wasm from the downloaded artifact, so each is its own binding.
      - name: Assert the npm artifacts match the released version
        if: steps.relinfo.outputs.kernel_release == 'true'
        env:
          KERNEL_VERSION: ${{ steps.relinfo.outputs.kernel_version }}
        run: |
          set -euo pipefail
          [ -n "$KERNEL_VERSION" ] || { echo "::error::no kernel version from relinfo"; exit 1; }
          NPM_DIR=rs/crates/bindings/paigasus-node-bindings/npm
          count=0
          for d in "$NPM_DIR"/*/; do
            [ -d "$d" ] || continue
            count=$((count + 1))
            plat="$(basename "$d")"
            [ -f "$d/package.json" ] || { echo "::error::npm/$plat has no package.json"; exit 1; }
            v="$(jq -r '.version' "$d/package.json")"
            [ "$v" = "$KERNEL_VERSION" ] \
              || { echo "::error::npm/$plat is at version $v, expected $KERNEL_VERSION"; exit 1; }
            ls "$d"*.node >/dev/null 2>&1 \
              || { echo "::error::npm/$plat ships no .node binary"; exit 1; }
          done
          [ "$count" -eq 7 ] \
            || { echo "::error::found $count platform packages under $NPM_DIR, expected exactly 7"; exit 1; }
          for p in rs/crates/bindings/paigasus-node-bindings/package.json wasm-dist/package.json; do
            v="$(jq -r '.version' "$p")"
            [ "$v" = "$KERNEL_VERSION" ] \
              || { echo "::error::$p is at version $v, expected $KERNEL_VERSION"; exit 1; }
          done
          echo "OK: 7 platform packages (each with its .node) + 2 main packages at $KERNEL_VERSION"

      # npm has no --skip-existing, and napi prepublish publishes several packages. A re-run
      # after a partial success would hit 403 "cannot publish over the previously published
      # versions" on the ones that landed, so the retry could never succeed unaided — the same
      # argument skip-existing answers for PyPI. Give npm those semantics by hand.
      - name: Skip packages already at this version
        id: npmstate
        if: steps.relinfo.outputs.kernel_release == 'true'
        env:
          VERSION: ${{ steps.relinfo.outputs.kernel_version }}
        run: |
          set -euo pipefail
          published () { npm view "$1@$2" version >/dev/null 2>&1; }
          if published "@paigasus/wasm" "$VERSION"; then
            echo "wasm=skip" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=publish" >> "$GITHUB_OUTPUT"
          fi
          if published "@paigasus/node-bindings" "$VERSION"; then
            echo "node=skip" >> "$GITHUB_OUTPUT"
          else
            echo "node=publish" >> "$GITHUB_OUTPUT"
          fi

      # --no-gh-release IS REQUIRED and is NOT in --help (prebuild.yml records this; ghRelease
      # defaults ON). release-plz owns every CRATE tag — ADR-0011 S3, amended. tag-<svc>
      # (SMA-658) separately owns each service's IMAGE tag. ci/actionlint/release_guard.py's V5
      # fails if this flag is ever dropped.
      # `--no-gh-release` immediately after the subcommand, per the task-89 header: the guard
      # splits a `run:` line on shell separators and drops anything after a `#`, and a quoted
      # argument containing `#` placed BEFORE the flag would truncate the segment and produce a
      # false red — putting the flag first makes that unreachable.
      #
      # Auth: npm Trusted Publishing (OIDC), one configuration per package. npm cannot configure
      # it before a package's first-ever publish (npm/cli#8544 is still open), which is why
      # SMA-580 needed a token and SMA-602 could remove it only afterwards.
      #
      # `napi prepublish` shells out to `npm publish` once per platform directory, each with its
      # own cwd. Those inherit OIDC correctly: @napi-rs/cli spawns them with `env: process.env`,
      # so both ACTIONS_ID_TOKEN_REQUEST_* variables reach every child (measured, 3.7.2
      # dist/index.js:3451-3455). The exchange is PER PACKAGE, so all nine @paigasus/* packages
      # need their own trusted publisher.
      #
      # NPM_CONFIG_LOGLEVEL: verbose is load-bearing, not debug residue. npm's oidc.js reports
      # every OIDC failure at verbose or silly and NEVER throws, so without it a misconfigured
      # publisher surfaces as a bare ENEEDAUTH with no cause — in the one job a fresh dispatch
      # cannot repair (see RUNBOOK §7.4).
      #
      # Know what it does NOT give you. napi runs each platform child with stdio: "pipe" and
      # forwards only its STDOUT (dist/index.js:3452-3457), while npm logs to STDERR. So the
      # FAILURE path works — Node folds the captured stderr into error.message and napi rethrows —
      # but the positive "Successfully retrieved and set token" line is readable only for the two
      # DIRECT npm publish steps, never for the seven platform children. Do not treat its absence
      # there as evidence of anything.
      - name: Publish the node addon and its platform packages
        if: steps.npmstate.outputs.node == 'publish'
        working-directory: ts/packages/paigasus-kernel
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          pnpm exec napi prepublish --no-gh-release --npm-dir npm \
            --cwd ../../../rs/crates/bindings/paigasus-node-bindings

      # Fix round 1, Critical 1: `napi prepublish` publishes ONLY the seven per-platform
      # packages — its single `npm publish` call runs with `cwd: pkgDir` inside its target
      # loop (verified in @napi-rs/cli 3.7.2, dist/index.js:3441-3452). It never publishes the
      # crate root. Without this step the platform packages land as orphans referenced by
      # nothing installable, and `npm install @paigasus/node-bindings` 404s forever. Must run
      # AFTER napi prepublish: the main package's optionalDependencies point at the platform
      # packages, which must already exist on the registry.
      - name: Publish @paigasus/node-bindings (the main package)
        if: steps.npmstate.outputs.node == 'publish'
        working-directory: rs/crates/bindings/paigasus-node-bindings
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          npm publish --provenance --access public

      # Assert the TARBALL, not the working tree: `files` membership is what npm actually ships.
      # A wasm-less package installs cleanly and fails at import.
      - name: Assert the wasm tarball carries its binary
        if: steps.npmstate.outputs.wasm == 'publish'
        working-directory: wasm-dist
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          python3 - <<'PY'
          import json, sys
          files = {f["path"] for f in json.load(open("/tmp/pack.json"))[0]["files"]}
          if "paigasus_wasm_bg.wasm" not in files:
              print("::error::the wasm tarball ships no binary:", sorted(files))
              sys.exit(1)
          print("OK: tarball carries paigasus_wasm_bg.wasm")
          PY

      - name: Publish @paigasus/wasm
        if: steps.npmstate.outputs.wasm == 'publish'
        working-directory: wasm-dist
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: |
          set -euo pipefail
          npm publish --provenance --access public

  # SMA-658. THE IMAGE CHAINS. Each service has its own four jobs and its own approval, so a
  # kernel release and an image release never block each other, and approving one never authorises
  # the other. release_guard.py V8 asserts the per-chain boundary and V14 the capabilities.
  images-build-iam:
    name: build the iam image (${{ matrix.arch }})
    needs: [plan]
    # FAIL-SAFE POLARITY, exactly like the kernel gate above: anything but the literal 'true'
    # runs. An already released version is a no-op in publish-images-iam, not a red.
    if: needs.plan.outputs.skip_iam != 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    # NO job outputs. A matrix job writes ONE set of outputs, so both legs would write the same
    # name and the last leg would win -- the amd64 digest could arrive under `digest_arm64`.
    # `publish-images-<svc>` reads each per-platform digest from its own archive instead, which is
    # the only source that cannot be crossed (spec Section 4.2's "job output" wording is corrected
    # here; see the self-review record).
    env:
      SERVICE: iam
      ARCH: ${{ matrix.arch }}
      PROTO_REPORTER: text
    # SMA-658 B2. This anchor is defined HERE, on the first job that needs it, and aliased
    # (*image-build-steps) from images-build-gateway. MEASURED with actionlint 1.7.12: a top-level
    # x-image-chain: key fails schema validation; an anchor on an ordinary job key does not.
    steps: &image-build-steps
      - name: Reclaim runner disk (drop unused preinstalled toolchains)
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Set up proto (pinned via .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install crane, syft and uv
        run: |
          proto install crane
          proto install syft
          proto install uv

      - name: Build the image as an OCI archive
        run: ci/images/run.sh build-oci "${SERVICE}" out

      - name: Load the archive and check its identity
        id: load
        run: |
          set -euo pipefail
          archive="out/paigasus-${SERVICE}-${ARCH}.oci.tar"
          ci/images/run.sh load-oci "$archive" "paigasus-${SERVICE}:dev"
          digests="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py oci-digests "$archive")"
          manifest="$(printf '%s\n' "$digests" | sed -n 's/^manifest=//p')"
          # I2 (SMA-658 fix round 1): write the digest into the uploaded artifact, BEFORE
          # upload, so the publish job can compare it against a digest it computes itself from
          # the DOWNLOADED archive. Without this file, both sides of that comparison would read
          # the same archive, and a corrupted or swapped artifact hop would be undetectable.
          printf '%s\n' "$manifest" > "out/digest-${ARCH}.txt"

      - name: Smoke this service
        run: ci/images/run.sh smoke "${SERVICE}"

      - name: SBOM for this platform
        run: syft "oci-archive:out/paigasus-${SERVICE}-${ARCH}.oci.tar" -o "spdx-json=out/sbom-paigasus-${SERVICE}-${ARCH}.spdx.json"

      - name: Report the SBOM contents (spec AC 7)
        run: |
          set -euo pipefail
          summary="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py sbom-summary "out/sbom-paigasus-${SERVICE}-${ARCH}.spdx.json")"
          echo "M8 image=paigasus-${SERVICE} arch=${ARCH} ${summary}"
          cargo_count="$(printf '%s\n' "$summary" | sed -n 's/^cargo=//p')"
          if [ "${cargo_count:-0}" -lt 1 ]; then
            echo "::error::the SBOM lists no Rust crates; the binary was not built with cargo auditable (spec AC 7)." >&2
            exit 1
          fi

      - name: Upload the archive and its SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: image-${{ env.SERVICE }}-${{ matrix.arch }}
          path: |
            out/paigasus-${{ env.SERVICE }}-${{ matrix.arch }}.oci.tar
            out/sbom-paigasus-${{ env.SERVICE }}-${{ matrix.arch }}.spdx.json
            out/digest-${{ matrix.arch }}.txt
          if-no-files-found: error
          retention-days: 7

  approve-images-iam:
    name: approve the iam image release
    needs: [images-build-iam]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-approval
    steps:
      - run: echo "Approved. Everything below this point is irreversible."

  publish-images-iam:
    name: publish the iam image
    needs: [plan, images-build-iam, approve-images-iam]
    if: needs.plan.outputs.skip_iam != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-images
    concurrency:
      group: release-images-iam
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.index }}
      revision: ${{ steps.publish.outputs.revision }}
    env:
      SERVICE: iam
      VERSION: ${{ needs.plan.outputs.version_iam }}
      GHCR_IMAGE: ghcr.io/smk1085/paigasus-iam
      HUB_IMAGE: docker.io/smaschek/paigasus-iam
      PROTO_REPORTER: text
    steps: &image-publish-steps
      - name: Fail on an empty Docker Hub token
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$DOCKERHUB_TOKEN" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty or unset; the release-images environment secret did not reach this job." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Set up proto (pinned via .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install crane, cosign and uv
        run: |
          proto install crane
          proto install cosign
          proto install uv

      - name: Download both archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: image-${{ env.SERVICE }}-*
          merge-multiple: true
          path: in

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check the artifact hop and read the decision
        id: decide
        run: |
          set -euo pipefail
          # S3 (SMA-658): only a registry's own "no such tag" answer may read as "the digest is
          # absent". Any other crane failure -- a timeout, an auth error, a transient 5xx -- must
          # fail the job, because reading it as absent would push a second digest under a
          # published version (D10).
          digest_or_none() {
            local image="$1" rc=0 out
            out="$(crane digest "$image" 2>&1)" || rc=$?
            if [ "$rc" -eq 0 ]; then
              printf '%s\n' "$out"
              return 0
            fi
            case "$out" in
              *MANIFEST_UNKNOWN*|*NAME_UNKNOWN*|*"unexpected status code 404"*)
                echo none
                ;;
              *)
                echo "::error::crane digest failed for ${image}: ${out}" >&2
                exit 1
                ;;
            esac
          }
          for arch in amd64 arm64; do
            archive="in/paigasus-${SERVICE}-${arch}.oci.tar"
            digests="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py oci-digests "$archive")"
            manifest_digest="$(printf '%s\n' "$digests" | sed -n 's/^manifest=//p')"
            # I2 (SMA-658 fix round 1): the build job wrote this file from the archive it just
            # built, before upload. Comparing it against the digest computed here, from the
            # DOWNLOADED archive, is what proves the artifact hop did not corrupt or swap
            # anything -- without an independent source, both sides of the check would read the
            # same bytes.
            built_digest="$(cat "in/digest-${arch}.txt")"
            if [ "$manifest_digest" != "$built_digest" ]; then
              echo "::error::the ${arch} archive's digest changed between build and download: built ${built_digest}, downloaded ${manifest_digest}." >&2
              exit 1
            fi
            echo "digest_${arch}=${manifest_digest}" >> "$GITHUB_OUTPUT"
          done
          # C1 (SMA-658 fix round 1): `crane config "oci-archive:…"` cannot read a local
          # archive -- MEASURED against crane 0.22.1: `Error: fetching config: parsing
          # reference … could not parse reference`, and with a missing file it tries to
          # resolve a host called `oci-archive`. `oci-archive:` is a syft/skopeo transport;
          # `crane config` takes a REGISTRY reference only. `release_decision.py labels` reads
          # the same two labels straight out of the archive this job already downloaded.
          labels="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py labels "in/paigasus-${SERVICE}-amd64.oci.tar")"
          label="$(printf '%s\n' "$labels" | sed -n 's/^version=//p')"
          # minor 7 (SMA-658 fix round 1): this is what catches Task 4's empty-version
          # fail-safe -- if `plan` ever emits skip_<svc>=false with an empty version, $VERSION
          # is empty here and no archive's version label can ever equal it, so this step fails
          # loudly instead of publishing under a blank tag.
          if [ "$label" != "$VERSION" ]; then
            echo "::error::the archive carries version ${label}, but plan says ${VERSION}." >&2
            exit 1
          fi
          revision="$(printf '%s\n' "$labels" | sed -n 's/^revision=//p')"
          echo "revision=${revision}" >> "$GITHUB_OUTPUT"
          tag="paigasus-${SERVICE}-v${VERSION}"
          if git ls-remote --tags --exit-code origin "refs/tags/${tag}" > /dev/null 2>&1; then
            git_tag=present
          else
            git_tag=absent
          fi
          ghcr="$(digest_or_none "${GHCR_IMAGE}:${VERSION}")"
          hub="$(digest_or_none "${HUB_IMAGE}:${VERSION}")"
          echo "ghcr=${ghcr} dockerhub=${hub} git_tag=${git_tag}"
          echo "ghcr=${ghcr}" >> "$GITHUB_OUTPUT"
          echo "dockerhub=${hub}" >> "$GITHUB_OUTPUT"
          echo "git_tag=${git_tag}" >> "$GITHUB_OUTPUT"

      # I3 (SMA-658 fix round 1): this used to be one step that pushed, copied to Docker Hub,
      # signed BOTH registries and wrote the floating tags, all before the attest-* steps below
      # created anything. A failed attestation then left `:latest` pointing at an image with no
      # provenance in either registry. Split in three: this step makes GHCR authoritative and
      # signs it; the three attest-* steps run next (push-new only -- see I4); the final step
      # makes Docker Hub authoritative, signs it, and only then moves the floating tags.
      - name: Push to GHCR and sign
        id: publish
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DIGEST_AMD64: ${{ steps.decide.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ steps.decide.outputs.digest_arm64 }}
          GHCR_EXISTING: ${{ steps.decide.outputs.ghcr }}
          HUB_EXISTING: ${{ steps.decide.outputs.dockerhub }}
          GIT_TAG_STATE: ${{ steps.decide.outputs.git_tag }}
          REVISION: ${{ steps.decide.outputs.revision }}
        run: |
          set -euo pipefail
          # SMA-658 Task 8 fix round 1. Shared by the already-released branch and the adopt
          # branch below: two copies of this same extraction, differing only in their
          # argument, is what let the already-released branch drift wrong in the first place
          # (Task 8's own fix). Spec section 7.1 still holds -- the registry commands stay
          # literal in this step; this only removes the duplication inside it.
          revision_of() {
            crane config "$1" | uv run --no-project --python '>=3.12' python3 -c \
              'import json,sys; c=json.load(sys.stdin); print(c["config"]["Labels"]["org.opencontainers.image.revision"])'
          }
          # D10: the FIRST digest published under :<version> is final. A later run adopts it and
          # discards its own build, so a rebuild -- which never reproduces a digest, because the
          # chisel cut resolves the live archive -- can never replace a published image.
          # C5 (SMA-658): --new-digest feeds only the push-new branch below, so it must be a real
          # digest, not a placeholder -- pass the amd64 archive's own manifest digest.
          decision="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py adopt \
            --new-digest "$DIGEST_AMD64" \
            --ghcr "$GHCR_EXISTING" --dockerhub "$HUB_EXISTING" --git-tag "$GIT_TAG_STATE")"
          action="$(printf '%s\n' "$decision" | sed -n 's/^action=//p')"
          if [ "$action" = "already-released" ]; then
            echo "already released: the tag paigasus-${SERVICE}-v${VERSION} exists. Nothing to do."
            echo "index=" >> "$GITHUB_OUTPUT"
            # SMA-658 Task 8 fix, same family as I5 (fix round 1) on the adopt path below.
            # REVISION is this RUN's own local build, which a re-run at a LATER commit does not
            # share with the image the existing tag actually names. Read the revision back from
            # whichever registry holds :${VERSION} instead -- both carry it once a release has
            # completed, from the `crane tag "${image}@${index}" "$VERSION"` loop below.
            already_image="$GHCR_IMAGE"
            already_existing="$GHCR_EXISTING"
            if [ "$already_existing" = "none" ]; then
              already_image="$HUB_IMAGE"
              already_existing="$HUB_EXISTING"
            fi
            if [ "$already_existing" = "none" ]; then
              echo "::error::the git tag paigasus-${SERVICE}-v${VERSION} exists, but neither registry holds a :${VERSION} digest to read the revision from." >&2
              exit 1
            fi
            already_revision="$(revision_of "${already_image}@${already_existing}")"
            echo "revision=${already_revision}" >> "$GITHUB_OUTPUT"
            echo "action=already-released" >> "$GITHUB_OUTPUT"
            echo "copy_to=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$action" = "push-new" ]; then
            refs=()
            for arch in amd64 arm64; do
              layout="$(mktemp -d)"
              tar -xf "in/paigasus-${SERVICE}-${arch}.oci.tar" -C "$layout"
              crane push "$layout" "${GHCR_IMAGE}:${GITHUB_SHA}-${arch}"
              got="$(crane digest "${GHCR_IMAGE}:${GITHUB_SHA}-${arch}")"
              # S5 (SMA-658): images-rehearsal.yml carries this exact check (run 35498922565). A
              # changed per-platform digest would later name an attest-sbom subject the registry
              # does not hold.
              case "$arch" in
                amd64) want="$DIGEST_AMD64" ;;
                arm64) want="$DIGEST_ARM64" ;;
              esac
              if [ "$got" != "$want" ]; then
                echo "::error::crane push changed the ${arch} digest: ${want} -> ${got}" >&2
                exit 1
              fi
              refs+=("${GHCR_IMAGE}@${got}")
            done
            docker buildx imagetools create --tag "${GHCR_IMAGE}:${GITHUB_SHA}" "${refs[@]}"
            index="$(crane digest "${GHCR_IMAGE}:${GITHUB_SHA}")"
            # push-new always needs the Hub copy too: neither registry had the digest before
            # this run pushed it to GHCR.
            copy_to=dockerhub
          else
            index="$(printf '%s\n' "$decision" | sed -n 's/^digest=//p')"
            copy_to="$(printf '%s\n' "$decision" | sed -n 's/^copy_to=//p')"
            echo "adopting the published digest ${index} (copy_to=${copy_to})"
            # S4 (SMA-658): `adopt` names which registry is MISSING the digest. Copying from the
            # wrong registry fails outright, because that registry may not hold it at all.
            if [ "$copy_to" = "ghcr" ]; then
              # minor 10 (SMA-658 fix round 1): the trap fires on any exit, so a failure between
              # login and the copy below cannot leave the token on disk.
              echo "$DOCKERHUB_TOKEN" | docker login docker.io --username smaschek --password-stdin
              trap 'docker logout docker.io || true' EXIT
              docker buildx imagetools create --tag "${GHCR_IMAGE}:${GITHUB_SHA}" "${HUB_IMAGE}@${index}"
              ghcr_index="$(crane digest "${GHCR_IMAGE}:${GITHUB_SHA}")"
              if [ "$ghcr_index" != "$index" ]; then
                echo "::error::the GHCR copy changed the digest: ${index} -> ${ghcr_index}" >&2
                exit 1
              fi
            fi
          fi
          cosign sign --yes "${GHCR_IMAGE}@${index}"
          echo "index=${index}" >> "$GITHUB_OUTPUT"
          echo "action=${action}" >> "$GITHUB_OUTPUT"
          echo "copy_to=${copy_to}" >> "$GITHUB_OUTPUT"
          if [ "$action" = "push-new" ]; then
            echo "revision=${REVISION}" >> "$GITHUB_OUTPUT"
          else
            # I5 (SMA-658 fix round 1): spec Section 3.5 -- the tag must name the PUBLISHED
            # image's own revision, not this run's local build (which may not even be the same
            # commit). GHCR now holds the adopted digest -- either it always did, or the branch
            # above just copied it there -- so read the label back with a REGISTRY reference:
            # crane accepts that (C1 above is about a LOCAL archive only).
            adopted_revision="$(revision_of "${GHCR_IMAGE}@${index}")"
            echo "revision=${adopted_revision}" >> "$GITHUB_OUTPUT"
          fi

      # I4 (SMA-658 fix round 1): on the adopt path these three subjects come from THIS run's
      # local, discarded rebuild, not from the published image -- the registry holds no such
      # subject for them, and the original push-new run already attested the real one.
      - name: Attest build provenance (index)
        if: steps.publish.outputs.index != '' && steps.publish.outputs.action == 'push-new'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.publish.outputs.index }}
          push-to-registry: true

      - name: Attest the amd64 SBOM (per-platform subject)
        if: steps.publish.outputs.index != '' && steps.publish.outputs.action == 'push-new'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.decide.outputs.digest_amd64 }}
          sbom-path: in/sbom-paigasus-${{ env.SERVICE }}-amd64.spdx.json
          push-to-registry: true

      - name: Attest the arm64 SBOM (per-platform subject)
        if: steps.publish.outputs.index != '' && steps.publish.outputs.action == 'push-new'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e  # v4.1.0
        with:
          subject-name: ${{ env.GHCR_IMAGE }}
          subject-digest: ${{ steps.decide.outputs.digest_arm64 }}
          sbom-path: in/sbom-paigasus-${{ env.SERVICE }}-arm64.spdx.json
          push-to-registry: true

      - name: Copy to Docker Hub, sign and write the release tags
        if: steps.publish.outputs.index != ''
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          INDEX: ${{ steps.publish.outputs.index }}
          COPY_TO: ${{ steps.publish.outputs.copy_to }}
        run: |
          set -euo pipefail
          index="$INDEX"
          echo "$DOCKERHUB_TOKEN" | docker login docker.io --username smaschek --password-stdin
          # S15 / minor 10 (SMA-658 fix round 1): a trap set right after login, not a final
          # unconditional `docker logout` line -- it fires on any exit, so a failure anywhere
          # below (a changed digest, a failed cosign sign) cannot leave the token on disk. Spec
          # Section 4.3 step 6 says logout happens "at once" after the Hub cosign sign; it is
          # a trap instead, because the crane tag loop below also writes to Docker Hub and
          # needs the same credential.
          trap 'docker logout docker.io || true' EXIT
          if [ "$COPY_TO" = "dockerhub" ]; then
            docker buildx imagetools create --tag "${HUB_IMAGE}:${GITHUB_SHA}" "${GHCR_IMAGE}@${index}"
            hub_index="$(crane digest "${HUB_IMAGE}:${GITHUB_SHA}")"
            if [ "$hub_index" != "$index" ]; then
              echo "::error::the Docker Hub copy changed the digest: ${index} -> ${hub_index}" >&2
              exit 1
            fi
          fi
          cosign sign --yes "${HUB_IMAGE}@${index}"
          git tag -l > /tmp/tags.txt
          floating="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py floating \
            --service "$SERVICE" --version "$VERSION" --tags-file /tmp/tags.txt)"
          move="$(printf '%s\n' "$floating" | sed -n 's/^move=//p')"
          minor="$(printf '%s\n' "$floating" | sed -n 's/^minor_tag=//p')"
          # minor 6 (SMA-658 fix round 1): consumed, not left dead -- :<major> moves too, once
          # the service is out of 0.x (floating() leaves major_tag empty until then).
          major="$(printf '%s\n' "$floating" | sed -n 's/^major_tag=//p')"
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            crane tag "${image}@${index}" "$VERSION"
            if [ "$move" = "true" ]; then
              crane tag "${image}@${index}" "$minor"
              if [ -n "$major" ]; then
                crane tag "${image}@${index}" "$major"
              fi
              crane tag "${image}@${index}" latest
            fi
          done

      # SMA-658 B6. The plan's original single "Push, copy, tag, sign and verify" step ran
      # `gh attestation verify` BEFORE the three attest-* steps above created anything to verify
      # -- on a first release that check always failed. Verification is its own, later step.
      - name: Verify the signature and attestations
        if: steps.publish.outputs.index != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INDEX: ${{ steps.publish.outputs.index }}
          ACTION: ${{ steps.publish.outputs.action }}
          DIGEST_AMD64: ${{ steps.decide.outputs.digest_amd64 }}
          DIGEST_ARM64: ${{ steps.decide.outputs.digest_arm64 }}
        run: |
          set -euo pipefail
          index="$INDEX"
          for image in "$GHCR_IMAGE" "$HUB_IMAGE"; do
            cosign verify \
              --certificate-identity "https://github.com/SMK1085/paigasus-core/.github/workflows/release.yml@refs/heads/main" \
              --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
              "${image}@${index}"
            gh attestation verify "oci://${image}@${index}" \
              --repo SMK1085/paigasus-core \
              --signer-workflow SMK1085/paigasus-core/.github/workflows/release.yml \
              --source-ref refs/heads/main
          done
          # minor 9 (SMA-658 fix round 1): the two per-platform SBOM attestations created above
          # were never verified -- mirror images-rehearsal.yml's own check. push-new only: on
          # adopt, DIGEST_AMD64/DIGEST_ARM64 come from THIS run's local, discarded rebuild (I4),
          # not from the published image, so the registry holds no such subject for them.
          if [ "$ACTION" = "push-new" ]; then
            for d in "$DIGEST_AMD64" "$DIGEST_ARM64"; do
              gh attestation verify "oci://${GHCR_IMAGE}@${d}" \
                --repo SMK1085/paigasus-core \
                --signer-workflow SMK1085/paigasus-core/.github/workflows/release.yml \
                --predicate-type https://spdx.dev/Document/v2.3 \
                --source-ref refs/heads/main
            done
          fi
          echo "PUBLISHED ${SERVICE} ${VERSION}: ${index}"

  tag-iam:
    name: tag the iam release
    needs: [plan, publish-images-iam]
    if: needs.plan.outputs.skip_iam != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publish
    # minor 11 (SMA-658 fix round 1): without this, two concurrent runs could race the same
    # `gh api POST git/refs` for the same tag.
    concurrency:
      group: release-tag-iam
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SERVICE: iam
      VERSION: ${{ needs.plan.outputs.version_iam }}
      REVISION: ${{ needs.publish-images-iam.outputs.revision }}
    steps: &image-tag-steps
      - name: Mint the App installation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.PAIGASUS_BOT_APP_ID }}
          private-key: ${{ secrets.PAIGASUS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Make the release tag
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          tag="paigasus-${SERVICE}-v${VERSION}"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq .object.sha 2> /dev/null || echo none)"
          if [ "$existing" = "$REVISION" ]; then
            echo "the tag ${tag} already points at ${REVISION}. Nothing to do."
            exit 0
          fi
          if [ "$existing" != "none" ]; then
            echo "::error::the tag ${tag} points at ${existing}, not at the image's revision ${REVISION}." >&2
            exit 1
          fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${tag}" -f "sha=${REVISION}"
          echo "TAGGED ${tag} at ${REVISION}"

  # SMA-658. The gateway chain. Same shape as the iam chain above; the step lists are aliased
  # from the anchors defined there, so no step text differs between the two chains.
  images-build-gateway:
    name: build the gateway image (${{ matrix.arch }})
    needs: [plan]
    # FAIL-SAFE POLARITY, exactly like the kernel gate above: anything but the literal 'true'
    # runs. An already released version is a no-op in publish-images-gateway, not a red.
    if: needs.plan.outputs.skip_gateway != 'true'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch:
          - amd64
          - arm64
    # NO job outputs. A matrix job writes ONE set of outputs, so both legs would write the same
    # name and the last leg would win -- the amd64 digest could arrive under `digest_arm64`.
    # `publish-images-<svc>` reads each per-platform digest from its own archive instead, which is
    # the only source that cannot be crossed (spec Section 4.2's "job output" wording is corrected
    # here; see the self-review record).
    env:
      SERVICE: gateway
      ARCH: ${{ matrix.arch }}
      PROTO_REPORTER: text
    steps: *image-build-steps

  approve-images-gateway:
    name: approve the gateway image release
    needs: [images-build-gateway]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-approval
    steps:
      - run: echo "Approved. Everything below this point is irreversible."

  publish-images-gateway:
    name: publish the gateway image
    needs: [plan, images-build-gateway, approve-images-gateway]
    if: needs.plan.outputs.skip_gateway != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release-images
    concurrency:
      group: release-images-gateway
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.publish.outputs.index }}
      revision: ${{ steps.publish.outputs.revision }}
    env:
      SERVICE: gateway
      VERSION: ${{ needs.plan.outputs.version_gateway }}
      GHCR_IMAGE: ghcr.io/smk1085/paigasus-gateway
      HUB_IMAGE: docker.io/smaschek/paigasus-gateway
      PROTO_REPORTER: text
    steps: *image-publish-steps

  tag-gateway:
    name: tag the gateway release
    needs: [plan, publish-images-gateway]
    if: needs.plan.outputs.skip_gateway != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release-publish
    # minor 11 (SMA-658 fix round 1): without this, two concurrent runs could race the same
    # `gh api POST git/refs` for the same tag.
    concurrency:
      group: release-tag-gateway
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SERVICE: gateway
      VERSION: ${{ needs.plan.outputs.version_gateway }}
      REVISION: ${{ needs.publish-images-gateway.outputs.revision }}
    steps: *image-tag-steps
