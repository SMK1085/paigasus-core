# SPDX-License-Identifier: Apache-2.0
name: release

# Only the RELEASE-PR half is live (SMA-576). The release job — tags + registry publishes —
# lands with SMA-580 behind `vars.PAIGASUS_RELEASE_ENABLED`. Nothing here publishes.
on:
  push:
    branches:
      - main

# Least privilege for the auto GITHUB_TOKEN, matching every other workflow here: it is never
# used for the push/PR below (that goes through the App installation token — see "Mint").
permissions:
  contents: read

# JOB ORDER IS LOAD-BEARING, and it is the reverse of the obvious one (SMA-578 review B3).
# Everything REVERSIBLE runs before the first IRREVERSIBLE step:
#
#   {wheels, prebuild, proto-dist} -> release -> {publish-pypi, publish-npm}
#
# The draft this replaced ran `release` FIRST, so release-plz published to crates.io and cut six
# tags before a single wheel was built. A zig regression or a runner-image change in the 12-leg
# matrix then left crates.io permanently published, tags permanently cut, and paigasus-kernel
# missing from PyPI while pinning paigasus-py-bindings==X.Y.Z. Nothing forces that order: the
# release commit on main already carries the bumped versions, so the artifacts can be built first.
#
# COROLLARY, equally load-bearing: NO JOB DOWNSTREAM OF `release` MAY BUILD ANYTHING. publish-pypi
# and publish-npm only download, assert and upload. A wasm-pack or uv build after the crates.io
# upload reintroduces exactly the half-published state this order exists to prevent.
#
# NO `plan` JOB EXISTS (SMA-579 Task 6+7 decision). The original design had a `plan` job run
# `release-plz release --dry-run` first, so a push with nothing to release could skip the 12-leg
# matrix. Measured against the real repository: the dry-run FAILS every time, with `no matching
# package named paigasus-proto-derive` — a dry run never publishes the derive crate to crates.io,
# so the dependent `paigasus-proto` dry-run can never resolve it. That failure is permanent until
# a LIVE release publishes the derive crate first. A `plan` job built on that dry-run would red
# the whole graph on every push to main. So `wheels`, `prebuild` and `proto-dist` each carry
# `if: vars.PAIGASUS_RELEASE_ENABLED == 'true'` directly, and `approve-release`/`release` are
# gated only TRANSITIVELY through their `needs:` chain. The accepted cost: once the flag is on,
# every push to main builds the full wheel and napi matrices even when nothing is releasable. Do
# not "fix" this by reintroducing a dry-run-based `plan` job without first re-verifying that
# release-plz's dry-run can resolve the derive-crate dependency.

jobs:
  release-pr:
    name: release PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # release-plz force-updates its PR branch on every run, so two rapid merges to main would
    # race. Do NOT cancel in progress: a cancelled run can leave the branch half-written.
    concurrency:
      group: release-pr
      cancel-in-progress: false
    steps:
      # The App credentials may not exist yet (a human must create them — see the workflow's
      # own doc). A job-level `if:` cannot see whether a secret is set: per GitHub's own
      # context-availability table, `jobs.<job_id>.if` only sees github/needs/vars/inputs,
      # never secrets. A step's `if:`/`env:` CAN see secrets, so every step below is
      # individually guarded on this step's output instead. Left unconfigured, this makes the
      # whole job skip cleanly (green) on every push to main rather than failing forever.
      #
      # Keyed on the App identifier rather than the private key purely because it is not a
      # credential. Both are required by the mint step below, so a HALF-configured App fails
      # there instead of skipping — which is correct: that is a real misconfiguration, not a
      # "not set up yet".
      - name: Check for the App credentials
        id: preflight
        env:
          APP_ID_SET: ${{ secrets.PAIGASUS_BOT_APP_ID != '' }}
        run: |
          echo "configured=$APP_ID_SET" >> "$GITHUB_OUTPUT"
          if [ "$APP_ID_SET" != "true" ]; then
            echo "::notice::PAIGASUS_BOT_APP_ID is not set — skipping the release-PR job until a human creates the App secrets (see release.yml)."
          fi

      # An App INSTALLATION token, minted fresh per run and valid for one hour — which is
      # exactly why it cannot be a stored repository secret, and why the earlier
      # RELEASE_PLZ_TOKEN shape could only ever have held a long-lived PAT. This job's
      # timeout-minutes: 20 keeps the whole run well inside that hour, so one mint here is
      # enough for both consumers below.
      #
      # Scoped to THIS repository (the action defaults `repositories` to the current repo) and
      # to exactly two permissions, requested EXPLICITLY below rather than inherited. Without
      # the `permission-*` inputs a minted token carries every permission the App installation
      # holds, so granting the App an unrelated scope later would silently widen this token
      # (zizmor: github-app, "app token inherits blanket installation permissions").
      #
      #   contents:write      — the stamping step's push
      #   pull-requests:write — release-plz opening/updating the release PR
      #
      # Both must genuinely be granted to the installation: the action ERRORS when asked for a
      # permission the App does not hold. That is the right direction — an under-granted App
      # reds here rather than half-working further down.
      #
      # The action registers the token as a log mask and revokes it in its post-step, so it
      # does not outlive the run.
      - name: Mint the App installation token
        id: app_token
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          # `client-id`, not the deprecated `app-id` (v3.2.0 warns on the latter).
          # PAIGASUS_BOT_APP_ID holds the App's CLIENT ID, not the numeric App ID — the secret
          # predates this input's rename and is deliberately left named as it is, since
          # rotating a secret name costs more than this comment. Do not "correct" it by
          # swapping in the numeric App ID: the value here is the Client ID, and the secret
          # NAME is the only stale thing about it.
          client-id: ${{ secrets.PAIGASUS_BOT_APP_ID }}
          private-key: ${{ secrets.PAIGASUS_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        if: steps.preflight.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # persist-credentials: false, matching every other checkout in this repo
          # (artipacked hardening). An earlier revision persisted the App token here so the
          # stamping step could push — but `actions/checkout` writes that credential into
          # the local git config for the WHOLE job, which handed a write-capable token to
          # four steps that have no business with it (setup-toolchain, proto install,
          # moon setup, pnpm install). A compromised action or transitive dependency in any
          # of them could have used it before release work even began.
          #
          # The token now reaches only the two steps that genuinely need it, via their own
          # `env:` — release-plz (GIT_TOKEN) and the stamping step (which authenticates its
          # fetch/push through an explicit remote URL rather than ambient git config).
          persist-credentials: false

      - name: Set up proto + Moon
        if: steps.preflight.outputs.configured == 'true'
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          # Don't cache the proto/Moon toolchain dir: a restored ~/.proto carries stale
          # setup-state that makes `moon setup` skip installing node/pnpm (their shims
          # then don't exist). Reinstall fresh each run (matches ci.yml/prebuild.yml).
          cache: false

      # release-plz is proto-pinned like every other CLI this repo depends on
      # (.prototools, .proto/plugins/release-plz.toml) — install the pinned binary
      # directly rather than through a third-party GitHub Action, which would resolve
      # its own, unpinned release-plz build. Narrow install (not a bare `proto install`):
      # this job needs none of actionlint/buf/deny/machete/nextest/promtool/wasm-pack.
      - name: Install pinned release-plz CLI
        if: steps.preflight.outputs.configured == 'true'
        run: proto install release-plz

      - name: Install Moon-managed toolchains (node, pnpm, rust, python, uv)
        if: steps.preflight.outputs.configured == 'true'
        run: moon setup

      - name: Install JS workspace deps
        if: steps.preflight.outputs.configured == 'true'
        run: pnpm --dir ts install --frozen-lockfile

      # release-plz first, ALWAYS, then --write (next step). release-plz owns every Cargo
      # version and the [workspace.dependencies] requirements; --write then brings the six
      # sites it cannot reach (pyproject/package.json/the dependency pin) plus the three
      # regenerated sites into line.
      #
      # Run from rs/: release-plz's config/manifest discovery (./release-plz.toml,
      # ./Cargo.toml) is CWD-relative with no upward search, so this is what makes it find
      # rs/release-plz.toml and rs/Cargo.toml without --config/--manifest-path flags.
      #
      # `--output json` always prints one line, `{"prs": [...]}`, with 0 or 1 elements —
      # verified against the pinned 0.3.158 source
      # (release_plz_core::command::release_pr::release_pr returns Option<ReleasePr>;
      # main.rs wraps None as `[]`, Some(pr) as `[pr]`). Each element carries head_branch/
      # base_branch/html_url/number/releases (the ReleasePr struct) — the CLI's own --help
      # only promises "prints the branch, URL and number", so this was confirmed by reading
      # the source at the exact pinned tag, not assumed from the docs.
      - name: Open or update the release PR
        id: release_pr
        if: steps.preflight.outputs.configured == 'true'
        working-directory: rs
        env:
          GIT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          OUT="$(release-plz release-pr --output json)"
          echo "$OUT"
          echo "json=$OUT" >> "$GITHUB_OUTPUT"

      # release-plz does ALL of its work — version bumps, changelog, branch creation, push —
      # inside a private copy under a tempdir
      # (release_plz_core::command::release_pr::copy_to_temp_dir, confirmed by reading the
      # pinned 0.3.158 source and independently measured: a throwaway clone's HEAD and
      # working tree were untouched after a real `release-pr` run). This checkout's `main`
      # is therefore NEVER the branch to act on — the branch comes only from the JSON above,
      # never from `git rev-parse --abbrev-ref HEAD` (which would still read "main" here and
      # push straight to it).
      - name: Stamp the non-Cargo manifests onto the release PR branch
        if: steps.preflight.outputs.configured == 'true'
        env:
          PR_JSON: ${{ steps.release_pr.outputs.json }}
          # Scoped to this step only. The checkout sets persist-credentials: false, so there
          # are no ambient git credentials — the fetch and push below authenticate through an
          # explicit remote URL built from this value. GitHub masks the secret in logs, and
          # the URL is never written to git config (no `remote set-url`), so it does not
          # outlive the commands themselves.
          GH_TOKEN_FOR_PUSH: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          PR_COUNT="$(printf '%s' "$PR_JSON" | jq '.prs | length')"
          if [ "$PR_COUNT" -eq 0 ]; then
            echo "release-plz: no release PR needed (every releasable package is already" \
                 "at its proposed version) — nothing to stamp"
            exit 0
          fi
          BRANCH="$(printf '%s' "$PR_JSON" | jq -r '.prs[0].head_branch')"
          AUTH_REMOTE="https://x-access-token:${GH_TOKEN_FOR_PUSH}@github.com/${GITHUB_REPOSITORY}.git"

          git fetch "$AUTH_REMOTE" "$BRANCH"
          git checkout -B "$BRANCH" FETCH_HEAD

          bash ci/version-lockstep/run.sh --write

          if git diff --quiet; then
            echo "version-lockstep: nothing to stamp"
            exit 0
          fi
          git config user.name  "paigasus-release[bot]"
          git config user.email "paigasus-release[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(rs): stamp the non-Cargo manifests to the release version"
          git push "$AUTH_REMOTE" "HEAD:$BRANCH"

  # THE REVERSIBLE STAGE. Everything below `release` only downloads what these produce.
  wheels:
    name: build wheels
    if: vars.PAIGASUS_RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/wheels.yml

  prebuild:
    name: build node addons and wasm
    if: vars.PAIGASUS_RELEASE_ENABLED == 'true'
    uses: ./.github/workflows/prebuild.yml

  proto-dist:
    name: build the Python proto distribution
    if: vars.PAIGASUS_RELEASE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install Moon-managed toolchains
        run: moon setup

      - name: Build the distribution
        working-directory: py
        run: uv build --package paigasus-proto --out-dir ../dist

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: proto-dist-py
          path: |
            dist/paigasus_proto-*.whl
            dist/paigasus_proto-*.tar.gz
          if-no-files-found: error

  # The ONE place a human approval can be inserted, by adding required reviewers to the
  # `release-approval` environment in repo settings. It must NOT go on the publishing jobs:
  # GitHub pauses EACH job entering an environment, so reviewers on release-publish would stop
  # the run again between crates.io and PyPI — leaving crates.io published and PyPI empty if the
  # second approval is rejected or times out (30 days). That is the split state the job order
  # above exists to prevent. SMA-580: add reviewers HERE, never to release-publish.
  approve-release:
    name: approve the release
    needs: [wheels, prebuild, proto-dist]
    runs-on: ubuntu-latest
    environment: release-approval
    steps:
      - run: echo "Approved. Everything below this point is irreversible."

  release:
    name: publish to crates.io and cut tags
    needs: [wheels, prebuild, proto-dist, approve-release]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-publish
    # The irreversible step, serialized. Two merges to main in quick succession would otherwise
    # run two `release-plz release` invocations concurrently, racing the same crates.io publish
    # and the same tag push. NEVER cancel-in-progress here: a cancelled release can leave
    # crates.io half-published with tags partially cut, which is precisely the split state the
    # job ORDER above exists to prevent. A queued second run is safe — release-plz is idempotent
    # and skips packages already published at that version.
    #
    # The build jobs deliberately carry no group: they only produce artifacts, so concurrent
    # runs are harmless, and serializing them would put every push to main behind a full
    # 12-leg matrix.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      id-token: write    # crates.io OIDC exchange
      contents: read     # the App token below does the writing, not GITHUB_TOKEN
    outputs:
      released: ${{ steps.rel.outputs.json }}
    steps:
      - name: Authenticate with crates.io
        id: cratesio
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18  # v1.0.5

      # A SECOND mint: tokens are per-job and live one hour. Every checkout in this repo sets
      # persist-credentials: false, so there are no ambient git credentials and release-plz's
      # tag push needs this explicitly.
      - name: Mint the App installation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3.2.0
        with:
          client-id: ${{ secrets.PAIGASUS_BOT_APP_ID }}
          private-key: ${{ secrets.PAIGASUS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install pinned release-plz CLI
        run: proto install release-plz

      - name: Release
        id: rel
        working-directory: rs
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio.outputs.token }}
          GIT_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          OUT="$(release-plz release --output json)"
          echo "$OUT"
          echo "json=$OUT" >> "$GITHUB_OUTPUT"

  # THE THIRD AND FOURTH IRREVERSIBLE STAGES. There is no `plan` job (see the file-header
  # decision) — the version and per-family flags are read straight out of `release`'s own
  # `released` output rather than from a job that does not exist. Both jobs only download,
  # assert and upload; the corollary above forbids anything that compiles, fetches or
  # generates here.
  publish-pypi:
    name: publish to PyPI
    needs: [wheels, proto-dist, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      id-token: write    # PyPI trusted publishing; the claim binds to THIS file's name
    steps:
      # `release`'s `released` output is release-plz's own `--output json`, shaped
      # `{"releases":[{"package_name":...,"version":...}]}` (measured against release_plz_core
      # 0.36.14 — "releases"/"package_name", NOT "prs"/"package", which is the OTHER command's
      # shape). paigasus-py-bindings is Cargo `publish = false`, so release-plz never reports
      # it — bind against paigasus-kernel instead, which it definitely reports and which
      # version_group holds to the identical number (repo:version-lockstep asserts that).
      - name: Read the released version
        id: relinfo
        env:
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          set -euo pipefail
          KERNEL_VERSION="$(jq -r '.releases[] | select(.package_name == "paigasus-kernel") | .version' <<<"$RELEASED")"
          [ -n "$KERNEL_VERSION" ] || { echo "::error::paigasus-kernel not found in released output: $RELEASED"; exit 1; }
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"
          # This keys on the RUST crate `paigasus-proto` reported by release-plz. What gets
          # uploaded below under this flag is the PYTHON distribution built from
          # py/packages/paigasus-proto — same name, two different artifacts.
          if jq -e '.releases[] | select(.package_name == "paigasus-proto")' <<<"$RELEASED" >/dev/null; then
            echo "proto_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "proto_release=false" >> "$GITHUB_OUTPUT"
          fi

      # THREE downloads, not one. wheels.yml deliberately keeps face-paigasus-kernel OUTSIDE the
      # wheel-* namespace precisely so a single `pattern: wheel-*` + merge-multiple cannot
      # collapse them: paigasus-py-bindings MUST reach PyPI before paigasus-kernel, because the
      # face pins `==` and the reverse order leaves it uninstallable in between.
      - name: Download the bindings wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: wheel-*
          merge-multiple: true
          path: dist-bindings

      - name: Download the bindings sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sdist
          path: dist-bindings

      - name: Download the kernel face
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: face-paigasus-kernel
          path: dist-face

      - name: Download the proto distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: proto-dist-py
          path: dist-proto

      # Binds the artifact to the release. Without this a re-run against a moved main could
      # publish a stale wheel under the wrong version.
      - name: Assert the wheels match the released version
        env:
          KERNEL_VERSION: ${{ steps.relinfo.outputs.kernel_version }}
        run: |
          set -euo pipefail
          [ -n "$KERNEL_VERSION" ] || { echo "::error::no kernel version from relinfo"; exit 1; }
          found=0
          for w in dist-bindings/*.whl; do
            case "$(basename "$w")" in
              paigasus_py_bindings-"$KERNEL_VERSION"-*) found=$((found+1)) ;;
              *) echo "::error::unexpected wheel $(basename "$w") — expected version $KERNEL_VERSION"; exit 1 ;;
            esac
          done
          [ "$found" -ge 7 ] || { echo "::error::found $found wheels, expected at least 7"; exit 1; }
          echo "OK: $found wheels at $KERNEL_VERSION"

      # ORDER IS LOAD-BEARING: bindings, then the face. skip-existing makes a partial failure
      # re-runnable — PyPI returns 400 "file already exists" otherwise, so an un-skipped retry can
      # never succeed unaided. PyPI is delete-but-never-reuse.
      - name: Publish paigasus-py-bindings
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist-bindings
          skip-existing: true

      - name: Publish paigasus-kernel
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist-face
          skip-existing: true

      # Independent cadence: release-plz sees the RUST crate `paigasus-proto`; what uploads here
      # is the PYTHON distribution built from py/packages/paigasus-proto. Same name, two things.
      - name: Publish paigasus-proto
        if: steps.relinfo.outputs.proto_release == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          packages-dir: dist-proto
          skip-existing: true

  publish-npm:
    name: publish to npm
    needs: [prebuild, release]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release-publish
    permissions:
      id-token: write    # npm provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install JS workspace deps
        run: pnpm --dir ts install --frozen-lockfile

      # See publish-pypi's "Read the released version" step for the JSON shape. Only the
      # version is needed here — the family is version-locked, so paigasus-kernel's number
      # binds every @paigasus/* package too.
      - name: Read the released version
        id: relinfo
        env:
          RELEASED: ${{ needs.release.outputs.released }}
        run: |
          set -euo pipefail
          KERNEL_VERSION="$(jq -r '.releases[] | select(.package_name == "paigasus-kernel") | .version' <<<"$RELEASED")"
          [ -n "$KERNEL_VERSION" ] || { echo "::error::paigasus-kernel not found in released output: $RELEASED"; exit 1; }
          echo "kernel_version=$KERNEL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Download the node addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: prebuild-*
          merge-multiple: true
          path: rs/crates/bindings/paigasus-node-bindings/artifacts

      - name: Download the assembled npm dirs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: npm-dirs
          path: rs/crates/bindings/paigasus-node-bindings/npm

      - name: Download the wasm distribution
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: wasm-dist
          path: wasm-dist

      # npm has no --skip-existing, and napi prepublish publishes several packages. A re-run
      # after a partial success would hit 403 "cannot publish over the previously published
      # versions" on the ones that landed, so the retry could never succeed unaided — the same
      # argument skip-existing answers for PyPI. Give npm those semantics by hand.
      - name: Skip packages already at this version
        id: npmstate
        env:
          VERSION: ${{ steps.relinfo.outputs.kernel_version }}
        run: |
          set -euo pipefail
          published () { npm view "$1@$2" version >/dev/null 2>&1; }
          if published "@paigasus/wasm" "$VERSION"; then
            echo "wasm=skip" >> "$GITHUB_OUTPUT"
          else
            echo "wasm=publish" >> "$GITHUB_OUTPUT"
          fi
          if published "@paigasus/node-bindings" "$VERSION"; then
            echo "node=skip" >> "$GITHUB_OUTPUT"
          else
            echo "node=publish" >> "$GITHUB_OUTPUT"
          fi

      # --no-gh-release IS REQUIRED and is NOT in --help (prebuild.yml records this; ghRelease
      # defaults ON). release-plz owns every tag — ADR-0011 S3, "the tool owns every tag",
      # singular. ci/actionlint/release_guard.py's V5 fails if this flag is ever dropped.
      # `--no-gh-release` immediately after the subcommand, per the task-89 header: the guard
      # splits a `run:` line on shell separators and drops anything after a `#`, and a quoted
      # argument containing `#` placed BEFORE the flag would truncate the segment and produce a
      # false red — putting the flag first makes that unreachable.
      #
      # Auth: npm Trusted Publishing (OIDC) cannot be configured before a package's first-ever
      # publish, and all three @paigasus/* packages are unpublished (measured: `npm view` 404s
      # for each) — so NPM_TOKEN stays for now, becoming unnecessary after the first release.
      # Confined to this step's own env (never job- or workflow-level) and written to the HOME
      # npmrc rather than the committed ts/.npmrc so every per-target `npm publish` napi shells
      # out to, regardless of its own cwd under --npm-dir, resolves it.
      - name: Publish the node addon and its platform packages
        if: steps.npmstate.outputs.node == 'publish'
        working-directory: ts/packages/paigasus-kernel
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          pnpm exec napi prepublish --no-gh-release --npm-dir npm \
            --cwd ../../../rs/crates/bindings/paigasus-node-bindings

      # Assert the TARBALL, not the working tree: `files` membership is what npm actually ships.
      # A wasm-less package installs cleanly and fails at import.
      - name: Assert the wasm tarball carries its binary
        if: steps.npmstate.outputs.wasm == 'publish'
        working-directory: wasm-dist
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          python3 - <<'PY'
          import json, sys
          files = {f["path"] for f in json.load(open("/tmp/pack.json"))[0]["files"]}
          if "paigasus_wasm_bg.wasm" not in files:
              print("::error::the wasm tarball ships no binary:", sorted(files))
              sys.exit(1)
          print("OK: tarball carries paigasus_wasm_bg.wasm")
          PY

      - name: Publish @paigasus/wasm
        if: steps.npmstate.outputs.wasm == 'publish'
        working-directory: wasm-dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
          npm publish --provenance --access public
