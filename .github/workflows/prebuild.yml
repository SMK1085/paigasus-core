# SPDX-License-Identifier: Apache-2.0
name: prebuild

on:
  # Consumed by release.yml's reversible stage (SMA-579). This workflow must NEVER declare
  # `secrets:` or `id-token: write` — it keeps a pull_request trigger, and same-repo PRs receive
  # repository secrets. Publishing happens in release.yml, which downloads these artifacts.
  workflow_call:

  workflow_dispatch:

  # POST-merge verification of Rust changes. Deliberately excludes every `ts/` path:
  # dependabot.yml emits a grouped npm PR every Monday that always touches
  # ts/pnpm-lock.yaml, and listing it here would fire the full matrix weekly for a change
  # that cannot affect the addon's Rust source (SMA-520 AC-3).
  push:
    branches:
      - main
    paths:
      - 'rs/**'                              # includes rs/Cargo.lock + rs/rust-toolchain.toml
      - '.github/workflows/prebuild.yml'
      - '.prototools'
      - '.moon/**'                           # `moon setup` needs workspace.yml as well as toolchains.yml

  # PRE-merge verification of the BUILD INPUTS, which all live in ts/. @napi-rs/cli is
  # `catalog:` in the kernel package.json, resolved from ts/pnpm-workspace.yaml and pinned in
  # ts/pnpm-lock.yaml — a napi CLI bump is the change most likely to break a cross-build, so
  # it is verified before it merges rather than after. `rs/**` is deliberately absent: most
  # PRs here touch it, and a macOS job on every one of them would raise the bill. Not a
  # required check (the `Protect main` ruleset requires only `moon ci`), so a skipped run
  # cannot wedge a merge.
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/prebuild.yml'
      - '.prototools'
      - '.moon/**'
      - 'ts/pnpm-lock.yaml'
      - 'ts/pnpm-workspace.yaml'
      - 'ts/packages/paigasus-kernel/package.json'
      - 'ts/.npmrc'                          # pins the registry for `pnpm install` (steps 83 + 116)
      # Two NARROW rs/ inputs, deliberately not the whole `rs/**`. Both are load-bearing for the
      # darwin build and both are rarely touched, so listing them costs almost nothing while
      # `rs/**` on this trigger would put a macOS job on most PRs in the repo:
      - 'rs/.cargo/config.toml'              # the -undefined dynamic_lookup flags the cdylib needs
      - 'rs/crates/bindings/paigasus-node-bindings/package.json'   # napi binaryName + target list

# Build-only verification: read the repo, build addons, run dry-run packaging. No publish, and no
# GitHub release is created (the assemble job omits napi's opt-in --gh-release flag), so no
# contents:write is needed.
# No publish, and no GitHub release (the assemble job omits napi's opt-in --gh-release flag).
# Credentials are NOT added here and never will be: this workflow carries a pull_request trigger.
# release.yml owns every credential and downloads these artifacts (SMA-579 §4).
permissions:
  contents: read

concurrency:
  # `event_name` is in the GROUP so a manual dispatch cannot cancel a running push-to-main
  # job — without it both resolve to refs/heads/main and share a group.
  group: prebuild-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  # Never cancel a push run: this workflow's actions/cache step is the ONLY writer to main's
  # cache scope, and a cancelled job does not run cache's post-step save. PR and dispatch runs
  # carry no such value, so superseded ones are cancelled (mirrors ci.yml).
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  build:
    name: build ${{ matrix.platform }}${{ matrix.extra_platform && format(' + {0}', matrix.extra_platform) || '' }}
    runs-on: ${{ matrix.runner }}
    # The darwin leg does two full --release builds; 30 was sized for one.
    timeout-minutes: ${{ matrix.extra_target && 45 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both darwin targets build in ONE macos-latest (arm64) job. The Intel macOS image was
          # the last x86_64 runner on Actions and retires in August 2027; napi-rs's own generated
          # CI uses macos-latest for both apple triples with no cross flag, because the macOS SDK
          # ships both slices. Merging also drops the duplicated proto/Moon/pnpm setup. (SMA-520)
          - { platform: darwin-arm64,     target: aarch64-apple-darwin,       runner: macos-latest,     zig: false, extra_platform: darwin-x64, extra_target: x86_64-apple-darwin }
          - { platform: win32-x64-msvc,   target: x86_64-pc-windows-msvc,     runner: windows-latest,   zig: false }
          - { platform: linux-x64-gnu,    target: x86_64-unknown-linux-gnu,   runner: ubuntu-latest,    zig: false }
          - { platform: linux-arm64-gnu,  target: aarch64-unknown-linux-gnu,  runner: ubuntu-24.04-arm, zig: false }
          - { platform: linux-x64-musl,   target: x86_64-unknown-linux-musl,  runner: ubuntu-latest,    zig: true }
          - { platform: linux-arm64-musl, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, zig: true }
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Pin node/pnpm/rust via proto (matches .prototools / rust-toolchain.toml). Every leg runs on a
      # real glibc/macOS/Windows host (no job-level container), so GitHub JS actions work everywhere —
      # incl. the musl legs, which cross-compile via zig instead of an Alpine container (that container
      # can't run JS actions on arm64 and ships pnpm 9 vs the repo's pnpm 11 lockfile — SMA-428 CI,
      # decision #6 revised).
      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install Moon-managed toolchains
        run: moon setup

      # Cross-target artifacts differ by triple → triple in the cache key (spec §2 / L2).
      - name: Cache Rust (cargo + target)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rs/target
          # `dual` segment: the darwin leg now populates TWO target triples under one key.
          # Without a new literal the merged job would hit the pre-change arm64 key, and
          # actions/cache skips its post-job save on an exact primary-key hit — so
          # rs/target/x86_64-apple-darwin/ would be restored-never and saved-never, recompiling
          # cold on every run. Precedent: ci.yml's `-line-tables-only-` segment, same reason.
          key: prebuild-rust-${{ runner.os }}-${{ matrix.target }}-dual-${{ hashFiles('rs/rust-toolchain.toml') }}-${{ hashFiles('rs/Cargo.lock') }}
          restore-keys: |
            prebuild-rust-${{ runner.os }}-${{ matrix.target }}-dual-${{ hashFiles('rs/rust-toolchain.toml') }}-

      # Attach the cross target to the pinned 1.95.0 toolchain — run from rs/ so rust-toolchain.toml's
      # override selects 1.95.0, not the runner default (mirrors ci.yml's serial pre-install; spec §2).
      - name: Add Rust target(s) (pinned toolchain)
        working-directory: rs
        # rustup accepts several triples at once; matrix.extra_target expands to nothing on the
        # five single-target legs, leaving the original one-target command.
        run: rustup target add ${{ matrix.target }} ${{ matrix.extra_target }}

      # musl targets cross-compile with cargo-zigbuild (zig supplies the musl libc) on a glibc host,
      # instead of a job-level Alpine container (decision #6 revised — SMA-428 CI). ziglang via pip is
      # the zig that cargo-zigbuild discovers (`python3 -m ziglang`); cargo-zigbuild provides the
      # `cargo zigbuild` subcommand that napi's `-x` flag invokes. Built with the pinned toolchain.
      - name: Set up zig + cargo-zigbuild (musl cross-compile)
        if: ${{ matrix.zig }}
        working-directory: rs
        run: |
          pip3 install --break-system-packages ziglang
          cargo install --locked cargo-zigbuild

      - name: Install JS workspace deps
        run: pnpm --dir ts install --frozen-lockfile

      - name: Build the addon
        working-directory: ts/packages/paigasus-kernel
        run: pnpm exec napi build --platform --release --target ${{ matrix.target }} ${{ matrix.zig && '-x' || '' }} --cwd ../../../rs/crates/bindings/paigasus-node-bindings

      # Exact copy of the step above with only --target changed. No `-x`: darwin never
      # cross-compiles via zig (that is musl-only), and on a macOS host no cross flag is needed
      # for either apple arch. --cwd is load-bearing — it is how cargo discovers
      # rs/.cargo/config.toml and therefore the -undefined dynamic_lookup link flags that the
      # napi cdylib needs on macOS (declared there for BOTH apple triples).
      - name: Build the addon (second darwin target)
        if: ${{ matrix.extra_target }}
        working-directory: ts/packages/paigasus-kernel
        run: pnpm exec napi build --platform --release --target ${{ matrix.extra_target }} --cwd ../../../rs/crates/bindings/paigasus-node-bindings

      # Nothing in this workflow ever EXECUTES a macOS binary (the only runtime check is
      # linux-x64-gnu resolution in `assemble`, on ubuntu), so a cross-built darwin artifact is
      # otherwise unverified. Exact equality, NOT a substring match: `lipo -archs` prints
      # "x86_64 arm64" for a universal binary, so `grep -q x86_64` would pass for a fat file —
      # vacuously green in precisely the case worth catching.
      - name: Verify Mach-O architecture (darwin only)
        if: runner.os == 'macOS'
        working-directory: rs/crates/bindings/paigasus-node-bindings
        run: |
          set -euo pipefail
          arm="$(lipo -archs paigasus-node-bindings.darwin-arm64.node)"
          x64="$(lipo -archs paigasus-node-bindings.darwin-x64.node)"
          echo "darwin-arm64 archs: [$arm]"
          echo "darwin-x64   archs: [$x64]"
          [ "$arm" = "arm64" ]  || { echo "::error::darwin-arm64 is not pure arm64: [$arm]"; exit 1; }
          [ "$x64" = "x86_64" ] || { echo "::error::darwin-x64 is not pure x86_64: [$x64]"; exit 1; }
          # Record the minimum-OS stamp rather than assume it, and FAIL if the x86_64 slice ever
          # rises above 10.12 — cross-building on an arm64 host could otherwise silently inherit
          # the host SDK's floor and drop macOS 10.13-10.15 Intel users. Verified 2026-08-16: the
          # cross-built x64 matches the old Intel runner exactly (10.12), because Rust pins the
          # deployment target per TARGET, not per host.
          #
          # BOTH load commands must be matched: x86_64 emits the legacy LC_VERSION_MIN_MACOSX
          # while arm64 emits LC_BUILD_VERSION. Grepping only the latter prints nothing at all for
          # the x64 binary — the one this job actually migrated.
          echo "== minimum macOS version =="
          otool -l paigasus-node-bindings.darwin-x64.node   | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          otool -l paigasus-node-bindings.darwin-arm64.node | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX'
          x64min="$(otool -l paigasus-node-bindings.darwin-x64.node | awk '/LC_VERSION_MIN_MACOSX/{getline; getline; print $2; exit}')"
          [ "$x64min" = "10.12" ] || { echo "::error::darwin-x64 minimum macOS moved from 10.12 to [$x64min] — set MACOSX_DEPLOYMENT_TARGET"; exit 1; }
          echo "darwin-x64 minimum macOS: [$x64min] (unchanged from the Intel-runner build)"

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prebuild-${{ matrix.platform }}
          path: rs/crates/bindings/paigasus-node-bindings/paigasus-node-bindings.${{ matrix.platform }}.node
          if-no-files-found: error

      # Separate upload (not a glob) so the artifact keeps the prebuild-<platform> name that
      # `assemble`'s `pattern: prebuild-*` + merge-multiple download depends on.
      - name: Upload prebuild artifact (second darwin target)
        if: ${{ matrix.extra_platform }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: prebuild-${{ matrix.extra_platform }}
          path: rs/crates/bindings/paigasus-node-bindings/paigasus-node-bindings.${{ matrix.extra_platform }}.node
          if-no-files-found: error

  assemble:
    name: assemble + verify (dry-run, no publish)
    runs-on: ubuntu-latest   # ubuntu-latest == linux-x64-gnu, one of the 7 targets (spec §2.4)
    needs: build
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up proto + Moon
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      - name: Install Moon-managed toolchains
        run: moon setup

      - name: Install JS workspace deps
        run: pnpm --dir ts install --frozen-lockfile

      - name: Download all prebuilt addons
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: rs/crates/bindings/paigasus-node-bindings/artifacts
          pattern: prebuild-*
          merge-multiple: true

      # Generate the per-platform npm/<platform>/ dirs IN CI (decision #4 — nothing committed),
      # then sort the downloaded .node files into them. `napi artifacts` default input dir is
      # ./artifacts (spike Task 1) — the download step wrote them to $CRATE/artifacts, so do NOT
      # pass --output-dir. --npm-dir is the correct flag (not --dist).
      - name: Generate npm dirs + distribute artifacts
        working-directory: ts/packages/paigasus-kernel
        run: |
          CRATE=../../../rs/crates/bindings/paigasus-node-bindings
          pnpm exec napi create-npm-dirs --cwd "$CRATE"
          pnpm exec napi artifacts --cwd "$CRATE" --npm-dir npm

      - name: Upload the assembled npm dirs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: npm-dirs
          path: rs/crates/bindings/paigasus-node-bindings/npm/
          if-no-files-found: error

      # wasm-pack is a proto-plugin-pinned CLI (.prototools), NOT a Moon-managed toolchain — and
      # `moon setup` provisions toolchains and components but NOT bins. That distinction already
      # cost this repo a wave of "no such command: nextest" failures; see .moon/toolchains.yml's
      # comment. Narrow install (not a bare `proto install`): this job needs none of
      # actionlint/buf/deny/machete/nextest/promtool/release-plz.
      - name: Install pinned wasm-pack CLI
        run: proto install wasm-pack

      # A THIRD scratch dir. wasm-pack CLEANS --out-dir and deletes package.json, so it must
      # never run in the crate root (see that crate's .gitignore). ts/packages/paigasus-kernel's
      # build task owns .wasmpack-out and its test task owns .wasmpack-test-out; this needs its
      # own name so a concurrent moon ci cannot race it. The wasm32-unknown-unknown target is
      # already provisioned by the "Install Moon-managed toolchains" step above (declared in
      # .moon/toolchains.yml's rust.targets), so no `rustup target add` is needed here.
      - name: Build the wasm distribution
        run: |
          set -euo pipefail
          cd rs/crates/bindings/paigasus-wasm
          wasm-pack build . --target bundler --release --no-pack \
            --out-dir .wasmpack-release-out --out-name paigasus_wasm
          test -s .wasmpack-release-out/paigasus_wasm_bg.wasm \
            || { echo "::error::wasm-pack produced no binary"; exit 1; }

      # STAGE INTO A NON-HIDDEN DIRECTORY, and do not "simplify" this away.
      # `actions/upload-artifact` excludes hidden files by default (`include-hidden-files: false`),
      # and `.wasmpack-release-out` is DOT-PREFIXED — it follows the convention its two sibling
      # scratch dirs use (`.wasmpack-out`, `.wasmpack-test-out`) precisely because they are
      # gitignored build output. Uploading that path directly therefore matched NOTHING and failed
      # the job with "No files were found with the provided path" — MEASURED on this workflow's
      # first CI run, after the build step above had already reported success.
      #
      # Staging is preferred over `include-hidden-files: true`: that flag would also ship the bare
      # `*` .gitignore wasm-pack writes into its own --out-dir, which would then sit in the publish
      # job's working directory. Copying out names exactly what ships instead.
      #
      # package.json comes from the CRATE ROOT, never from --out-dir: wasm-pack CLEANS its out-dir
      # and DELETES package.json there even with --no-pack (see this crate's .gitignore), so the
      # crate-root copy is the only one carrying publishConfig.access and the real metadata.
      - name: Stage the wasm distribution for upload
        run: |
          set -euo pipefail
          cd rs/crates/bindings/paigasus-wasm
          rm -rf wasm-dist && mkdir wasm-dist
          cp .wasmpack-release-out/paigasus_wasm* wasm-dist/
          cp package.json wasm-dist/package.json
          test -s wasm-dist/paigasus_wasm_bg.wasm \
            || { echo "::error::no wasm binary staged for upload"; exit 1; }
          test -s wasm-dist/package.json \
            || { echo "::error::no package.json staged for upload"; exit 1; }
          ls -la wasm-dist

      - name: Upload the wasm distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: wasm-dist
          path: rs/crates/bindings/paigasus-wasm/wasm-dist/
          if-no-files-found: error

      # Dry-run prepublish: assert os/cpu/libc + main paths + optionalDependencies resolve, touching
      # nothing. `--no-gh-release` IS REQUIRED — ghRelease defaults ON, so without it prepublish enters
      # createGhRelease→getRepoInfo and fails on the shallow CI checkout ("No release commit found")
      # even under --dry-run. The flag IS accepted (clipanion auto-negates booleans) though it's absent
      # from --help — the Task-1 spike misread this; CI confirmed. --tag-style left at default `lerna`
      # (inert under dry-run; SMA-407 owns the napi/release-plz tagging boundary + the real --gh-release
      # path). Do NOT set NAPI_RS_ENFORCE_VERSION_CHECK.
      - name: Verify packaging (prepublish dry-run)
        working-directory: ts/packages/paigasus-kernel
        run: pnpm exec napi prepublish --dry-run --no-gh-release --npm-dir npm --cwd ../../../rs/crates/bindings/paigasus-node-bindings

      # Assert the MAIN package tarball is loader-only (the files fix from Task 2) + has the glue.
      - name: Verify tarball contents (pack dry-run)
        working-directory: rs/crates/bindings/paigasus-node-bindings
        run: |
          set -euo pipefail
          echo "== main package ==" ; npm pack --dry-run
          npm pack --dry-run --json | node -e '
            const pkgs = JSON.parse(require("fs").readFileSync(0));
            const files = pkgs[0].files.map(f => f.path);
            if (files.some(f => f.endsWith(".node"))) { console.error("FAIL: main package ships a .node", files); process.exit(1); }
            if (!files.includes("index.js") || !files.includes("index.d.ts")) { console.error("FAIL: missing loader glue", files); process.exit(1); }
            console.log("main package is loader-only OK");
          '

      # Single-host REAL install-resolution check on linux-x64-gnu (spec §2.4 / review H2): pack the
      # main + linux-x64-gnu per-platform packages, install both into a scratch project so the
      # optional dep resolves via the PACKAGE PATH, and load sum across the FFI boundary.
      - name: Verify install-time platform resolution (linux-x64-gnu)
        working-directory: rs/crates/bindings/paigasus-node-bindings
        run: |
          set -euo pipefail
          CRATE_ABS="$(pwd)"
          MAIN_TGZ="$CRATE_ABS/$(npm pack | tail -1)"
          PLAT_TGZ="$CRATE_ABS/npm/linux-x64-gnu/$(cd npm/linux-x64-gnu && npm pack | tail -1)"
          SMOKE="$(mktemp -d)"
          cd "$SMOKE" && npm init -y >/dev/null
          npm install "$MAIN_TGZ" "$PLAT_TGZ"
          test -d node_modules/@paigasus/node-bindings-linux-x64-gnu || { echo "FAIL: linux-x64-gnu optional dep not installed"; exit 1; }
          node -e 'const b=require("@paigasus/node-bindings"); if(b.sum(2,3)!==5){console.error("FAIL sum=",b.sum(2,3));process.exit(1);} console.log("install-resolution + FFI load OK");'
