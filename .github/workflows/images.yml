# SPDX-License-Identifier: Apache-2.0
name: images

on:
  workflow_dispatch:

  # POST-merge verification. `rs/**` and `ts/**` because any service, console or dependency
  # change can break an image build, and this is the only place that is checked.
  push:
    branches:
      - main
    paths:
      - 'rs/**'
      - 'ts/**'
      - 'ci/images/**'
      - '.github/workflows/images.yml'
      - '.prototools'
      - '.proto/plugins/crane.toml'
      - '.proto/plugins/syft.toml'

  # PRE-merge verification of the BUILD INPUTS only. `rs/**` is deliberately absent: most PRs
  # here touch it, and two cold --release builds on every one of them would raise the bill
  # (SMA-520). These are the inputs that can actually break an image build — a new dependency,
  # a toolchain bump, a tool pin, or the build machinery itself. The same reasoning excludes a
  # bare `ts/**`: only the console build's own inputs are listed. That includes the install
  # inputs beside the lockfile (`pnpm-workspace.yaml`'s `allowBuilds` changes what the Docker
  # install does without a lockfile change) and each console's `lib/config.ts`, whose required
  # keys the console smoke's dummy runtime config must match.
  pull_request:
    branches:
      - main
    paths:
      - 'rs/Cargo.lock'
      - 'rs/Cargo.toml'
      - 'rs/rust-toolchain.toml'
      - 'rs/Dockerfile'
      - 'rs/.dockerignore'
      - 'ts/Dockerfile'
      - 'ts/.dockerignore'
      - 'ts/pnpm-lock.yaml'
      - 'ts/pnpm-workspace.yaml'
      - 'ts/package.json'
      - 'ts/.npmrc'
      - 'ts/apps/*/lib/config.ts'
      - 'ts/apps/*/next.config.ts'
      - 'ts/apps/*/package.json'
      # SMA-634: the kernel's `file:` dependency list. ts/Dockerfile's COPY list is hand-maintained
      # against it, and only the Docker path reads it.
      - 'ts/packages/paigasus-kernel/package.json'
      # SMA-634 CR round 1: ts/Dockerfile COPYs these two files from the napi crate BY NAME. No
      # Moon task lists them as `inputs` — the kernel build task's own `napi build` step
      # regenerates them fresh every run, so a stale or renamed committed copy never reds the
      # ordinary build, only the Docker COPY. (The crate's `package.json` is NOT listed here: it
      # IS a `paigasus-kernel-ts:build`/`:test` input already, so the ordinary build already reds
      # on a bad edit to it.)
      - 'rs/crates/bindings/paigasus-node-bindings/index.js'
      - 'rs/crates/bindings/paigasus-node-bindings/index.d.ts'
      - 'ci/images/**'
      - '.github/workflows/images.yml'
      - '.prototools'
      - '.proto/plugins/crane.toml'
      - '.proto/plugins/syft.toml'

# Build-and-verify only: no registry, no credentials, nothing is pushed (SMA-500 D1). The
# `rehearse` step pushes only to two registry:2 containers on the runner itself.
permissions:
  contents: read

concurrency:
  # `event_name` is in the GROUP so a manual dispatch cannot cancel a running push job.
  group: images-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  images:
    name: build + smoke (${{ matrix.arch }})
    # SMA-658: the RELEASE build path (OCI archive -> load -> identity check -> per-service
    # smoke -> rehearse), one leg per architecture on a NATIVE runner. A pull request runs amd64
    # only; `main` and a dispatch also run arm64 (spec M5), so a PR can get the arm64 evidence
    # with `gh workflow run images.yml --ref <branch>`.
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    # Two cold --release builds of a tree that has already overflowed the runner disk once.
    # Both services build in ONE leg: the smoke suite needs both images on one daemon.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(github.event_name == 'pull_request' && '["amd64"]' || '["amd64", "arm64"]') }}
    env:
      ARCH: ${{ matrix.arch }}
      # SMA-609: every captured shim output must set this, so `$(uv run …)` never captures proto's
      # NDJSON preamble.
      PROTO_REPORTER: text
    steps:
      # Same reclaim as ci.yml: this builds the cedar-policy tree in --release on a ~14 GB disk.
      - name: Reclaim runner disk (drop unused preinstalled toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set up proto (pinned via .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      # Narrow installs, not a bare `proto install`: this job needs only these three.
      - name: Install crane, syft and uv
        run: |
          proto install crane
          proto install syft
          proto install uv

      - name: Decision script self-test
        run: uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py --self-test

      - name: Build both images as OCI archives
        run: |
          ci/images/run.sh build-oci iam out
          ci/images/run.sh build-oci gateway out

      # Prints one `M3 …` line per image: this runner's image store and what the loaded image
      # reports as its ID (spec M3). The load goes through a throwaway local registry, not
      # `docker load`, because `docker load` of an OCI-layout archive needs the containerd image
      # store, which this runner does not carry (CI fix, PR 270; see ci/images/run.sh's
      # load_oci comment).
      - name: Load each archive and check its identity
        run: |
          for crate in paigasus-iam paigasus-gateway; do
            ci/images/run.sh load-oci "out/${crate}-${ARCH}.oci.tar" "${crate}:dev"
          done

      - name: Smoke each service on its own
        run: |
          ci/images/run.sh smoke gateway
          ci/images/run.sh smoke iam

      - name: Rehearse the publish steps against local registries
        run: ci/images/run.sh rehearse "out/paigasus-gateway-${ARCH}.oci.tar"

      # This step is a MEASUREMENT for spec M8. It checks that syft finds libc6 and the Rust
      # crates. SMA-688: the step now also checks the cargo SBOM floor. Each pull request
      # proves the floor that release.yml uses.
      - name: SBOM for each archive
        run: |
          for key in iam gateway; do
            crate="paigasus-${key}"
            syft "oci-archive:out/${crate}-${ARCH}.oci.tar" -o "spdx-json=sbom-${crate}-${ARCH}.spdx.json"
            summary="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py sbom-summary "sbom-${crate}-${ARCH}.spdx.json")"
            echo "M8 image=${crate} arch=${ARCH} $(printf '%s' "$summary" | tr '\n' ' ')"
            uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py sbom-floor --service "$key" "sbom-${crate}-${ARCH}.spdx.json"
          done

      # SMA-670: the self-test of the console image checks in ci/images/run.sh. Each static check
      # and each console smoke row must red on its own mutation, against a stub docker, and the
      # healthcheck's fetch signal must end a hang in the pinned runtime image. It sits directly
      # before the two console build steps, so all rs evidence above already exists when it runs.
      # With CI=true a skipped row is a failure.
      - name: Console image self-test
        run: ci/images/console-selftest.sh

      # SMA-688 (spec section 5.3). This step runs the console RELEASE sequence. It is the same
      # sequence that release.yml runs for each images-build-<key> job: build the OCI archive,
      # load it, check its identity, smoke it, take its SBOM, and check the SBOM floor. This
      # workflow builds two console keys here: iam-console and gateway-console. The step runs on
      # each pull request that changes a console's package.json or ci/images/**. A pull request
      # leg builds only the amd64 archive. Start this workflow by hand on the branch to get the
      # arm64 leg (spec R1). The "Build + smoke both consoles" step below still runs. It smokes
      # the build-console path only.
      - name: Console release sequence
        run: |
          set -euo pipefail
          df -h /
          for key in iam-console gateway-console; do
            ci/images/run.sh build-oci "$key" out
            archive="out/paigasus-${key}-${ARCH}.oci.tar"
            ci/images/run.sh load-oci "$archive" "paigasus-${key}:dev"
            ci/images/run.sh smoke "$key"
            syft "oci-archive:${archive}" -o "spdx-json=sbom-paigasus-${key}-${ARCH}.spdx.json"
            summary="$(uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py sbom-summary "sbom-paigasus-${key}-${ARCH}.spdx.json")"
            echo "M8 image=paigasus-${key} arch=${ARCH} $(printf '%s' "$summary" | tr '\n' ' ')"
            uv run --no-project --python '>=3.12' python3 ci/images/release_decision.py sbom-floor --service "$key" "sbom-paigasus-${key}-${ARCH}.spdx.json"
          done
          df -h /

      # Placed AFTER the rs release-path evidence (build, load, smoke, rehearse, SBOM) and BEFORE
      # the `if: always()` upload steps: a console failure here stops the job, but only once every
      # rs artifact this job exists to produce already exists on disk, so the uploads below still
      # carry that evidence instead of the console failure masking it.
      # `df -h /` before and after: the two Next builds were added to a job whose disk has already
      # overflowed once, and the job's only other reading is at job start, before the rs builds.
      # The rc is kept and re-raised, so the second reading is printed on a failure too.
      - name: Build + smoke both consoles
        run: |
          df -h /
          rc=0
          ci/images/run.sh all-consoles || rc=$?
          df -h /
          exit "$rc"

      - name: Upload chisel package manifests
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: chisel-manifests-${{ matrix.arch }}
          path: chisel-manifest-*.txt
          if-no-files-found: ignore
          # 90, not the 14-day default: any image built from this manifest can and does outlive
          # a 14-day artifact expiry, and the manifest is the only record of which chisel-cut
          # package versions (including libc6) that image actually shipped.
          retention-days: 90

      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sboms-${{ matrix.arch }}
          path: sbom-*.spdx.json
          if-no-files-found: ignore
          retention-days: 90
