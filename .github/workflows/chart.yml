# SPDX-License-Identifier: Apache-2.0
name: chart

on:
  workflow_dispatch:

  # POST-merge. Broad paths, so a regression anywhere in the code this job tests starts a run.
  push:
    branches:
      - main
    paths:
      - 'rs/**'
      - 'ts/**'
      - 'charts/**'
      - 'ci/kind/**'
      - 'ci/images/**'
      - 'ci/helm-render/**'
      - '.prototools'
      - '.proto/plugins/helm.toml'
      - '.github/workflows/chart.yml'

  # PRE-merge (SMA-514 D3): this job's own inputs AND the code under test in the journeys: the
  # shell, the auth routes, discovery, both consoles and the lockfile (a Next bump is the most
  # probable cause of a prefetch or RSC change). The check is NOT required. Cost: every such PR pays for a
  # cold --release IAM build in `run.sh images` (the SMA-520 reason in images.yml). Any other PR
  # can start the job by hand: `gh workflow run chart.yml --ref <branch>`.
  pull_request:
    branches:
      - main
    paths:
      - 'charts/**'
      - 'ci/kind/**'
      - 'ts/apps/iam-console/tests/cluster/**'
      - '.github/workflows/chart.yml'
      - 'ts/packages/paigasus-app-shell/**'
      - 'ts/packages/paigasus-auth/**'
      - 'ts/packages/paigasus-discovery/**'
      - 'ts/packages/paigasus-console-core/**'
      - 'ts/packages/paigasus-next-config/**'
      - 'ts/packages/paigasus-ui/**'
      - 'ts/apps/iam-console/**'
      - 'ts/apps/gateway-console/**'
      - 'ts/pnpm-lock.yaml'

# Nothing is pushed and nothing is published: kind loads the images locally (parent spec § 11).
permissions:
  contents: read

concurrency:
  # `event_name` is in the GROUP so a manual dispatch cannot cancel a running push job.
  group: chart-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  kind:
    name: kind install + upgrade (amd64)
    # NOT a required check (spec § 7): a broken chart reds main, the same trade images.yml makes.
    runs-on: ubuntu-latest
    # 169 (SMA-514). Each step timeout below is sized to the SUM of ci/kind/run.sh's own
    # --timeout/deadline values for that mode (review Minor 1), because each is a generous allowance
    # for Docker Hub throttling and can legitimately run close to its cap on the same slow pull. The
    # job budget must hold them all, or a slow but passing run is killed by the JOB timeout. The
    # step timeouts sum to 158 minutes: 57 (up) + 25 (images) + 12 (install a) + 10 (specs a) +
    # 9 (stub up) + 10 (specs journeys) + 17 (upgrade b) + 8 (specs b) + 5 (evidence) + 5 (down).
    # Before SMA-514 the sum was 139 and the budget 150; the budget grows by the two new step
    # timeouts (9 + 10), which keeps the same 11-minute room for the untimed steps (reclaim,
    # checkout, tool and dependency installs, Chromium).
    timeout-minutes: 169
    env:
      # SMA-609: every captured shim output must set this.
      PROTO_REPORTER: text
    steps:
      # Same reclaim as images.yml: this job builds IAM in --release on a ~14 GB disk.
      - name: Reclaim runner disk (drop unused preinstalled toolchains)
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ci/images/run.sh builds with `docker buildx build --load`, measured under this builder in
      # images.yml.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Set up proto (pinned via .prototools)
        uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095  # v0
        with:
          cache: false

      # Narrow installs: this job needs only these three.
      - name: Install helm, node and pnpm
        run: |
          proto install helm
          proto install node
          proto install pnpm

      - name: Resolve the pnpm store path
        id: cache-paths
        run: echo "pnpm-store=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.cache-paths.outputs.pnpm-store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('ts/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install JS workspace dependencies
        run: pnpm --dir ts install --frozen-lockfile

      # From the PACKAGE: `playwright` is only on that package's node_modules/.bin (ci.yml).
      - name: Install Playwright Chromium
        run: pnpm --dir ts/apps/iam-console exec playwright install --with-deps chromium

      # kind v0.31.0 is the newest kind with a Kubernetes 1.31 node image (the golden files render
      # for 1.31.0); kubectl matches the node's minor. No cluster here: run.sh up makes it.
      - name: Install kind and kubectl
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2  # v1.15.0
        with:
          install_only: true
          version: v0.31.0
          kubectl_version: v1.31.14

      # 57, not 15 (review Minor 1). run.sh up's own waits, summed: kind create --wait 180s (3m) +
      # helm install traefik --timeout 5m (5m) + CoreDNS rollout --timeout=180s (3m) + three
      # dependency rollouts at --timeout=600s each, postgres/redis/keycloak (30m) + preflight's
      # own Keycloak Ready wait at --timeout=600s (10m) + the idp-preflight pod's
      # Succeeded wait --timeout=180s (3m) = 3+5+3+30+10+3 = 54 minutes. +3 min margin for the
      # untimed steps in between (openssl, sed, kubectl create/apply) = 57.
      - name: Cluster up (kind, Traefik, CA, CoreDNS, Postgres, Redis, Keycloak, preflight)
        timeout-minutes: 57
        run: bash ci/kind/run.sh up

      - name: Build and load the three images
        timeout-minutes: 25
        run: bash ci/kind/run.sh images

      - name: helm install (phase A, both zones)
        id: install-a
        timeout-minutes: 12
        run: bash ci/kind/run.sh install a

      - name: Specs, phase A (R1, R1-control, R2, R3-control)
        timeout-minutes: 10
        run: bash ci/kind/run.sh specs a

      # SMA-514 decision D5: the stub and the journeys run when `install a` succeeded, EVEN IF
      # `specs a` failed. Mutation M1 (a cross-zone NextLink) breaks R2 too, and a failed phase A
      # must still leave journey evidence. `!cancelled()` replaces the implicit success(). Phase B
      # below keeps the default: it runs only when every step before it passed.
      # 9 min: run.sh stub_up's own waits, summed: rollout status --timeout=300s (5m) + the old
      # stub-check pod delete --timeout=60s (1m) + the stub-check pod wait --timeout=120s (2m) =
      # 8 minutes. +1 min margin.
      - name: Start the gateway stub (SMA-514)
        if: ${{ !cancelled() && steps.install-a.outcome == 'success' }}
        timeout-minutes: 9
        run: bash ci/kind/run.sh stub up

      # 10 min: two tests at the config's 120-s test timeout (4m), `--list`, the pre-run checks and
      # the report check (under 1m), and the room phase A's step uses for its four tests.
      - name: Specs, journeys (SMA-514 scenarios 1 and 2)
        if: ${{ !cancelled() && steps.install-a.outcome == 'success' }}
        timeout-minutes: 10
        run: bash ci/kind/run.sh specs journeys

      # 17, not 12 (review Minor 1, the reviewer's own worked example). run.sh upgrade_b's own
      # waits, summed: helm upgrade --timeout 10m (10m) + the old-ReplicaSet settle deadline (3m)
      # + settle_gateway_404's deadline (2m) = 10+3+2 = 15 minutes. +2 min margin.
      - name: helm upgrade (phase B, gateway zone off) and settle
        timeout-minutes: 17
        run: bash ci/kind/run.sh upgrade b

      - name: Specs, phase B (R3)
        timeout-minutes: 8
        run: bash ci/kind/run.sh specs b

      # `cancelled()` too: a step or job timeout cancels, and a hang is when evidence matters most.
      - name: Collect evidence
        if: failure() || cancelled()
        timeout-minutes: 5
        run: bash ci/kind/run.sh diagnose

      - name: Upload evidence
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: kind-evidence
          path: ${{ runner.temp }}/paigasus-kind/diagnose
          if-no-files-found: warn
          # Short: the Playwright traces hold the per-run (throwaway) password.
          retention-days: 7

      - name: Cluster down
        if: always()
        timeout-minutes: 5
        run: bash ci/kind/run.sh down
