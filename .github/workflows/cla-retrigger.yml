name: CLA retrigger

# Works around a known cla-assistant bug where the CLA check gets stuck and never re-runs
# after a contributor signs (cla-assistant/cla-assistant#520, #528). Commenting `/check-cla`
# on a pull request asks the service to re-check it.
#
# WHY `issue_comment` AND NOT `pull_request_target` — this job needs no repository write
# access and no token; it calls one unauthenticated endpoint. `pull_request_target` would
# hand it a privileged context it has no use for.
#
# WHY `permissions: {}` — the endpoint is unauthenticated. Declaring the empty set means a
# later edit that needs a scope has to add one deliberately, where `repo:workflow-credentials`
# will see it: this workflow IS a subject of that gate (SMA-408 extended the gate's trigger
# set to cover `issue_comment`, which is world-reachable on a public repo).
#
# WHAT A GREEN RUN DOES AND DOES NOT PROVE — measured directly against the live endpoint
# (2026-09-03, three cases: this repo, a nonexistent owner/repo, and a real repo cla-assistant
# has never linked), it answers EVERY request, right or wrong, with an unconditional `302`
# redirect to `https://github.com/`. `curl --fail-with-body` only turns a non-2xx response into
# a non-zero exit, and 302 is never that, so a correct request, a stale/wrong repo slug, and an
# unlinked repo are indistinguishable here and the job goes green in all three. A green run
# therefore proves only that the request left the runner and the service answered — NOT that
# the recheck happened or that the repo slug is right. `--fail-with-body` stays anyway: it still
# catches a 5xx, a DNS failure, or a TLS failure, which are real signals this workflow can act
# on. Langfuse ships the same workaround against the same endpoint behaviour.
#
# KNOWN LIMITATION — an `issue_comment` run attaches no check to the pull request, so it is
# visible only in this repository's Actions tab. CONTRIBUTING.md documents that.

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  retrigger:
    # `startsWith`, not `contains`: a comment that merely QUOTES the CONTRIBUTING.md
    # instruction would self-trigger under `contains`, because the command appears somewhere
    # in the body. With `startsWith` it has to be the first thing typed.
    #
    # There is deliberately NO trim() here: GitHub Actions expressions have no such function
    # (the complete string set is contains/startsWith/endsWith/format/join), so calling one
    # is an actionlint error, not a nicety. The cost is that a body with leading whitespace
    # does not match; a contributor following CONTRIBUTING.md types the command first.
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/check-cla')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Job-level, not workflow-level: `concurrency:` at the workflow level is evaluated per RUN,
    # before this job's `if:` even runs — so a run this `if:` skips would still claim the group
    # and, with `cancel-in-progress: true`, cancel a legitimate in-flight retrigger. Any later
    # comment on the same PR — including cla-assistant's own bot reply — creates such a run.
    # A job SKIPPED by `if:` never claims a job-level group, so scoping it here is what makes
    # the cap apply only to runs that actually reach the curl. Any GitHub account can comment on
    # a public repository, so this trigger is world-reachable; Actions minutes are free here,
    # but the account-level concurrent-job limit is shared with ci.yml, so an uncapped comment
    # flood would starve the required checks.
    concurrency:
      group: cla-retrigger-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Ask cla-assistant to re-check this pull request
        env:
          PR_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          curl --fail-with-body -sS --max-time 30 \
            "https://cla-assistant.io/check/${REPO}?pullRequest=${PR_NUMBER}"
