syntax = "proto3";

package paigasus.agents.v1;

// The contract of the agent host.
//
// 1. The package is `paigasus.agents.v1`. Field numbers and names are permanent. New fields
//    can be added.
// 2. JSON `data` uses the proto3 JSON lowerCamelCase field names.
// 3. Each message is the `data` of one CloudEvents event. The comment of each message gives
//    its direction and its CloudEvents `type`. The request and response messages of
//    `AgentService` are not event data.
// 4. Envelope rule: a message never repeats a CloudEvents envelope attribute (`id`, `source`,
//    `type`, `time`, `subject`) or an extension (`threadid`, `actorprn`, `correlationid`,
//    `schemaversion`). The envelope is the only place for those values.

import "google/protobuf/timestamp.proto";

// A message that the host sends out to the user of a run.
//
// Direction: out. CloudEvents `type`: `agents.outbox.message`. The envelope `source` is
// `urn:paigasus:agents`. The envelope `subject` is the inbox PRN, so this message has no
// `inbox_prn`.
message OutboxMessage {
  // Canonical PRN of the run that produced the message.
  string run_prn = 1;
  string text = 2;
}

// The kind of a timer.
enum TimerKind {
  TIMER_KIND_UNSPECIFIED = 0;
  // A timer that fires once.
  TIMER_KIND_FOLLOW_UP = 1;
  // A timer that fires on a cron schedule.
  TIMER_KIND_SCHEDULE = 2;
}

// Who made a timer.
enum TimerOrigin {
  TIMER_ORIGIN_UNSPECIFIED = 0;
  // The agent made the timer with a tool.
  TIMER_ORIGIN_AGENT = 1;
  // The system made the timer.
  TIMER_ORIGIN_SYSTEM = 2;
}

// A timer fired.
//
// Direction: host to agent (inbox). CloudEvents `type`: `agents.timer.fired`. The envelope
// `source` is `urn:paigasus:agents:timer:agent` or `urn:paigasus:agents:timer:system`, by the
// origin of the timer. The envelope `time` is the time of the actual firing, so this message has
// no `fired_at`. The envelope `threadid` is the thread of the timer, if it has one.
message TimerFired {
  // The ID of the timer, as a hyphenated UUID.
  string timer_id = 1;
  TimerKind kind = 2;
  TimerOrigin origin = 3;
  // The scheduled time of the firing. It is the slot, not the actual time.
  google.protobuf.Timestamp fire_at = 4;
  // The note of the timer. It is untrusted text.
  string note = 5;
  // The cron pattern. Only a schedule has it.
  optional string cron = 6;
  // The IANA time zone name of the schedule. Only a schedule has it.
  optional string tz = 7;
}

// The registry of agent definitions and their inboxes.
service AgentService {
  rpc CreateAgent(CreateAgentRequest) returns (CreateAgentResponse);
  rpc GetAgent(GetAgentRequest) returns (GetAgentResponse);
  rpc ListAgents(ListAgentsRequest) returns (ListAgentsResponse);
  rpc UpdateAgent(UpdateAgentRequest) returns (UpdateAgentResponse);
  rpc ArchiveAgent(ArchiveAgentRequest) returns (ArchiveAgentResponse);
  rpc CreateInbox(CreateInboxRequest) returns (CreateInboxResponse);
  rpc GetInbox(GetInboxRequest) returns (GetInboxResponse);
  rpc ListInboxes(ListInboxesRequest) returns (ListInboxesResponse);
}

// An agent definition.
message Agent {
  string agent_prn = 1;
  string org_prn = 2;
  string name = 3;
  string model = 4;
  string instructions = 5;
  repeated string tools = 6;
  // The version of the definition. It increases with each update.
  int64 version = 7;
  google.protobuf.Timestamp create_time = 8;
  google.protobuf.Timestamp update_time = 9;
  // Not set while the agent is active.
  google.protobuf.Timestamp archive_time = 10;
}

// The inbox of one principal at one agent.
message Inbox {
  string inbox_prn = 1;
  string agent_prn = 2;
  string principal_prn = 3;
  google.protobuf.Timestamp create_time = 4;
  // The archive time of the agent. Not set while the agent is active.
  google.protobuf.Timestamp agent_archive_time = 5;
}

message CreateAgentRequest {
  string org_prn = 1;
  string name = 2;
  string model = 3;
  string instructions = 4;
  repeated string tools = 5;
}

message CreateAgentResponse {
  Agent agent = 1;
}

message GetAgentRequest {
  string agent_prn = 1;
}

message GetAgentResponse {
  Agent agent = 1;
}

message ListAgentsRequest {
  string org_prn = 1;
  bool include_archived = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListAgentsResponse {
  repeated Agent agents = 1;
  string next_page_token = 2;
}

message UpdateAgentRequest {
  string agent_prn = 1;
  // The version that the caller read. A different current version fails the update.
  int64 version = 2;
  string name = 3;
  string model = 4;
  string instructions = 5;
  repeated string tools = 6;
}

message UpdateAgentResponse {
  Agent agent = 1;
}

message ArchiveAgentRequest {
  string agent_prn = 1;
}

message ArchiveAgentResponse {
  Agent agent = 1;
}

message CreateInboxRequest {
  string agent_prn = 1;
  string principal_prn = 2;
}

message CreateInboxResponse {
  Inbox inbox = 1;
}

message GetInboxRequest {
  string inbox_prn = 1;
}

message GetInboxResponse {
  Inbox inbox = 1;
}

message ListInboxesRequest {
  string agent_prn = 1;
  uint32 page_size = 2;
  string page_token = 3;
}

message ListInboxesResponse {
  repeated Inbox inboxes = 1;
  string next_page_token = 2;
}
