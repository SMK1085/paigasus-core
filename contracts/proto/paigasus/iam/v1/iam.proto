syntax = "proto3";

package paigasus.iam.v1;

import "google/protobuf/timestamp.proto";
import "paigasus/common/v1/audit.proto";

// IAM v1 wire model.
//
// Hosts the tenancy hierarchy — `TenancyService` (M1) — authentication
// introspection — `AuthnService` (M2) — and authorization/policy
// administration — `AuthorizationService` (M3).
//
// AuthorizationService's originally-planned Introspect rpc is not duplicated
// there: it folds into AuthnService.Introspect below (spec D4).

// Placeholder so the package generates a concrete type in all three languages.
// Replaced by real messages in M1; carries a service PRN string for now.
message ServiceInfo {
  string prn = 1;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_ACTIVE = 1;
  NODE_STATUS_ARCHIVED = 2;
}

message Organization {
  string prn = 1;
  string slug = 2;
  string name = 3;
  NodeStatus status = 4;
  NodeStatus effective_status = 5;
  paigasus.common.v1.AuditMetadata audit = 6;
}
message Team {
  string prn = 1;
  string org_prn = 2;
  string slug = 3;
  string name = 4;
  NodeStatus status = 5;
  NodeStatus effective_status = 6;
  paigasus.common.v1.AuditMetadata audit = 7;
}
message Project {
  string prn = 1;
  string team_prn = 2;
  string org_prn = 3;
  string slug = 4;
  string name = 5;
  NodeStatus status = 6;
  NodeStatus effective_status = 7;
  paigasus.common.v1.AuditMetadata audit = 8;
}
message Membership {
  string id = 1;
  string principal_prn = 2;
  string node_prn = 3;
  paigasus.common.v1.AuditMetadata audit = 4; // modified_at == created_at (immutable)
}

message CreateOrganizationRequest {
  string slug = 1;
  string name = 2;
}
message CreateOrganizationResponse {
  Organization organization = 1;
  Team default_team = 2;
}
message GetOrganizationRequest {
  string prn = 1;
}
message GetOrganizationResponse {
  Organization organization = 1;
}
message ListOrganizationsRequest {
  uint32 limit = 1;
  uint64 offset = 2;
} // limit 0 => server default 50
message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}
message RenameOrganizationRequest {
  string prn = 1;
  optional string new_slug = 2;
  optional string new_name = 3;
}
message RenameOrganizationResponse {
  Organization organization = 1;
}
message ArchiveOrganizationRequest {
  string prn = 1;
}
message ArchiveOrganizationResponse {
  Organization organization = 1;
}
message RestoreOrganizationRequest {
  string prn = 1;
}
message RestoreOrganizationResponse {
  Organization organization = 1;
}

message CreateTeamRequest {
  string org_prn = 1;
  string slug = 2;
  string name = 3;
}
message CreateTeamResponse {
  Team team = 1;
}
message GetTeamRequest {
  string prn = 1;
}
message GetTeamResponse {
  Team team = 1;
}
message ListTeamsRequest {
  string org_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListTeamsResponse {
  repeated Team teams = 1;
}
message RenameTeamRequest {
  string prn = 1;
  optional string new_slug = 2;
  optional string new_name = 3;
}
message RenameTeamResponse {
  Team team = 1;
}
message ArchiveTeamRequest {
  string prn = 1;
}
message ArchiveTeamResponse {
  Team team = 1;
}
message RestoreTeamRequest {
  string prn = 1;
}
message RestoreTeamResponse {
  Team team = 1;
}

message CreateProjectRequest {
  string team_prn = 1;
  string slug = 2;
  string name = 3;
}
message CreateProjectResponse {
  Project project = 1;
}
message GetProjectRequest {
  string prn = 1;
}
message GetProjectResponse {
  Project project = 1;
}
message ListProjectsRequest {
  string team_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListProjectsResponse {
  repeated Project projects = 1;
}
message RenameProjectRequest {
  string prn = 1;
  optional string new_slug = 2;
  optional string new_name = 3;
}
message RenameProjectResponse {
  Project project = 1;
}
message ArchiveProjectRequest {
  string prn = 1;
}
message ArchiveProjectResponse {
  Project project = 1;
}
message RestoreProjectRequest {
  string prn = 1;
}
message RestoreProjectResponse {
  Project project = 1;
}

message AttachMembershipRequest {
  string principal_prn = 1;
  string node_prn = 2;
}
message AttachMembershipResponse {
  Membership membership = 1;
}

// Detaching an org membership cascades: the principal's team/project
// memberships within that same org are removed in the same transaction
// (spec §5.1 rule 5). Detaching a team/project membership removes only
// itself.
message DetachMembershipRequest {
  string id = 1;
} // membership uuid
message DetachMembershipResponse {}
message ListMembershipsRequest {
  oneof filter {
    string principal_prn = 1;
    string node_prn = 2;
  }
  uint32 limit = 3;
  uint64 offset = 4;
}
message ListMembershipsResponse {
  repeated Membership memberships = 1;
}

message IntrospectRequest {
  string token = 1;
}
message IntrospectResponse {
  string principal_prn = 1;
  string status = 2; // principal status
  string issuer = 3;
  string subject = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated Membership memberships = 6; // reuse tenancy message
  reserved 7;
  reserved "role_group_prns";
  repeated RoleGrantRef role_grants = 8;
}
message RoleGrantRef {
  string scope_prn = 1;
  string role_key = 2;
}

message IntrospectApiKeyRequest {
  string token = 1;
}
message IntrospectApiKeyResponse {
  string principal_prn = 1;
  string status = 2; // principal status
  string key_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated Membership memberships = 5; // reuse tenancy message
  repeated RoleGrantRef role_grants = 6;
}

service TenancyService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc RenameOrganization(RenameOrganizationRequest) returns (RenameOrganizationResponse);
  rpc ArchiveOrganization(ArchiveOrganizationRequest) returns (ArchiveOrganizationResponse);
  rpc RestoreOrganization(RestoreOrganizationRequest) returns (RestoreOrganizationResponse);
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc RenameTeam(RenameTeamRequest) returns (RenameTeamResponse);
  rpc ArchiveTeam(ArchiveTeamRequest) returns (ArchiveTeamResponse);
  rpc RestoreTeam(RestoreTeamRequest) returns (RestoreTeamResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc RestoreProject(RestoreProjectRequest) returns (RestoreProjectResponse);
  rpc AttachMembership(AttachMembershipRequest) returns (AttachMembershipResponse);
  // Detaching an ORG membership also removes that principal's team/project
  // memberships in that same org (cascade detach, spec §5.1 rule 5).
  rpc DetachMembership(DetachMembershipRequest) returns (DetachMembershipResponse);
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse);
}

service AuthnService {
  rpc Introspect(IntrospectRequest) returns (IntrospectResponse);
  rpc IntrospectApiKey(IntrospectApiKeyRequest) returns (IntrospectApiKeyResponse);
}

message IsAuthorizedRequest {
  string principal_prn = 1;
  string action = 2;
  string resource_prn = 3;
  map<string, string> context = 4;
}
message IsAuthorizedResponse {
  bool allowed = 1;
  repeated string determining_policies = 2;
  string reason = 3;
}
message Policy {
  string policy_id = 1;
  string kind = 2;
  string source = 3;
  string description = 4;
  bool system = 5;
}
message PutPolicyRequest {
  Policy policy = 1;
} // upsert; validated; rejects system ids
message PutPolicyResponse {
  Policy policy = 1;
}
message DeletePolicyRequest {
  string policy_id = 1;
}
message DeletePolicyResponse {}
message ListPoliciesRequest {
  uint32 limit = 1;
  uint64 offset = 2;
}
message ListPoliciesResponse {
  repeated Policy policies = 1;
}
message RoleGrant {
  string id = 1;
  string principal_prn = 2;
  string role_key = 3;
  string scope_prn = 4;
}
message GrantRoleRequest {
  string principal_prn = 1;
  string role_key = 2;
  string scope_prn = 3;
}
message GrantRoleResponse {
  RoleGrant grant = 1;
}
message RevokeRoleRequest {
  string id = 1;
}
message RevokeRoleResponse {}
message ListRoleGrantsRequest {
  string principal_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListRoleGrantsResponse {
  repeated RoleGrant grants = 1;
}

service AuthorizationService {
  rpc IsAuthorized(IsAuthorizedRequest) returns (IsAuthorizedResponse);
  rpc PutPolicy(PutPolicyRequest) returns (PutPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse);
}

// ServiceAccount is a machine identity: a principal PRN owned by exactly one
// tenancy node (org/team/project). It reuses the unified Principal type
// (M3 D1) — status lives on the principal row, not here — so `status` mirrors
// IntrospectResponse.status (a free-form principal-status string) rather than
// a dedicated enum.
message ServiceAccount {
  string prn = 1;
  string owner_prn = 2;
  string name = 3;
  string status = 4; // principal status
  paigasus.common.v1.AuditMetadata audit = 5;
}

enum ApiKeyStatus {
  API_KEY_STATUS_UNSPECIFIED = 0;
  API_KEY_STATUS_ACTIVE = 1;
  API_KEY_STATUS_REVOKED = 2;
}

// ApiKey never carries the secret or its hash — only display/lifecycle
// metadata. The plaintext token is returned exactly once, in
// IssueApiKeyResponse.token.
message ApiKey {
  string id = 1;
  string service_account_prn = 2;
  string scope_prn = 3;
  string prefix = 4;
  ApiKeyStatus status = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
  repeated string scope_actions = 8; // stored, unenforced in v1
  repeated string scope_roles = 9; // stored, unenforced in v1
  paigasus.common.v1.AuditMetadata audit = 10;
}

message CreateServiceAccountRequest {
  string owner_prn = 1;
  string name = 2;
}
message CreateServiceAccountResponse {
  ServiceAccount service_account = 1;
}
message GetServiceAccountRequest {
  string prn = 1;
}
message GetServiceAccountResponse {
  ServiceAccount service_account = 1;
}
message ListServiceAccountsRequest {
  string owner_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
}
message ArchiveServiceAccountRequest {
  string prn = 1;
}

// Archive is a lifecycle op with no meaningful payload (like DetachMembership):
// an empty response avoids requiring GetServiceAccount authz alongside
// ArchiveServiceAccount just to populate a body.
message ArchiveServiceAccountResponse {}

message IssueApiKeyRequest {
  string service_account_prn = 1;
  string scope_prn = 2;
  google.protobuf.Timestamp expires_at = 3; // unset = uses the configured default expiry if one is set, else non-expiring
  repeated string scope_actions = 4;
  repeated string scope_roles = 5;
}
message IssueApiKeyResponse {
  ApiKey api_key = 1;
  string token = 2; // plaintext token, shown once
}
message RevokeApiKeyRequest {
  string id = 1;
}
message RevokeApiKeyResponse {}
message ListApiKeysRequest {
  string service_account_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

service ServiceAccountService {
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse);
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  rpc ArchiveServiceAccount(ArchiveServiceAccountRequest) returns (ArchiveServiceAccountResponse);
  rpc IssueApiKey(IssueApiKeyRequest) returns (IssueApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
}
