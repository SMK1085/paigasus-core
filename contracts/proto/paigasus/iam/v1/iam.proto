syntax = "proto3";

package paigasus.iam.v1;

import "google/protobuf/timestamp.proto";
import "paigasus/common/v1/audit.proto";

// IAM v1 wire model.
//
// Hosts the tenancy hierarchy — `TenancyService` (M1) — authentication
// introspection — `AuthnService` (M2) — authorization/policy administration,
// now including system-policy retirement (SMA-501) — `AuthorizationService`
// (M3) — machine identities — `ServiceAccountService` — audit log access —
// `AuditService` — user creation — `UserService` (SMA-501) — and outbox
// dead-letter operations — `OutboxService` (SMA-501).
// `ServiceInfoService` (ADR-0020) lives in `common/v1`, not here.
//
// AuthorizationService's originally-planned Introspect rpc is not duplicated
// there: it folds into AuthnService.Introspect below (spec D4).

// DEPRECATED — superseded by `paigasus.common.v1.ServiceInfo`, the real
// capability descriptor (ADR-0020, SMA-499). Do not use: nothing serves this
// message, and no RPC accepts or returns it.
//
// It is retained, rather than removed, only because buf's MESSAGE_NO_DELETE
// forbids deleting a published message — removal would red `contracts:breaking`.
// This deprecation is PERMANENT; there is no follow-up that retires it.
message ServiceInfo {
  option deprecated = true;

  string prn = 1;
}

enum NodeStatus {
  NODE_STATUS_UNSPECIFIED = 0;
  NODE_STATUS_ACTIVE = 1;
  NODE_STATUS_ARCHIVED = 2;
}

message Organization {
  string prn = 1;
  string slug = 2;
  string name = 3;
  NodeStatus status = 4;
  NodeStatus effective_status = 5;
  paigasus.common.v1.AuditMetadata audit = 6;
}
message Team {
  string prn = 1;
  string org_prn = 2;
  string slug = 3;
  string name = 4;
  NodeStatus status = 5;
  NodeStatus effective_status = 6;
  paigasus.common.v1.AuditMetadata audit = 7;
}
message Project {
  string prn = 1;
  string team_prn = 2;
  string org_prn = 3;
  string slug = 4;
  string name = 5;
  NodeStatus status = 6;
  NodeStatus effective_status = 7;
  paigasus.common.v1.AuditMetadata audit = 8;
}
message Membership {
  string id = 1;
  string principal_prn = 2;
  string node_prn = 3;
  paigasus.common.v1.AuditMetadata audit = 4; // modified_at == created_at (immutable)
}

message CreateOrganizationRequest {
  string slug = 1;
  string name = 2;
}
message CreateOrganizationResponse {
  Organization organization = 1;
  Team default_team = 2;
}
message GetOrganizationRequest {
  string prn = 1;
}
message GetOrganizationResponse {
  Organization organization = 1;
}
message ListOrganizationsRequest {
  uint32 limit = 1;
  uint64 offset = 2;
} // limit 0 => server default 50
message ListOrganizationsResponse {
  repeated Organization organizations = 1;
}
message RenameOrganizationRequest {
  string prn = 1;
  optional string new_slug = 2;
  optional string new_name = 3;
}
message RenameOrganizationResponse {
  Organization organization = 1;
}
message ArchiveOrganizationRequest {
  string prn = 1;
}
message ArchiveOrganizationResponse {
  Organization organization = 1;
}
message RestoreOrganizationRequest {
  string prn = 1;
}
message RestoreOrganizationResponse {
  Organization organization = 1;
}

message CreateTeamRequest {
  string org_prn = 1;
  string slug = 2;
  string name = 3;
}
message CreateTeamResponse {
  Team team = 1;
}
message GetTeamRequest {
  string prn = 1;
}
message GetTeamResponse {
  Team team = 1;
}
message ListTeamsRequest {
  string org_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListTeamsResponse {
  repeated Team teams = 1;
}
message RenameTeamRequest {
  string prn = 1;
  optional string new_slug = 2;
  optional string new_name = 3;
}
message RenameTeamResponse {
  Team team = 1;
}
message ArchiveTeamRequest {
  string prn = 1;
}
message ArchiveTeamResponse {
  Team team = 1;
}
message RestoreTeamRequest {
  string prn = 1;
}
message RestoreTeamResponse {
  Team team = 1;
}

message CreateProjectRequest {
  string team_prn = 1;
  string slug = 2;
  string name = 3;
}
message CreateProjectResponse {
  Project project = 1;
}
message GetProjectRequest {
  string prn = 1;
}
message GetProjectResponse {
  Project project = 1;
}
message ListProjectsRequest {
  string team_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListProjectsResponse {
  repeated Project projects = 1;
}
message RenameProjectRequest {
  string prn = 1;
  optional string new_slug = 2;
  optional string new_name = 3;
}
message RenameProjectResponse {
  Project project = 1;
}
message ArchiveProjectRequest {
  string prn = 1;
}
message ArchiveProjectResponse {
  Project project = 1;
}
message RestoreProjectRequest {
  string prn = 1;
}
message RestoreProjectResponse {
  Project project = 1;
}

message AttachMembershipRequest {
  string principal_prn = 1;
  string node_prn = 2;
}
message AttachMembershipResponse {
  Membership membership = 1;
}

// Detaching an org membership cascades: the principal's team/project
// memberships within that same org are removed in the same transaction
// (spec §5.1 rule 5). Detaching a team/project membership removes only
// itself.
message DetachMembershipRequest {
  string id = 1;
} // membership uuid
message DetachMembershipResponse {}
message ListMembershipsRequest {
  oneof filter {
    string principal_prn = 1;
    string node_prn = 2;
  }
  uint32 limit = 3;
  uint64 offset = 4;
}
message ListMembershipsResponse {
  repeated Membership memberships = 1;
}

message IntrospectRequest {
  string token = 1;
}
message IntrospectResponse {
  string principal_prn = 1;
  string status = 2; // principal status
  string issuer = 3;
  string subject = 4;
  google.protobuf.Timestamp expires_at = 5;
  repeated Membership memberships = 6; // reuse tenancy message
  reserved 7;
  reserved "role_group_prns";
  repeated RoleGrantRef role_grants = 8;
}
message RoleGrantRef {
  string scope_prn = 1;
  string role_key = 2;
}

message IntrospectApiKeyRequest {
  string token = 1;
}
message IntrospectApiKeyResponse {
  string principal_prn = 1;
  string status = 2; // principal status
  string key_id = 3;
  google.protobuf.Timestamp expires_at = 4;
  repeated Membership memberships = 5; // reuse tenancy message
  repeated RoleGrantRef role_grants = 6;
  string scope_prn = 7; // PRN of the key's tenancy scope node (gateway authorizes against it)
}

service TenancyService {
  rpc CreateOrganization(CreateOrganizationRequest) returns (CreateOrganizationResponse);
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse);
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse);
  rpc RenameOrganization(RenameOrganizationRequest) returns (RenameOrganizationResponse);
  rpc ArchiveOrganization(ArchiveOrganizationRequest) returns (ArchiveOrganizationResponse);
  rpc RestoreOrganization(RestoreOrganizationRequest) returns (RestoreOrganizationResponse);
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse);
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc RenameTeam(RenameTeamRequest) returns (RenameTeamResponse);
  rpc ArchiveTeam(ArchiveTeamRequest) returns (ArchiveTeamResponse);
  rpc RestoreTeam(RestoreTeamRequest) returns (RestoreTeamResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc RenameProject(RenameProjectRequest) returns (RenameProjectResponse);
  rpc ArchiveProject(ArchiveProjectRequest) returns (ArchiveProjectResponse);
  rpc RestoreProject(RestoreProjectRequest) returns (RestoreProjectResponse);
  rpc AttachMembership(AttachMembershipRequest) returns (AttachMembershipResponse);
  // Detaching an ORG membership also removes that principal's team/project
  // memberships in that same org (cascade detach, spec §5.1 rule 5).
  rpc DetachMembership(DetachMembershipRequest) returns (DetachMembershipResponse);
  rpc ListMemberships(ListMembershipsRequest) returns (ListMembershipsResponse);
}

service AuthnService {
  rpc Introspect(IntrospectRequest) returns (IntrospectResponse);
  rpc IntrospectApiKey(IntrospectApiKeyRequest) returns (IntrospectApiKeyResponse);
}

message IsAuthorizedRequest {
  string principal_prn = 1;
  string action = 2;
  string resource_prn = 3;
  map<string, string> context = 4;
}
message IsAuthorizedResponse {
  bool allowed = 1;
  repeated string determining_policies = 2;
  string reason = 3;
}
message Policy {
  string policy_id = 1;
  string kind = 2;
  string source = 3;
  string description = 4;
  bool system = 5;
}
message PutPolicyRequest {
  Policy policy = 1;
} // upsert; validated; rejects system ids
message PutPolicyResponse {
  Policy policy = 1;
}
message DeletePolicyRequest {
  string policy_id = 1;
}
message DeletePolicyResponse {}
message ListPoliciesRequest {
  uint32 limit = 1;
  uint64 offset = 2;
}
message ListPoliciesResponse {
  repeated Policy policies = 1;
}
message RoleGrant {
  string id = 1;
  string principal_prn = 2;
  string role_key = 3;
  string scope_prn = 4;
}
message GrantRoleRequest {
  string principal_prn = 1;
  string role_key = 2;
  string scope_prn = 3;
}
message GrantRoleResponse {
  RoleGrant grant = 1;
}
message RevokeRoleRequest {
  string id = 1;
}
message RevokeRoleResponse {}
message ListRoleGrantsRequest {
  string principal_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListRoleGrantsResponse {
  repeated RoleGrant grants = 1;
}

service AuthorizationService {
  rpc IsAuthorized(IsAuthorizedRequest) returns (IsAuthorizedResponse);
  rpc PutPolicy(PutPolicyRequest) returns (PutPolicyResponse);
  rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
  rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
  rpc GrantRole(GrantRoleRequest) returns (GrantRoleResponse);
  rpc RevokeRole(RevokeRoleRequest) returns (RevokeRoleResponse);
  rpc ListRoleGrants(ListRoleGrantsRequest) returns (ListRoleGrantsResponse);
  // Root-only, and additionally gated on the iam.authz.cedar capability,
  // mirroring the HTTP route's placement behind caps.authz_admin.
  rpc RetireSystemPolicy(RetireSystemPolicyRequest) returns (RetireSystemPolicyResponse);
}

// ServiceAccount is a machine identity: a principal PRN owned by exactly one
// tenancy node (org/team/project). It reuses the unified Principal type
// (M3 D1) — status lives on the principal row, not here — so `status` mirrors
// IntrospectResponse.status (a free-form principal-status string) rather than
// a dedicated enum.
message ServiceAccount {
  string prn = 1;
  string owner_prn = 2;
  string name = 3;
  string status = 4; // principal status
  paigasus.common.v1.AuditMetadata audit = 5;
}

enum ApiKeyStatus {
  API_KEY_STATUS_UNSPECIFIED = 0;
  API_KEY_STATUS_ACTIVE = 1;
  API_KEY_STATUS_REVOKED = 2;
}

// ApiKey never carries the secret or its hash — only display/lifecycle
// metadata. The plaintext token is returned exactly once, in
// IssueApiKeyResponse.token.
message ApiKey {
  string id = 1;
  string service_account_prn = 2;
  string scope_prn = 3;
  string prefix = 4;
  ApiKeyStatus status = 5;
  google.protobuf.Timestamp expires_at = 6;
  google.protobuf.Timestamp last_used_at = 7;
  repeated string scope_actions = 8; // stored, unenforced in v1
  repeated string scope_roles = 9; // stored, unenforced in v1
  paigasus.common.v1.AuditMetadata audit = 10;
}

message CreateServiceAccountRequest {
  string owner_prn = 1;
  string name = 2;
}
message CreateServiceAccountResponse {
  ServiceAccount service_account = 1;
}
message GetServiceAccountRequest {
  string prn = 1;
}
message GetServiceAccountResponse {
  ServiceAccount service_account = 1;
}
message ListServiceAccountsRequest {
  string owner_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListServiceAccountsResponse {
  repeated ServiceAccount service_accounts = 1;
}
message ArchiveServiceAccountRequest {
  string prn = 1;
}

// Archive is a lifecycle op with no meaningful payload (like DetachMembership):
// an empty response avoids requiring GetServiceAccount authz alongside
// ArchiveServiceAccount just to populate a body.
message ArchiveServiceAccountResponse {}

message IssueApiKeyRequest {
  string service_account_prn = 1;
  string scope_prn = 2;
  google.protobuf.Timestamp expires_at = 3; // unset = uses the configured default expiry if one is set, else non-expiring
  repeated string scope_actions = 4;
  repeated string scope_roles = 5;
}
message IssueApiKeyResponse {
  ApiKey api_key = 1;
  string token = 2; // plaintext token, shown once
}
message RevokeApiKeyRequest {
  string id = 1;
}
message RevokeApiKeyResponse {}
message ListApiKeysRequest {
  string service_account_prn = 1;
  uint32 limit = 2;
  uint64 offset = 3;
}
message ListApiKeysResponse {
  repeated ApiKey api_keys = 1;
}

service ServiceAccountService {
  rpc CreateServiceAccount(CreateServiceAccountRequest) returns (CreateServiceAccountResponse);
  rpc GetServiceAccount(GetServiceAccountRequest) returns (GetServiceAccountResponse);
  rpc ListServiceAccounts(ListServiceAccountsRequest) returns (ListServiceAccountsResponse);
  rpc ArchiveServiceAccount(ArchiveServiceAccountRequest) returns (ArchiveServiceAccountResponse);
  rpc IssueApiKey(IssueApiKeyRequest) returns (IssueApiKeyResponse);
  rpc RevokeApiKey(RevokeApiKeyRequest) returns (RevokeApiKeyResponse);
  rpc ListApiKeys(ListApiKeysRequest) returns (ListApiKeysResponse);
}

// AuditEntry is a single row of the append-only audit log (SMA-446): authz
// denials in Slice A, committed mutations in Slice B. `detail_json` is a
// JSON-serialized string (not a structured message) since the persistence
// layer stores detail as serialized TEXT.
message AuditEntry {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string actor_prn = 3;
  string action = 4;
  string resource_prn = 5;
  string outcome = 6;
  repeated string determining_policies = 7;
  string detail_json = 8;
  string correlation_id = 9;
}

// Optional scalar filters use empty-string/zero sentinels (mirrors the other
// request messages in this file): an empty string / zero timestamp means
// "unfiltered" on that field.
message ListAuditEntriesRequest {
  string actor_prn = 1;
  string resource_prn = 2;
  string action = 3;
  string outcome = 4;
  google.protobuf.Timestamp from = 5;
  google.protobuf.Timestamp to = 6;
  string cursor = 7;
  uint32 limit = 8; // limit 0 => server default
}
message ListAuditEntriesResponse {
  repeated AuditEntry entries = 1;
  string next_cursor = 2;
}

service AuditService {
  rpc ListAuditEntries(ListAuditEntriesRequest) returns (ListAuditEntriesResponse);
}

// ─────────────────────────────────────────────────────────────────────────
// Users (SMA-501). CreateUser has NO per-action authorization — it requires
// a bearer and nothing more, mirroring `POST /v1/users` exactly. That is a
// deliberate parity decision, not an oversight: see the design doc's D0.
// It lives on its own service rather than on TenancyService precisely so
// that property is visible in the contract instead of hidden among 21
// authorized RPCs.
// ─────────────────────────────────────────────────────────────────────────
message CreateUserRequest {
  string email = 1;
  string display_name = 2;
  // Empty means unset. This DIVERGES from HTTP, where `{"locale": ""}`
  // persists an empty string rather than NULL (design doc D11). The proto
  // sentinel is normative for gRPC; HTTP is unchanged.
  string locale = 3;
  string timezone = 4;
}
message CreateUserResponse {
  string principal_prn = 1;
}

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
}

// ─────────────────────────────────────────────────────────────────────────
// System-policy retirement (SMA-501), mirroring
// POST /v1/authz/system-policies/{id}/retire.
// ─────────────────────────────────────────────────────────────────────────
message RetireSystemPolicyRequest {
  string policy_id = 1;
  // Absent == false == "not acknowledged". The safe reading of an
  // unspecified acknowledgement is "no", so the flag must be set
  // deliberately to take effect.
  bool acknowledge_decision_change = 2;
}

// One grant blocking a role retirement. Deliberately NOT the existing
// RoleGrant: this mirrors the HTTP body's three fields exactly, and
// role_key is carried once on RetirementBlocked rather than repeated.
message SurvivingGrant {
  string id = 1;
  string principal_prn = 2;
  string scope_prn = 3;
}

message RetiredPolicy {
  string policy_id = 1;
  string kind = 2; // "static" or "template"
  bool role_deleted = 3;
}

// A refusal, not an error: nothing was written because grants of this role
// survive and must be revoked first. `role_key` is a gRPC-only field — the
// HTTP twin carries it only inside its error message prose (design D6).
message RetirementBlocked {
  string role_key = 1;
  repeated SurvivingGrant grants = 2;
  uint64 total_surviving = 3;
  bool truncated = 4;
}

// A refusal, not an error: this is a STATIC policy, so removing it changes
// decisions fleet-wide and the caller has not acknowledged that. Carries
// what would be destroyed, so the refusal doubles as the operator's
// preview. `policy_id` is a gRPC-only field (design D6).
message RetirementNeedsAcknowledgement {
  string policy_id = 1;
  string kind = 2;
  string source = 3;
  string description = 4;
}

// All three outcomes return gRPC OK: the two refusals are outcomes that
// are not Retired, never server errors (design D3). Two consequences a
// client MUST handle:
//   1. An UNSET `outcome` is a protocol error. Treat it as failure, never
//      as a successful retirement.
//   2. The HTTP twin answers the two refusals with 409 plus a registry
//      error code; this response carries neither. The payload fields are
//      the same, the status is not.
message RetireSystemPolicyResponse {
  oneof outcome {
    RetiredPolicy retired = 1;
    RetirementBlocked blocked = 2;
    RetirementNeedsAcknowledgement needs_acknowledgement = 3;
  }
}

// ─────────────────────────────────────────────────────────────────────────
// Outbox dead letters (SMA-501), mirroring /v1/outbox/dead-letters.
// Every RPC here is Root-only, enforced server-side in the IAM service's
// application layer: nothing about a dead letter's contents reaches a
// non-Root caller.
//
// A caveat for the time filters, not a bug: a row with parked_at unset can
// never satisfy parked_from/parked_to, because Postgres never evaluates a
// NULL comparison as true. Such a row is invisible to ListDeadLetters
// whenever either bound is set. It stays reachable via an unfiltered list.
// ─────────────────────────────────────────────────────────────────────────
message DeadLetterEntry {
  string id = 1;
  google.protobuf.Timestamp occurred_at = 2;
  string event_type = 3;
  int32 schema_version = 4;
  string aggregate_prn = 5;
  string actor_prn = 6; // empty => none
  string payload = 7; // JSON-serialized string, like AuditEntry.detail_json
  string correlation_id = 8; // empty => none
  uint32 attempts = 9;
  google.protobuf.Timestamp parked_at = 10; // absent => not parked
  string last_error = 11; // empty => none
}

// Optional filters use absent/empty/zero sentinels, mirroring
// ListAuditEntriesRequest. An ABSENT timestamp means unfiltered; a PRESENT
// but unrepresentable one is INVALID_ARGUMENT and never silently
// unfiltered (design D10).
message ListDeadLettersRequest {
  string event_type = 1;
  google.protobuf.Timestamp parked_from = 2;
  google.protobuf.Timestamp parked_to = 3;
  string cursor = 4;
  uint32 limit = 5; // 0 => server default; clamped to 200
}
message ListDeadLettersResponse {
  repeated DeadLetterEntry entries = 1;
  string next_cursor = 2; // set only when the page came back FULL
}

message ReplayDeadLetterRequest {
  string id = 1;
}
message ReplayDeadLetterResponse {
  DeadLetterEntry entry = 1;
}
message DiscardDeadLetterRequest {
  string id = 1;
}
message DiscardDeadLetterResponse {
  DeadLetterEntry entry = 1;
}

// Named BulkReplayDeadLetters, not ReplayDeadLetters: one character from
// ReplayDeadLetter while replaying up to 10000 rows instead of one, on a
// destructive operator surface, with no lint rule that would catch the
// typo. Matches the BulkReplayRequest type it maps onto.
//
// Not atomic: rows are replayed incrementally, so a DEADLINE_EXCEEDED or a
// cancelled RPC may leave an unknown number already replayed. Re-issuing is
// safe — an already-replayed row is no longer parked and therefore no
// longer matches.
message BulkReplayDeadLettersRequest {
  string event_type = 1;
  google.protobuf.Timestamp parked_from = 2;
  google.protobuf.Timestamp parked_to = 3;
  // 0 is rejected as invalid-bulk-replay before any store access, and an
  // absent field collapses to 0, so "didn't say" and "said zero" are
  // rejected identically — exactly HTTP's behavior. This is DELIBERATE.
  // Do NOT "fix" it into an optional: the explicit row budget is the guard
  // on blast radius and must never default to anything usable.
  // Silently clamped to 10000, with no signal to the caller, on both
  // transports.
  uint64 max_rows = 4;
}
message BulkReplayDeadLettersResponse {
  uint64 replayed = 1;
}

service OutboxService {
  rpc ListDeadLetters(ListDeadLettersRequest) returns (ListDeadLettersResponse);
  rpc ReplayDeadLetter(ReplayDeadLetterRequest) returns (ReplayDeadLetterResponse);
  rpc BulkReplayDeadLetters(BulkReplayDeadLettersRequest) returns (BulkReplayDeadLettersResponse);
  rpc DiscardDeadLetter(DiscardDeadLetterRequest) returns (DiscardDeadLetterResponse);
}
