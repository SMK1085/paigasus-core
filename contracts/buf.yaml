version: v2
modules:
  - path: proto
# googleapis is declared so the lockfile + lint posture are ready before the
# first proto imports google.protobuf.* / google.api.* — nothing imports it yet.
deps:
  - buf.build/googleapis/googleapis
lint:
  use:
    - STANDARD
  except:
    # The directory already encodes the version, so don't also require the
    # package path to match the directory.
    - PACKAGE_DIRECTORY_MATCH
breaking:
  use:
    - FILE
  # TEMP (SMA-389): allow the one-time deletion of the reserved.proto placeholder.
  # buf FILE_NO_DELETE flags it vs main; remove this ignore in a follow-up once
  # main no longer carries reserved.proto.
  ignore:
    - proto/paigasus/common/v1/reserved.proto
