# The retry/concurrency policy for paigasus-iam's Docker-backed integration tests (SMA-521).
#
# Deliberately on `profile.default`, NOT a `[profile.ci]`: a `ci` profile only applies with
# `--profile ci`, which the inherited `.moon/tasks/rust.yml` command
# (`cargo nextest run --no-tests=pass`) does not pass. Putting it on the default profile is what
# makes Moon, the manual command, and a developer's bare `cargo nextest` all read ONE definition.
# Note `cargo test` picks up none of this — nextest config is nextest-only.
nextest-version = { required = "0.9.136" }

# Bounds how many tests in this group start containers concurrently, ON TOP OF the global
# `test-threads` (left at its default so non-container crates keep full parallelism).
#
# Floored at 4 on purpose: CI (`ubuntu-latest`, 4 vCPU on this public repo) already runs only
# ~4-way, so a cap >= 4 is provably a no-op there and cannot serialize the graph into ci.yml's
# 30-minute job timeout. The win is local, where a bare `cargo nextest` otherwise fires 18
# concurrent container startups at an 8-CPU Docker VM.
#
# NOTE this cap is per nextest PROCESS, not global: `moon ci` runs `paigasus-iam-rs:test` and
# `repo:nats-permissions` as separate tasks, each with its own budget.
#
# MEASURED 2026-08-16 on an 18-logical-CPU Apple M5 Max macOS host with an 8-CPU / ~7.8 GB
# Docker VM (Docker 29.6.2), `CI=1 cargo nextest run -p paigasus-iam`, two runs each (wall clock
# via `time`, all runs 873 passed / 0 skipped):
#   uncapped (test-group commented out): 55.8s (1 leaky) / 123.4s (1 flaky: postgres conn timeout)
#   max-threads = 8: 84.7s (clean) / 84.0s (clean)
#   max-threads = 6: 99.5s (2 flaky) / 126.6s (1 flaky)
#   max-threads = 4: 109.0s (clean, matches the prior 108.4s reference) / 145.0s (1 flaky, 1 leaky)
#
# CAVEAT: n=2 per config, run SEQUENTIALLY in increasing-cap order (uncapped, 4, 6, 8 — never
# randomized/interleaved), so a warm-up effect (Docker layer cache, connection pools, OS file
# cache) favoring later-tested configs cannot be excluded. Partial cross-session corroboration
# exists for 4 (Task 3, a separate earlier session, independently measured 108.4s, matching this
# run's 109.0s) but NOT for 8, which has no such replicate.
#
# Chose 8, NOT the floor of 4 — on VARIANCE, not raw speed. Read literally against the table
# above, "8 is fastest" is FALSE: uncapped's single best run (55.8s) beats every capped run
# tested, including both cap=8 runs. What 8 has is PREDICTABILITY and the best average: its two
# runs span only 84.0-84.7s (a 0.7s range) against uncapped's 55.8-123.4s (a 68s range), and its
# 84.3s average beats uncapped's 89.6s, cap=6's 113.1s, and cap=4's 127.0s. cap=4 hit the same
# postgres connection-timeout mode uncapped hit; cap=6 also flaked (twice in one run, once in the
# other) but its captured output does not record the failure mode, so that comparison is not
# claimed; cap=8 hit no failure of any kind in either run.
#
# The brief's literal "within ~30% of the uncapped baseline" rule is ambiguous on this data:
# against uncapped's AVERAGE (89.6s) both 6 (+26%) and 8 (-6%) qualify, which by "lowest cap
# that qualifies" would pick 6; against uncapped's fastest single run (55.8s) nothing qualifies.
# Neither reading is stable given the spreads above, so variance — not the 30% rule — is what
# actually drove this choice.
#
# Re-derive by repeating the above, ideally randomizing/interleaving run order across configs to
# rule out the warm-up confound; the optimum tracks Docker VM capacity, not host CPU count.
[test-groups.docker-containers]
max-threads = 8

# ORDER IS LOAD-BEARING. nextest applies "the first override that matches the test and
# configures the setting" — first-match-wins PER SETTING, evaluated top-to-bottom. The general
# `kind(test)` override below also matches keycloak_e2e and also sets `retries`, so if it came
# first this narrower block would never apply and the safeguard would exist only as a comment.
# Specific before general.
[[profile.default.overrides]]
# keycloak_e2e starts a Keycloak with a 240s startup timeout (tests/keycloak_e2e.rs:79). Three
# attempts of a genuinely failing run would be ~18 minutes against ci.yml's 30-minute budget.
filter = 'package(=paigasus-iam) and test(keycloak)'
retries = 1

[[profile.default.overrides]]
# `=` is an exact-match matcher. Verified that the bare form does NOT match `paigasus-iam-core`
# either, but the explicit form means no reader has to know the matcher's semantics.
# `kind(test)` selects integration-test targets only, so paigasus-iam's own --lib unit tests and
# every other crate keep retries = 0 — a flaky pure-logic test must still red immediately.
filter = 'package(=paigasus-iam) and kind(test)'
# Attempts land at roughly t, t+15s, t+45s. Sized against a MEASURED contention window: see
# tests/nats_publisher.rs:51-58, where a full-suite run that normally takes 3.7s took 33s under
# load. A flat 2s backoff would put all three attempts inside that window and absorb nothing.
retries = { backoff = "exponential", count = 2, delay = "15s", max-delay = "60s", jitter = true }
# The keycloak override above deliberately does NOT set `test-group`, so keycloak_e2e still
# picks up the group from here — precedence is per-setting, so a narrower block only overrides
# the settings it names.
test-group = 'docker-containers'

# `.moon/tasks.yml` sets `taskOptions.outputStyle: 'buffer-only-failure'`, so a task that goes
# green-with-flakes prints NOTHING — the FLAKY signal this design's safety argument depends on is
# otherwise invisible in CI. Task 5 adds the ci.yml step that uploads this report as an artifact.
[profile.default.junit]
path = 'junit.xml'
