[workspace]
# ONE wildcard level per entry. `crates/*/*` reads identically to Cargo, but Dependabot's cargo
# file fetcher cannot expand it: `expand_workspaces` lists exactly one directory level, so it
# sees `crates/libs`, `crates/services`, `crates/bindings` and then drops all three, because
# `File.fnmatch?("crates/*/*", "crates/libs")` is false. It then found ZERO members and built its
# sandbox from the five crates still reachable through `path =` in [workspace.dependencies]. Cargo
# re-resolved that 5-member workspace down to 176 packages, which is both the recurring truncated
# rs/Cargo.lock (SMA-601 gates the symptom) and the hard `Failed to update serde!` that failed
# every `cargo in /rs` job from 2026-08-17 on. Keep each entry at one `*` (SMA-604).
members  = ["crates/bindings/*", "crates/libs/*", "crates/services/*"]
resolver = "3"

[workspace.package]
edition      = "2024"
license      = "Apache-2.0"
rust-version = "1.95"
authors      = ["Paigasus contributors"]

# Versions here are only frozen in Cargo.lock once a workspace member opts in via
# `<dep>.workspace = true`. The stubs consume none of these yet, so today's lock pins
# almost nothing — each dep is resolved by its first real consumer. Feature lists are a
# MINIMAL baseline: they union across the workspace and can't be removed per-crate, so
# crates ADD the features they need rather than this table enabling everything.
[workspace.dependencies]
axum = "0.8"
tower = "0.5"
# http: the protocol-agnostic `Request`/`Response`/`HeaderValue`/`StatusCode` types axum and tonic
# both build on. `paigasus-observability`'s correlation layer (SMA-504) is written against these
# rather than axum's re-exports, which is what lets ONE `tower::Layer` wrap an axum router and a
# tonic server alike. Already in Cargo.lock transitively (axum/hyper/tonic); this only promotes it.
http = "1"
# tower-http: TraceLayer (request/response spans) + TimeoutLayer for `paigasus-iam`'s
# `serve_http` helper (SMA-441 Task 11 — the first consumer).
tower-http = { version = "0.6", features = ["trace", "timeout"] }
# tokio: no feature baseline — services add rt-multi-thread/macros/time/sync/signal;
# libraries take a strict subset (avoid `macros`, which pulls in #[tokio::main]/tokio::test).
tokio = { version = "1" }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
# uuid: NO rng feature. v4/v7/rng transitively pull `getrandom`, which does not build on
# wasm32-unknown-unknown without a JS cfg — and the kernel (uuid's first consumer) is bound to
# wasm. The kernel mints UUIDv7 from injected bytes via `Uuid::from_bytes` (no feature needed);
# parse/Display/as_hyphenated are in default features. Add features per-consumer if ever needed
# (SMA-448).
uuid = { version = "1" }
# rand: host entropy source for service adapters (e.g. paigasus-iam's `KernelIdGenerator`
# feeds random bytes into the kernel's pure `mint_uuid7`). Native-only consumer — must not
# leak into the wasm-bindgen crate's dependency tree (same getrandom/wasm concern as uuid
# above); `moon run repo:wasm-getrandom-free` guards this.
rand = "0.10"
bytes = "1"
# Proto codegen runtimes — versions track the pinned neoeinstein-prost/tonic
# v0.5.0 plugins (prost 0.14 / tonic 0.14). tonic 0.14 split the prost codec into
# the separate tonic-prost crate; generated service stubs need both. prost-types
# supplies ::prost_types::Timestamp etc.: prost emits those paths for google.protobuf.*
# well-known types because compile_well_known_types is set only on the tonic plugin,
# not prost (contracts/buf.gen.yaml), so consumers of WKT-bearing messages need it.
prost       = "0.14"
prost-types = "0.14"
tonic       = "0.14"
tonic-prost = "0.14"
# tonic-health — the well-known `grpc.health.v1.Health` service (M0 walking skeleton,
# SMA-441 Task 9). Tracks the pinned tonic 0.14 line.
tonic-health = "0.14"
# tonic-types — google.rpc.* richer-error details (ErrorDetails/StatusExt). Production dep on
# BOTH services: iam emits ErrorInfo, the gateway reads it (SMA-504, ADR-0019 decision 4).
tonic-types = "0.14"
# tokio-stream — wraps a `TcpListener` into the `Stream` tonic's `serve_with_incoming`
# expects. Consumers add the features they need (e.g. the iam service's gRPC boot test
# needs `net` for `TcpListenerStream`); no default features at the workspace baseline.
tokio-stream = { version = "0.1", default-features = false }
thiserror = "2"
anyhow = "1"
figment = { version = "0.10", features = ["toml", "env"] }
# Prefer native `async fn` in traits (stable since 1.75); use async-trait only when
# `dyn Trait` is required (per the Notion Rust guidelines).
async-trait = "0.1"
futures = "0.3"
# TLS baseline is rustls + json. If a service needs gzip/brotli/cookies, opt in PER CRATE —
# do NOT set default-features = true here (it re-introduces openssl across the workspace).
#
# BOTH root-store features are on deliberately (SMA-558 D1). reqwest builds ONE RootCertStore by
# UNION: `add_root_certificate()` calls, then webpki roots if `rustls-tls-webpki-roots`, then the
# platform store if `rustls-tls-native-roots` (async_impl/client.rs:687-732). So this yields
# webpki ∪ /etc/ssl/certs ∪ any explicitly configured bundle, not a choice between them — which is
# what lets an operator trust a private-CA IdP without `accept_invalid_tls`.
#
# Keeping `rustls-tls` alongside is NOT redundancy. reqwest errors on a native store only when it
# finds certificates that ALL fail to parse (client.rs:715); an ABSENT or EMPTY store falls through
# and yields a client with zero anchors that fails every handshake at request time. The webpki
# roots are the floor that makes that unrepresentable.
#
# Both features alias through to `__rustls-ring` (reqwest/Cargo.toml:148,154-172), so there is no
# second CryptoProvider — cf. the aws-lc-rs note on `async-nats` below.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "rustls-tls-native-roots", "json"] }
# jsonwebtoken — JWT decode/verify + the `jwk` module (`JwkSet`/`Jwk`, `DecodingKey::from_jwk`)
# for the OIDC adapter's JWKS cache (SMA-443 Task 6) and validator (Task 7). MIT-licensed.
jsonwebtoken = "10"
# base64 — already an indirect dep via jsonwebtoken; the validator (SMA-443 Task 7) uses it
# directly (URL_SAFE_NO_PAD engine) to base64url-decode a token's payload segment for the
# UNVERIFIED `iss` read that picks which issuer's JWKS to check against.
base64 = "0.23"
# PyO3 — Rust↔Python FFI for the bindings crates (ADR-0005). `abi3-py312` builds one
# stable-ABI wheel for CPython >=3.12 (matches the py workspace's requires-python); the
# `extension-module` feature omits the libpython link so plain `cargo build` works without
# an embedded interpreter. macOS needs the link flags in rs/.cargo/config.toml.
pyo3 = { version = "0.29", features = ["abi3-py312", "extension-module"] }
# napi-rs — Rust↔Node FFI for the node binding crate (ADR-0005). napi/napi-derive are the
# runtime + proc-macro (consumed via #[napi] macros); napi-build runs in build.rs to set up the
# cdylib link. Node resolves N-API symbols at load (like CPython resolves PyO3's), so plain
# `cargo build` links the cdylib without an embedded Node; macOS needs the rs/.cargo/config.toml
# `-undefined dynamic_lookup` flags (shared with PyO3). Versions track the @napi-rs/cli 3 line
# (Polyglot Monorepo Scoping §3); spike confirms the napi-build pairing.
napi = { version = "3", default-features = false, features = ["napi8"] }
napi-derive = "3"
napi-build = "2"
# wasm-bindgen — Rust↔browser/Edge FFI for the wasm binding crate (ADR-0005). Consumed via the
# #[wasm_bindgen] macro; the cdylib's wasm imports (__wbindgen_*) resolve at INSTANTIATION on the
# wasm32-unknown-unknown target, so — unlike the PyO3/napi cdylibs — it needs NO rs/.cargo/config.toml
# link flags. wasm-pack (proto-pinned) fetches the matching wasm-bindgen-cli for whatever 0.2.z this
# caret resolves to. INVARIANT: the pinned wasm-pack must support that 0.2.z (crate↔CLI compat is exact
# per 0.2.z) — bump the two together (dependency-bump runbook), or this re-introduces the schema
# mismatch the proto pin was meant to avoid.
wasm-bindgen = "0.2"
# proptest — property-based coverage of the kernel's behavioral properties (the "against the
# Rust impl" half of the ADR-0005 parity harness, SMA-433). Dev-dependency only — never enters a
# published artifact.
proptest = "1"
# syn / quote / proc-macro2 — the proc-macro toolchain for `paigasus-proto-derive` (SMA-438's
# #[derive(Auditable)]). All three are ALREADY in Cargo.lock as transitive deps of async-trait
# and thiserror-impl (proc-macro2 1.0.106, quote 1.0.45, syn 2.0.117 AND syn 3.0.3), so this
# pins what is already resolved rather than adding to the build. `full` is needed by
# paigasus-proto's drift test, which calls `syn::parse_file` over the generated sources; the
# derive crate itself needs only the default features.
syn = { version = "3", features = ["full"] }
quote = "1"
proc-macro2 = "1"
# In-tree path dep: the derive crate that generates `impl Auditable` for DTOs embedding
# AuditMetadata. `paigasus-proto` re-exports it, and buf injects it onto the generated
# messages — same in-tree-freshness rationale as paigasus-kernel/paigasus-proto above.
# PUBLISH ORDER (SMA-577): this crate must publish BEFORE paigasus-proto, which depends on
# it. repo:publish-metadata expresses that as a publish GROUP (a connected component of the
# in-set dependency graph, computed at runtime from `publish = true` crates), running one
# `cargo publish --dry-run -p paigasus-proto-derive -p paigasus-proto`.
paigasus-proto-derive = { path = "crates/libs/paigasus-proto-derive", version = "0.1.1" }
# In-tree path dep: the bindings (and future consumers) build against the live kernel, so a
# kernel edit rebuilds them. This is also the cargo-side half of the affected-graph edge.
paigasus-kernel = { path = "crates/libs/paigasus-kernel", version = "0.1.0" }
# In-tree path dep: paigasus-iam's gRPC adapter binds the generated `paigasus.iam.v1` types
# (Task 16) — same in-tree-freshness rationale as paigasus-kernel above.
paigasus-proto = { path = "crates/libs/paigasus-proto", version = "0.1.1" }
# In-tree path dep: the shared observability lib (metrics recorder, `/metrics` router, axum
# request-metrics layer, metric-name registry — SMA-446 Unit 1). Service crates instrument
# their hot paths through it (Unit 2 — `paigasus-gateway` is the first consumer); same
# in-tree-freshness rationale as paigasus-kernel/paigasus-proto above.
paigasus-observability = { path = "crates/libs/paigasus-observability", version = "0.0.0" }
# paigasus-service-info — the shared `ServiceInfo` builder + HTTP DTO (SMA-505). Owns the wire
# invariants both services must not re-derive: the UNSPECIFIED sentinel is never advertised,
# ordering is deterministic, and `capabilities` is always emitted (as `[]` when empty) so a
# client doing `info.capabilities.includes(k)` cannot throw.
paigasus-service-info = { path = "crates/libs/paigasus-service-info", version = "0.0.0" }
# sea-orm — async ORM for service persistence adapters (paigasus-iam's AppState/readyz ping,
# later the Postgres repository). `runtime-tokio-rustls` keeps the TLS posture on rustls/ring
# (see reqwest above) instead of native-tls/openssl; `sqlx-postgres` is the only backend we run.
sea-orm = { version = "1", default-features = false, features = [
  "sqlx-postgres", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono",
] }
# sea-orm-migration — the migration runner (`MigratorTrait`/`SchemaManager`) for the m0001
# DDL. Same backend posture as `sea-orm` above (sqlx-postgres + rustls).
sea-orm-migration = { version = "1", default-features = false, features = [
  "sqlx-postgres", "runtime-tokio-rustls",
] }
# redis — external, shared `JwksCache` backend (paigasus-iam's `RedisJwksCache`, SMA-443
# Task 8). `tokio-comp` selects the tokio async runtime (matches the workspace's tokio
# baseline); `connection-manager` gives an auto-reconnecting client so a transient Redis
# blip doesn't need bespoke retry logic in the adapter. `tokio-rustls-comp` +
# `tls-rustls-webpki-roots` enable `rediss://` URLs (the D15 trust note requires TLS on
# the JWKS cache; rustls + bundled webpki roots match the reqwest posture above — no
# second crypto provider). Default features (acl/streams/geospatial/script/num-bigint)
# are all unneeded for a plain SET/GET cache, so trimmed — same "minimal baseline, add
# per-crate" posture as reqwest/sea-orm above.
redis = { version = "1", default-features = false, features = [
  "tokio-comp", "connection-manager", "tokio-rustls-comp", "tls-rustls-webpki-roots",
] }
# cedar-policy — embedded Cedar authorization engine (ADR-0013). Pure evaluation; only
# consumed by paigasus-iam-core + paigasus-iam. NOT in the wasm/binding tree.
cedar-policy = "4"
# blake3 — decision-cache key hashing (`paigasus-iam`'s `adapters::authz::decision_cache`,
# SMA-444 Task 14): a canonical `(principal, action, resource, context)` serialization is
# blake3-hashed into the Redis/in-proc key
# `iam:authz:dec:<policy_content>:<entity_gen>:<hash>`. blake3 also computes the
# `<policy_content>` component itself — `CompiledPolicies::content_hash`, a hash of the stored
# policy documents + role grants, which replaced the Redis-sourced `policy_gen` counter in that
# key (SMA-470 D4: a counter that can stall or reset to 0 lets a pre-revoke key space be
# re-entered; a content hash cannot).
# Only consumed by `paigasus-iam`; no wasm/binding exposure (SMA-448's getrandom-free posture
# is unaffected — blake3's default features carry no OS-entropy dependency).
blake3 = "1"
# url — WHATWG URL Standard parsing. `paigasus-iam` validates `[outbox.publisher].source` with it: the value
# is copied verbatim into every published CloudEvents envelope, so a malformed one ships
# spec-violating events to external subscribers (SMA-471). Promoted to a direct dependency rather
# than hand-rolling a check — it is ALREADY in the tree transitively via `async-nats` and `redis`,
# so this costs no additional build or supply-chain surface.
#
# NOTE the contract this pins is deliberately NARROWER than CloudEvents': the spec allows any RFC
# 3986 URI-*reference* (relative included) and only RECOMMENDs an absolute URI, while `Url::parse`
# implements the WHATWG standard and accepts absolute URIs only. That is the intent — `source`
# must stay stable for a stream's lifetime (SMA-471 D6), so a relative reference is not something a
# deployment should be able to set. Verified empirically that no realistic absolute scheme is lost:
# `urn:`, `tag:`, `mailto:`, bare custom schemes and the six WHATWG "special" schemes all parse
# (`config::tests::every_realistic_absolute_uri_scheme_is_accepted`).
url = "2"
# metrics / metrics-exporter-prometheus — the `metrics` facade + Prometheus exporter that back
# `paigasus-observability` (SMA-446). The exporter is `default-features = false`: we install the
# global recorder in-process and render the exposition through our own axum `GET /metrics` route,
# so the bundled hyper `http-listener` / `push-gateway` transports are dead weight. Versions track
# `metrics` 0.24 (facade) + `metrics-exporter-prometheus` 0.18 (their compatible pairing).
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
# async-nats — the official NATS Rust client, and `paigasus-iam`'s outbox `EventPublisher`
# backend (ADR-0016, SMA-471). `default-features = false` for the same "minimal baseline, add
# per-crate" reason as reqwest/sea-orm/redis above: the default set drags in object-store, kv,
# websockets, service and nuid, none of which a publisher needs. `jetstream` is the one that
# earns its keep — the ack-waiting publish and the stream-config verification both live there.
# `server_2_10`/`server_2_11` gate the newer stream-config fields against the broker versions
# ADR-0016 targets.
#
# TLS posture: the crate offers `ring` and `aws-lc-rs`. `ring` is selected explicitly to match
# the workspace's rustls/ring baseline (see reqwest/sea-orm/redis above) — `aws-lc-rs` would
# link a SECOND rustls CryptoProvider and panic at runtime with "no process-level
# CryptoProvider available", as well as adding a native cmake build dep. `nkeys` backs the
# `.creds` (JWT + nkey seed) auth `[outbox.publisher].credentials_file` allows.
async-nats = { version = "0.50", default-features = false, features = [
  "jetstream", "ring", "server_2_10", "server_2_11", "nkeys",
] }
# nkeys — NATS ed25519 key handling, a DIRECT dependency of `paigasus-iam` since SMA-493.
# Already in the tree transitively (async-nats' own `auth_utils` under the `nkeys` feature this
# workspace enables), so this pins no new build weight. It is needed directly because
# async-nats' `.creds` parser is `pub(crate)`: rotation-safe auth re-reads and re-signs on every
# connection attempt via `ConnectOptions::with_auth_callback`, which hands us a raw nonce and
# expects a signature back (SMA-493 D8). Version tracks what async-nats 0.50 resolves.
nkeys = "0.4.5"

# Lint posture: rustc warnings deny in-source; clippy warns in-source and is denied in CI
# via the Moon `lint` task's `-D warnings`.
[workspace.lints.rust]
warnings = "deny"

[workspace.lints.clippy]
all = "warn"
