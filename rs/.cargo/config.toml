# SMA-409/420: the FFI binding cdylibs (paigasus-py-bindings = PyO3 extension-module;
# paigasus-node-bindings = napi-rs) leave their host-runtime symbols intentionally undefined at
# link time — CPython resolves _Py* and Node resolves napi_* when they load the module.
# Linux/ELF permits undefined symbols in shared objects by default; the macOS
# linker rejects them unless told to defer resolution. These flags let `cargo build` link
# the extension on macOS WITHOUT maturin. Scoped to apple-darwin so every other target keeps
# strict link-time symbol checking; CI (Linux) is unaffected.
#
# NOTE: cargo finds this file by walking up from the working directory, so run cargo from
# inside `rs/` (as CONTRIBUTING/CLAUDE.md document, and as `moon` always does). A workspace
# build launched from the repo ROOT won't pick up these flags and fails to link the cdylib
# on macOS with undefined `_Py*` symbols.
#
# SMA-767: the strip rustflag on macOS.
# rustc 1.95 strips release Mach-O output with `rust-objcopy`.
# `rust-objcopy` does not pad after the indirect symbol table.
# With an odd count of indirect symbols, the string pool is only 4-byte aligned.
# dyld on macOS 27 rejects that alignment for a binary linked with SDK 27.
# The error is "mis-aligned LINKEDIT". The flag stops the strip step.
# Measured: stroff 402708 (mod 8 = 4) with the strip; 435672 (mod 8 = 0) with `strip=none`.
# The flag is scoped to apple-darwin. On Linux, `strip = "none"` makes the .so 7.7 times larger.
# Remove the flag only when this holds on an odd-count dylib built with the default strip:
# `stroff > indirectsymoff + 4 * nindirectsyms` (spec decision D6).
# The crate-local copy in `rs/crates/bindings/paigasus-py-bindings/.cargo/config.toml`
# must stay in step with this file. A build with cwd in that crate reads both files, and cargo
# joins the two lists, so rustc gets `-C strip=none` twice. That is harmless: measured, the dylib
# has the same stroff (435672) and size from the crate directory and from `rs/`. Do not remove
# either copy: `rs/` builds (napi, cargo) need this one, and the sdist needs the crate-local one.
# This flag reaches host units (proc macros, build scripts) only without `--target`. The CI
# darwin legs pass `--target`, so wheels.yml and prebuild.yml also set
# CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP=none on darwin (SMA-767 R1, see rs/CLAUDE.md).
[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup", "-C", "strip=none"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup", "-C", "strip=none"]
