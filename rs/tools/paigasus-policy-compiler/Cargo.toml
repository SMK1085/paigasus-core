# This crate is a separate cargo workspace, not a member of `rs/` (spec 2026-11-15
# iam-tool-policy-sets, section 5.1). It has its own Cargo.lock. It cannot inherit
# `[workspace.package]` from `rs/`, so it restates the edition, the rust-version and the lints.
[workspace]
resolver = "3"

[package]
name = "paigasus-policy-compiler"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
# Dogwood parses the temporal policy language and lowers it to Cedar plus history conditions.
# Pinned to one commit (version 1.1.1), because the lowering output is part of the IAM contract.
dogwood-language = { git = "https://github.com/dogwood-policy/dogwood", rev = "ff158506cfd9c7871385ed3a87d7435505fd24b1" }
# Dogwood's lowered output is a `cedar_policy::PolicySet`. The scope proof reads policy
# annotations from it. Pinned exactly to the version that the Dogwood commit pins (4.11.0).
cedar-policy = "=4.11.0"
# `Compiled` carries the lowered schema as a Cedar JSON schema value.
serde_json = "1"

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "warn"
