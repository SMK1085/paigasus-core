# This crate is a separate cargo workspace, not a member of `rs/` (spec 2026-11-15
# iam-tool-policy-sets, section 5.1). It has its own Cargo.lock. It cannot inherit
# `[workspace.package]` from `rs/`, so it restates the edition, the rust-version and the lints.
[workspace]
resolver = "3"

[package]
name = "paigasus-policy-compiler"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false

[dependencies]
# Dogwood parses the temporal policy language and lowers it to Cedar plus history conditions.
# Pinned to one commit (version 1.2.0, tag v1.2.0), because the lowering output is part of the IAM contract.
# The `version` restates what that commit holds. cargo-deny reads a git dependency with no
# `version` as a wildcard and `deny.toml` sets `wildcards = "deny"`, so it is required (SMA-774).
dogwood-language = { git = "https://github.com/dogwood-policy/dogwood", rev = "8ffd2106daf08cc3350a45b36866d75b41234ca3", version = "=1.2.0" }
# Dogwood's lowered output is a `cedar_policy::PolicySet`. The scope proof reads policy
# annotations from it. Pinned exactly to the version that the Dogwood commit pins (4.14.0).
# Dogwood 1.1.1 asked for `cedar-policy = "4.11"`; its non-optional `cedar-policy-mcp-schema-generator`
# pinned `=4.11.0`, so 4.11.1 (GHSA-c33x-vcv4-vg3g) could not resolve. Dogwood 1.2.0 pins `=4.14.0`
# itself and makes the generator optional (feature `mcp-schema`, off by default) (SMA-800).
cedar-policy = "=4.14.0"
# `Compiled` carries the lowered schema as a Cedar JSON schema value.
serde_json = "1"
# The JSON protocol with IAM (spec section 5.2).
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# The golden-output pin hash (spec section 6.2), as `EXPECTED_GOLDEN_HASH` in `tests/golden.rs`.
blake3 = "1"
# `raw_value` lets the corpus test read the number token of each argument as written. The
# feature adds no crate, so the lockfile does not change.
serde_json = { version = "1", features = ["raw_value"] }

[lints.rust]
warnings = "deny"

[lints.clippy]
all = "warn"
