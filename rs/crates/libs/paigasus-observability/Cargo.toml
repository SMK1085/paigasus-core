# SPDX-License-Identifier: Apache-2.0

[package]
name = "paigasus-observability"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
axum.workspace = true
tonic.workspace = true
tracing.workspace = true
# SMA-504: the shared correlation layer. `tower` for the Layer/Service impl (was dev-only),
# `http` for the header types the layer manipulates on both the axum and tonic sides,
# `tokio` with `rt` for `task_local!` (LocalKey lives behind that feature; `macros` stays for the
# crate's `#[tokio::test]`s), and `paigasus-kernel` + `rand` to mint UUIDv7 the one way this repo
# mints it.
tower.workspace = true
http.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }
paigasus-kernel = { workspace = true }
rand.workspace = true
uuid = { workspace = true }

[dev-dependencies]
# serde_json: already a transitive dep (axum/tonic/tracing-subscriber pull it in) — pulled in
# explicitly here for the drift test (tests/drift.rs, Task B4), which parses the committed
# Grafana dashboard JSON.
serde_json.workspace = true
# serde_norway: the maintained fork of the now-unmaintained serde_yaml, used ONLY by the drift
# test (tests/drift.rs, Task B4) to parse the committed Prometheus alert-rule YAML. Not a
# workspace dep (no other crate needs YAML) — pinned here; MIT OR Apache-2.0, both already
# allow-listed in rs/deny.toml.
serde_norway = "0.9.42"

[lints]
workspace = true
