# SPDX-License-Identifier: Apache-2.0

[package]
name = "paigasus-proto-derive"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
# TODO(SMA-388): flip publish = true in lockstep with paigasus-proto. This crate must be
# published FIRST — paigasus-proto depends on it.
publish = false

[lib]
proc-macro = true

[dependencies]
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true

[dev-dependencies]
# extra-traits: syn's AST types (e.g. `ItemImpl`, `ImplItem`) only implement `Debug` under this
# feature. Production `expand()` never needs it (per the workspace `syn` entry's rationale), but
# this crate's own tests assert on/panic-print expansion output structurally and need it. Scoped
# to dev-dependencies only — a plain (non-test) build of this crate does not pull it in.
syn = { workspace = true, features = ["extra-traits"] }

[lints]
workspace = true
