$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-iam-core-rs'
layer: 'library'
language: 'rust'

dependsOn:
  - 'paigasus-kernel-rs'
  # SMA-753: `tool_policy::proto` maps the history conditions to the proto form.
  - 'paigasus-proto-rs'

# SMA-528 — the transitive dependsOn closure's sources, consumed by build/test/lint via
# `@group(upstreams)` in .moon/tasks/rust.yml. Moon confers affectedness ONLY through a task's own
# `inputs`; dependsOn and `^:build` schedule an upstream but never select this crate. Asserted to
# strict equality by repo:affected-smoke's A6.
fileGroups:
  upstreams:
    - '/rs/crates/libs/paigasus-kernel/src/**/*'
    - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
    - '/rs/crates/libs/paigasus-proto-derive/src/**/*'
    - '/rs/crates/libs/paigasus-proto-derive/Cargo.toml'
    - '/rs/crates/libs/paigasus-proto/src/**/*'
    - '/rs/crates/libs/paigasus-proto/Cargo.toml'

tasks:
  build:
    deps: ['^:build']
  test:
    deps: ['^:build']
    # SMA-774 — `tool_policy::schema`'s `the_base_schema_fixture_is_current` reads the base
    # schema fixture of the policy compiler, which is outside this project. `tool_policy::protocol`
    # reads every protocol fixture, and `tests/tool_policy_cross_version.rs` reads the compiler's
    # golden results and golden tenant schema. SMA-855 — `tests/detector_policies.rs` reads the
    # shared detector policy fixture and the tenant guide that holds each policy. Both are in
    # docs/tool-policies/, outside rs/crates, so A6 of repo:affected-smoke sees no foreign crate.
    inputs:
      - '/rs/tools/paigasus-policy-compiler/protocol/fixtures/**/*'
      - '/rs/tools/paigasus-policy-compiler/tests/golden/**/*'
      - '/docs/tool-policies/detector-policies.cedar'
      - '/docs/tool-policies/tenant-guide.md'
