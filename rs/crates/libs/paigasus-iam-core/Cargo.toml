[package]
name = "paigasus-iam-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
paigasus-kernel = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
cedar-policy = { workspace = true }
# `api_key`'s token codec (`format_token`/`parse_token`) encodes/decodes the secret segment
# as URL-safe base64 without padding (SMA-445, M4).
base64 = { workspace = true }
# `authz::model`'s `Decision`/`EntitySlice` (+ their `Effect`/`ContextValue`/`SliceEntity`
# parts) derive `Serialize`/`Deserialize` so the service crate's Redis-backed decision +
# entity-slice caches (`adapters::authz::{decision_cache,entity_cache}`, SMA-444 Task 14)
# can round-trip them as cache payloads without a bespoke wire format.
serde = { workspace = true }
# `audit::AuditEntry.detail` carries free-form event context as opaque JSON (SMA-446, Task A1).
serde_json = { workspace = true }
# `authz::engine::PolicyEngine::compile` — blake3-hashes the canonical encoding of the
# compiled documents + grants into `CompiledPolicies::content_hash`, which keys the
# decision cache (SMA-470). Already a workspace dep via `paigasus-iam`.
blake3 = { workspace = true }

# `tests/api_key_props.rs` — property-based coverage of the api-key token codec plus a
# test-local `SecretHasher` (SMA-445 Task 6, AC-1 "constant-time validation").
[dev-dependencies]
proptest.workspace = true
# `TestHasher`: a test-local HMAC-SHA-256 `SecretHasher` stand-in that proves the port's
# round-trip/rejection contract without pulling crypto into this crate's runtime
# dependencies (the real adapter lands in a later SMA-445 task). Not in the workspace
# baseline since this crate is the sole consumer today; versions match what's already
# resolved transitively in Cargo.lock (hmac 0.12.x, sha2 0.10.x).
hmac = "0.12"
sha2 = "0.10"

[lints]
workspace = true
