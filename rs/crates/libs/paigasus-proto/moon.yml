$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-proto-rs'
layer: 'library'
language: 'rust'

# paigasus-proto-derive is a `workspace = true` dep (Cargo.toml:24), and Moon 2.3.2 does not resolve
# workspace-inherited deps into the project graph — only `path = "..."` ones — so this edge must be
# hand-declared. `dependsOn` creates the project edge; the task-level `^:build` is what schedules the
# derive crate's build under `moon ci --include-relations`. Both are required; neither implies the
# other, and `repo:affected-smoke` asserts both (SMA-389, corrected by SMA-524).
dependsOn:
  - 'paigasus-proto-derive-rs'

tasks:
  build:
    deps: ['contracts:generate', '^:build']
  test:
    deps: ['contracts:generate', '^:build']
  # `contracts:generate` declares no `outputs:` but writes this crate's src/generated/**, so
  # without this dep Moon may run `buf generate` concurrently with the clippy that is compiling
  # those very files. build and test already order against it; lint must too, now that SMA-526
  # gives lint `^:build` and puts more Rust tasks in flight at once. Mirrors the ts sibling,
  # which wires contracts:generate into build, typecheck and test.
  lint:
    deps: ['contracts:generate']
