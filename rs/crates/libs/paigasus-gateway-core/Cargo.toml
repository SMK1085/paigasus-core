[package]
name = "paigasus-gateway-core"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
# `Bytes` is the body currency at the gateway boundary (`axum::body::Bytes` is this type).
bytes = { workspace = true }
serde = { workspace = true }
# Rewritten frames keep the upstream key order, deterministic across builds. `raw_value`: the
# request rewrite edits the body through `RawValue` slices, so untouched members keep their bytes
# (SMA-752 P-8).
serde_json = { workspace = true, features = ["preserve_order", "raw_value"] }
# `name_sha256_8` in decision reports (spec § 4.6). The same major as paigasus-iam-core's line,
# already in rs/Cargo.lock.
sha2 = "0.11"
# The kernel's tool-policy types (SMA-752 Task 7).
paigasus-kernel = { workspace = true, features = ["tool-policy"] }
thiserror = { workspace = true }
# The decision record's ids and org (SMA-755). No clock and no entropy: the caller passes both in.
uuid = { workspace = true }

[dev-dependencies]
# The differential oracle's hostile-stream generators (spec § 8.1). `bytes` and `serde_json` are
# already normal dependencies, which integration tests can use.
proptest = { workspace = true }
# The decision-report reasons are checked against the canonical error registry (SMA-752 D10).
paigasus-proto = { workspace = true }

[lints]
workspace = true
