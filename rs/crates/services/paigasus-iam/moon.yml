$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-iam-rs'
layer: 'application'
language: 'rust'

dependsOn:
  - 'paigasus-iam-core-rs'
  - 'paigasus-logging-rs'
  - 'paigasus-observability-rs'
  - 'paigasus-kernel-rs'
  - 'paigasus-proto-rs'
  - 'paigasus-service-info-rs'

# SMA-528 — the transitive dependsOn closure's sources, consumed by build/test/lint via
# `@group(upstreams)` in .moon/tasks/rust.yml. Moon confers affectedness ONLY through a task's own
# `inputs`; dependsOn and `^:build` schedule an upstream but never select this crate. Asserted to
# strict equality by repo:affected-smoke's A6.
fileGroups:
  upstreams:
    - '/rs/crates/libs/paigasus-iam-core/src/**/*'
    - '/rs/crates/libs/paigasus-iam-core/Cargo.toml'
    - '/rs/crates/libs/paigasus-kernel/src/**/*'
    - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
    - '/rs/crates/libs/paigasus-logging/src/**/*'
    - '/rs/crates/libs/paigasus-logging/Cargo.toml'
    - '/rs/crates/libs/paigasus-observability/src/**/*'
    - '/rs/crates/libs/paigasus-observability/Cargo.toml'
    - '/rs/crates/libs/paigasus-proto-derive/src/**/*'
    - '/rs/crates/libs/paigasus-proto-derive/Cargo.toml'
    - '/rs/crates/libs/paigasus-proto/src/**/*'
    - '/rs/crates/libs/paigasus-proto/Cargo.toml'
    - '/rs/crates/libs/paigasus-service-info/src/**/*'
    - '/rs/crates/libs/paigasus-service-info/Cargo.toml'

tasks:
  build:
    deps: ['^:build']
  test:
    # `--profile iam` only changes where the JUnit report is written (target/nextest/iam/), not
    # the retry or concurrency policy — a custom profile inherits profile.default's overrides.
    # Without it this crate's report is clobbered by the other crates' concurrent nextest runs.
    #
    # Deliberately `args:`, NOT `command:` — Moon's default `mergeArgs: append` strategy appends
    # a project task's args onto the inherited task's args regardless of what `command:` says, so
    # redeclaring the full `cargo nextest run --no-tests=pass --profile iam` string here produces
    # a doubled, broken command (`nextest run --no-tests=pass nextest run --no-tests=pass
    # --profile iam`) — verified via `moon task paigasus-iam-rs:test --json`. Appending only the
    # new flags is correct BECAUSE of that same append behavior.
    args: ['--profile', 'iam']
    deps: ['^:build']
