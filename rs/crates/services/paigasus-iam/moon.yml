$schema: 'https://moonrepo.dev/schemas/project.json'

id: 'paigasus-iam-rs'
layer: 'application'
language: 'rust'

dependsOn:
  - 'paigasus-iam-core-rs'
  - 'paigasus-logging-rs'
  - 'paigasus-nats-creds-rs'
  - 'paigasus-observability-rs'
  - 'paigasus-kernel-rs'
  - 'paigasus-proto-rs'
  - 'paigasus-redis-rs'
  - 'paigasus-service-info-rs'
  - 'paigasus-test-docker-rs'

# SMA-528 — the transitive dependsOn closure's sources, consumed by build/test/lint via
# `@group(upstreams)` in .moon/tasks/rust.yml. Moon confers affectedness ONLY through a task's own
# `inputs`; dependsOn and `^:build` schedule an upstream but never select this crate. Asserted to
# strict equality by repo:affected-smoke's A6.
fileGroups:
  upstreams:
    - '/rs/crates/libs/paigasus-iam-core/src/**/*'
    - '/rs/crates/libs/paigasus-iam-core/Cargo.toml'
    - '/rs/crates/libs/paigasus-kernel/src/**/*'
    - '/rs/crates/libs/paigasus-kernel/Cargo.toml'
    - '/rs/crates/libs/paigasus-logging/src/**/*'
    - '/rs/crates/libs/paigasus-logging/Cargo.toml'
    - '/rs/crates/libs/paigasus-nats-creds/src/**/*'
    - '/rs/crates/libs/paigasus-nats-creds/Cargo.toml'
    - '/rs/crates/libs/paigasus-observability/src/**/*'
    - '/rs/crates/libs/paigasus-observability/Cargo.toml'
    - '/rs/crates/libs/paigasus-proto-derive/src/**/*'
    - '/rs/crates/libs/paigasus-proto-derive/Cargo.toml'
    - '/rs/crates/libs/paigasus-proto/src/**/*'
    - '/rs/crates/libs/paigasus-proto/Cargo.toml'
    - '/rs/crates/libs/paigasus-redis/src/**/*'
    - '/rs/crates/libs/paigasus-redis/Cargo.toml'
    - '/rs/crates/libs/paigasus-service-info/src/**/*'
    - '/rs/crates/libs/paigasus-service-info/Cargo.toml'
    - '/rs/crates/libs/paigasus-test-docker/src/**/*'
    - '/rs/crates/libs/paigasus-test-docker/Cargo.toml'

tasks:
  build:
    deps: ['^:build']
  test:
    # `--profile iam` only changes where the JUnit report is written (target/nextest/iam/), not
    # the retry or concurrency policy — a custom profile inherits profile.default's overrides.
    # Without it this crate's report is clobbered by the other crates' concurrent nextest runs.
    #
    # Deliberately `args:`, NOT `command:` — Moon's default `mergeArgs: append` strategy appends
    # a project task's args onto the inherited task's args regardless of what `command:` says, so
    # redeclaring the full `cargo nextest run --no-tests=pass --profile iam` string here produces
    # a doubled, broken command (`nextest run --no-tests=pass nextest run --no-tests=pass
    # --profile iam`) — verified via `moon task paigasus-iam-rs:test --json`. Appending only the
    # new flags is correct BECAUSE of that same append behavior.
    args: ['--profile', 'iam']
    # SMA-774 — `tests/tool_policies_real_compiler.rs` and `tests/tool_policies_compiler_process.rs`
    # run the real policy compiler. It is a separate cargo workspace, so `^:build` does not build
    # it: the task names its build here, and `env` gives the tests the path of the binary.
    # SMA-777 — `test-build` compiles the test binaries before this task starts. This task holds
    # the mutex below, so it then only runs the tests and does not compile under the lock.
    deps: ['^:build', 'paigasus-policy-compiler-rs:build', 'test-build']
    env:
      PAIGASUS_POLICY_COMPILER_BIN: '$workspaceRoot/rs/tools/paigasus-policy-compiler/target/debug/paigasus-policy-compiler'
    # The two tests above read the protocol fixtures of the policy compiler, which is outside this
    # project. They also run its binary, so its sources, manifest and lock are inputs. It is a task
    # dep, not a `dependsOn` project: `fileGroups.upstreams` is for the crates of the `rs/` workspace.
    inputs:
      - '/rs/tools/paigasus-policy-compiler/protocol/**/*'
      - '/rs/tools/paigasus-policy-compiler/src/**/*'
      - '/rs/tools/paigasus-policy-compiler/Cargo.toml'
      - '/rs/tools/paigasus-policy-compiler/Cargo.lock'
    # This task and the two console e2e tasks share one CI runner. This task runs about 520 s of
    # Docker-backed nextest suites, Keycloak e2e included. Overlap starves the browser, so React
    # never hydrates in the console e2e tasks (SMA-718). The mutex stops the three tasks from
    # running at the same time.
    options:
      mutex: 'heavy-integration'
  # SMA-777 — compiles the test binaries of `test`, OUTSIDE the `heavy-integration` mutex. The
  # mutex holder ran about 4.5 minutes of compilation in CI while the two console e2e tasks
  # waited. `nextest run --no-run` calls cargo with the same arguments as `nextest run`, so `test`
  # finds every binary fresh. The inputs are the full input list of `test`, so the two tasks are
  # affected together. `cache: false`: a moon cache hit would skip this task while
  # `rs/target` can be cold, and `test` would then compile under the lock again. A run with
  # fresh binaries costs only the cargo freshness check.
  test-build:
    command: 'cargo nextest run --locked --no-run'
    deps: ['^:build']
    inputs:
      - '@group(sources)'
      - '@group(tests)'
      - 'Cargo.toml'
      - '/rs/.config/nextest.toml'
      - '@group(upstreams)'
      - '/rs/.cargo/config.toml'
      - '/rs/tools/paigasus-policy-compiler/protocol/**/*'
      - '/rs/tools/paigasus-policy-compiler/src/**/*'
      - '/rs/tools/paigasus-policy-compiler/Cargo.toml'
      - '/rs/tools/paigasus-policy-compiler/Cargo.lock'
    options:
      cache: false
