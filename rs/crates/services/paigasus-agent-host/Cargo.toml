[package]
name = "paigasus-agent-host"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "paigasus-agent-host"
path = "src/main.rs"

[lib]
name = "paigasus_agent_host"
path = "src/lib.rs"

[dependencies]
# `adapters::persistence` — the migrator and the advisory-lock runner.
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
async-trait = { workspace = true }
# `config` — layered configuration.
figment = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
# `adapters::http` and `adapters::boot` — the routes, the JSON bodies and the shared layers.
axum = { workspace = true }
serde_json = { workspace = true }
tower = { workspace = true, features = ["util"] }
paigasus-observability = { workspace = true }
# `main.rs` — logging, the `describe_*` lines and the boot error type.
paigasus-logging = { path = "../../libs/paigasus-logging", version = "0.0.0" }
metrics = { workspace = true }
anyhow = { workspace = true }
# `adapters::helikon` — the agent runtime.
# Exact pin (SMA-786 §6.9): the facade re-exports the core, and one facade PATCH release
# already moved the core from 0.5 to 0.6. A facade bump re-checks §6.9 of the spec.
paigasus-helikon = { version = "=0.6.12", default-features = false, features = ["runtime-tokio"] }
paigasus-agent-host-core = { workspace = true }

# figment's `Jail` test helper is feature-gated. It is a dev-dependency only.
[dev-dependencies]
paigasus-proto = { workspace = true }
figment = { workspace = true, features = ["test"] }
# The Postgres tests. `paigasus-test-docker` owns the Docker-skip policy.
paigasus-test-docker = { workspace = true }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
reqwest = { workspace = true }
# reqwest 0.13 uses `rustls-no-provider` (SMA-809). A test installs the `ring` CryptoProvider
# before it builds a `Client`, or reqwest panics.
rustls = { workspace = true }
# The test model of `adapters::helikon` names the `BoxStream` type of the core `Model` trait.
futures = { workspace = true }
# `tests/support/inbox.rs` — fixed ids. No `rng` feature: a test builds ids with `from_u128`.
uuid = { workspace = true }

[lints]
workspace = true
