[package]
name = "paigasus-gateway"
version = "0.0.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "paigasus_gateway"
path = "src/lib.rs"

[[bin]]
name = "paigasus-gateway"
path = "src/main.rs"

[dependencies]
paigasus-logging = { path = "../../libs/paigasus-logging", version = "0.0.0" }
# `adapters::http` — axum liveness/readiness routes; serde_json builds the JSON bodies.
axum = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal"] }
figment = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# Not yet consumed by G3 itself (config::validate/main.rs follow iam's `Result<(), String>` +
# `anyhow::Error::msg` posture) — pre-declared per the task brief for G4/G5's error types
# (IAM client + auth middleware errors, mirroring iam's `application::error` thiserror
# pattern). See `[package.metadata.cargo-machete]` below; prune the allowlist entry once a
# later task's error enum actually derives `thiserror::Error`.
thiserror = { workspace = true }
# `config::OpenAiConfig::api_key` — redacts the OpenAI key out of `Debug`/`Serialize`
# (`GatewayConfig` derives both for log/`readyz` dumps, mirroring iam's `RawPepper` posture).
# NOT a workspace-pinned dep yet (root Cargo.toml carries no `secrecy` entry) — this crate is
# its first consumer; see the task report for the new-dep note (G9 may add a deny.toml note).
secrecy = { version = "0.10", features = ["serde"] }

# figment's `Jail` test helper is feature-gated (`#[cfg(any(test, feature = "test"))]`);
# the workspace baseline only carries `toml`/`env`, so the "test" feature is added here as a
# dev-dependency — it's unified into test builds only, never the shipped binary.
[dev-dependencies]
figment = { workspace = true, features = ["test"] }
# `tests/health.rs` drives the health router via `ServiceExt::oneshot` (no real listener).
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true

[package.metadata.cargo-machete]
# `thiserror` — see the dependency comment above; not yet consumed, temporary allowlist per
# CLAUDE.md's "dep consumed only by a later commit" convention (SMA-446 G3).
ignored = ["thiserror"]
