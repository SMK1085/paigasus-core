[package]
name = "paigasus-gateway"
version = "0.3.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "paigasus_gateway"
path = "src/lib.rs"

[[bin]]
name = "paigasus-gateway"
path = "src/main.rs"

[dependencies]
paigasus-logging = { path = "../../libs/paigasus-logging", version = "0.0.0" }
# paigasus-observability — the shared `/metrics` + request-metrics-layer + metric-name-registry
# lib (SMA-446 Unit 1); `metrics` is its facade crate, used directly at the IAM/upstream
# instrumentation sites in `adapters::http::{auth,chat}`.
paigasus-observability = { workspace = true }
metrics = { workspace = true }
# `adapters::http` — axum liveness/readiness routes; serde_json builds the JSON bodies.
axum = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync", "fs"] }
figment = { workspace = true }
serde = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
# `adapters::iam::client::IamError` derives `thiserror::Error` (the outbound IAM adapter's
# error type; G5's auth middleware maps its `Rpc(tonic::Status)` variant to HTTP), mirroring
# iam's `application::error` thiserror pattern.
thiserror = { workspace = true }
# `adapters::iam::client` — the outbound IAM gRPC adapter. `tonic` provides the `Channel`,
# `Request`, `metadata::MetadataValue`, and `transport::{ClientTlsConfig, Certificate,
# Identity}` used to dial IAM. TLS features: `tls-ring` selects the RING rustls CryptoProvider
# (this workspace is ring-only — NEVER `tls-aws-lc`, which links a second provider and panics
# rustls 0.23 at first TLS use); `tls-native-roots` supplies the platform trust store for the
# system-trust (no custom-CA) path. Cargo unions features workspace-wide, so both stay
# ring-backed and `aws-lc-rs` remains absent from Cargo.lock.
tonic = { workspace = true, features = ["tls-ring", "tls-native-roots"] }
# `adapters::http::auth::is_identity_not_provisioned` reads `google.rpc.ErrorInfo` off an IAM
# `Status` (SMA-504) via `tonic_types::StatusExt::get_error_details`/`ErrorDetails::error_info`;
# the test harness also builds fake `Status`es carrying `ErrorDetails` with it.
tonic-types = { workspace = true }
# `adapters::iam::client` names the generated `paigasus.iam.v1` gRPC clients + request/response
# messages (`AuthnServiceClient`, `AuthorizationServiceClient`, `IntrospectApiKeyRequest`, …).
paigasus-proto = { workspace = true }
# `adapters::iam::client::Iam` is `#[async_trait]` — the port is consumed as `dyn Iam`
# (G5 injects a fake in unit tests, G7 the real `IamClient`), which native AFIT can't yet do
# object-safely.
async-trait = { workspace = true }
# `config::OpenAiConfig::api_key` — redacts the OpenAI key out of `Debug`/`Serialize`
# (`GatewayConfig` derives both for log/`readyz` dumps, mirroring iam's `RawPepper` posture).
# NOT a workspace-pinned dep yet (root Cargo.toml carries no `secrecy` entry) — this crate is
# its first consumer; see the task report for the new-dep note (G9 may add a deny.toml note).
secrecy = { version = "0.10", features = ["serde"] }
# `adapters::openai::client::OpenAiClient` — the outbound OpenAI egress adapter (G6). The
# workspace pins reqwest WITHOUT `stream`; `features = ["stream"]` adds `Response::bytes_stream()`
# for the UNBUFFERED streaming path (cargo unions features workspace-wide, so this just enables
# `stream` build-wide). The TLS feature is UNTOUCHED — the workspace baseline `rustls-no-provider`
# already resolves to the RING provider here (Cargo.lock has `ring`, no `aws-lc-rs`); a second
# provider would panic rustls 0.23 at first TLS use (see gateway-iam-integration-facts.md).
rustls = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
# `bytes::Bytes` is the request/response body currency at the egress boundary — the caller's
# ORIGINAL raw request bytes flow upstream verbatim, and the non-stream response comes back as
# `Bytes` (byte-lossless passthrough; the DTO is parsed only to read `model`/`stream`).
bytes = { workspace = true }
# `futures::stream::BoxStream` names the boxed UNBUFFERED chunk stream `chat_completion` returns
# on the stream path, and `StreamExt::boxed` erases `Response::bytes_stream()`'s opaque type into
# it so it can live in the `ChatResponse` enum.
futures = { workspace = true }
# `service_info` — the shared ServiceInfo builder + HTTP DTO (SMA-505).
paigasus-service-info = { workspace = true }
# `domain::resolve_org` (SMA-635) parses and builds org PRNs with the kernel `Prn` API. The
# `tool-policy` feature (SMA-752) brings Cedar into the gateway ON PURPOSE (ADR-0027 (e)): the tool
# policy evaluates Cedar here, also through gateway-core. paigasus-iam-core stays out: the gateway
# needs none of its IAM model.
paigasus-kernel = { workspace = true, features = ["tool-policy"] }
# SMA-749: the sans-IO tool-call interception core. `{ workspace = true }`, so `moon.yml`
# hand-declares the `dependsOn` edge (ci/CLAUDE.md).
paigasus-gateway-core = { workspace = true }
# `domain::resolve_org` reads the `paigasus-org` header as a UUID (SMA-635). Moved from
# [dev-dependencies]; the correlation test in `adapters::iam::client` still uses it.
uuid = { workspace = true }
# SMA-677 D6: the UTC budget periods (`iso_week()` for the ISO week-year) and the RFC 3339 reset
# instant in the budget refusal message. Already a workspace dependency.
chrono = { workspace = true }
# SMA-677 D15: the one Redis connection site (tuned ConnectionManager + the SMA-476 breaker).
# `{ workspace = true }`, so `moon.yml` hand-declares the `dependsOn` edge (ci/CLAUDE.md).
paigasus-redis = { workspace = true }
# SMA-677: the limit store names `redis::Script`, `redis::pipe` and `redis::RedisError`. The
# `script` feature comes from paigasus-redis's own line (D19).
redis = { workspace = true }
# SMA-677 D16: `TaskTracker` for the spawned charges and the 5 s shutdown drain. `rt` adds only
# tokio/rt, tokio/sync and futures-util, all already in Cargo.lock.
tokio-util = { version = "0.7", features = ["rt"] }
# SMA-755: `adapters::decision_log::proto` maps a decision record to the generated `ToolDecisionEvent`
# and encodes it (`prost::Message`); `prost-types` names its `Timestamp` and `Duration`.
prost = { workspace = true }
prost-types = { workspace = true }
# SMA-752: the file policy source hashes file contents into the policy version.
sha2 = "0.11"
# SMA-755: the keyed (HMAC-SHA256) digest of the tool-call arguments in a decision record, and the
# OS entropy of a decision id.
hmac = "0.13"
rand = { workspace = true }
# SMA-752 § 6.3.5: the core NATS subscription on `iam.policy.>` that invalidates the tool-policy
# cache. The workspace line selects the ring provider (no aws-lc-rs). The `kv` feature is for the generation
# bucket of the decision log (SMA-821).
async-nats = { workspace = true, features = ["kv"] }
# The same creds callback that IAM uses (SMA-493 D8): it re-reads the creds file on every connect
# attempt, so a rotation is picked up on the next reconnect. `{ workspace = true }`, so `moon.yml`
# hand-declares the `dependsOn` edge.
paigasus-nats-creds = { workspace = true }
# SMA-755 Task 13: RFC 3339 parsing of `--since`/`--until`, the summary text, and the start time of the
# ordered consumer (async-nats names `time::OffsetDateTime`).
time = { version = "0.3", features = ["parsing", "formatting"] }

# figment's `Jail` test helper is feature-gated (`#[cfg(any(test, feature = "test"))]`);
# the workspace baseline only carries `toml`/`env`, so the "test" feature is added here as a
# dev-dependency — it's unified into test builds only, never the shipped binary.
[dev-dependencies]
# SMA-775: the in-process fake `ToolPolicyService` server of `tests/tool_policy_iam_source.rs`
# wraps a `TcpListener` into the `Stream` that `serve_with_incoming` takes (as paigasus-iam does).
tokio-stream = { workspace = true, features = ["net"] }
# SMA-752 Task 13: `#[tokio::test(start_paused = true)]` for the policy-cache refresh, stale and timeout tests.
tokio = { workspace = true, features = ["test-util"] }
# SMA-677: the blackhole listener and the lazy / open-breaker handles for the fail-open tests.
# Test builds only, like paigasus-logging/test-support above.
paigasus-redis = { workspace = true, features = ["test-support"] }
# SMA-677 D22: the one Docker-skip policy (SMA-538), shared with paigasus-iam. Dev-only.
paigasus-test-docker = { workspace = true }
# SMA-677: the Redis image type, `ContainerAsync` and `ExecCommand` for the raw `redis-cli` reads
# (the single-site gate bans a second Rust Redis client in tests). Already in Cargo.lock via IAM.
# SMA-752 Task 18 (preflight F11): `nats` for the tool-policy NATS tests. Already in Cargo.lock via IAM.
testcontainers-modules = { version = "0.15", features = ["redis", "nats"] }
# SMA-677: unit tests read the limit metrics from a local DebuggingRecorder instead of the
# process-global Prometheus recorder. Same line as paigasus-iam's.
metrics-util = { version = "0.20.4", default-features = false, features = ["debugging"] }
figment = { workspace = true, features = ["test"] }
# `src/adapters/http/mod.rs`'s health unit tests and `tests/chat_proxy.rs`'s integration tests
# both drive the router via `ServiceExt::oneshot` (no real listener).
tower = { workspace = true, features = ["util"] }
# cfg(test) so strum_macros never enters the shipped binary, exactly as paigasus-iam does it
# (SMA-498). Drives the AC 6 exhaustive registry test over `GatewayError` (SMA-504).
strum = { version = "0.28", features = ["derive"] }
# Writes throwaway CA-bundle fixtures for `adapters::openai::client`'s trust-anchor tests
# (SMA-558) — the same dev-dep paigasus-iam already carries for its own fixtures.
tempfile = "3"
# Mints those fixtures' CA certificate at RUNTIME rather than committing a PEM blob, matching
# the convention paigasus-iam records in tests/support/mod.rs ("no committed PEM/JWK fixtures").
# Only the cert minter — deliberately NOT axum-server, since no gateway test starts a TLS
# listener (SMA-558 D6).
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

# The shared log-capture helper for the auth and chat tests (SMA-689, spec D3). Listed a second
# time, here, so that the `test-support` feature reaches test builds only, never the shipped
# binary. `version = "0.0.0"` is REQUIRED, not redundant: `rs/deny.toml` sets
# `wildcards = "deny"`, and a path dependency with no version counts as a wildcard.
paigasus-logging = { path = "../../libs/paigasus-logging", version = "0.0.0", features = ["test-support"] }

[lints]
workspace = true
