# Live release-plz configuration (SMA-576).
#
# The SMA-398 parity harness DERIVES its fixture config from the classification keys below,
# so this file is the single source of truth for commit->semver behaviour. Do not duplicate
# them into ci/release-parity/.

[workspace]
# NO workspace-level `release` key. It was `release = false` while every package sat at the
# 0.0.0 stub floor; measured against release-plz 0.3.158, that makes the tool hard-error with
# "no public packages found", so a release-PR job cannot run under it. Releasability is now
# declared per package below. A per-package `release = false` keeps a crate out of the
# release-PR proposal, so the "dependencies changed" cascade cannot bump it (spec §8). The
# cascade itself is unconditional — see the `dependencies_update` note below.
#
# Conventional-Commit -> semver classification (the contract SMA-398 asserts).
# In 0.x: fix -> patch, feat -> minor, breaking (! or BREAKING CHANGE) -> minor.
features_always_increment_minor = true

# --- Lockfile scope of the release PR (SMA-680) --------------------------------------------
# NOT a classification key. The SMA-398 parity harness does not read it:
# ci/release-parity/ecosystems/release-plz.sh derives only `features_always_increment_minor`.
#
# WHAT IT DOES. Read from the release-plz 0.3.158 source, not measured. Read it again when
# .prototools moves the release-plz pin. Its only reader is `update_cargo_lock`
# (release_plz_core, src/command/update/mod.rs:142-158). `true` runs `cargo update`, which
# can move any third-party entry of rs/Cargo.lock to the newest compatible version. `false`
# (the release-plz default) runs `cargo update --workspace`, which rewrites only the workspace
# members' entries. The key acts only when release-plz proposes a version bump (the guard at
# mod.rs:53). That holds only while the lock satisfies the manifests; ci/cargo-lock-integrity
# enforces that on main.
#
# WHAT IT DOES NOT DO. It does not control the "dependencies changed" cascade, where a
# dependent is bumped because a workspace dependency of it was bumped. `update_dependencies`
# (mod.rs:202-232) and `add_dependencies_update_if_any` (updater.rs:749-783) never read this
# key. An earlier comment here said the opposite. It was wrong.
# Measured before SMA-680, with `true`, on publishable fixture crates:
# a crate neither in the version group nor touched by the commit was still bumped
# ("dependencies changed").
#
# WHY FALSE (SMA-680):
#   1. The wasm glue under rs/crates/bindings/paigasus-wasm/ is committed (SMA-634), and no
#      release step regenerates it. A full `cargo update` that moved wasm-bindgen made that glue
#      stale, and the v0.2.0 release PR failed committed-wasm.test.ts.
#   2. The release-pr job's stamp step builds with a write-capable App token in its environment
#      (release.yml, GH_TOKEN_FOR_PUSH). With `true`, third-party build scripts that no person
#      reviewed ran there.
# Setting it to `true` again CAN make a release PR fail committed-wasm.test.ts, on a day when the
# registry has a newer compatible wasm-bindgen. That test's message then asks for a manual
# `generate-wasm` commit. The real cause is this key. Third-party Rust updates come from
# dependabot's cargo group or a manual PR.
#
# `false` is not enough if a crate version ever enters the glue. See the note above
# `generate-wasm` in ts/packages/paigasus-kernel/moon.yml.
dependencies_update = false

# --- Releasable: the kernel family (ADR-0011 S1) ------------------------------------------
# One version across crates.io/PyPI/npm. release-plz 0.3.158 bumps ONLY `paigasus-kernel` here.
# It never writes the version of a crate whose Cargo manifest says `publish = false`, version
# group or not (READ: `packages_to_process()`, release_plz_core updater.rs:283-302, takes only
# Cargo-publishable and `git_only` crates; version groups are computed over that set only,
# updater.rs:162-189; MEASURED, SMA-685 M1 and M1b). So `version_group` and `release = true`
# on the three binding crates below are INERT today. They stay as the declaration, in case a
# later pin changes the filter; read the source again when .prototools moves the pin.
# The binding versions come from `ci/version-lockstep/run.sh --write`, which the release-PR
# job's stamp step runs (SMA-685). It writes each `publish = false` non-head crate's version
# from the head. `repo:version-lockstep` then checks every site.
# An earlier comment here said `version_group` applies to these crates "(measured)". It was
# wrong: the bindings reached 0.1.0 by hand (e2007d55). The SMA-407 fixture most probably ran
# with `git_only = true` (INFERRED). M1c could not test this. `git_only` failed with a
# repository NotFound error at manifest_dir rs/ instead, a new failure mode on this layout
# (MEASURED, SMA-685 M1c). That error also counts against `git_only` as a fix.
# GITHUB RELEASES (SMA-579 §2.1). release-plz creates one per released package by default, which
# would mean SIX release pages per release commit for two lockstep families. Only the two family
# HEADS carry one, each with its family's changelog. MEASURED on the first live release: exactly
# two GitHub Releases were created, `paigasus-kernel-v0.1.0` and `paigasus-proto-v0.1.0`. Correct.
#
# TAGS: THREE, NOT SIX — the earlier claim here was WRONG (measured, SMA-580).
# This comment used to say "every package still gets `<package>-v<version>`". It does not.
# `release-plz release` tags only the packages it PUBLISHES. The first live release produced
# `paigasus-kernel-v0.1.0`, `paigasus-proto-v0.1.0` and `paigasus-proto-derive-v0.1.0` — and the
# three `publish = false` binding crates below were never mentioned in the job log AT ALL, not
# even skipped. So `release = true` does NOT get a `publish = false` crate tagged.
#
# This is cosmetic, not functional: the binding crates' versions come from
# `version-lockstep --write`, and `repo:version-lockstep` checks them; neither reads a tag.
# Recorded so nobody hunts for the missing three. napi is still barred from cutting any tag
# (`--no-gh-release`, asserted by
# ci/actionlint/release_guard.py V5).
[[package]]
name = "paigasus-kernel"
version_group = "kernel"
release = true

# publish = false MIRRORS each crate's Cargo manifest. release-plz reads an ABSENT publish key as
# `publish = true` and hard-errors on the contradiction ("has `publish = false` ... in the
# Cargo.toml, but it has `publish = true` in the release-plz configuration"), which blocked
# `release-plz release` entirely — measured on this repo before SMA-579 fixed it.
# `release = true` and `version_group` are inert on these crates (see the kernel-family note
# above): release-plz neither bumps nor tags them. Their versions come from
# `version-lockstep --write`. They ship as maturin/napi/wasm byproducts to PyPI and npm.
[[package]]
name = "paigasus-py-bindings"
version_group = "kernel"
release = true
publish = false
# Not a family head (see GITHUB RELEASES comment above paigasus-kernel) — one release page per
# family, not per package.
git_release_enable = false

[[package]]
name = "paigasus-node-bindings"
version_group = "kernel"
release = true
publish = false
git_release_enable = false

[[package]]
name = "paigasus-wasm"
version_group = "kernel"
release = true
publish = false
git_release_enable = false

# --- Releasable: the proto family (ADR-0011 S1) --------------------------------------------
# One version across the two crates, ordered derive -> proto (paigasus-proto depends on
# paigasus-proto-derive). Its lockstep is realized structurally: the generated Rust lives
# inside paigasus-proto/src/generated, so a contracts/ change regenerates it, changes the
# crate's files, and release-plz attributes the bump BY FILE PATH (ADR-0011 S5). No contract
# version is introduced. Nothing publishes until SMA-580 flips PAIGASUS_RELEASE_ENABLED;
# `release = true` here only makes them eligible for the release PR.
# GITHUB RELEASES: same policy as paigasus-kernel above (SMA-579 §2.1). paigasus-proto is this
# family's head, so it keeps its GitHub release; paigasus-proto-derive below does not.
[[package]]
name = "paigasus-proto"
version_group = "proto"
release = true

[[package]]
name = "paigasus-proto-derive"
version_group = "proto"
release = true
git_release_enable = false

# --- Not releasable ------------------------------------------------------------------------
# Every other member. `release = false` removes a package from the release-PR proposal
# ENTIRELY (measured: it is neither bumped nor listed), which is what keeps the
# "dependencies changed" cascade from bumping crates nobody released. None of these crates can
# get a tag: release-plz tags only what it publishes (see the TAGS note above).
#
# paigasus-gateway / paigasus-iam are versioned BY HAND (SMA-658): each moved to 0.1.0 at the
# first image release. `packages_to_process()` filters on Cargo's own `publish` field, and
# neither crate is in a `version_group`, so `release-plz update` never sees them (M7, measured on
# 0.3.158). The same filter applies to every Cargo `publish = false` crate, in a version group or
# not (READ, SMA-685; see the kernel-family note above).
# `env!("CARGO_PKG_VERSION")` feeds the ServiceInfo descriptor, and ADR-0020 skew reporting is
# parked on that value (SMA-505 R7).
#
# publish = false MIRRORS each crate's Cargo manifest, same contradiction as the kernel-family
# bindings above (SMA-579): all seven of these carry `publish = false` in Cargo.toml, and an
# absent `publish` key here still reads as `publish = true` to release-plz — which errors even
# though `release = false` already excludes the package from the release PR. `release = false`
# stops the release-PR proposal; `publish = false` is what `release-plz release` itself checks.
# Measured: `paigasus-iam-core` was the first of these seven to trip the same hard error the
# kernel-family bindings did, once that contradiction was fixed above.
[[package]]
name = "paigasus-iam-core"
release = false
publish = false
git_release_enable = false

[[package]]
name = "paigasus-kernel-parity"
release = false
publish = false
git_release_enable = false

[[package]]
name = "paigasus-logging"
release = false
publish = false
git_release_enable = false

[[package]]
name = "paigasus-observability"
release = false
publish = false
git_release_enable = false

[[package]]
name = "paigasus-service-info"
release = false
publish = false
git_release_enable = false

[[package]]
name = "paigasus-gateway"
# release = false stays. MEASURED (SMA-658 M7, release-plz 0.3.158): release-plz never processes a
# crate whose Cargo manifest sets `publish = false`, so `release = true` would change nothing. A
# maintainer bumps this service by hand, and release.yml's tag-<svc> job makes its tag.
release = false
publish = false
git_release_enable = false

[[package]]
name = "paigasus-iam"
# release = false stays. MEASURED (SMA-658 M7, release-plz 0.3.158): release-plz never processes a
# crate whose Cargo manifest sets `publish = false`, so `release = true` would change nothing. A
# maintainer bumps this service by hand, and release.yml's tag-<svc> job makes its tag.
release = false
publish = false
git_release_enable = false

[changelog]
sort_commits = "newest"
